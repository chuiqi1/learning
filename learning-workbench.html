    'Hiragino Sans GB', Roboto, sans-serif;

  --font-weight-code: 450;

  --transition-normal: 0.2s ease;
  --transition-slow: 0.3s ease;

  /* ===== Z-Index Layer System ===== */
  --z-base: 0;
  --z-above: 1;
  --z-above-2: 2;

  --z-sticky: 10;
  --z-local-overlay: 100;

  --z-dropdown: 1000;
  --z-popover: 1010;

  --z-modal-backdrop: 1090;
  --z-modal: 1100;
  --z-drawer: 1120;
  --z-confirm: 1150;

  --z-notification: 1200;
  --z-tooltip: 1300;

  --z-fullscreen: 1400;

  /* 仅限基础设施 / 调试工具，业务组件禁止直接使用 */
  --z-max: 9999;
  /* GTM 是全窗口阻塞式系统弹窗，必须覆盖 IDE / Solo Lite 内所有业务浮层 */
  --z-gtm-modal: 2147483647;

<script>
/* ================================================================
   KNOWLEDGE DATA — 三大知识体系
   ================================================================ */
const KNOWLEDGE = {

riemann: {
  name:'黎曼几何', color:'#2563eb', accent2:'#7c3aed',
  nodes:[
    {id:'r1',label:'光滑流形',r:22,
     content:'光滑流形是一个局部看起来像 ℝⁿ，且坐标变换都是光滑映射的拓扑空间。严格来说，它是一个第二可数的 Hausdorff 空间，配上一个光滑图册（atlas）。',
     understanding:'你可以把流形想象成地球表面：站在地面上你觉得它是平的（局部像 ℝ²），但整体上它是个球。光滑流形就是这种"局部平、整体弯"的空间，而且弯得很光滑——不会突然出现尖角或折痕。我们之所以费这么大劲定义流形，是因为在弯曲空间上做微积分，不能直接套用平面上的办法，得先通过坐标卡把问题拉到 ℝⁿ 里处理，再确保不同坐标卡之间切换时计算结果是相容的。'},
    {id:'r2',label:'切空间',r:20,
     content:'在流形 M 上一点 p 处的切空间 TₚM，是所有经过 p 的光滑曲线的"速度向量"的等价类构成的向量空间。等价地，也可以定义为作用在 p 点附近光滑函数上的导子（derivation）全体。',
     understanding:'切空间就是把"在某点的方向导数"这个概念搬到弯曲空间上。在平面上，你可以画一个箭头表示方向；在弯曲空间上，你不能直接画箭头（因为空间本身是弯的），但你可以让一条曲线穿过这个点，然后看它"经过的一瞬间"往哪个方向走。所有可能的"瞬间方向"就构成了切空间。导子定义的好处是它完全不依赖坐标的选取，数学上干净利落。'},
    {id:'r3',label:'向量场与李括号',r:18,
     content:'向量场是流形上每点指派一个切向量的光滑映射。李括号 [X,Y] 衡量两个向量场 X 和 Y 的"不可交换性"：先沿 X 再沿 Y 走，和先沿 Y 再沿 X 走，到达的位置不同，这个差异（到二阶）就是 [X,Y]。',
     understanding:'向量场你可以想象成流形上到处画满了小箭头，像天气预报里的风场图。李括号稍微抽象一点：想象你和朋友在弯曲的地面上走路，你向东走一步再向北走一步，他向北走一步再向东走一步——你们不会到达同一个点。这个"差"就是李括号在起作用。它本质上度量的是两个方向"不配合"的程度，是联络和曲率理论的先导概念。'},
    {id:'r4',label:'张量场',r:18,
     content:'张量场是流形上每点赋予一个多重线性映射的光滑截面。一个 (r,s) 型张量，接受 r 个余切向量和 s 个切向量，输出一个实数。',
     understanding:'张量是物理和几何里最自然的"量"，因为它们不依赖坐标系。比如，一个向量（1,0）在不同坐标系下分量会变，但向量本身不变。张量场把这些"不变量"铺满整个流形。你可以把张量理解为"吃进一些向量，吐出一些向量或数字"的机器，线性且逐点工作。度量张量、曲率张量都是张量，所以这门课到处是张量运算。'},
    {id:'r5',label:'黎曼度量',r:24,
     content:'黎曼度量 g 是流形上的一个光滑对称正定 (0,2) 型张量场。它在每点 p 的切空间上定义一个内积 gₚ(u,v)=⟨u,v⟩ₚ，从而可以测量向量的长度和夹角。',
     understanding:'度量就是给弯曲空间装上"尺子"。在没有度量的流形上，你知道什么是"光滑"，但不知道什么是"长度"和"角度"。一旦有了度量，你就可以量曲线的长度、算面积、定义梯度。球面上的度量告诉你大圆弧的长度，双曲平面上的度量告诉你三角形内角和小于 180°。度量是黎曼几何的灵魂——同一个流形装不同的度量，就成了完全不同的几何世界。'},
    {id:'r6',label:'音乐同构',r:16,
     content:'音乐同构 ♭（降）和 ♯（升）是利用黎曼度量在切空间 TM 和余切空间 T*M 之间建立的自然同构。♭ 把向量变成余向量：v♭(w)=⟨v,w⟩；♯ 是它的逆。',
     understanding:'名字很酷，但本质很简单：度量让你能把向量和余向量互相转换。向量 v 的"降调" v♭ 就是"跟 v 做内积"这个操作本身。这个同构极其重要，因为它让你可以在 TM 和 T*M 之间自由切换，定义了梯度（标量函数的余向量版）、散度等。没有它，很多运算写起来会非常别扭。'},
    {id:'r7',label:'仿射联络',r:20,
     content:'仿射联络 ∇ 是一个映射，给两个向量场 X,Y 指派一个新的向量场 ∇ₓY，满足 C∞-线性和莱布尼茨法则。它让"向量场沿另一个向量场的变化率"有了意义。',
     understanding:'在平面上，你可以直接对向量求导——因为你可以把不同点的向量平移到一起比较。在弯曲空间里，不同点的切空间是不同的向量空间，不能直接比较。联络就是解决这个问题的：它规定了"什么叫沿着某个方向变化"。不同的联络给出不同的"平行"概念，就像不同的交通规则告诉你不同的"直行"方式。'},
    {id:'r8',label:'Levi-Civita联络',r:22,
     content:'Levi-Civita 联络是黎曼流形上唯一满足两个条件的仿射联络：(1) 度量相容性 ∇g=0；(2) 无挠性 ∇ₓY−∇_Y X=[X,Y]。它的存在唯一性是黎曼几何的基本定理。',
     understanding:'在众多可能的联络中，有一个是"最自然"的——它既保持度量（平行移动不改变向量长度和夹角），又没有"扭"（沿两个方向依次求导的差异恰好等于李括号）。这个联络就像"上帝的选择"：它完全由度量决定，不需要额外输入。给定一个度量，你就能算出唯一的一个 Levi-Civita 联络，然后一切几何量（曲率、测地线）都从它导出来。'},
    {id:'r9',label:'Christoffel符号',r:18,
     content:'Christoffel 符号 Γᵏᵢⱼ 是联络在局部坐标系下的分量表示：∇_{∂ᵢ}∂ⱼ = Γᵏᵢⱼ ∂ₖ。它们不是张量的分量，但它们的差是张量。对于 Levi-Civita 联络，Γᵏᵢⱼ 由度量及其一阶导数完全确定：Γᵏᵢⱼ = ½gᵏˡ(∂ᵢgⱼˡ+∂ⱼgᵢˡ−∂ˡgᵢⱼ)。',
     understanding:'Christoffel 符号是联络的"坐标组件"。打个比方：度量告诉你空间有多弯，Christoffel 符号告诉你坐标格子本身有多"歪"。在平面上用直角坐标，所有 Γ=0；但换成极坐标，Γ 就非零了——不是因为空间变弯了，而是坐标线本身是弯的。搞懂这一点很重要：Γ≠0 不一定意味着曲率非零，可能只是坐标选得不好。'},
    {id:'r10',label:'协变导数',r:20,
     content:'协变导数 ∇ₓT 是联络对任意张量场 T 的推广。对于向量场，就是 ∇ₓY；对于函数，退化为普通方向导数 X(f)；对于一般张量，通过莱布尼茨法则递归定义。',
     understanding:'协变导数是普通方向导数的"弯曲空间升级版"。在平面上，你对一个向量场求导，直接对分量求导就行。在弯曲空间里，你还得额外考虑"基向量本身在变化"——这就是 Christoffel 符号那项的来源。协变导数让"变化率"这个概念在弯曲空间里有了内蕴的意义，不依赖坐标选择。'},
    {id:'r11',label:'平行移动',r:18,
     content:'沿曲线 γ 的向量场 V 满足 ∇_{γ'}V=0 时，称 V 沿 γ 平行。平行移动是将一点处的切向量沿曲线"平移"到另一点得到的向量，它由这个常微分方程唯一确定。',
     understanding:'在平面上，平行移动就是把箭头原封不动搬过去。在弯曲空间里，"原封不动"没有意义——你得用联络来定义什么叫"不变"。沿球面的大圆平行移动一个向量，走一圈回来，向量会转一个角度（和乐 holonomy）。这个旋转角度正好反映了曲面的弯曲程度。平行移动是连接局部几何和整体几何的桥梁。'},
    {id:'r12',label:'测地线',r:24,
     content:'测地线是满足 ∇_{γ'}γ'=0 的曲线，即速度向量沿自身平行。在局部坐标下，它是二阶常微分方程 ẍᵏ+Γᵏᵢⱼẋⁱẋʲ=0 的解。测地线是欧氏空间直线的自然推广，局部上是最短路径。',
     understanding:'测地线就是弯曲空间里的"直线"。球面上的大圆是测地线，飞机从北京飞纽约就沿着大圆走——因为那是球面上最短的路。但要注意，"最短"只在局部成立：大圆上超过半圈的那段虽然也是测地线，但不是最短的。测地线方程是一个二阶 ODE，给定初始位置和初始方向，就唯一确定一条测地线。这跟牛顿力学很像：给定初始位置和速度，轨迹就确定了。'},
    {id:'r13',label:'指数映射',r:20,
     content:'指数映射 expₚ: TₚM → M 定义为 expₚ(v)=γᵥ(1)，其中 γᵥ 是满足 γ(0)=p, γ'(0)=v 的测地线。它将切空间局部地映射到流形上，在 p 点附近是一个微分同胚。',
     understanding:'指数映射是测地线概念的"打包"：给定一个点和一个方向，沿着那个方向走测地线，走"单位时间"到达的点就是 exp 的值。它在原点附近的微分同胚性质非常关键——这意味着在小范围内，切空间和流形本身是"一样"的，这直接导出法坐标系的存在。在法坐标系下，Christoffel 符号在原点为零，计算大大简化。'},
    {id:'r14',label:'Riemann曲率张量',r:24,
     content:'Riemann 曲率张量 R(X,Y)Z = ∇ₓ∇_Y Z − ∇_Y∇ₓZ − ∇_{[X,Y]}Z，是一个 (1,3) 型张量。它衡量协变导数的不可交换性，即"先沿 X 再沿 Y"与"先沿 Y 再沿 X"的差异。',
     understanding:'曲率张量是黎曼几何里最核心的对象。它回答了一个问题：如果你在一个弯曲空间里，朝不同方向走，协变导数"换不换顺序"？在平面上，答案是不换——先朝东再朝北，跟先朝北再朝东，对向量场求导的结果一样。在球面上，不一样。这个"不一样"就是曲率。R 有三层输入（两个方向向量，一个被求导的向量），吐出一个向量，所以分量很多，但它有精巧的对称性，独立分量其实不多。'},
    {id:'r15',label:'截面曲率',r:20,
     content:'截面曲率 K(σ) = ⟨R(u,v)v,u⟩/(|u|²|v|²−⟨u,v⟩²)，其中 σ 是由 u,v 张成的二维切子空间。它衡量流形沿该二维平面方向的弯曲程度。',
     understanding:'曲率张量有太多分量，截面曲率把它压缩成一个数：对于每个二维切方向，给一个数。球面的截面曲率恒为正常数，双曲空间恒为负常数，欧氏空间恒为零。如果你知道所有二维方向的截面曲率，曲率张量就完全确定了。在二维流形上，截面曲率就是高斯曲率。'},
    {id:'r16',label:'Ricci曲率',r:20,
     content:'Ricci 曲率 Ric(u,v) 是 Riemann 曲率张量的迹：Ric(u,v)=tr(w↦R(w,u)v)。它在局部坐标下为 Rⱼₖ=gⁱˡRᵢⱼₖˡ。Ricci 曲率衡量的是"沿某个方向的体积收缩率"。',
     understanding:'Ricci 曲率是曲率张量的"平均版"：你固定两个方向 u,v，然后对所有可能的 w 方向求和（取迹）。它比截面曲率更粗糙，但信息量刚好够用。在广义相对论中，爱因斯坦方程直接用到 Ricci 曲率。物理直觉是：Ricci 曲率告诉你一小团粒子沿测地线自由下落时，体积怎么变化——正 Ricci 曲率让体积收缩（引力聚焦），负 Ricci 曲率让体积膨胀。'},
    {id:'r17',label:'标量曲率',r:18,
     content:'标量曲率 S 是 Ricci 曲率的迹：S = gⁱʲRᵢⱼ。它是曲率的最简标量度量，在每点给一个数。',
     understanding:'标量曲率是曲率信息的"终极压缩"——一个数概括了该点处空间的弯曲程度。正标量曲率表示空间"平均"是球状的，负的是马鞍状的。但它丢失了很多信息：存在标量曲率处处为零但不是平坦空间的例子。标量曲率在二维时等于高斯曲率的两倍，在 Yamabe 问题中扮演核心角色。'},
    {id:'r18',label:'Jacobi场',r:20,
     content:'Jacobi 场 J(t) 是沿测地线 γ(t) 的向量场，满足 Jacobi 方程 ∇²_{γ'}J + R(J,γ')γ' = 0。它描述一族测地线的"相对偏离"，即测地线的变分场。',
     understanding:'想象一束测地线从同一点出发，像手电筒的光束。相邻测地线之间怎么"散开"或"聚拢"？Jacobi 场就是描述这个的。曲率项 R(J,γ')γ' 起关键作用：正曲率让测地线聚拢（像球面上的经线在极点汇聚），负曲率让它们散开。Jacobi 场是共轭点理论和比较定理的基础，也是理解曲率几何意义的密钥。'},
    {id:'r19',label:'比较定理',r:22,
     content:'比较定理（Rauch、Bishop-Gromov 等）将黎曼流形的几何量（体积、距离、Jacobi 场长度等）与常曲率模型空间中的对应量进行比较。核心思想是"曲率有界，则几何量受控"。',
     understanding:'比较定理是黎曼几何的"瑞士军刀"。你不需要知道流形的精确形状，只要知道曲率的上界或下界，就能推出很多结论。比如 Bishop-Gromov 定理说，如果 Ricci 曲率 ≥ (n-1)K，那么测地球的体积增长不超过常曲率 K 空间中的体积增长。这类定理把局部的曲率条件转化为整体的几何约束，是证明很多深刻定理的利器。'},
    {id:'r20',label:'子流形与第二基本形式',r:18,
     content:'子流形 Σ⊂M 的几何由两个量刻画：诱导度量（第一基本形式）和第二基本形式 II。第二基本形式衡量 Σ 在 M 中如何弯曲，即 Σ 的法向"加速度"。Gauss-Codazzi 方程联系了内蕴曲率与外在曲率。',
     understanding:'球面 S² 放在 ℝ³ 里，有两种弯曲：球面本身的"内蕴弯曲"（高斯曲率，只跟球面上的度量有关）和球面在 ℝ³ 中如何"弯进去"（第二基本形式，跟法向量有关）。Gauss 的绝妙定理说：内蕴曲率完全由第一基本形式决定，不需要知道第二基本形式。这意味着二维生物在球面上测距离就能知道空间是弯的，不需要"从外面看"。'},

topology: {
  name:'代数拓扑', color:'#059669', accent2:'#0d9488',
  nodes:[
    {id:'t1',label:'同伦',r:22,
     content:'两个连续映射 f,g: X→Y 同伦，如果存在一个连续的"过渡"映射 H: X×[0,1]→Y，使得 H(x,0)=f(x), H(x,1)=g(x)。同伦是一个等价关系，同伦等价类是代数拓扑分类空间的基本工具。',
     understanding:'同伦就是"连续变形"。一个咖啡杯可以连续变形为一个甜甜圈——它们同伦等价。但你不能把咖啡杯连续变形为两个分离的球。同伦抓住了"拉伸和压缩，但不撕裂也不粘合"这个直觉。基本群和同伦群都是基于同伦概念定义的，所以这是整个代数拓扑的逻辑起点。'},
    {id:'t2',label:'基本群',r:24,
     content:'基本群 π₁(X,x₀) 是以 x₀ 为基点的所有闭路（loop）的同伦等价类构成的群，群运算是路的拼接。它是拓扑空间最基本的代数不变量。',
     understanding:'基本群测量的是"空间里有多少种不同的洞"。圆的基本群是 ℤ（整数），因为你可以顺时针绕 n 圈，也可以逆时针绕 n 圈。球面的基本群是平凡的（任何闭路都可以缩成一点），但环面 T² 的基本群是 ℤ×ℤ——因为有两个独立的"绕圈"方向。如果你能算出一个空间的基本群，你就抓住了它最本质的拓扑特征。'},
    {id:'t3',label:'Van Kampen定理',r:18,
     content:'Van Kampen 定理给出了计算基本群的最强工具：如果 X = U∪V，且 U、V、U∩V 都道路连通，那么 π₁(X) 可以从 π₁(U)、π₁(V) 和 π₁(U∩V) 通过群的自由积和融合关系构造出来。',
     understanding:'这是计算基本群的"分而治之"策略。把复杂的空间拆成两块简单空间，分别算基本群，再"粘回去"。粘回去的时候，交集部分的基本群提供"融合关系"——那些在交集里的闭路，在 U 和 V 中的表示必须一致。用这个定理，你可以轻松算出图的基本群（自由群）、闭曲面的基本群等。'},
    {id:'t4',label:'覆盖空间',r:22,
     content:'覆盖空间 p: X̃→X 是一个连续满射，满足每点 x∈X 存在邻域 U，使得 p⁻¹(U) 是 X̃ 中若干个不相交的开集，每个都被 p 同胚地映射到 U。覆盖空间与基本群通过 Galois 对应紧密关联。',
     understanding:'覆盖空间就是"展开"一个空间。想象圆柱面，它的万有覆盖是平面——平面绕成圆柱面，绕一圈对应一个整数。覆盖空间理论告诉我们，基本群的子群对应覆盖空间，正规子群对应正则覆盖。这个对应极其优美：代数（群论）和几何（覆盖）一一对应。如果你搞懂了这层关系，基本群就真正通透了。'},
    {id:'t5',label:'提升性质',r:18,
     content:'提升性质：给定覆盖 p: X̃→X 和连续映射 f: Y→X，如果 Y 是单连通或满足某些条件，f 可以"提升"为 f̃: Y→X̃ 使得 p∘f̃=f。这是覆盖空间理论的基石。',
     understanding:'提升性质回答了一个问题：给定一个映射到一个空间，能不能"展开"到覆盖空间上？核心结论是：能提升当且仅当 f 诱导的基本群映射的像落在 p 诱导的基本群子群中。特别地，从单连通空间出发的任何映射都可以唯一提升。这个性质用来证明覆盖空间中闭路的提升性质、计算基本群等。'},
    {id:'t6',label:'单纯复形',r:18,
     content:'单纯复形是由单纯形（点、线段、三角形、四面体及其高维推广）按照一定规则拼接而成的组合结构。它是离散化拓扑空间的工具，便于用代数方法（同调）计算拓扑不变量。',
     understanding:'别被"单纯复形"这个名字吓到。说白了就是把空间"三角剖分"——像有限元分析那样把曲面分成三角形，把立体分成四面体。这样做的妙处在于：原本连续的拓扑空间变成了由有限个"积木块"搭起来的组合结构，同调群的计算就变成了线性代数（算边界矩阵的秩）。计算机做拓扑数据分析（TDA）用的就是这个思路。'},
    {id:'t7',label:'单纯同调',r:22,
     content:'单纯同调是定义在单纯复形上的同调理论。k 维链群 Cₖ 由 k 维单纯形的形式和生成，边界算子 ∂ₖ: Cₖ→Cₖ₋₁ 将 k 维单纯形映射到它的 (k-1) 维边界（带符号）。同调群 Hₖ=ker ∂ₖ/im ∂ₖ₊₁。',
     understanding:'单纯同调是"数洞"的数学工具。边界算子 ∂ₖ 告诉你一个 k 维"积木"的边界是什么。那些"边界为零但自己不是边界的"链——就是洞。比如圆环：中间那个洞是 1 维的，周围有一圈 1 维单纯形组成的闭链，它不是任何 2 维链的边界，所以 H₁ 非零。同调群 Hₖ 的秩就是 k 维"洞"的个数（Betti 数）。'},
    {id:'t8',label:'奇异同调',r:20,
     content:'奇异同调将单纯同调推广到任意拓扑空间。奇异 k 维单纯形是连续映射 σ: Δᵏ→X，奇异链群由这些映射的形式和生成。边界算子类似定义，同调群同样为 Hₖ=ker ∂ₖ/im ∂ₖ₊₁。',
     understanding:'单纯同调的问题在于——你得先把空间三角剖分，不是所有空间都容易剖分。奇异同调绕过了这个限制：直接用"映射到空间的单纯形"来定义链，不需要剖分整个空间。代价是链群变得巨大（不可数维），但神奇的是同调群仍然是有限生成的（对紧流形）。奇异同调是更灵活、更通用的框架。'},
    {id:'t9',label:'同调群的性质',r:20,
     content:'同调群满足一系列公理性质：同伦不变性（同伦等价的空间有相同同调）、切除性（可以"切掉"不影响同调的部分）、正合性（长正合序列）、维数公理（单点的同调为 H₀≅ℤ，其余为零）。',
     understanding:'这些公理是同调论的"宪法"。同伦不变性最重要——如果你能连续变形一个空间，它的同调不变。这就解释了为什么咖啡杯和甜甜圈同调相同（都是 H₀=ℤ, H₁=ℤ, H₂=0）。切除性让你可以"挖掉"不好的部分，只要边界处理得当。Mayer-Vietoris 序列就是切除性的直接推论，是计算同调的主要工具。'},
    {id:'t10',label:'正合序列',r:18,
     content:'正合序列是一串群同态 ⋯→Aₙ₊₁→Aₙ→Aₙ₋₁→⋯，满足每个同态的像等于下一个同态的核。长正合序列是计算同调群的基本工具。',
     understanding:'正合序列是代数拓扑的"流水线"。信息从左流到右，每个环节"恰好抵消"——上一个的输出是下一个的输入。当你不知道某个群时，正合序列常常能帮你"夹逼"出它的结构。比如，如果一段序列是 0→A→B→0 正合，那么 A≅B。更复杂的情况，你可以用正合序列和已知群推导未知群。'},
    {id:'t11',label:'Mayer-Vietoris序列',r:20,
     content:'Mayer-Vietoris 序列是计算同调群的核心工具：对于 X=U∪V，存在长正合序列 ⋯→Hₖ(U∩V)→Hₖ(U)⊕Hₖ(V)→Hₖ(X)→Hₖ₋₁(U∩V)→⋯ 它把 X 的同调与 U、V 和 U∩V 的同调联系起来。',
     understanding:'这是同调版的 Van Kampen 定理。跟 Van Kampen 一样，它把复杂空间拆成两块，用已知的同调去算未知的同调。区别在于：Van Kampen 算的是基本群（非交换群），Mayer-Vietoris 算的是同调群（交换群），而且同调版本有所有维度。用这个序列算球面 Sⁿ 的同调非常简洁：把 Sⁿ 拆成两个半球（可缩），交集是 Sⁿ⁻¹，序列直接给出递推关系。'},
    {id:'t12',label:'CW复形',r:18,
     content:'CW 复形是通过逐维"粘合"胞腔（cell）构造的空间：从离散点集 X⁰ 开始，通过粘合映射 φ: Sⁿ⁻¹→Xⁿ⁻¹ 把 n 维圆盘 Dⁿ 粘上去，得到 Xⁿ。CW 复形是代数拓扑中最方便计算的拓扑空间。',
     understanding:'CW 复形是"用乐高搭空间"。0 维积木是点，1 维是线段（两端粘在已有的点上），2 维是圆盘（边界粘在已有的 1 维骨架上），以此类推。几乎所有你关心的空间（流形、复形）都有 CW 复形结构。CW 复形的胞腔同调计算极其简单——链群直接由 n 维胞腔的数量生成，边界算子由粘合映射的度数决定。'},
    {id:'t13',label:'胞腔同调',r:18,
     content:'胞腔同调是 CW 复形上定义的同调理论。n 维链群 Cₙ 由 n 维胞腔自由生成，边界算子 ∂ₙ 的矩阵元由粘合映射的度数给出。它计算简便，且与奇异同调同构。',
     understanding:'胞腔同调是"计算友好型"同调。你不需要处理无穷多的奇异单纯形，只需要数有多少个 n 维胞腔，然后算它们之间的边界映射（通常是整数矩阵）。比如，复射影空间 ℂPⁿ 的 CW 结构只有偶数维胞腔（每个偶数维一个），所以它的同调群一目了然：H₂ₖ≅ℤ，其余为零。'},
    {id:'t14',label:'上同调',r:22,
     content:'上同调 Hᵏ(X;G) 是对偶于同调的群：Cᵏ=Hom(Cₖ,G)，上边界算子 δᵏ: Cᵏ→Cᵏ⁺¹ 定义为 (δᵏφ)(σ)=φ(∂ₖ₊₁σ)。上同调有额外的乘法结构——杯积，使其成为一个环。',
     understanding:'上同调是"对偶视角"的同调。同调算的是"洞"，上同调算的是"在洞上积分"。它比同调多一个关键结构：杯积。杯积让上同调成为一个分次环，而不仅仅是群。这使上同调能区分一些同调相同但几何不同的空间。比如，S²×S² 和 ℂP²#ℂP² 同调一样，但上同调环不同（杯积结构不同），所以它们不同伦等价。'},
    {id:'t15',label:'杯积',r:20,
     content:'杯积 ⌣: Hᵖ(X)×Hᑫ(X)→Hᵖ⁺ᑫ(X) 是上同调上的乘法，定义在余链层面为 (φ⌣ψ)(σ)=φ(σ的前p维面)·ψ(σ的后q维面)。它赋予上同调分次交换环结构。',
     understanding:'杯积是上同调比同调"多出来的东西"。它有点像形式和的外积——两个 k 形式和 l 形式的外积是 (k+l) 形式。在上同调里，两个 p 维"洞"的杯积是一个 (p+q) 维的"洞"，代表了这两个洞的"相交"。环面 T² 的 H¹ 有两个生成元 a 和 b，它们的杯积 a⌣b 是 H² 的生成元——对应两个环的相交。'},
    {id:'t16',label:'同伦群',r:20,
     content:'同伦群 πₙ(X,x₀) 是 n 维球面 Sⁿ 到 X 的保持基点的映射的同伦类构成的群（n≥2 时是交换群）。π₁ 是基本群（非交换），πₙ（n≥2）是交换群。',
     understanding:'同伦群是基本群的高维推广——用 n 维球面代替 1 维圆圈。但是，计算同伦群极其困难，甚至球面的同伦群至今没有完全算出来。相比之下，同调群容易算得多。Hurewicz 定理联系了同伦和同调：第一个非零同伦群同构于同维度的同调群。同伦群的计算是代数拓扑的"硬核区域"。'},
    {id:'t17',label:'纤维化',r:18,
     content:'纤维化 p: E→B 是一个满足同伦提升性质的连续映射，典型纤维 F=p⁻¹(b)。纤维化产生长正合序列：⋯→πₙ(F)→πₙ(E)→πₙ(B)→πₙ₋₁(F)→⋯ 这是计算同伦群的主要工具。',
     understanding:'纤维化是"连续一族空间"。Hopf 纤维化 S³→S² 是最经典的例子：三维球面可以看成是二维球面上每点"长"一圈 S¹（纤维）。纤维化的长正合序列把底空间、全空间和纤维的同伦群串起来，如果你知道其中两个，就能推出第三个。这是计算同伦群最常用的方法。'},

cet6: {
  name:'英语六级', color:'#d97706', accent2:'#f59e0b',
  nodes:[
    {id:'c1',label:'词汇记忆策略',r:22,
     content:'六级词汇约 6000 词，核心高频词约 2000 词。高效记忆方法包括：词根词缀法、语境记忆法、间隔重复（Spaced Repetition）、主动回忆（Active Recall）。',
     understanding:'背单词最怕的就是"背了忘、忘了背"的死循环。其实大脑的记忆不是硬盘，而是肌肉——用得越多越牢固。与其一天背 100 个新词然后一周全忘，不如每天背 20 个新词 + 复习 60 个旧词。关键是"间隔重复"：在遗忘曲线的拐点附近复习，效率最高。把单词放到句子里记忆，比孤立地背词表有效得多。比如 "ambiguous" 这个词，记 "The contract contains an ambiguous clause" 比记 "ambiguous=模棱两可的" 强十倍。'},
    {id:'c2',label:'词根词缀',r:20,
     content:'掌握高频词根（如 spec-/spect- 看、dict- 说、duc- 引导、mit-/miss- 发送）和词缀（如 pre- 前、re- 再、-tion 名词、-able 可…的），可以大幅提升猜词能力和记忆效率。',
     understanding:'英语词汇不是一盘散沙，而是有"家族血缘"的。spect（看）这个根，衍生出 inspect（往里看→检查）、respect（回头看→尊重）、prospect（向前看→前景）、spectacle（看的东西→奇观）。一旦你掌握了 50 个核心词根，就能覆盖几千个派生词。这比死记硬背聪明太多了。而且考试时遇到生词，拆开词根词缀往往能猜出大概意思。'},
    {id:'c3',label:'阅读理解',r:24,
     content:'六级阅读包括仔细阅读（2篇）、快速阅读（1篇长文匹配）和选词填空。核心技巧：先读题干划关键词、回原文定位、注意同义替换、把握作者态度。',
     understanding:'六级阅读考的不是你英语有多好，而是你"找信息"有多快。很多人栽在逐字逐句读，结果时间不够。正确做法是：先扫一眼题目（不是选项！），圈出关键词（人名、数字、专有名词），然后快速在原文定位。答案往往就是原文的同义改写——换个说法而已。注意转折词（but, however, yet），后面常常是考点。作者态度题看形容词和副词就够了，不用通读全段。'},
    {id:'c4',label:'长难句分析',r:20,
     content:'六级阅读中长难句的核心是"拆主干、找修饰"。主干 = 主语 + 谓语（+宾语），修饰 = 定语从句、状语从句、插入语、分词短语。',
     understanding:'读长难句不要从头到尾硬啃。先找谓语动词——这是句子的"心脏"。找到谓语后，主语在它前面，宾语在它后面。剩下的全是修饰成分。比如 "The proposal that the committee submitted after weeks of deliberation was finally approved" ——先抓住 "The proposal was approved"，中间的 that 从句和 after 短语都是修饰，读完主干再回去看修饰。练多了你会发现，再长的句子也就是"主干+装饰"的结构。'},
    {id:'c5',label:'听力技巧',r:22,
     content:'六级听力包括短篇新闻、长对话和短文理解。关键技巧：预读选项、抓关键词、注意语音语调变化、同义替换识别。',
     understanding:'六级听力最大的坑是"走神"。一不留神就错过关键信息。解决办法是"预读"——在录音开始前，快速扫一遍选项，猜对话主题和可能的问题。听的时候不要试图听懂每个词，而是抓"信号词"：but, however, actually 后面通常是答案；well, you know, I mean 后面常常是说话人的真实态度。注意语调变化——升调表示疑问，降调表示确定。如果错过了某题，果断放弃，不要影响下一题。'},
    {id:'c6',label:'听力场景词汇',r:18,
     content:'六级听力高频场景：校园生活（seminar, syllabus, assignment, deadline）、职场（promotion, resign, interview）、旅游（reservation, boarding, departure）、健康（symptom, prescription, allergy）。',
     understanding:'听力有个窍门：场景决定词汇。听到 "boarding pass" 你就知道在机场，听到 "syllabus" 就知道在教室。提前熟悉各场景的"关键词包"，考试时就能快速进入状态。比如，听到 "I'd like to check in" 立刻切换到"酒店/机场"模式，脑子里预激活 reservation, luggage, aisle seat 等词。这比裸听强太多了。'},
    {id:'c7',label:'写作模板',r:24,
     content:'六级写作（30分钟，150-200词）常见题型：议论文、图表作文、书信/邮件。核心结构：三段式——引入段（背景+观点）、主体段（论点+论据）、结论段（总结+升华）。',
     understanding:'作文拿分的关键不是写得多华丽，而是结构清晰、没有语法错误。我强烈建议你准备一套"万能骨架"：开头段用 "Recently, the issue of...has aroused widespread concern. From my perspective,..." 主体段 "First and foremost,...Furthermore,...Last but not least,..." 结尾段 "To sum up,...only by...can we..." 这套骨架背熟了，考试时直接往里填内容，省时省力，而且结构清晰，阅卷老师看了就舒服。记住：宁可简单正确，不要复杂错误。'},
    {id:'c8',label:'常用句型',r:20,
     content:'六级作文高分句型：强调句（It is...that...）、倒装句（Not only...but also...）、虚拟语气（If...were to...）、非限定性定语从句（which...）、with 复合结构。',
     understanding:'作文想从 12 分提到 15 分，靠的就是句型变化。每段至少用一次高级句型，但不要堆砌。一篇文章里，强调句用一次、倒装句用一次、定语从句用一次，就足够了。比如 "It is through persistence that we can overcome difficulties"（强调句）比 "We can overcome difficulties through persistence" 高级一个档次。但切记：用之前确保你写的是对的，语法错误比简单句扣分更多。'},
    {id:'c9',label:'翻译技巧',r:22,
     content:'六级翻译（汉译英，30分钟，150-200字）考查中国文化、历史、社会热点等话题。核心技巧：找主干、拆长句、用被动语态、注意时态统一。',
     understanding:'翻译最大的误区是"逐字翻"。中文和英文的句子结构完全不同——中文是"竹节式"（短句并列），英文是"树式"（主从嵌套）。所以拿到中文先找主干（谁干了什么），翻成英文主谓宾，然后再把修饰成分挂上去。比如"位于北京市中心、始建于明朝的故宫博物院，每年吸引数百万游客"——主干是"故宫博物院吸引游客"，翻成 "The Palace Museum attracts millions of tourists"，然后挂 "located in central Beijing" 和 "built in the Ming Dynasty"。遇到不会的词，用解释代替，别空着。'},
    {id:'c10',label:'选词填空',r:18,
     content:'选词填空（15选10）考查词汇辨析和上下文理解。策略：先按词性分类（名词、动词、形容词、副词），再根据空格语法位置缩小范围，最后用上下文语义确定。',
     understanding:'这题很多人直接放弃，其实它是整套卷子里性价比最高的——掌握了方法，10 分钟能拿 8 分。关键是"先分类，再填空"。拿到 15 个词，别急着看文章，先用 30 秒把所有词按词性分类：n./v./adj./adv.。然后看空格：前面是冠词→填名词；前面是 be 动词→填形容词或现在分词；后面是名词→可能是形容词。这样每个空只需从 3-4 个候选词里选，而不是 15 个。'},
    {id:'c11',label:'完形填空',r:18,
     content:'完形填空考查词汇、语法和篇章理解。策略：先通读全文把握大意，再逐空作答，注意上下文逻辑关系（转折、因果、递进）。',
     understanding:'完形填空的关键是"先读懂，再填空"。很多人上来就填，填到一半发现理解错了，又回头改，浪费时间。正确做法是：第一步，花 1 分钟通读全文（不看选项），搞清楚文章讲什么。第二步，逐空作答，注意前后逻辑——however 后面一定是转折，therefore 后面是因果，furthermore 后面是递进。第三步，填完后快速通读一遍，检查是否通顺。'},
    {id:'c12',label:'阅读题型分类',r:18,
     content:'六级阅读六大题型：细节题（40%）、推断题（20%）、主旨题（15%）、态度题（10%）、词义题（10%）、例证题（5%）。每种题型有不同的解题策略。',
     understanding:'不同题型有不同的"套路"。细节题最简单——回原文定位，找同义替换。推断题稍难——答案不在原文直接说，但"暗示"出来了。主旨题看首尾段和每段首句，作者反复提的就是主题。态度题看形容词和副词，客观题选 neutral/objective，议论文选 positive/negative/critical。词义题看上下文——生词的意思往往在前后句中解释了。例证题——例子本身不重要，例子支持的观点才是考点。'},

/* ================================================================
   STATE MANAGEMENT — localStorage
   ================================================================ */
const STORAGE_KEY = 'learning_workbench_v2';
function loadState(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{};}catch(e){return{}}
}
function saveState(state){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}
}
let state = loadState();
if(!state.learned) state.learned = {};
if(!state.notes) state.notes = {};
if(!state.currentSubject) state.currentSubject = 'riemann';
if(!state.history) state.history = [];
if(!state.quizLog) state.quizLog = [];
saveState(state);

function markLearned(nodeId){
  if(state.learned[nodeId]){delete state.learned[nodeId]}
  else{state.learned[nodeId]=Date.now()}
  state.history.push({node:nodeId,action:state.learned[nodeId]?'learned':'unlearned',time:Date.now()});
  if(state.history.length>200) state.history = state.history.slice(-200);
  saveState(state);
  updateGraph();
}
function isLearned(nodeId){return !!state.learned[nodeId]}
function getProgress(subject){
  const nodes = KNOWLEDGE[subject].nodes;
  const learned = nodes.filter(n=>isLearned(n.id)).length;
  return {learned,total:nodes.length,pct:Math.round(learned/nodes.length*100)};
}

/* ================================================================
   GRAPH ENGINE — D3.js Force-Directed
   ================================================================ */
let currentSubject = state.currentSubject;
let simulation, svg, g, zoom;
let nodeElements, linkElements, labelElements;

function initGraph(){
  const panel = document.getElementById('graphPanel');
  const W = panel.clientWidth, H = panel.clientHeight;
  if(svg){svg.remove()}
  svg = d3.select('#graphPanel').append('svg').attr('viewBox',[0,0,W,H]);
  g = svg.append('g');
  zoom = d3.zoom().scaleExtent([0.3,3]).on('zoom',(e)=>g.attr('transform',e.transform));
  svg.call(zoom);
  svg.on('dblclick.zoom',null);
  updateGraph();
}

function updateGraph(){
  const panel = document.getElementById('graphPanel');
  const W = panel.clientWidth, H = panel.clientHeight;
  const subj = KNOWLEDGE[currentSubject];
  const nodes = subj.nodes.map(n=>({...n}));
  const edges = subj.edges.map(e=>({source:e.source,target:e.target}));
  const nodeMap = new Map(nodes.map(n=>[n.id,n]));

  if(simulation) simulation.stop();
  g.selectAll('*').remove();

  // Links
  linkElements = g.append('g').selectAll('line').data(edges).join('line')
    .attr('class','link-line').attr('stroke',subj.accent2+'44').attr('stroke-width',1.5);

  // Nodes
  nodeElements = g.append('g').selectAll('g').data(nodes).join('g').attr('cursor','pointer');

  nodeElements.append('circle').attr('class','node-circle')
    .attr('r',d=>d.r||18).attr('fill',subj.color)
    .attr('stroke',subj.accent2).attr('stroke-width',1.5)
    .attr('opacity',d=>isLearned(d.id)?1:0.72);

  nodeElements.append('circle').attr('class','node-circle learned')
    .attr('r',d=>(d.r||18)+3).attr('fill','none')
    .attr('stroke',subj.accent2).attr('stroke-width',0)
    .attr('opacity',0);

  nodeElements.filter(d=>isLearned(d.id)).select('.learned')
    .attr('stroke-width',2.5).attr('opacity',1);

  // Labels
  labelElements = g.append('g').selectAll('text').data(nodes).join('text')
    .attr('class','node-label').text(d=>d.label)
    .attr('font-size',d=>Math.max(10,Math.min(13,(d.r||18)*0.6)))
    .attr('fill','#fff').attr('font-weight','600');

  // Force simulation
  simulation = d3.forceSimulation(nodes)
    .force('link',d3.forceLink(edges).id(d=>d.id).distance(100).strength(0.5))
    .force('charge',d3.forceManyBody().strength(-400))
    .force('center',d3.forceCenter(W/2,H/2))
    .force('collision',d3.forceCollide().radius(d=>(d.r||18)+12))
    .on('tick',()=>{
      linkElements.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
        .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      nodeElements.attr('transform',d=>`translate(${d.x},${d.y})`);
      labelElements.attr('x',d=>d.x).attr('y',d=>d.y);
    });

  // Click handler
  nodeElements.on('click',(e,d)=>showDetail(d.id));
  nodeElements.on('dblclick',(e,d)=>{e.stopPropagation();markLearned(d.id)});

  // Drag
  nodeElements.call(d3.drag()
    .on('start',(e,d)=>{if(!e.active)simulation.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y})
    .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y})
    .on('end',(e,d)=>{if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null}));

  // Update subject indicator
  updateTabStyles();
}

/* ================================================================

   ================================================================ */
function showDetail(nodeId){
  const subj = KNOWLEDGE[currentSubject];
  const node = subj.nodes.find(n=>n.id===nodeId);
  if(!node) return;
  const learned = isLearned(nodeId);
  const relatedEdges = subj.edges.filter(e=>e.source===nodeId||e.target===nodeId);
  const relatedIds = relatedEdges.map(e=>e.source===nodeId?e.target:e.source);
  const relatedNodes = relatedIds.map(id=>subj.nodes.find(n=>n.id===id)).filter(Boolean);

  const badgeClass = currentSubject==='topology'?'green':currentSubject==='cet6'?'amber':'';
  const panel = document.getElementById('detailPanel');
  panel.innerHTML = `
    <button class="btn-close" onclick="closeDetail()">✕</button>
    <h3>${node.label}<span class="badge ${badgeClass}">${subj.name}</span></h3>
    <div class="section">
      <h4>📖 核心内容</h4>
      <p>${node.content}</p>
    </div>
    <div class="section">
      <h4>💡 我的理解</h4>
      <p style="color:var(--ink);font-style:italic">${node.understanding}</p>
    </div>
    ${relatedNodes.length?`
    <div class="section">
      <h4>🔗 关联知识点</h4>
      <div class="related-tags">
        ${relatedNodes.map(rn=>`<span class="related-tag" onclick="showDetail('${rn.id}')">${rn.label}</span>`).join('')}
      </div>
    </div>`:''}
    ${state.notes[nodeId]?`
    <div class="section">
      <h4>📝 我的笔记</h4>
      <p style="background:var(--bg2);padding:0.6rem;border-radius:8px;font-size:0.85rem">${state.notes[nodeId]}</p>
    </div>`:''}
    <div class="btn-row">
      <button class="btn btn-learned ${learned?'done':''}" onclick="markLearned('${nodeId}');showDetail('${nodeId}')">${learned?'✅ 已掌握':'☐ 标记为已掌握'}</button>
      <button class="btn btn-note" onclick="addNote('${nodeId}')">📝 写笔记</button>
    </div>
  `;
  document.getElementById('detailOverlay').classList.add('show');
}

function closeDetail(){
  document.getElementById('detailOverlay').classList.remove('show');
}

function addNote(nodeId){
  const note = prompt('为这个知识点写一条笔记：',state.notes[nodeId]||'');
  if(note!==null){
    if(note.trim()){state.notes[nodeId]=note.trim()}
    else{delete state.notes[nodeId]}
    state.history.push({node:nodeId,action:'note',time:Date.now()});
    if(state.history.length>200) state.history = state.history.slice(-200);
    saveState(state);
    showDetail(nodeId);
  }
}

let quizState = null;
function startQuiz(){
  const subj = KNOWLEDGE[currentSubject];
  const pool = subj.nodes.filter(n=>!isLearned(n.id));
  if(pool.length<2){
    const allLearned = subj.nodes.filter(n=>isLearned(n.id));
    if(allLearned.length<2){alert('需要至少 2 个知识点才能生成测验！');return}
    // Review learned
    const qs = d3.shuffle([...allLearned]).slice(0,5);
    buildQuiz(qs,subj);
    return;
  }
  const qs = d3.shuffle([...pool]).slice(0,5);
  buildQuiz(qs,subj);
}

function buildQuiz(questions,subj){
  quizState = {questions,current:0,score:0,answers:[],subject:currentSubject};
  showQuizQuestion();
  document.getElementById('quizOverlay').classList.add('show');
}

function showQuizQuestion(){
  const q = quizState.questions[quizState.current];
  if(!q){finishQuiz();return}
  // Generate wrong options from other nodes
  const subj = KNOWLEDGE[quizState.subject];
  const others = subj.nodes.filter(n=>n.id!==q.id);
  const wrongOpts = d3.shuffle([...others]).slice(0,3);
  const options = d3.shuffle([{id:q.id,label:q.label,correct:true},...wrongOpts.map(n=>({id:n.id,label:n.label,correct:false}))]);

  const panel = document.getElementById('quizPanel');
  panel.innerHTML = `
    <h3>📝 测验 (${quizState.current+1}/${quizState.questions.length})</h3>
    <p style="font-size:0.9rem;margin:0.8rem 0;line-height:1.6">${q.content.substring(0,120)}...</p>
    <p style="font-weight:600;margin-bottom:0.5rem">这个问题描述的是哪个知识点？</p>
    <div id="quizOptions">
      ${options.map(o=>`<div class="quiz-option" data-id="${o.id}" data-correct="${o.correct}" onclick="answerQuiz(this)">${o.label}</div>`).join('')}
    </div>
    <div id="quizFeedback" style="margin-top:0.8rem;font-size:0.85rem"></div>
  `;
}

function answerQuiz(el){
  if(el.parentElement.querySelector('.correct')||el.parentElement.querySelector('.wrong')) return;
  const correct = el.dataset.correct==='true';
  if(correct){el.classList.add('correct');quizState.score++}
  else{el.classList.add('wrong');el.parentElement.querySelector('[data-correct="true"]').classList.add('correct')}
  quizState.answers.push({node:quizState.questions[quizState.current].id,correct});
  document.getElementById('quizFeedback').innerHTML = correct
    ?'✅ 正确！'
    :`❌ 正确答案是：<strong>${el.parentElement.querySelector('[data-correct="true"]').textContent}</strong>`;
  setTimeout(()=>{quizState.current++;showQuizQuestion()},1500);
}

function finishQuiz(){
  const pct = Math.round(quizState.score/quizState.questions.length*100);
  state.quizLog.push({subject:quizState.subject,score:quizState.score,total:quizState.questions.length,time:Date.now()});
  if(state.quizLog.length>50) state.quizLog = state.quizLog.slice(-50);
  saveState(state);

  const panel = document.getElementById('quizPanel');
  panel.innerHTML = `
    <h3>📝 测验完成！</h3>
    <div class="quiz-score">${quizState.score}/${quizState.questions.length} (${pct}%)</div>
    <p style="text-align:center;color:var(--muted);font-size:0.85rem">${pct>=80?'🎉 太棒了！':pct>=60?'👍 不错，继续加油！':'💪 还需努力，多看几遍！'}</p>
    <div style="margin-top:1rem;font-size:0.85rem">
      ${quizState.questions.map((q,i)=>`<p style="margin:0.3rem 0">${quizState.answers[i].correct?'✅':'❌'} ${q.label}</p>`).join('')}
    </div>
    <div class="btn-row" style="margin-top:1rem">
      <button class="btn btn-learned" onclick="closeQuiz()">关闭</button>
      <button class="btn btn-note" onclick="startQuiz()">再来一局</button>
    </div>
  `;
}

function closeQuiz(){document.getElementById('quizOverlay').classList.remove('show');quizState=null}

   ================================================================ */
function initSearch(){
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');
  input.addEventListener('input',()=>{
    const q = input.value.trim().toLowerCase();
    if(q.length<1){results.classList.remove('show');return}
    const allNodes = [...KNOWLEDGE.riemann.nodes.map(n=>({...n,subject:'riemann'})),
      ...KNOWLEDGE.topology.nodes.map(n=>({...n,subject:'topology'})),
      ...KNOWLEDGE.cet6.nodes.map(n=>({...n,subject:'cet6'}))];
    const matches = allNodes.filter(n=>n.label.toLowerCase().includes(q)||n.content.toLowerCase().includes(q)).slice(0,8);
    results.innerHTML = matches.length
      ?matches.map(n=>{
        const sname = n.subject==='riemann'?'黎曼几何':n.subject==='topology'?'代数拓扑':'英语六级';
        return `<div class="item" onclick="switchToNode('${n.subject}','${n.id}')"><div>${n.label}</div><div class="sub">${sname}</div></div>`;
      }).join('')
      :'<div class="item" style="color:var(--muted)">无匹配结果</div>';
    results.classList.add('show');
  });
  input.addEventListener('blur',()=>{setTimeout(()=>results.classList.remove('show'),200)});
}

function switchToNode(subject,nodeId){
  if(currentSubject!==subject){
    currentSubject=subject;
    state.currentSubject=subject;
    saveState(state);
    updateGraph();
    updateTabStyles();
  }
  setTimeout(()=>showDetail(nodeId),300);
  document.getElementById('searchResults').classList.remove('show');
  document.getElementById('searchInput').value='';
}

/* ================================================================
   BUTTON HANDLERS
   ================================================================ */
document.getElementById('btnDash').addEventListener('click',showDashboard);
document.getElementById('btnQuiz').addEventListener('click',startQuiz);
document.getElementById('btnSearch').addEventListener('click',()=>{
  const wrap = document.getElementById('searchWrap');
  wrap.style.display = wrap.style.display==='none'?'block':'none';
  if(wrap.style.display!=='none') document.getElementById('searchInput').focus();
});
document.getElementById('detailOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDetail()});
document.getElementById('dashOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDash()});
document.getElementById('quizOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeQuiz()});

// Mobile bar
document.getElementById('mbSearch').addEventListener('click',()=>document.getElementById('btnSearch').click());
document.getElementById('mbDash').addEventListener('click',showDashboard);
document.getElementById('mbQuiz').addEventListener('click',startQuiz);
document.getElementById('mbList').addEventListener('click',()=>{
  const subj = KNOWLEDGE[currentSubject];
  const items = subj.nodes.map(n=>`<div class="item" onclick="showDetail('${n.id}');closeList()" style="display:flex;justify-content:space-between;align-items:center"><span>${isLearned(n.id)?'✅ ':''}${n.label}</span><span style="font-size:0.7rem;color:var(--muted)">${subj.name}</span></div>`).join('');
  const panel = document.getElementById('detailPanel');
  panel.innerHTML = `<button class="btn-close" onclick="closeDetail()">✕</button><h3>📋 ${subj.name} 知识点列表</h3><div style="margin-top:1rem">${items}</div>`;
  document.getElementById('detailOverlay').classList.add('show');
});

// Keyboard shortcuts
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDetail();closeDash();closeQuiz()}
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();document.getElementById('btnSearch').click()}
});

// Handle resize
window.addEventListener('resize',()=>{
  const panel = document.getElementById('graphPanel');
  if(svg) svg.attr('viewBox',[0,0,panel.clientWidth,panel.clientHeight]);
});

/* ================================================================
   INIT
   ================================================================ */
initSearch();
initGraph();
updateTabStyles();

// Daily streak reminder
(function(){
  const today = new Date().toDateString();
  const lastVisit = state.lastVisit;
  if(lastVisit && lastVisit !== today){
    const diff = Math.floor((new Date(today)-new Date(lastVisit))/(86400000));
    if(diff===1){state.streak=(state.streak||0)+1}
    else{state.streak=1}
  }else if(!lastVisit){state.streak=1}
  state.lastVisit = today;
  saveState(state);
  if(state.streak>=3){
    console.log(`🔥 连续学习第 ${state.streak} 天！`);
  }
})();

console.log('📐 学习工作台已就绪');
