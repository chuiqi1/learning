义为T(X,Y)=∇_X Y - ∇_Y X - [X,Y]。Levi-Civita联络的挠率恒为零。","difficulty":"medium","chapter":"ch4","subject":"riemann"},{"q":"协变导数∇_X对函数f的作用是什么？","options":["∇_X f = 0","∇_X f = Xf（方向导数）","∇_X f = f·X","∇_X f = df"],"answer":1,"explanation":"对函数（标量场），协变导数退化为普通方向导数：∇_X f = Xf = df(X)。","difficulty":"medium","chapter":"ch4","subject":"riemann"},{"q":"Foucault摆的摆动平面旋转与什么几何概念相关？","options":["测地线","平行移动","曲率","指数映射"],"answer":1,"explanation":"Foucault摆的摆动平面旋转是平行移动的物理体现：地球自转使摆沿球面平行移动，产生和乐旋转。","difficulty":"medium","chapter":"ch4","subject":"riemann"},{"q":"Berger分类定理中，不可约非对称黎曼流形的和乐群有几种？","options":["5种","7种","9种","无穷多种"],"answer":1,"explanation":"Berger分类给出了7种可能：SO(n), U(n), SU(n), Sp(n)·Sp(1), Sp(n), G₂, Spin(7)。","difficulty":"hard","chapter":"ch4","subject":"riemann"},{"q":"Killing向量场满足什么方程？","options":["∇_i X_j = 0","∇_i X_j + ∇_j X_i = 0","∇_i X_j - ∇_j X_i = 0","X_i X_j = 0"],"answer":1,"explanation":"Killing向量场满足Killing方程：∇_i X_j + ∇_j X_i = 0，生成流形的等距变换。","difficulty":"medium","chapter":"ch4","subject":"riemann"},{"q":"de Rham分解定理与什么概念相关？","options":["曲率张量","和乐群的可约性","测地线","指数映射"],"answer":1,"explanation":"de Rham分解定理：若和乐群可约，则流形局部等距于黎曼乘积。和乐群的可约性对应流形的分解。","difficulty":"hard","chapter":"ch4","subject":"riemann"},{"q":"在欧氏空间Rⁿ中，平行移动与路径的关系是什么？","options":["与路径有关","与路径无关","仅在闭曲线上有关","仅在测地线上有关"],"answer":1,"explanation":"欧氏空间曲率为零，平行移动与路径无关（和乐群平凡），这是平坦空间的特性。","difficulty":"easy","chapter":"ch4","subject":"riemann"},{"q":"Koszul公式用于计算什么？","options":["曲率张量","Levi-Civita联络的Christoffel符号","测地线方程","体积形式"],"answer":1,"explanation":"Koszul公式：2g(∇_X Y, Z) = Xg(Y,Z) + Yg(Z,X) - Zg(X,Y) + g([X,Y],Z) - g([Y,Z],X) + g([Z,X],Y)。它通过度量和李括号表达Levi-Civita联络，是唯一性证明和显式计算的基础。参考Lee定理5.4。","difficulty":"medium","chapter":"ch4","subject":"riemann"},{"q":"设∇是Levi-Civita联络。度量相容性条件∇g = 0的等价表述是什么？","options":["Xg(Y,Z) = g(∇_X Y, Z) + g(Y, ∇_X Z)","Xg(Y,Z) = 0","g(∇_X Y, Z) = 0","g(Y, ∇_X Z) = g(∇_X Y, Z)"],"answer":0,"explanation":"度量相容性∇g = 0等价于Xg(Y,Z) = g(∇_X Y, Z) + g(Y, ∇_X Z)，即协变导数满足对度量的“莱布尼茨法则”。这是联络保持内积结构的必要条件。","difficulty":"easy","chapter":"ch4","subject":"riemann"},{"q":"在局部坐标下，向量场X = X^i ∂_i的协变导数∇_j X^i的表达式为？","options":["∇_j X^i = ∂_j X^i","∇_j X^i = ∂_j X^i + Γ^i_jk X^k","∇_j X^i = ∂_j X^i - Γ^i_jk X^k","∇_j X^i = Γ^i_jk X^k"],"answer":1,"explanation":"向量场的协变导数：∇_j X^i = ∂_j X^i + Γ^i_jk X^k。上标接受+Γ修正。对于1-形式ω_i，协变导数∇_j ω_i = ∂_j ω_i - Γ^k_ji ω_k（下标接受-Γ修正）。","difficulty":"medium","chapter":"ch4","subject":"riemann"},{"q":"设γ(t)是黎曼流形中的曲线，V(t)是沿γ的向量场。沿γ的协变导数∇_t V的局部坐标表达式为？","options":["∇_t V^k = dV^k/dt","∇_t V^k = dV^k/dt + Γ^k_ij γ'^i V^j","∇_t V^k = dV^k/dt - Γ^k_ij γ'^i V^j","∇_t V^k = Γ^k_ij V^i V^j"],"answer":1,"explanation":"沿曲线的协变导数：∇_t V^k = dV^k/dt + Γ^k_ij(γ(t)) γ'^i(t) V^j(t)。这是平行移动方程∇_t V = 0的局部坐标形式。","difficulty":"medium","chapter":"ch4","subject":"riemann"},{"q":"联络形式ω^i_j与Christoffel符号的关系是什么？","options":["ω^i_j = Γ^i_jk dx^k","ω^i_j = Γ^i_jk","ω^i_j = Γ^i_jk ∂_k","ω^i_j = Γ^i_jk g_kl"],"answer":0,"explanation":"在坐标基下，联络1-形式ω^i_j = Γ^i_jk dx^k。Cartan结构方程dθ^i + ω^i_j ∧ θ^j = Θ^i（挠率）和dω^i_j + ω^i_k ∧ ω^k_j = Ω^i_j（曲率）用联络形式表达。","difficulty":"hard","chapter":"ch4","subject":"riemann"},{"q":"设(M,g)是二维黎曼流形，在等温坐标(x,y)下g = e^(2λ)(dx²+dy²)。Christoffel符号Γ^x_xy等于什么？","options":["0","∂_x λ","∂_y λ","-∂_x λ"],"answer":1,"explanation":"在等温坐标g = e^(2λ)(dx²+dy²)下，非零Christoffel符号为：Γ^x_xx = Γ^y_xy = Γ^y_yx = ∂_x λ，Γ^x_yy = -Γ^y_xx = -∂_x λ，Γ^y_yy = Γ^x_xy = Γ^x_yx = ∂_y λ，Γ^y_xx = -Γ^x_xy = -∂_y λ。这是二维共形度量的标准计算。参考Lee习题4-5。","difficulty":"hard","chapter":"ch4","subject":"riemann"},{"q":"无挠联络的定义是∇_X Y - ∇_Y X = [X,Y]。在局部坐标下，这等价于什么？","options":["Γ^k_ij = 0","Γ^k_ij = Γ^k_ji","Γ^k_ij = -Γ^k_ji","∂_i Γ^j_kl = 0"],"answer":1,"explanation":"无挠性在坐标基下等价于Christoffel符号的对称性：Γ^k_ij = Γ^k_ji。这是无挠联络的坐标表征，也是Levi-Civita联络Christoffel符号公式推导的关键前提。","difficulty":"easy","chapter":"ch4","subject":"riemann"},{"q":"设X,Y,Z是光滑向量场。R(X,Y)Z = ∇_X∇_Y Z - ∇_Y∇_X Z - ∇_[X,Y]Z。∇_[X,Y]Z项的作用是什么？","options":["确保R是张量（C^∞-多线性）","使R满足Bianchi恒等式","使R与度量相容","使R对称"],"answer":0,"explanation":"∇_[X,Y]Z项的存在确保曲率算子R(X,Y)Z关于X,Y,Z是C^∞-多线性的，即对任意函数f，R(fX,Y)Z = f·R(X,Y)Z。没有这项，∇_X∇_Y Z - ∇_Y∇_X Z不是张量。","difficulty":"medium","chapter":"ch4","subject":"riemann"},{"q":"设γ是黎曼流形中的闭曲线，P_γ: T_pM → T_pM是沿γ的平行移动。和乐群Hol_p(M)是？","options":["所有P_γ生成的O(T_pM)的子群","基本群π_1(M)","曲率张量在p的值","等距群在p的迷向子群"],"answer":0,"explanation":"和乐群Hol_p(M) = {P_γ : γ是以p为基点的分段光滑闭曲线}，是正交群O(T_pM)的子群。和乐群度量了平行移动对路径的依赖程度。Ambrose-Singer定理将和乐代数与曲率张量联系起来。","difficulty":"medium","chapter":"ch4","subject":"riemann"},{"q":"设(M,g)是黎曼流形，f: M → R光滑。Hessian ∇²f定义为∇²f(X,Y) = ?","options":["∇²f(X,Y) = X(Yf) - (∇_X Y)f","∇²f(X,Y) = X(Yf)","∇²f(X,Y) = g(∇_X grad f, Y)","∇²f(X,Y) = X(Yf) - (∇_X Y)f，且等于g(∇_X grad f, Y)"],"answer":3,"explanation":"Hessian有两种等价定义：∇²f(X,Y) = X(Yf) - (∇_X Y)f = g(∇_X grad f, Y)。前者更直接，后者揭示了Hessian与梯度协变导数的关系。Hessian是对称(0,2)-张量。","difficulty":"hard","chapter":"ch4","subject":"riemann"},{"q":"在二维球面S²上，从北极出发沿纬线平行移动一个向量一周后，该向量旋转了多少？","options":["0","等于该纬线围成面积的球面面积","等于围成面积的Gauss曲率积分","2π"],"answer":2,"explanation":"平行移动一周后的旋转角等于该纬线所围区域上Gauss曲率的积分（即球面面积/R²）。对于纬度φ的纬线，围成的球冠面积为2πR²(1-sin φ)，旋转角为2π(1-sin φ)。这是Gauss-Bonnet定理的平行移动解释。","difficulty":"hard","chapter":"ch4","subject":"riemann"},{"q":"在黎曼流形上，对光滑函数f，下列哪个等式成立？","options":["Δf = tr_g(∇²f) = g^ij ∇²f_ij","Δf = g^ij ∂_i∂_j f","Δf = div(grad f) = tr_g(∇²f)","Δf = div(grad f) = tr_g(∇²f) = g^ij ∇²f_ij"],"answer":3,"explanation":"Laplace-Beltrami算子有三种等价定义：Δf = div(grad f) = tr_g(∇²f) = g^ij ∇²f_ij。在局部坐标下，Δf = g^ij(∂_i∂_j f - Γ^k_ij ∂_k f)。","difficulty":"easy","chapter":"ch4","subject":"riemann"},{"q":"测地线方程在局部坐标下是什么形式？","options":["dx^k/dt = 0","d²x^k/dt² + Γ^k_ij dx^i/dt dx^j/dt = 0","dx^k/dt + Γ^k_ij x^i x^j = 0","d²x^k/dt² = 0"],"answer":1,"explanation":"测地线方程为d²x^k/dt² + Γ^k_ij (dx^i/dt)(dx^j/dt) = 0，是二阶非线性ODE。","difficulty":"easy","chapter":"ch5","subject":"riemann"},{"q":"指数映射exp_p的定义是什么？","options":["exp_p(v) = p + v","exp_p(v) = γ_v(1)，其中γ_v是测地线","exp_p(v) = p·v","exp_p(v) = ∇_v p"],"answer":1,"explanation":"exp_p(v) = γ_v(1)，即从p以速度v出发的测地线在t=1时刻到达的点。","difficulty":"easy","chapter":"ch5","subject":"riemann"},{"q":"Hopf-Rinow定理中，以下哪项不是完备性的等价条件？","options":["作为度量空间完备","任意两点可由最短测地线连接","截面曲率有界","有界闭集紧致"],"answer":2,"explanation":"Hopf-Rinow定理等价条件：(1)度量完备；(2)测地完备；(3)两点可由最短测地线连接；(4)有界闭集紧致。曲率有界不在其中。","difficulty":"medium","chapter":"ch5","subject":"riemann"},{"q":"球面S²上，北极的割迹是什么？","options":["赤道","整个球面","南极（单点）","所有经线"],"answer":2,"explanation":"球面上任意点p的割迹是对径点{-p}。从p出发沿大圆走，在到达-p之前是最短的。","difficulty":"medium","chapter":"ch5","subject":"riemann"},{"q":"Gauss引理的内容是什么？","options":["测地线总是最短的","exp_p保持径向和切向正交性","所有测地线最终相交","距离函数是光滑的"],"answer":1,"explanation":"Gauss引理：指数映射的微分保持径向与切向正交性，这是测地线极坐标表示的基础。","difficulty":"medium","chapter":"ch5","subject":"riemann"},{"q":"能量泛函E(γ)和长度泛函L(γ)的关系是什么？","options":["E = L","E = L²/2 (对弧长参数)","E = √L","E = 1/L"],"answer":1,"explanation":"对弧长参数化曲线，L(γ) = ∫√(g(γ',γ'))dt，E(γ) = (1/2)∫g(γ',γ')dt。由Cauchy-Schwarz，L² ≤ 2E(b-a)。","difficulty":"medium","chapter":"ch5","subject":"riemann"},{"q":"以下哪个流形是完备的？","options":["R²去掉原点","单位开圆盘","紧致无边流形","上半空间去掉边界"],"answer":2,"explanation":"紧致无边黎曼流形自动完备。R²去掉原点不完备（Cauchy列不收敛），开圆盘和上半空间去边界也不完备。","difficulty":"easy","chapter":"ch5","subject":"riemann"},{"q":"割点与共轭点的关系是什么？","options":["割点总是在共轭点之后","割点总是在共轭点之前或同时","二者无关","割点就是共轭点"],"answer":1,"explanation":"第一个割点要么是共轭点，要么存在另一条等长测地线。割点出现在共轭点之前或与之同时。","difficulty":"hard","chapter":"ch5","subject":"riemann"},{"q":"第一变分公式δL(γ)[V] = 0给出什么条件？","options":["γ是直线","γ是测地线","γ是最短路径","γ是闭曲线"],"answer":1,"explanation":"第一变分公式δL(γ)[V] = -∫⟨∇_γ'γ', V⟩ dt = 0对所有V成立，等价于∇_γ'γ'=0，即γ是测地线。","difficulty":"medium","chapter":"ch5","subject":"riemann"},{"q":"在法坐标下，原点处的度量有什么性质？","options":["g_ij = δ_ij, ∂_k g_ij = 0","g_ij = 0","g_ij = -δ_ij","g_ij = δ_ij但∂_k g_ij ≠ 0"],"answer":0,"explanation":"在法坐标下，原点处g_ij(0)=δ_ij且∂_k g_ij(0)=0，因此Christoffel符号在原点为零。","difficulty":"hard","chapter":"ch5","subject":"riemann"},{"q":"在法坐标下，径向测地线γ(t) = (tv^1, ..., tv^n)的参数方程是什么？","options":["γ^k(t) = t v^k","γ^k(t) = t^2 v^k","γ^k(t) = sin(t) v^k","γ^k(t) = e^t v^k"],"answer":0,"explanation":"在法坐标下，从原点出发的径向测地线简化为直线γ^k(t) = t v^k。这是因为原点处Christoffel符号为零，测地线方程退化为d²γ^k/dt² = 0。这是法坐标最重要的性质。","difficulty":"easy","chapter":"ch5","subject":"riemann"},{"q":"设(M,g)是完备黎曼流形，d(p,q)是黎曼距离。以下哪个函数是Lipschitz连续的？","options":["d(p,q)对q不是Lipschitz的","d(p,·)是1-Lipschitz函数","d(p,q)的平方是Lipschitz的","d(p,q)在割迹上不是Lipschitz的"],"answer":1,"explanation":"由三角不等式|d(p,q₁) - d(p,q₂)| ≤ d(q₁,q₂)，距离函数d(p,·)是1-Lipschitz的。这是距离函数的基本性质。在割迹上，距离函数仅仅是Lipschitz的，不是光滑的。","difficulty":"medium","chapter":"ch5","subject":"riemann"},{"q":"指数映射exp_p: T_pM → M的微分d(exp_p)_0等于什么？","options":["恒等映射id: T_pM → T_pM","零映射","曲率张量","Christoffel符号"],"answer":0,"explanation":"d(exp_p)_0 = id_{T_pM}。这是因为exp_p(tv) = γ_v(t)，对t求导在t=0处给出d(exp_p)_0(v) = γ_v'(0) = v。由反函数定理，exp_p在0附近是局部微分同胚。","difficulty":"medium","chapter":"ch5","subject":"riemann"},{"q":"球面S²(1)上，从北极出发的指数映射exp_N的共轭半径（即第一个共轭点出现的距离）是多少？","options":["π/2","π","2π","1"],"answer":1,"explanation":"在S²(1)上，从北极出发的大圆在对径点（南极）首次出现共轭点。沿大圆的距离为π。因此共轭半径（injectivity radius的共轭版本）为π。在距离π处，exp_N的微分退化。","difficulty":"medium","chapter":"ch5","subject":"riemann"},{"q":"设(M,g)是完备黎曼流形，p∈M。割迹C(p)的定义是什么？","options":["所有到p距离为最大值的点","exp_p的微分退化的点集","exp_p不是单射的最近点集（沿每条射线）","所有共轭点的集合"],"answer":2,"explanation":"割迹C(p) = {exp_p(tv) : v∈T_pM, |v|=1, t是使得exp_p(sv)在[0,t]上最短的最大t}。割迹是exp_p从单射变为非单射的边界，也是距离函数失去光滑性的点集。","difficulty":"hard","chapter":"ch5","subject":"riemann"},{"q":"在欧氏空间Rⁿ中，任意两点之间有唯一的最短测地线。该陈述对一般黎曼流形是否成立？","options":["总是成立","仅对完备流形成立","对完备流形，两点间总存在最短测地线，但不一定唯一","仅对单连通流形成立"],"answer":2,"explanation":"Hopf-Rinow定理保证完备流形中任意两点间存在最短测地线，但唯一性不保证。反例：球面S²上对径点有无穷多条最短测地线（所有大圆的一半）。","difficulty":"medium","chapter":"ch5","subject":"riemann"},{"q":"设γ: [0,∞) → M是完备测地线，p=γ(0)。q=γ(t₀)是p的共轭点。以下关于γ|[0,t₀+ε]的说法哪个正确？","options":["γ在[0,t₀+ε]上仍然最短","γ在[0,t₀+ε]上不再是最短测地线","γ仍然是测地线但不再最短","γ不再是测地线"],"answer":2,"explanation":"共轭点之后，γ仍然是测地线（满足∇_γ'γ'=0），但不再极小化距离。即存在比γ更短的连接p和γ(t₀+ε)的曲线。这是共轭点判别极小性的经典结论。参考Lee定理10.9。","difficulty":"hard","chapter":"ch5","subject":"riemann"},{"q":"设(M,g)是黎曼流形，γ是测地线。能量泛函的第二变分δ²E(V,V)的表达式为？","options":["δ²E = ∫|∇_t V|² dt","δ²E = ∫(|∇_t V|² - ⟨R(V,γ')γ',V⟩) dt","δ²E = ∫⟨R(V,γ')γ',V⟩ dt","δ²E = 0对所有V"],"answer":1,"explanation":"第二变分：δ²E(V,V) = ∫ₐᵇ (|∇_t V|² - ⟨R(V,γ')γ',V⟩) dt。第一项是“拉伸”能量，第二项是曲率贡献。正曲率使第二变分可能为负（共轭点），负曲率使第二变分恒正。","difficulty":"medium","chapter":"ch5","subject":"riemann"},{"q":"完备黎曼流形上，距离函数d(p,q)在q处光滑当且仅当？","options":["q不在p的割迹上","q是p的共轭点","d(p,q) < inj(p)","q不在p的割迹上且q ≠ p"],"answer":3,"explanation":"距离函数d(p,·)在q ≠ p处光滑当且仅当q不在p的割迹上。在割迹上，距离函数一般不是光滑的（甚至不是C²）。在p处，距离函数也不是光滑的。","difficulty":"hard","chapter":"ch5","subject":"riemann"},{"q":"单射半径inj(p)的定义是什么？","options":["到割迹的距离","到第一个共轭点的距离","exp_p是单射的球的最大半径","exp_p是微分同胚的球的最大半径"],"answer":2,"explanation":"inj(p) = sup{r > 0 : exp_p限制在B(0,r)⊂T_pM上是单射}。注意exp_p是局部微分同胚的最大半径是共轭半径，单射半径≤共轭半径。","difficulty":"medium","chapter":"ch5","subject":"riemann"},{"q":"在球面S²上，北极的单射半径inj(N)是多少？","options":["π/2","π","2π","π/4"],"answer":1,"explanation":"S²上inj(N) = π。在距离<π时，exp_N是单射；在距离=π时，南极是割点（也是共轭点），exp_N不再单射。球面Sⁿ(R)的全局单射半径为πR。","difficulty":"easy","chapter":"ch5","subject":"riemann"},{"q":"设γ是黎曼流形中的测地线。若γ上存在一对共轭点，则γ是否一定不是最短的？","options":["一定不是最短的","仍然是全局最短的","仅在共轭点之间不是最短的","取决于曲率"],"answer":0,"explanation":"若γ上存在共轭点p和q（p在q之前），则γ在[p,q]之后不再最短。更精确地说，存在严格短于γ的曲线连接p和q之后的点。这是共轭点判别极小性的基本定理。","difficulty":"medium","chapter":"ch5","subject":"riemann"},{"q":"黎曼曲率张量R(X,Y)Z的定义是什么？","options":["∇_X ∇_Y Z","∇_X∇_Y Z - ∇_Y∇_X Z","∇_X∇_Y Z - ∇_Y∇_X Z - ∇_[X,Y]Z","∇_X Y - ∇_Y X"],"answer":2,"explanation":"R(X,Y)Z = ∇_X∇_Y Z - ∇_Y∇_X Z - ∇_[X,Y]Z。交换子项∇_[X,Y]Z确保曲率张量是张量（C^∞-多线性）。","difficulty":"easy","chapter":"ch6","subject":"riemann"},{"q":"截面曲率K(σ)的公式是什么？","options":["K = ⟨R(u,v)u,v⟩","K = ⟨R(u,v)v,u⟩/(|u|²|v|²-⟨u,v⟩²)","K = R_ijkl","K = tr(R)"],"answer":1,"explanation":"K(σ) = ⟨R(u,v)v,u⟩/(|u|²|v|²-⟨u,v⟩²)，不依赖于σ的基{u,v}的选取。","difficulty":"easy","chapter":"ch6","subject":"riemann"},{"q":"Ricci曲率是如何定义的？","options":["曲率张量的所有分量之和","R_ij = R^k_ikj（缩并）","R = g^ij R_ij","R_ijkl的平方和"],"answer":1,"explanation":"Ricci曲率R_ij = R^k_ikj，是曲率张量在第一和第三指标的缩并得到的对称(0,2)-张量。","difficulty":"easy","chapter":"ch6","subject":"riemann"},{"q":"第二Bianchi恒等式缩并后得到什么？","options":["R = 0","∇^j R_ij = (1/2)∇_i S","∇_i R = 0","R_ijkl = 0"],"answer":1,"explanation":"缩并第二Bianchi恒等式得∇^j R_ij = (1/2)∇_i S，等价于Einstein张量G_ij满足∇^j G_ij = 0。","difficulty":"medium","chapter":"ch6","subject":"riemann"},{"q":"Weyl张量W在什么变换下是不变量？","options":["等距变换","共形变换","微分同胚","平行移动"],"answer":1,"explanation":"Weyl张量是共形不变量：在共形变换g'=e^(2f)g下，W'=e^(2f)W。W=0是度量共形平坦的充要条件（n≥4）。","difficulty":"medium","chapter":"ch6","subject":"riemann"},{"q":"Einstein流形满足什么条件？","options":["R_ijkl = 0","R_ij = λg_ij","R = 0","K = 常数"],"answer":1,"explanation":"Einstein流形满足Ricci曲率与度量成比例：Ric = λg。真空Einstein场方程Ric=0（λ=0）是其特例。","difficulty":"medium","chapter":"ch6","subject":"riemann"},{"q":"Ricci恒等式[∇_i,∇_j]X^k等于什么？","options":["0","R^k_lij X^l","R_ij X^k","∂_i X^k - ∂_j X^k"],"answer":1,"explanation":"Ricci恒等式：∇_i∇_j X^k - ∇_j∇_i X^k = R^k_lij X^l。协变导数交换子由曲率张量给出。","difficulty":"medium","chapter":"ch6","subject":"riemann"},{"q":"Bonnet-Myers定理的结论是什么？","options":["流形是平坦的","Ric≥(n-1)/R²·g时，直径≤πR且π₁有限","流形一定同胚于球面","截面曲率恒为常数"],"answer":1,"explanation":"Bonnet-Myers定理：若Ric≥(n-1)/R²·g，则diam(M)≤πR且π₁(M)有限。","difficulty":"medium","chapter":"ch6","subject":"riemann"},{"q":"Schur引理的内容是什么？","options":["截面曲率总是常数","若截面曲率仅依赖于点而不依赖于方向（n≥3），则曲率是常数","所有流形都是常曲率的","截面曲率与Ricci曲率相等"],"answer":1,"explanation":"Schur引理：若连通流形(n≥3)上每点截面曲率在所有方向都相同，则截面曲率在整个流形上是常数。","difficulty":"hard","chapter":"ch6","subject":"riemann"},{"q":"Bochner公式中，(1/2)Δ|∇f|²等于什么？","options":["|∇f|²","|∇²f|² + ⟨∇f,∇Δf⟩ + Ric(∇f,∇f)","Δf","0"],"answer":1,"explanation":"Bochner公式：(1/2)Δ|∇f|² = |∇²f|² + ⟨∇f,∇Δf⟩ + Ric(∇f,∇f)，是Bochner技巧的核心。","difficulty":"hard","chapter":"ch6","subject":"riemann"},{"q":"第一Bianchi恒等式的内容是什么？","options":["R(X,Y)Z + R(Y,Z)X + R(Z,X)Y = 0","∇_X R = 0","R(X,Y) = -R(Y,X)","R(X,Y,Z,W) = R(Z,W,X,Y)"],"answer":0,"explanation":"第一（代数）Bianchi恒等式：R(X,Y)Z + R(Y,Z)X + R(Z,X)Y = 0。这是曲率张量最基本的代数恒等式，隐含了截面曲率完全决定曲率张量的事实。","difficulty":"easy","chapter":"ch6","subject":"riemann"},{"q":"第二（微分）Bianchi恒等式的内容是什么？","options":["∇R = 0","(∇_X R)(Y,Z) + (∇_Y R)(Z,X) + (∇_Z R)(X,Y) = 0","R(X,Y) = 0","∇_X R(Y,Z) = 0"],"answer":1,"explanation":"第二Bianchi恒等式：(∇_X R)(Y,Z)W + (∇_Y R)(Z,X)W + (∇_Z R)(X,Y)W = 0。缩并后得到∇^j R_ij = (1/2)∇_i R，即Einstein张量的守恒律。","difficulty":"medium","chapter":"ch6","subject":"riemann"},{"q":"标量曲率S（或R）与Ricci曲率的关系是什么？","options":["S = R_ij","S = g^ij R_ij","S = det(R_ij)","S = tr(R_ij)/n"],"answer":1,"explanation":"标量曲率S = g^ij R_ij = tr_g(Ric)，是Ricci曲率的迹。在二维，S = 2K；在n维，S是截面曲率在所有方向上的某种平均。","difficulty":"easy","chapter":"ch6","subject":"riemann"},{"q":"在二维黎曼流形上，曲率张量有多少个独立分量？","options":["1","6","20","n²(n²-1)/12"],"answer":0,"explanation":"二维时，曲率张量由Gauss曲率K完全决定：R_ijkl = K(g_ik g_jl - g_il g_jk)。因此只有一个独立分量。一般n维曲率张量有n²(n²-1)/12个独立分量。","difficulty":"medium","chapter":"ch6","subject":"riemann"},{"q":"设Einstein流形满足Ric = λg。在n≥3维时，λ必须满足什么条件？","options":["λ是常数（由Schur型论证）","λ可以是任意函数","λ = 0","λ = 1"],"answer":0,"explanation":"对n≥3的Einstein流形，缩并第二Bianchi恒等式可得∇_i R = 0，即标量曲率S = nλ为常数，故λ也是常数。这是Schur引理的推广：Ricci曲率在各向同性时自动为常数。","difficulty":"hard","chapter":"ch6","subject":"riemann"},{"q":"曲率张量R_ijkl的对称性中，哪个是配对对称性（pair symmetry）？","options":["R_ijkl = -R_jikl","R_ijkl = -R_ijlk","R_ijkl = R_klij","R_ijkl + R_iklj + R_iljk = 0"],"answer":2,"explanation":"配对对称性：R_ijkl = R_klij。这是曲率张量四个对称性之一（前两个反对称、配对对称、第一Bianchi）。这四种对称性将n⁴个分量约化到n²(n²-1)/12个独立分量。","difficulty":"medium","chapter":"ch6","subject":"riemann"},{"q":"在Kähler流形上，Ricci形式ρ与Ricci曲率的关系是什么？","options":["ρ_ij = R_ij","ρ = -i∂∂̄ log det(g)","ρ = 0","ρ = dω"],"answer":1,"explanation":"在Kähler流形上，Ricci形式ρ = -i∂∂̄ log det(g_αβ̄) = Ric(J·,·)。Ricci形式是闭的(1,1)-形式，其Chern类为c₁(M) = [ρ/2π]。这是复几何与黎曼几何的交汇点。","difficulty":"hard","chapter":"ch6","subject":"riemann"},{"q":"设(M,g)是三维Einstein流形。此时Einstein条件等价于什么？","options":["截面曲率为常数","Ricci曲率为常数","标量曲率为常数","曲率张量为零"],"answer":0,"explanation":"在三维，Einstein条件Ric = λg等价于截面曲率为常数。这是因为三维时曲率张量完全由Ricci曲率决定（Weyl张量恒为零）。这是三维黎曼几何的特殊性质。","difficulty":"hard","chapter":"ch6","subject":"riemann"},{"q":"设(M,g)的截面曲率满足a ≤ K ≤ b。Ricci曲率Ric(v,v)的上下界是什么？","options":["(n-1)a ≤ Ric(v,v) ≤ (n-1)b","a ≤ Ric(v,v) ≤ b","a ≤ Ric(v,v) ≤ (n-1)b","无法确定"],"answer":0,"explanation":"Ric(v,v) = Σ_{i=2}^n K(v,e_i)，其中{e_i}是v的正交补的一组基。由于每个K(v,e_i) ∈ [a,b]，有(n-1)a ≤ Ric(v,v) ≤ (n-1)b。但反向不成立：Ricci曲率有界不能推出截面曲率有界。","difficulty":"medium","chapter":"ch6","subject":"riemann"},{"q":"在法坐标下，原点处度量张量的Taylor展开中，二阶项由什么决定？","options":["Christoffel符号","曲率张量","Ricci曲率","标量曲率"],"answer":1,"explanation":"在法坐标原点附近，g_ij(x) = δ_ij - (1/3) R_iklj x^k x^l + O(|x|³)。二阶项系数由曲率张量决定。这是法坐标展开的核心公式，也是证明曲率决定局部几何的关键。参考Lee第5章。","difficulty":"hard","chapter":"ch6","subject":"riemann"},{"q":"设X,Y,Z,W是向量场。g(R(X,Y)Z,W)作为(0,4)-张量，其对称性有几个？","options":["2个","4个","3个","1个"],"answer":1,"explanation":"(0,4)-曲率张量Rm(X,Y,Z,W) = g(R(X,Y)Z,W)满足四个基本对称性：(1)前两个反对称；(2)后两个反对称；(3)配对对称；(4)第一Bianchi恒等式。这些对称性完全刻画了曲率张量的代数结构。","difficulty":"medium","chapter":"ch6","subject":"riemann"},{"q":"在广义相对论中，真空Einstein场方程Ric = 0意味着什么？","options":["时空没有曲率","Ricci曲率为零（但Weyl曲率可以非零）","截面曲率为零","时空是平坦的"],"answer":1,"explanation":"Ric = 0意味着Ricci曲率为零，但Weyl曲率（描述引力波、潮汐力等）可以非零。例如Schwarzschild解是Ric=0但Weyl≠0，描述了黑洞外部的时空弯曲。Ric=0不等于Riemann=0。","difficulty":"medium","chapter":"ch6","subject":"riemann"},{"q":"第二基本形式II(X,Y)的值在哪个空间中？","options":["切空间","法空间","整个外围空间","余切空间"],"answer":1,"explanation":"II(X,Y) = (∇^N_X Y)^⊥ 是N中协变导数在法空间上的投影，取值于法丛。","difficulty":"easy","chapter":"ch7","subject":"riemann"},{"q":"Gauss公式将N中联络分解为什么？","options":["∇^N = ∇^M","∇^N_X Y = ∇^M_X Y + II(X,Y)","∇^N = ∇^M + R","∇^N = R + II"],"answer":1,"explanation":"Gauss公式：∇^N_X Y = ∇^M_X Y + II(X,Y)，将N中联络分解为切向分量（M中联络）和法向分量（第二基本形式）。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"Gauss方程将什么量联系起来？","options":["仅第一基本形式","子流形曲率、外围曲率和第二基本形式","仅第二基本形式","仅外围曲率"],"answer":1,"explanation":"Gauss方程：R^M = R^N + II∧II，将子流形内蕴曲率与外围空间曲率和第二基本形式联系起来。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"极小曲面满足什么条件？","options":["Gauss曲率为零","平均曲率H=0","第二基本形式为零","法曲率为零"],"answer":1,"explanation":"极小曲面是面积泛函的临界点，满足平均曲率H=0。δArea = -∫⟨H,V⟩ dV = 0。","difficulty":"easy","chapter":"ch7","subject":"riemann"},{"q":"Alexandrov定理关于CMC曲面的结论是什么？","options":["存在无穷多紧致CMC曲面","R³中唯一紧致无边CMC曲面是球面","所有CMC曲面都是极小曲面","CMC曲面必为平坦"],"answer":1,"explanation":"Alexandrov定理：R³中唯一紧致无边常平均曲率（CMC）曲面是球面。这是刚性定理。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"Codazzi方程表达了什么对称性？","options":["度量张量的对称性","第二基本形式协变导数的对称性","曲率张量的对称性","联络的对称性"],"answer":1,"explanation":"Codazzi方程：(∇_X II)(Y,Z) = (∇_Y II)(X,Z)，即第二基本形式协变导数的对称性。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"全测地子流形满足什么条件？","options":["H=0","II=0（第二基本形式恒为零）","K=0","R=0"],"answer":1,"explanation":"全测地子流形第二基本形式恒为零（II=0），意味着子流形中测地线也是外围空间中的测地线。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"R³中曲面的Gauss曲率通过Gauss方程如何表达？","options":["K = H","K = (LN-M²)/(EG-F²)","K = L+N","K = E+G"],"answer":1,"explanation":"Gauss绝妙定理：K = det(II)/det(I) = (LN-M²)/(EG-F²)，仅依赖于第一基本形式。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"Sⁿ中极小子流形满足什么方程？","options":["Δx = 0","Δx = -nx","Δx = nx","Δx = x"],"answer":1,"explanation":"Sⁿ中极小子流形满足Δx = -nx（x是位置向量），这是Simons研究极小子流形刚性定理的出发点。","difficulty":"hard","chapter":"ch7","subject":"riemann"},{"q":"Gauss-Codazzi方程在子流形理论中的角色是什么？","options":["仅用于计算","子流形存在性的可积性条件","没有实际用途","仅用于二维曲面"],"answer":1,"explanation":"Gauss-Codazzi方程是子流形存在性的可积性条件：给定满足这些方程的度量和第二基本形式，存在局部浸入实现它们。","difficulty":"hard","chapter":"ch7","subject":"riemann"},{"q":"设M是R³中的曲面。第二基本形式II的系数L, M, N的定义是什么？","options":["L = ⟨∂_x²f, N⟩, M = ⟨∂_x∂_y f, N⟩, N = ⟨∂_y²f, N⟩","L = E, M = F, N = G","L = ∂_x N, M = ∂_y N","L = K, M = H, N = K"],"answer":0,"explanation":"对于参数化f: U → R³，第二基本形式系数：L = ⟨f_xx, N⟩ = -⟨f_x, N_x⟩，M = ⟨f_xy, N⟩，N = ⟨f_yy, N⟩。其中N是单位法向量。这些系数与第一基本形式E,F,G共同决定曲面几何。","difficulty":"easy","chapter":"ch7","subject":"riemann"},{"q":"对于R³中的曲面，平均曲率向量H⃗ = H·N。H的表达式（用第一和第二基本形式系数）是什么？","options":["H = (L+N)/2","H = (EN - 2FM + GL)/(2(EG-F²))","H = (LN-M²)/(EG-F²)","H = (E+G)/2"],"answer":1,"explanation":"平均曲率H = (EN - 2FM + GL)/(2(EG-F²)) = (κ₁+κ₂)/2。在等温坐标下（E=G=e^(2λ), F=0），H = e^(-2λ)(L+N)/2。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"设M是黎曼流形N的子流形。切丛TN限制在M上分解为TN|_M = TM ⊕ NM。∇^N_X Y的切向和法向分量分别是什么？","options":["切向=0, 法向=II(X,Y)","切向=∇^M_X Y, 法向=II(X,Y)","切向=II(X,Y), 法向=∇^M_X Y","切向=∇^M_X Y, 法向=0"],"answer":1,"explanation":"Gauss公式：∇^N_X Y = ∇^M_X Y + II(X,Y)。切向分量∇^M_X Y是M上的Levi-Civita联络，法向分量II(X,Y)是第二基本形式。这是子流形几何最基本的分解。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"Weingarten公式（对余维1子流形）描述了什么？","options":["∇^N_X N = -S(X)","∇^N_X N = S(X)","∇^N_X N = 0","∇^N_X N = N"],"answer":0,"explanation":"Weingarten公式：∇^N_X N = -S(X)（其中S是形状算子，N是单位法向量）。这表示N沿X方向的协变导数（在N中）等于-S(X)，其切向分量为-S(X)，法向分量为0。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"对于R³中由函数图z = f(x,y)给出的曲面，Gauss曲率K的表达式是什么？","options":["K = f_xx·f_yy - f_xy²","K = (f_xx f_yy - f_xy²)/(1 + f_x² + f_y²)²","K = f_xx + f_yy","K = (f_xx f_yy - f_xy²)/(1 + f_x² + f_y²)"],"answer":1,"explanation":"对于Monge片z = f(x,y)，Gauss曲率K = (f_xx f_yy - f_xy²)/(1 + f_x² + f_y²)²。这是计算显式曲面Gauss曲率的标准公式，来源于第一和第二基本形式系数。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"设M是N的全测地子流形。M中测地线与N中测地线的关系是什么？","options":["M中测地线不一定是N中测地线","M中测地线一定是N中测地线","M中没有测地线","N中测地线一定是M中测地线"],"answer":1,"explanation":"全测地子流形II=0，Gauss公式给出∇^N = ∇^M。因此M中测地线（满足∇^M_γ'γ'=0）也满足∇^N_γ'γ'=0，即也是N中测地线。例如R³中的平面（全测地）内直线也是R³的直线。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"Gauss-Codazzi方程在R³中曲面的情况下，Gauss方程简化为？","options":["K = (LN-M²)/(EG-F²)","K = 0","K = H²","K = R"],"answer":0,"explanation":"R³中曲面的Gauss方程：K = det(II)/det(I) = (LN-M²)/(EG-F²)。这是Gauss绝妙定理的精确公式。注意右边仅依赖于第一和第二基本形式系数，但Gauss证明K仅依赖于第一基本形式。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"设M是N的余维数为k的子流形。第二基本形式II有k个分量。对于每个法向量ξ，形状算子S_ξ定义为？","options":["S_ξ(X) = -∇^N_X ξ","⟨S_ξ(X), Y⟩ = ⟨II(X,Y), ξ⟩","S_ξ(X) = -(∇^N_X ξ)^T","S_ξ(X) = -(∇^N_X ξ)^T且⟨S_ξ(X), Y⟩ = ⟨II(X,Y), ξ⟩"],"answer":3,"explanation":"对于余维数k>1，II在每个法方向上有分量。形状算子S_ξ(X) = -(∇^N_X ξ)^T（切向投影），满足⟨S_ξ(X), Y⟩ = ⟨II(X,Y), ξ⟩。这是余维1情形的高维推广。","difficulty":"hard","chapter":"ch7","subject":"riemann"},{"q":"R³中极小曲面的Gauss曲率满足什么性质？","options":["K ≥ 0","K ≤ 0","K = 0","K ≥ 0或K ≤ 0均可"],"answer":1,"explanation":"R³中极小曲面（H=0）满足κ₁ = -κ₂，因此Gauss曲率K = κ₁κ₂ = -κ₁² ≤ 0。极小曲面的Gauss曲率非正，仅在平面点（κ₁=κ₂=0）处为零。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"设M是N的超曲面（余维1）。Gauss方程⟨R^M(X,Y)Z,W⟩与⟨R^N(X,Y)Z,W⟩的关系是什么？","options":["⟨R^M(X,Y)Z,W⟩ = ⟨R^N(X,Y)Z,W⟩ + ⟨II(X,W),II(Y,Z)⟩ - ⟨II(X,Z),II(Y,W)⟩","⟨R^M(X,Y)Z,W⟩ = ⟨R^N(X,Y)Z,W⟩","⟨R^M(X,Y)Z,W⟩ = ⟨II(X,W),II(Y,Z)⟩","⟨R^M(X,Y)Z,W⟩ = ⟨R^N(X,Y)Z,W⟩ - ⟨II(X,W),II(Y,Z)⟩"],"answer":0,"explanation":"Gauss方程：⟨R^M(X,Y)Z,W⟩ = ⟨R^N(X,Y)Z,W⟩ + ⟨II(X,W),II(Y,Z)⟩ - ⟨II(X,Z),II(Y,W)⟩。子流形曲率 = 外围曲率（投影） + 第二基本形式的二次项。当N=R³时，R^N=0，K = LN-M²。","difficulty":"hard","chapter":"ch7","subject":"riemann"},{"q":"设F: M → Rⁿ是等距浸入。位置向量场x = (x^1,...,x^n)看作M上的向量值函数。Δx等于什么？","options":["Δx = 0","Δx = n·H⃗（平均曲率向量）","Δx = 位置向量","Δx = 法向量"],"answer":1,"explanation":"Δx = n·H⃗，其中H⃗是平均曲率向量。因此M是极小浸入（H⃗=0）当且仅当坐标函数是调和函数（Δx^i=0对所有i）。这是极小浸入的重要特征。","difficulty":"hard","chapter":"ch7","subject":"riemann"},{"q":"R³中全脐曲面（umbilical surface）是什么？","options":["所有点都是脐点的曲面","Gauss曲率为零的曲面","极小曲面","可展曲面"],"answer":0,"explanation":"全脐曲面每点κ₁=κ₂，形状算子S = κ·id。R³中全脐曲面只能是平面（κ=0）或球面（κ≠0，常数）。这是古典微分几何的经典结果。","difficulty":"easy","chapter":"ch7","subject":"riemann"},{"q":"局部Gauss-Bonnet定理中，测地三角形满足什么关系？","options":["∫K dA = π","∫K dA = α₁+α₂+α₃ - π","∫K dA = 0","∫K dA = 2π"],"answer":1,"explanation":"对于测地三角形（边界κ_g=0），∫_Ω K dA = α₁+α₂+α₃ - π。","difficulty":"easy","chapter":"ch8","subject":"riemann"},{"q":"全局Gauss-Bonnet定理：∫_M K dA等于什么？","options":["4π","2πχ(M)","0","πχ(M)"],"answer":1,"explanation":"全局Gauss-Bonnet定理：∫_M K dA = 2πχ(M)。对于闭定向二维流形。","difficulty":"easy","chapter":"ch8","subject":"riemann"},{"q":"亏格为g的紧致定向曲面的Euler示性数是多少？","options":["g","2g","2-2g","g-1"],"answer":2,"explanation":"χ(M) = 2 - 2g。球面g=0, χ=2；环面g=1, χ=0；双环面g=2, χ=-2。","difficulty":"easy","chapter":"ch8","subject":"riemann"},{"q":"环面T²的总Gauss曲率是多少？","options":["4π","2π","0","-4π"],"answer":2,"explanation":"环面χ=0，∫K dA = 2π×0 = 0。外侧正曲率与内侧负曲率恰好抵消。","difficulty":"easy","chapter":"ch8","subject":"riemann"},{"q":"Chern-Gauss-Bonnet定理适用于什么维数的流形？","options":["任意维数","仅二维","偶维","奇维"],"answer":2,"explanation":"Chern-Gauss-Bonnet定理适用于紧致可定向偶维黎曼流形：∫_M Pf(Ω) = (2π)^n χ(M)。","difficulty":"medium","chapter":"ch8","subject":"riemann"},{"q":"Euler示性数χ通过三角剖分如何计算？","options":["χ = V + E + F","χ = V - E + F","χ = V + E - F","χ = E - V - F"],"answer":1,"explanation":"χ = V - E + F（顶点数-边数+面数），与剖分方式无关。","difficulty":"easy","chapter":"ch8","subject":"riemann"},{"q":"测地曲率κ_g度量什么？","options":["曲线在空间中的弯曲","曲线在曲面内偏离测地线的程度","曲面的Gauss曲率","曲线的挠率"],"answer":1,"explanation":"测地曲率κ_g度量曲线在曲面内偏离测地线的程度。测地线的κ_g=0。","difficulty":"medium","chapter":"ch8","subject":"riemann"},{"q":"亏格g=2的闭曲面总Gauss曲率是多少？","options":["4π","2π","0","-4π"],"answer":3,"explanation":"χ=2-2×2=-2，∫K dA = 2π×(-2) = -4π。负总曲率是亏格≥2曲面的特征。","difficulty":"medium","chapter":"ch8","subject":"riemann"},{"q":"二维Gauss-Bonnet定理中，带边曲面的公式是什么？","options":["∫K dA = 2πχ(M)","∫K dA + ∫κ_g ds = 2πχ(M)","∫κ_g ds = 2πχ(M)","∫K dA = 0"],"answer":1,"explanation":"带边曲面：∫_M K dA + ∫_∂M κ_g ds = 2πχ(M)。边界贡献∫κ_g ds是必须的。","difficulty":"medium","chapter":"ch8","subject":"riemann"},{"q":"Chern-Gauss-Bonnet定理中，Pfaffian Pf(Ω)在二维退化为什么？","options":["K dA","K/(2π) dA","K dA/(4π)","R dA"],"answer":1,"explanation":"二维时Pf(Ω) = K/(2π)·dA，∫_M K/(2π) dA = χ(M)，即∫K dA = 2πχ(M)。","difficulty":"hard","chapter":"ch8","subject":"riemann"},{"q":"对于紧致带边曲面M，Gauss-Bonnet公式中边界的测地曲率积分∫_∂M κ_g ds的符号约定是什么？","options":["κ_g是正的（对逆时针边界）","κ_g的符号取决于边界的定向","κ_g总是零","κ_g与Gauss曲率符号相同"],"answer":1,"explanation":"测地曲率κ_g的符号依赖于边界的定向：当曲面在其左侧时κ_g为正。这是Gauss-Bonnet公式中边界的定向约定，确保公式符号一致。","difficulty":"medium","chapter":"ch8","subject":"riemann"},{"q":"设M是紧致二维曲面，三角剖分为T。验证χ(M) = V-E+F不依赖于剖分的基本原理是什么？","options":["群论","Gauss-Bonnet定理","同调论（Euler示性数是同伦不变量）","微分拓扑"],"answer":2,"explanation":"Euler示性数是同伦不变量，因此不依赖于三角剖分的选择。这可以通过同调论证明：χ = Σ(-1)^i dim H_i(M;R)。Gauss-Bonnet定理从几何角度给出了χ的曲率积分表示，也证明了χ的拓扑不变性。","difficulty":"medium","chapter":"ch8","subject":"riemann"},{"q":"利用Gauss-Bonnet定理，亏格为g的定向闭曲面总曲率∫K dA等于？","options":["4π(1-g)","2π(1-g)","4π(1+g)","2π(1+g)"],"answer":0,"explanation":"∫K dA = 2πχ(M) = 2π(2-2g) = 4π(1-g)。球面(g=0)总曲率4π，环面(g=1)总曲率0，双环面(g=2)总曲率-4π。","difficulty":"easy","chapter":"ch8","subject":"riemann"},{"q":"设M是亏格g=2的定向闭曲面。若M上Gauss曲率处处满足K ≥ -1，则M的面积至少是多少？","options":["4π","2π","8π","无法确定"],"answer":0,"explanation":"由Gauss-Bonnet：∫K dA = 4π(1-2) = -4π。若K ≥ -1，则-4π = ∫K dA ≥ -Area(M)，故Area(M) ≥ 4π。这是Gauss-Bonnet定理给出的面积下界估计。","difficulty":"hard","chapter":"ch8","subject":"riemann"},{"q":"对于球面S²，若Gauss曲率满足K ≥ 1/R²，则面积的最大值是多少？","options":["4πR²","2πR²","πR²","∞"],"answer":0,"explanation":"由Gauss-Bonnet：∫K dA = 4π。若K ≥ 1/R²，则4π = ∫K dA ≥ Area(M)/R²，故Area(M) ≤ 4πR²。球面S²(R)恰好达到此上界，面积4πR²且K=1/R²。","difficulty":"medium","chapter":"ch8","subject":"riemann"},{"q":"设γ是二维曲面M上的简单闭曲线，围成区域Ω。由Gauss-Bonnet，∫_Ω K dA + ∫_γ κ_g ds等于什么？","options":["2π","2πχ(Ω)","2π - Σ(外角)","0"],"answer":1,"explanation":"对于带边区域Ω，局部Gauss-Bonnet：∫_Ω K dA + ∫_∂Ω κ_g ds = 2πχ(Ω)。若Ω同胚于圆盘（χ=1），则∫_Ω K dA + ∫_γ κ_g ds = 2π。","difficulty":"medium","chapter":"ch8","subject":"riemann"},{"q":"在Gauss-Bonnet定理中，若边界∂M由分段光滑曲线组成，外角（exterior angles）的贡献是什么？","options":["外角之和需要加到公式中","外角被忽略","外角等于测地曲率","外角等于Gauss曲率"],"answer":0,"explanation":"对于分段光滑边界，Gauss-Bonnet公式为：∫_M K dA + ∫_∂M κ_g ds + Σε_i = 2πχ(M)，其中ε_i是各角点处的外角（切向量转向角）。光滑边界时ε_i = 0。","difficulty":"medium","chapter":"ch8","subject":"riemann"},{"q":"设M是二维曲面，p∈M。取以p为中心、半径为ε的小测地圆D_ε。lim_{ε→0} ∫_∂D_ε κ_g ds等于什么？","options":["0","2π","π","4π"],"answer":1,"explanation":"当ε→0时，小测地圆趋近于欧氏圆，κ_g → 1/ε，周长 → 2πε，故∫κ_g ds → 2π。这也与Gauss-Bonnet一致：∫_D_ε K dA → 0，∫_D_ε K dA + ∫_∂D_ε κ_g ds = 2πχ(D_ε) = 2π。","difficulty":"hard","chapter":"ch8","subject":"riemann"},{"q":"Chern-Gauss-Bonnet定理中，Pfaffian Pf(Ω)在四维流形上的表达式是什么？","options":["Pf(Ω) = (1/32π²) ε^ijkl Ω_ij ∧ Ω_kl","Pf(Ω) = K dA","Pf(Ω) = (1/2π) Ω","Pf(Ω) = Ω ∧ Ω"],"answer":0,"explanation":"在四维，Pf(Ω) = (1/32π²) ε^ijkl R_ij ∧ R_kl（其中R_ij是曲率2-形式）。∫_M Pf(Ω) = χ(M)。这是Chern的伟大推广，将二维Gauss-Bonnet推广到任意偶维。","difficulty":"hard","chapter":"ch8","subject":"riemann"},{"q":"设M是紧致带边曲面。以下哪个组合在微分同胚下不变？","options":["∫_M K dA","∫_M K dA + ∫_∂M κ_g ds","∫_M K dA - ∫_∂M κ_g ds","∫_∂M κ_g ds"],"answer":1,"explanation":"∫_M K dA + ∫_∂M κ_g ds = 2πχ(M)是拓扑不变量，因此在微分同胚下不变。单独的∫_M K dA和∫_∂M κ_g ds都不是拓扑不变量，它们依赖于度量。","difficulty":"medium","chapter":"ch8","subject":"riemann"},{"q":"对于亏格g=3的紧致曲面，若要使其Gauss曲率K ≥ 0处处成立，则必须满足什么？","options":["g=0（球面）","g≤1","不可能实现","g=1"],"answer":2,"explanation":"若K≥0，则∫K dA ≥ 0。但由Gauss-Bonnet：∫K dA = 4π(1-g)。对g=3，∫K dA = -8π < 0，与K≥0矛盾。因此亏格≥2的曲面不能有处处非负的Gauss曲率。","difficulty":"medium","chapter":"ch8","subject":"riemann"},{"q":"Gauss-Bonnet定理在物理学中的一个重要应用是什么？","options":["计算天体轨道","拓扑绝缘体和量子Hall效应中的Chern数","计算流体动力学","电磁学"],"answer":1,"explanation":"Gauss-Bonnet定理（及Chern推广）在现代物理学中有重要应用：拓扑绝缘体的Chern数、量子Hall效应的TKNN不变量、引力理论中的Gauss-Bonnet项等。这些应用本质上是将曲率积分与拓扑不变量联系起来。","difficulty":"easy","chapter":"ch8","subject":"riemann"},{"q":"Jacobi方程是什么？","options":["J'' = 0","∇_γ'∇_γ' J + R(J,γ')γ' = 0","∇_γ' J = 0","J' + R J = 0"],"answer":1,"explanation":"Jacobi方程：∇_γ'∇_γ' J + R(J,γ')γ' = 0，描述沿测地线的无穷小变分。","difficulty":"easy","chapter":"ch9","subject":"riemann"},{"q":"球面Sⁿ(1)上法Jacobi场的方程是什么？","options":["J'' = 0","J'' + J = 0","J'' - J = 0","J'' + 2J = 0"],"answer":1,"explanation":"Sⁿ(1)上R(J,γ')γ' = J，法Jacobi方程简化为J''+J=0，解为三角振荡。","difficulty":"medium","chapter":"ch9","subject":"riemann"},{"q":"共轭点的定义是什么？","options":["测地线长度最小的点","存在非零Jacobi场在两端为零的点","测地线最长的点","割迹上的点"],"answer":1,"explanation":"q=γ(b)是p=γ(a)的共轭点，如果存在非零Jacobi场J满足J(a)=J(b)=0。","difficulty":"easy","chapter":"ch9","subject":"riemann"},{"q":"欧氏空间Rⁿ中有共轭点吗？","options":["有，且很多","没有","仅在原点上","仅在无穷远处"],"answer":1,"explanation":"Rⁿ中曲率为零，Jacobi场J(t)=J(0)+tJ'(0)只在t=0时为零，不存在共轭点。","difficulty":"easy","chapter":"ch9","subject":"riemann"},{"q":"第二变分公式δ²E(V,V)的表达式是什么？","options":["∫|V|² dt","∫(|∇V|² - ⟨R(V,γ')γ',V⟩) dt","∫⟨V,V⟩ dt","∫|∇V|² dt"],"answer":1,"explanation":"δ²E(V,V) = ∫(|∇_γ'V|² - ⟨R(V,γ')γ',V⟩) dt。曲率项使第二变分可能为负。","difficulty":"medium","chapter":"ch9","subject":"riemann"},{"q":"Morse指标定理给出了什么关系？","options":["Morse指标 = 流形维数","Morse指标 = 共轭点个数（计重数）","Morse指标 = 曲率","Morse指标 = 长度"],"answer":1,"explanation":"Morse指标定理：能量泛函在测地线上的Morse指标等于沿测地线的共轭点个数（计重数）。","difficulty":"medium","chapter":"ch9","subject":"riemann"},{"q":"双曲空间Hⁿ(-1)上法Jacobi场的解是什么形式？","options":["三角振荡","线性增长","指数增长（双曲函数）","常数"],"answer":2,"explanation":"Hⁿ(-1)上J''-J=0，解为J(t)=sinh(t)·A+cosh(t)·B，指数增长。","difficulty":"medium","chapter":"ch9","subject":"riemann"},{"q":"共轭点与割点的关系是什么？","options":["它们完全相同","割点总是在共轭点之后","第一个割点不晚于第一个共轭点","二者无关"],"answer":2,"explanation":"第一个割点要么是共轭点，要么出现在共轭点之前（有另一条等长测地线）。","difficulty":"hard","chapter":"ch9","subject":"riemann"},{"q":"Lyusternik-Fet定理的结论是什么？","options":["任何流形上都有测地线","任何紧致流形上存在闭测地线","测地线总是最短的","测地线是唯一的"],"answer":1,"explanation":"Lyusternik-Fet定理：任何紧致流形上存在闭测地线。这是Morse理论的关键应用。","difficulty":"hard","chapter":"ch9","subject":"riemann"},{"q":"Jacobi场沿测地线γ的维数是多少？","options":["n","2n","n(n+1)/2","n²"],"answer":1,"explanation":"Jacobi场由初始位置J(0)（n维）和初始速度J'(0)（n维）唯一确定，总维数为2n。","difficulty":"medium","chapter":"ch9","subject":"riemann"},{"q":"设γ是测地线，J是沿γ的Jacobi场。若J(0) = 0且J'(0) = v，则J(t)在小t下的渐近行为是什么？","options":["J(t) ≈ t·v","J(t) ≈ t²·v","J(t) ≈ v","J(t) ≈ sin(t)v"],"answer":0,"explanation":"由Jacobi方程∇_t²J + R(J,γ')γ' = 0，当t→0时，曲率项为O(t²)，故J(t) ≈ t·J'(0) = t·v。这反映了Jacobi场在原点附近的线性行为。","difficulty":"medium","chapter":"ch9","subject":"riemann"},{"q":"设J₁, J₂是沿同一测地线γ的Jacobi场。以下哪个量沿γ是常数？","options":["⟨J₁, J₂⟩","⟨J₁', J₂⟩ - ⟨J₁, J₂'⟩","|J₁|²","⟨J₁, J₂'⟩"],"answer":1,"explanation":"Wronskian W(J₁,J₂) = ⟨J₁', J₂⟩ - ⟨J₁, J₂'⟩沿γ是常数。这是因为Jacobi方程是二阶线性ODE，两个解的Wronskian守恒。这是焦散理论中重要的守恒量。","difficulty":"hard","chapter":"ch9","subject":"riemann"},{"q":"设γ是完备黎曼流形中的测地线。若存在t₀ > 0使得γ(t₀)是γ(0)的共轭点，则γ在[0, t₀+ε]上：","options":["一定是最短测地线","不再是最短测地线","可能是最短测地线","不再是测地线"],"answer":1,"explanation":"共轭点之后，测地线不再极小化距离。存在连接γ(0)和γ(t₀+ε)的、比γ更短的曲线。这是共轭点判别极小性的基本结论。参考Lee定理10.9。","difficulty":"medium","chapter":"ch9","subject":"riemann"},{"q":"在常曲率c的空间中，沿测地线γ的法Jacobi场J(t)（满足J(0)=0, |J'(0)|=1）的模长|J(t)|等于什么？","options":["|J(t)| = t","|J(t)| = (1/√c) sin(√c t)（c>0）或(1/√|c|) sinh(√|c| t)（c<0）或t（c=0）","|J(t)| = e^t","|J(t)| = 1"],"answer":1,"explanation":"常曲率c空间中，Jacobi方程简化为J'' + cJ = 0（法分量）。c>0时J(t)=sin(√c t)/√c（振荡），c<0时J(t)=sinh(√|c| t)/√|c|（指数增长），c=0时J(t)=t（线性增长）。","difficulty":"medium","chapter":"ch9","subject":"riemann"},{"q":"Jacobi场的几何意义是什么？","options":["描述测地线的长度","描述测地线变分的无穷小偏差","描述曲率的变化","描述度量的变化"],"answer":1,"explanation":"Jacobi场是测地线变分Γ(s,t)的变分向量场J(t) = ∂Γ/∂s|_{s=0}。它描述了从一条测地线到邻近测地线的无穷小偏差，是研究共轭点和焦散现象的核心工具。","difficulty":"easy","chapter":"ch9","subject":"riemann"},{"q":"设γ是完备流形中的测地线。若沿γ的截面曲率≤0，则共轭点的情况如何？","options":["一定存在共轭点","不存在共轭点","可能有共轭点","每个点都是共轭点"],"answer":1,"explanation":"若K≤0，则沿γ的Jacobi场满足|J|'' ≥ 0（从Jacobi方程可得），因此|J|是凸函数。若J(0)=0且J≠0，则|J(t)|严格递增，J(t)≠0对t>0成立。故不存在共轭点。这是Hadamard-Cartan定理的局部版本。","difficulty":"medium","chapter":"ch9","subject":"riemann"},{"q":"Morse指标定理建立了能量泛函E在测地线γ上的Morse指标与什么之间的关系？","options":["与曲率","与沿γ的共轭点个数（计重数）","与γ的长度","与流形的维数"],"answer":1,"explanation":"Morse指标定理：index(γ) = Σ_{t∈(0,b)} dim{J: J是Jacobi场, J(0)=J(t)=0}。即Morse指标等于沿γ（在端点之间）的共轭点个数（计重数）。这是变分法和黎曼几何的深刻联系。","difficulty":"hard","chapter":"ch9","subject":"riemann"},{"q":"在球面S²(1)上，从北极出发的大圆测地线γ(t) = (sin t, 0, cos t)。沿γ的法Jacobi场J(t)（满足J(0)=0, J'(0)=∂_θ）的表达式是什么？","options":["J(t) = t·∂_θ","J(t) = sin(t)·∂_θ","J(t) = sinh(t)·∂_θ","J(t) = (1-cos t)·∂_θ"],"answer":1,"explanation":"S²(1)上法Jacobi方程J''+J=0，初始条件J(0)=0, J'(0)=∂_θ给出J(t)=sin(t)·∂_θ。在t=π处J(π)=0，对应南极（共轭点）。这也是经典球面Jacobi场的显式解。","difficulty":"medium","chapter":"ch9","subject":"riemann"},{"q":"设γ是测地线，J是沿γ的Jacobi场。J可以分解为切向分量和法向分量。切向Jacobi场的通解是什么？","options":["J^T(t) = (at+b)γ'(t)","J^T(t) = a·γ'(t)","J^T(t) = 0","J^T(t) = sin(t)γ'(t)"],"answer":0,"explanation":"切向Jacobi场满足J^T'' = 0（因为R(γ',γ')γ' = 0），故J^T(t) = (at+b)γ'(t)。切向Jacobi场对应测地线的重新参数化，不包含新的几何信息。通常只考虑法Jacobi场。","difficulty":"medium","chapter":"ch9","subject":"riemann"},{"q":"在紧致黎曼流形上，Morse理论如何用于证明闭测地线的存在性？","options":["通过分析曲率张量","通过研究自由环路空间ΩM上的能量泛函的临界点","通过Gauss-Bonnet定理","通过Ricci流"],"answer":1,"explanation":"Morse理论应用于自由环路空间ΩM = {γ: S¹ → M}上的能量泛函E(γ) = ∫|γ'|² dt。E的临界点即闭测地线。利用Morse不等式和流形的拓扑性质（如Betti数），可证明闭测地线的存在性。Lyusternik-Fet定理是经典应用。","difficulty":"hard","chapter":"ch9","subject":"riemann"},{"q":"设γ: [0,b] → M是测地线，p=γ(0)。Jacobi场J满足J(0)=0。J(b)与d(exp_p)_{bγ'(0)}的关系是什么？","options":["J(b) = d(exp_p)_{bγ'(0)}(b J'(0))","J(b) = d(exp_p)_{bγ'(0)}(J'(0))","J(b) = exp_p(J'(0))","J(b)与exp_p无关"],"answer":1,"explanation":"J(b) = d(exp_p)_{bγ'(0)}(b J'(0))。这是Jacobi场与指数映射微分的核心关系：Jacobi场的值等于指数映射的微分在相应方向上的值。共轭点对应于d(exp_p)退化的点。参考Lee定理10.4。","difficulty":"hard","chapter":"ch9","subject":"riemann"},{"q":"在双曲空间Hⁿ中，从一点出发的测地线上是否有共轭点？","options":["有，且很多","没有","仅在无穷远处","仅在特定距离处"],"answer":1,"explanation":"Hⁿ截面曲率为负（K<0），Jacobi场|J(t)| ≥ t|J'(0)|（对J(0)=0），因此对所有t>0有J(t)≠0，不存在共轭点。这是Cartan-Hadamard定理的体现：非正曲率单连通流形上exp_p是全局微分同胚。","difficulty":"medium","chapter":"ch9","subject":"riemann"},{"q":"Rauch比较定理比较的是什么？","options":["两个流形的体积","两个流形中Jacobi场的模长","两个流形的直径","两个流形的曲率"],"answer":1,"explanation":"Rauch定理：若K_M ≥ K_M~，则沿等长测地线相同初始条件的Jacobi场满足|J(t)| ≤ |J~(t)|。","difficulty":"easy","chapter":"ch10","subject":"riemann"},{"q":"Bishop-Gromov体积比较定理的结论是什么？","options":["Vol(B(p,r)) ≥ V_c(r)","Vol(B(p,r)) ≤ V_c(r)","Vol(B(p,r)) = V_c(r)","Vol(B(p,r))与V_c(r)无关"],"answer":1,"explanation":"若Ric≥(n-1)c·g，则Vol(B(p,r)) ≤ V_c(r)，且比值Vol(B(p,r))/V_c(r)单调非增。","difficulty":"easy","chapter":"ch10","subject":"riemann"},{"q":"Toponogov定理比较的是什么？","options":["两个流形的曲率","测地三角形的边长和角度","两个流形的体积","测地线的长度"],"answer":1,"explanation":"Toponogov定理：若K≥c，则测地三角形各角不小于常曲率c空间中同边长三角形的对应角。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"Bonnet-Myers定理中，若Ric≥(n-1)/R²·g，直径的上界是多少？","options":["R","πR","2πR","πR/2"],"answer":1,"explanation":"Bonnet-Myers定理：diam(M) ≤ πR。球面Sⁿ(R)达到此上界，是刚性情形。","difficulty":"easy","chapter":"ch10","subject":"riemann"},{"q":"Gromov紧致性定理要求哪些条件？","options":["仅曲率有界","截面曲率有界、直径有界、体积有下界","仅直径有界","仅体积有下界"],"answer":1,"explanation":"Gromov紧致性定理：|K|≤1, diam≤D, vol≥v>0的n维流形集合在GH拓扑下紧致。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"Rauch定理中，正曲率对Jacobi场有什么影响？","options":["使Jacobi场增长更快","使Jacobi场增长变慢（或振荡）","无影响","使Jacobi场消失"],"answer":1,"explanation":"正曲率使Jacobi场增长变慢或振荡，负曲率使Jacobi场指数增长。曲率像'弹簧'。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"Gromov-Hausdorff距离度量什么？","options":["两个黎曼流形的曲率差异","两个度量空间之间的'形状差异'","两个流形的体积差异","两个流形的直径差异"],"answer":1,"explanation":"d_GH(X,Y)度量两个紧致度量空间之间的形状差异，定义为等距嵌入到同一空间后Hausdorff距离的下确界。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"Cheeger-Gromoll分裂定理的条件和结论是什么？","options":["Ric≥0且存在直线→M=R×N","Ric≤0→M是紧致的","K≥0→M是球面","Ric=0→M是平坦的"],"answer":0,"explanation":"Cheeger-Gromoll分裂定理：若完备非紧致流形Ric≥0且包含一条直线，则等距于乘积R×N。","difficulty":"hard","chapter":"ch10","subject":"riemann"},{"q":"Cartan-Hadamard定理适用于什么曲率条件？","options":["截面曲率≥0","截面曲率≤0","Ricci曲率≥0","标量曲率≤0"],"answer":1,"explanation":"Cartan-Hadamard定理：若完备单连通流形截面曲率≤0，则微分同胚于Rⁿ。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"Perelman证明Poincaré猜想时使用了什么工具？","options":["仅Gauss-Bonnet定理","Ricci流和Gromov-Hausdorff收敛","仅Toponogov定理","仅Rauch定理"],"answer":1,"explanation":"Perelman使用Ricci流（带手术的）和Gromov-Hausdorff收敛分析奇点形成，证明了Poincaré猜想和Thurston几何化猜想。","difficulty":"hard","chapter":"ch10","subject":"riemann"},{"q":"Rauch比较定理I（曲率比较）的基本假设是什么？","options":["两个流形有相同的体积","两个流形中沿等长测地线的Jacobi场满足相同的初始条件","两个流形有相同的直径","两个流形有相同的Euler示性数"],"answer":1,"explanation":"Rauch定理I：设M和M~是黎曼流形，γ和γ~是等长的测地线。若K_M ≤ K_M~，且J, J~是满足相同初始条件J(0)=J~(0)=0, |J'(0)|=|J~'(0)|, J'⊥γ', J~'⊥γ~'的法Jacobi场，则|J(t)| ≥ |J~(t)|。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"Bishop-Gromov定理中，Ricci曲率下界给出的体积比较是：Vol(B(p,R))/Vol(B(p,r))与什么比较？","options":["与V_c(R)/V_c(r)比较","与(R/r)^n比较","与常数比较","与R-r比较"],"answer":0,"explanation":"Bishop-Gromov定理：若Ric ≥ (n-1)c，则函数f(r) = Vol(B(p,r))/V_c(r)是r的非增函数。特别地，Vol(B(p,R))/Vol(B(p,r)) ≤ V_c(R)/V_c(r)（对R>r）。这是体积比较的最强形式。","difficulty":"hard","chapter":"ch10","subject":"riemann"},{"q":"Toponogov定理在三角形比较中的“铰链”版本（hinge version）陈述了什么？","options":["比较两个三角形的面积","比较由两条边和夹角决定的第三边长度","比较三角形的内角和","比较三角形的周长"],"answer":1,"explanation":"Toponogov铰链定理：设M中两条测地线γ₁, γ₂从p出发，夹角为α。若K_M ≥ c，则d(γ₁(t), γ₂(s)) ≤ d_c(γ̃₁(t), γ̃₂(s))，其中γ̃₁, γ̃₂是常曲率c空间中同样长度和夹角的测地线。","difficulty":"hard","chapter":"ch10","subject":"riemann"},{"q":"Bonnet-Myers定理的刚性情形是什么？","options":["直径=πR时，M等距于球面Sⁿ(R)","直径任意时都等距于球面","没有刚性情形","直径=0时等距于球面"],"answer":0,"explanation":"Bonnet-Myers定理的刚性部分：若Ric ≥ (n-1)/R²且diam(M) = πR，则M等距于半径为R的球面Sⁿ(R)。这是Cheng的刚性定理，证明了球面是唯一达到直径上界的流形。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"Gromov紧致性定理（Gromov预紧致性定理）中，条件vol ≥ v > 0的作用是什么？","options":["技术性条件，可以去掉","防止序列坍缩（collapse）到低维空间","保证曲率有界","保证直径有界"],"answer":1,"explanation":"体积下界vol ≥ v > 0防止流形序列坍缩到低维极限空间。若无此条件，例如一系列越来越薄的平坦环面会在GH极限下坍缩到圆。体积下界与曲率上界、直径上界构成Gromov紧致性的三个核心条件。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"Cheeger-Gromoll分裂定理的几何内涵是什么？","options":["正曲率流形必然分裂","非负Ricci曲率流形中的“直线”导致等距分裂","负曲率流形必然分裂","所有流形都能分裂"],"answer":1,"explanation":"Cheeger-Gromoll分裂定理：若完备流形Ric ≥ 0且包含一条直线（双向无穷的最短测地线），则M等距于R × N。几何上，这表示流形沿直线方向“分裂”出一个欧氏因子。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"Cartan-Hadamard定理的结论中，exp_p: T_pM → M是什么？","options":["局部微分同胚","全局微分同胚","覆盖映射","浸入"],"answer":1,"explanation":"Cartan-Hadamard定理：若M完备单连通且K≤0，则exp_p: T_pM → M是全局微分同胚。因此M微分同胚于R^n。这是非正曲率流形最基本的拓扑刚性定理。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"Bishop不等式（Bishop-Gromov的前身）给出了什么估计？","options":["Vol(B(p,r)) ≥ V_c(r)","Vol(B(p,r)) ≤ V_c(r)","Vol(B(p,r)) = V_c(r)","面积比较"],"answer":1,"explanation":"Bishop不等式：若Ric ≥ (n-1)c，则Vol(B(p,r)) ≤ V_c(r)。Gromov的改进是证明比值Vol(B(p,r))/V_c(r)是单调非增的，这是更强的结果（Bishop-Gromov不等式）。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"在Gromov-Hausdorff收敛中，若M_i → X且X是光滑流形，则dim X与dim M_i的关系是什么？","options":["dim X > dim M_i","dim X = dim M_i","dim X ≤ dim M_i（可能坍缩）","dim X ≥ dim M_i"],"answer":2,"explanation":"在GH收敛中，极限空间的维数可能严格小于收敛序列的维数（坍缩现象）。例如，半径趋于零的圆S¹(r_i)的GH极限是单点。但若有曲率下界和体积下界，则维数保持不变。","difficulty":"hard","chapter":"ch10","subject":"riemann"},{"q":"Synge定理的结论是什么？","options":["偶维定向正曲率紧致流形是单连通的","所有正曲率流形都是球面","正曲率流形直径有限","正曲率流形Ricci曲率有界"],"answer":0,"explanation":"Synge定理：若M是紧致黎曼流形，截面曲率K>0，则：(1)若M是偶维可定向的，则M单连通；(2)若M是奇维的，则M可定向。这是正曲率流形拓扑的早期经典结果。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"Gromov的Betti数估计定理给出了什么结果？","options":["Betti数与曲率无关","截面曲率有下界时，Betti数之和有上界","Betti数总是1","Betti数等于维数"],"answer":1,"explanation":"Gromov定理：若完备流形M满足K ≥ -1且diam ≤ D，则M的Betti数之和Σ b_i(M) ≤ C(n,D)，其中C(n,D)是仅依赖于n和D的常数。这是曲率下界对流形拓扑的深刻控制。","difficulty":"hard","chapter":"ch10","subject":"riemann"},{"q":"Berger球面定理（sphere theorem）的经典版本说什么？","options":["所有紧致流形都是球面","若1/4 < K ≤ 1，则M同胚于球面","若K ≥ 0，则M是球面","K=1的流形是球面"],"answer":1,"explanation":"Berger-Klingenberg球面定理：若紧致单连通n维黎曼流形M满足1/4 < K ≤ 1（截面曲率被pinched），则M同胚于Sⁿ。Brendle-Schoen使用Ricci流证明了微分同胚版本。","difficulty":"hard","chapter":"ch10","subject":"riemann"},{"q":"Ricci流方程∂g/∂t = -2Ric(g)的几何意义是什么？","options":["度量随时间不变","度量沿Ricci曲率方向演化（类似热方程）","度量膨胀","度量收缩为零"],"answer":1,"explanation":"Ricci流∂g/∂t = -2Ric(g)使度量沿Ricci曲率方向演化，类似于热方程。正曲率区域收缩，负曲率区域膨胀。Hamilton引入Ricci流，Perelman用它证明了Poincaré猜想和Thurston几何化猜想。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"两个映射 f,g: X→Y 同伦的定义是什么？","options":["存在连续映射 H: X×[0,1]→Y 使得 H(x,0)=f(x), H(x,1)=g(x)","f 和 g 的像相同","f 和 g 是同胚","f 和 g 有相同的定义域"],"answer":0,"explanation":"同伦的定义是通过连续映射 H: X×[0,1]→Y 连接两个映射，H(x,0)=f(x) 且 H(x,1)=g(x)。","difficulty":"easy","chapter":"ch1","subject":"topo"},{"q":"S^1 的基本群 π₁(S^1) 同构于什么？","options":["Z","Z/2","平凡群","Z×Z"],"answer":0,"explanation":"π₁(S^1)≅Z，每个同伦类由绕数（整数）唯一确定。","difficulty":"easy","chapter":"ch1","subject":"topo"},{"q":"下列哪个空间是可缩的？","options":["R^n","S^1","S^2","T^2"],"answer":0,"explanation":"R^n 可形变收缩到原点，同伦等价于点，故可缩。S^1, S^2, T^2 有非平凡同调群，不可缩。","difficulty":"easy","chapter":"ch1","subject":"topo"},{"q":"覆叠空间 p: X̃→X 的纤维 p^{-1}(x) 是什么？","options":["离散空间","连通空间","紧致空间","可缩空间"],"answer":0,"explanation":"覆叠空间的纤维是离散空间，这是覆叠映射的定义要求。","difficulty":"easy","chapter":"ch1","subject":"topo"},{"q":"Seifert-van Kampen 定理主要用于计算什么？","options":["基本群","同调群","同伦群","上同调环"],"answer":0,"explanation":"van Kampen 定理是计算基本群的核心工具，通过分解空间为开集利用自由积计算。","difficulty":"medium","chapter":"ch1","subject":"topo"},{"q":"万有覆叠空间的基本群是什么？","options":["平凡群","Z","自由群","Z/2"],"answer":0,"explanation":"万有覆叠是单连通的覆叠空间，其基本群为平凡群。","difficulty":"medium","chapter":"ch1","subject":"topo"},{"q":"Brouwer 不动点定理（二维）的基本群证明中，关键矛盾是什么？","options":["收缩映射 r: D²→S^1 诱导恒等映射在基本群上，但 π₁(D²)={e} 而 π₁(S^1)≅Z","D² 和 S^1 的基本群相同","基本群是函子","S^1 不可缩"],"answer":0,"explanation":"假设无不动点可构造收缩映射，导致基本群层面的矛盾：{e}→Z 不能是满射。","difficulty":"medium","chapter":"ch1","subject":"topo"},{"q":"形变收缩与同伦等价的关系是什么？","options":["形变收缩比同伦等价更强，形变收缩一定是同伦等价","两者完全相同","同伦等价比形变收缩更强","两者没有关系"],"answer":0,"explanation":"形变收缩是特殊的同伦等价，要求收缩映射在子空间上是恒等映射且同伦保持子空间点不动。","difficulty":"medium","chapter":"ch1","subject":"topo"},{"q":"在覆叠空间分类中，π₁(X) 的平凡子群对应什么覆叠？","options":["万有覆叠","平凡覆叠","正则覆叠","没有覆叠"],"answer":0,"explanation":"Galois对应中，π₁(X)的平凡子群对应万有覆叠（单连通覆叠空间）。","difficulty":"hard","chapter":"ch1","subject":"topo"},{"q":"设 X 道路连通，不同基点对应的基本群有何关系？","options":["同构（但同构不自然）","完全相同","完全不同","互不相关"],"answer":0,"explanation":"不同基点的基本群同构，但同构依赖于连接两基点的道路选择，不是自然的。","difficulty":"hard","chapter":"ch1","subject":"topo"},{"q":"n维标准单纯形 Δ^n 有多少个顶点？","options":["n+1","n","2n","n²"],"answer":0,"explanation":"Δ^n 是 R^{n+1} 中 n+1 个点的凸包，有 n+1 个顶点。","difficulty":"easy","chapter":"ch2","subject":"topo"},{"q":"单纯同调中边界算子 ∂ 满足什么关键性质？","options":["∂∘∂ = 0","∂∘∂ = id","∂ = 0","∂∘∂ = ∂"],"answer":0,"explanation":"∂_{n-1}∘∂_n = 0 是链复形的核心性质，保证了同调群的良定义性。","difficulty":"easy","chapter":"ch2","subject":"topo"},{"q":"S^2 的同调群 H_1(S^2) 是什么？","options":["0","Z","Z/2","Z²"],"answer":0,"explanation":"球面 S^2 没有一维洞，H_1(S^2)=0。H_0≅Z, H_2≅Z。","difficulty":"easy","chapter":"ch2","subject":"topo"},{"q":"奇异同调相比单纯同调的主要优势是什么？","options":["函子性和同伦不变性自然成立","计算更简单","链群总是有限生成","不需要连续映射"],"answer":0,"explanation":"奇异同调具有自然的函子性和同伦不变性，这些性质在单纯同调中需要额外证明。","difficulty":"medium","chapter":"ch2","subject":"topo"},{"q":"Mayer-Vietoris 序列连接哪些同调群？","options":["H_n(U∩V), H_n(U)⊕H_n(V), H_n(X)","H_n(X), H_n(A), H_n(X,A)","π_n(F), π_n(E), π_n(B)","H^n(X), H_n(X), H_{n-1}(X)"],"answer":0,"explanation":"Mayer-Vietoris 序列连接 H_n(U∩V), H_n(U)⊕H_n(V), H_n(U∪V)。","difficulty":"medium","chapter":"ch2","subject":"topo"},{"q":"CW 复形的胞腔同调中，n 维链群 C_n^{CW} 的秩等于什么？","options":["n 维胞腔的个数","n 维同调群的秩","Euler 示性数","基本群的秩"],"answer":0,"explanation":"C_n^{CW}(X) = H_n(X^n, X^{n-1}) 是自由阿贝尔群，秩等于 n 维胞腔数。","difficulty":"medium","chapter":"ch2","subject":"topo"},{"q":"切除定理的条件是什么？","options":["Z̄ ⊂ Int(A)","Z 是开集","A 是紧致集","X 是流形"],"answer":0,"explanation":"切除定理要求 Z 的闭包包含在 A 的内部，即 Z̄⊂Int(A)。","difficulty":"medium","chapter":"ch2","subject":"topo"},{"q":"RP^2 的同调群 H_1(RP^2;Z) 是什么？","options":["Z/2","Z","0","Z²"],"answer":0,"explanation":"RP^2 的胞腔边界 d_2(e²)=2e¹，故 H_1(RP^2;Z)≅Z/2（扭转）。","difficulty":"hard","chapter":"ch2","subject":"topo"},{"q":"Lefschetz 不动点定理中，Lefschetz 数 L(f) 如何定义？","options":["Σ(-1)^n tr(f_*: H_n(X)→H_n(X))","Σ rank H_n(X)","Σ tr(f_*: π_n→π_n)","Σ dim H_n(X)"],"answer":0,"explanation":"L(f) = Σ_{n}(-1)^n tr(f_*: H_n(X;Q)→H_n(X;Q))，是各维同调诱导映射的迹的交错和。","difficulty":"hard","chapter":"ch2","subject":"topo"},{"q":"对于可定向闭曲面 Σ_g，其 H_1(Σ_g) 的秩是多少？","options":["2g","g","g+1","1"],"answer":0,"explanation":"亏格 g 的可定向闭曲面 Σ_g 的 H_1≅Z^{2g}，秩为 2g。","difficulty":"hard","chapter":"ch2","subject":"topo"},{"q":"上同调群 H^n(X;G) 中的上链群 C^n 定义为什么？","options":["Hom(C_n, G)","C_n ⊗ G","H_n(X;G)","C_n ⊕ G"],"answer":0,"explanation":"C^n = Hom(C_n, G)，即从链群到系数群的所有群同态。","difficulty":"easy","chapter":"ch3","subject":"topo"},{"q":"Cup 积 ⌣: H^p×H^q→H^{p+q} 满足什么交换律？","options":["α⌣β = (-1)^{pq} β⌣α","α⌣β = β⌣α","α⌣β = -β⌣α","α⌣β = 0"],"answer":0,"explanation":"Cup 积是分次交换的：α⌣β = (-1)^{pq} β⌣α。","difficulty":"easy","chapter":"ch3","subject":"topo"},{"q":"CP^n 的上同调环 H^*(CP^n;Z) 同构于什么？","options":["Z[α]/(α^{n+1})，|α|=2","Z[α]/(α²)，|α|=n","Z×Z","Z/2[α]"],"answer":0,"explanation":"H^*(CP^n;Z) ≅ Z[α]/(α^{n+1})，其中 α 是度为 2 的生成元，α^{n+1}=0。","difficulty":"medium","chapter":"ch3","subject":"topo"},{"q":"万有系数定理（同调版本）的短正合序列包含什么？","options":["0→H_n⊗G→H_n(X;G)→Tor(H_{n-1},G)→0","0→H_n→H_n(X;G)→H_{n-1}→0","0→G→H_n(X;G)→H_n→0","0→Tor→H_n(X;G)→H_n⊗G→0"],"answer":0,"explanation":"同调UCT为 0→H_n(X)⊗G→H_n(X;G)→Tor(H_{n-1}(X),G)→0。","difficulty":"medium","chapter":"ch3","subject":"topo"},{"q":"Künneth 公式在域系数下，H^n(X×Y) 等于什么？","options":["⊕_{i+j=n} H^i(X)⊗H^j(Y)","H^n(X)⊕H^n(Y)","H^n(X)⊗H^n(Y)","H^n(X)×H^n(Y)"],"answer":0,"explanation":"在域系数下，上同调 Künneth 公式给出 H^n(X×Y) ≅ ⊕_{i+j=n} H^i(X)⊗H^j(Y)。","difficulty":"medium","chapter":"ch3","subject":"topo"},{"q":"Poincaré 对偶定理中，n 维紧致可定向流形 M 的 H^k(M) 同构于什么？","options":["H_{n-k}(M)","H_k(M)","H^{n-k}(M)","H_n(M)"],"answer":0,"explanation":"Poincaré 对偶：H^k(M) ≅ H_{n-k}(M)，通过 Cap 积与基本类实现。","difficulty":"medium","chapter":"ch3","subject":"topo"},{"q":"Chern 类 c_k(E) 属于哪个上同调群？","options":["H^{2k}(X;Z)","H^k(X;Z)","H^{2k}(X;Z/2)","H^k(X;R)"],"answer":0,"explanation":"Chern 类 c_k(E)∈H^{2k}(X;Z)，是复向量丛的整系数示性类。","difficulty":"hard","chapter":"ch3","subject":"topo"},{"q":"de Rham 定理表明什么？","options":["H^k_{dR}(M) ≅ H^k(M;R)","H^k_{dR}(M) ≅ H_k(M;R)","H^k_{dR}(M) ≅ π_k(M)","H^k_{dR}(M) ≅ H^k(M;Z)"],"answer":0,"explanation":"de Rham 定理给出了微分形式上同调与奇异上同调（实系数）的同构，楔积对应 Cup 积。","difficulty":"hard","chapter":"ch3","subject":"topo"},{"q":"Ext(H_{n-1}(X), G) 在上同调万有系数定理中出现在哪里？","options":["短正合序列的左端","短正合序列的右端","短正合序列的中间","不出现"],"answer":0,"explanation":"上同调UCT为 0→Ext(H_{n-1}(X),G)→H^n(X;G)→Hom(H_n(X),G)→0，Ext 在左端。","difficulty":"hard","chapter":"ch3","subject":"topo"},{"q":"RP^2 的 Z/2 系数上同调环 H^*(RP^2;Z/2) 同构于什么？","options":["Z/2[α]/(α³)，|α|=1","Z/2[α]/(α²)，|α|=2","Z/2⊕Z/2","Z/2"],"answer":0,"explanation":"H^*(RP^2;Z/2) ≅ Z/2[α]/(α³)，其中 α∈H^1(RP^2;Z/2) 是生成元。","difficulty":"hard","chapter":"ch3","subject":"topo"},{"q":"n≥2 时，π_n(X) 是什么类型的群？","options":["阿贝尔群（交换群）","非交换群","有限群","自由群"],"answer":0,"explanation":"当 n≥2 时，同伦群 π_n(X) 总是阿贝尔群。这是高维同伦群的基本性质。","difficulty":"easy","chapter":"ch4","subject":"topo"},{"q":"π_n(S^n) 同构于什么？","options":["Z","Z/2","平凡群","Z×Z"],"answer":0,"explanation":"π_n(S^n)≅Z，由恒等映射的度数生成。这是同伦群最基本的计算结果。","difficulty":"easy","chapter":"ch4","subject":"topo"},{"q":"纤维化 F→E→B 诱导什么序列？","options":["同伦群长正合序列","同调群长正合序列","基本群正合序列","上同调长正合序列"],"answer":0,"explanation":"纤维化诱导同伦群长正合序列 ...→π_n(F)→π_n(E)→π_n(B)→π_{n-1}(F)→...。","difficulty":"medium","chapter":"ch4","subject":"topo"},{"q":"Whitehead 定理在什么范畴中成立？","options":["CW 复形范畴","所有拓扑空间范畴","流形范畴","紧致空间范畴"],"answer":0,"explanation":"Whitehead 定理在 CW 复形范畴中成立：弱同伦等价（诱导同伦群同构）⇒ 同伦等价。","difficulty":"medium","chapter":"ch4","subject":"topo"},{"q":"Hurewicz 定理中，若 X 是 (n-1) 连通空间 (n≥2)，则 π_n(X) 同构于什么？","options":["H_n(X)","H_{n-1}(X)","H_n(X)⊗Z/2","π_{n-1}(X)"],"answer":0,"explanation":"Hurewicz 定理：若 X 是 (n-1) 连通 (n≥2)，则 Hurewicz 同态 π_n(X)→H_n(X) 是同构。","difficulty":"medium","chapter":"ch4","subject":"topo"},{"q":"Hopf 纤维化 S^1→S^3→S^2 给出 π_3(S^2) 同构于什么？","options":["Z","Z/2","0","Z×Z"],"answer":0,"explanation":"由 Hopf 纤维化同伦群长正合序列，π_3(S^3)≅Z 推出 π_3(S^2)≅Z。","difficulty":"medium","chapter":"ch4","subject":"topo"},{"q":"Freudenthal 悬挂定理描述了什么？","options":["π_{n+k}(S^n) 对充分大的 n 稳定","π_n(S^n)≅Z","π_n 是阿贝尔群","π_n 与 H_n 的关系"],"answer":0,"explanation":"Freudenthal 定理：悬挂同态 Σ: π_{n+k}(S^n)→π_{n+k+1}(S^{n+1}) 对 n>k+1 是同构。","difficulty":"hard","chapter":"ch4","subject":"topo"},{"q":"π_{n+1}(S^n) (n≥3) 同构于什么？","options":["Z/2","Z","0","Z/3"],"answer":0,"explanation":"π_{n+1}(S^n)≅Z/2 (n≥3)，这是稳定同伦群 π_1^S≅Z/2 的经典结果。","difficulty":"hard","chapter":"ch4","subject":"topo"},{"q":"Serre 谱序列主要用于计算什么？","options":["纤维化的同调/上同调","基本群","覆叠空间","同伦等价"],"answer":0,"explanation":"Serre 谱序列是计算纤维化 F→E→B 的同调群和上同调群的核心工具。","difficulty":"hard","chapter":"ch4","subject":"topo"},{"q":"Hurewicz 定理在 n=1 时给出什么关系？","options":["π₁(X)_{ab} ≅ H₁(X)","π₁(X) ≅ H₁(X)","π₁(X) ≅ H₁(X)⊗Z/2","π₁(X) ≅ H₂(X)"],"answer":0,"explanation":"n=1 时，Hurewicz 同态诱导 π₁(X) 的交换化与 H₁(X) 的同构。","difficulty":"hard","chapter":"ch4","subject":"topo"},{"q":"S¹的基本群π₁(S¹) ≅ Z的生成元对应什么？","options":["绕S¹逆时针旋转一圈的环路","绕S¹顺时针旋转半圈","常值环路","绕S¹旋转两圈"],"answer":0,"explanation":"π₁(S¹) ≅ Z，生成元是绕S¹逆时针一圈的环路（绕数为1）。绕数给出同构π₁(S¹)→Z。这是Hatcher §1.1中最核心的计算，也是所有基本群计算的基石。","difficulty":"easy","chapter":"ch1","subject":"topo"},{"q":"可缩空间X的基本群π₁(X)是什么？","options":["平凡群{e}","Z","自由群","非交换群"],"answer":0,"explanation":"可缩空间同伦等价于点，而点的基本群平凡。由于基本群是同伦不变量，故π₁(X) ≅ {e}。例如Rⁿ、星形区域、实心球Dⁿ（n≥1）的基本群都是平凡的。","difficulty":"easy","chapter":"ch1","subject":"topo"},{"q":"8字形空间（两个圆粘合于一点）的基本群π₁(S¹∨S¹)是什么？","options":["Z × Z","Z * Z（两个生成元的自由群）","Z","平凡群"],"answer":1,"explanation":"由Van Kampen定理，S¹∨S¹可分解为两个S¹（开邻域各加宽），交集为可缩点。故π₁(S¹∨S¹) ≅ π₁(S¹) * π₁(S¹) = Z * Z。这是两个生成元a,b的自由群，没有交换关系。","difficulty":"medium","chapter":"ch1","subject":"topo"},{"q":"Van Kampen定理中，若X = U∪V，且U∩V是道路连通的，则π₁(X) = π₁(U) * π₁(V) / N，其中N是由什么元素生成的？","options":["π₁(U)的所有元素","π₁(U∩V)中元素在包含映射i_U和i_V下的像的商","π₁(V)的所有元素","π₁(U)和π₁(V)的交换子"],"answer":1,"explanation":"N是由形如i_U*(ω)·i_V*(ω)⁻¹的元素生成的正规子群，其中ω ∈ π₁(U∩V)。这反映了U∩V中环路在π₁(U)和π₁(V)中必须被等同。这是Van Kampen定理的核心：交集的路必须融合。","difficulty":"medium","chapter":"ch1","subject":"topo"},{"q":"覆叠空间p: X̃→X的分类定理（Galois对应）说的是：X̃的连通覆叠空间与下列哪个对象一一对应？","options":["π₁(X)的共轭类","π₁(X)的子群的共轭类","π₁(X)的商群","π₁(X)的生成元"],"answer":1,"explanation":"对充分好的空间X（如道路连通、局部道路连通、半局部单连通），连通覆叠空间的等价类与π₁(X)的子群共轭类一一对应。特别地，万有覆叠对应平凡子群，底空间X对应π₁(X)本身。这是Hatcher §1.3的核心定理。","difficulty":"medium","chapter":"ch1","subject":"topo"},{"q":"设p: R→S¹, p(t)=e^{2πit}是万有覆叠。沿S¹上绕数为3的环路，提升到R中起于0，终点是？","options":["0","1","3","-3"],"answer":2,"explanation":"S¹上绕数为n的环路γ(t)=e^{2πint}，提升到R中为γ̃(t)=nt。起于0则在t=1时终点为n。绕数为3，故终点为3。提升终点的坐标恰好等于绕数，这是π₁(S¹)≅Z的覆叠解释。","difficulty":"easy","chapter":"ch1","subject":"topo"},{"q":"覆叠空间p: X̃→X的覆叠变换群（deck transformation group）Γ(X̃,p)与π₁(X)的关系是什么？","options":["Γ ≅ π₁(X)","Γ ≅ N(p_*π₁(X̃)) / p_*π₁(X̃)","Γ ≅ π₁(X̃)","Γ ≅ π₁(X) / π₁(X̃)"],"answer":1,"explanation":"Γ ≅ N(p_*π₁(X̃)) / p_*π₁(X̃)，其中N(H)是H在π₁(X)中的正规化子。当p_*π₁(X̃)是π₁(X)的正规子群时（正规覆叠），Γ ≅ π₁(X)/p_*π₁(X̃)。万有覆叠时Γ ≅ π₁(X)。","difficulty":"hard","chapter":"ch1","subject":"topo"},{"q":"Borsuk-Ulam定理（二维情形）的经典结论：任何连续映射f: S²→R²，必存在什么？","options":["f是常值映射","存在一对对径点x,-x使f(x)=f(-x)","f是满射","f有不动点"],"answer":1,"explanation":"Borsuk-Ulam定理：对任意连续映射f: S^n→R^n，存在x∈S^n使f(x)=f(-x)。二维情形（n=2）的经典推论：地球上任一时刻总存在一对对径点有相同温度和气压。证明依赖于覆叠空间和π₁的论证。","difficulty":"medium","chapter":"ch1","subject":"topo"},{"q":"闭曲面M_g（亏格g的定向曲面）的基本群可由Van Kampen定理计算。对于环面T²（g=1），其基本群用生成元a,b的表现为？","options":["⟨a,b⟩（自由群）","⟨a,b | aba⁻¹b⁻¹ = 1⟩","⟨a,b | a² = b² = 1⟩","⟨a,b | aᵏ = bᵏ = 1⟩"],"answer":1,"explanation":"将正方形对边粘合得环面T²。用Van Kampen定理，a和b分别对应赤道和经线方向，正方形边界给出关系aba⁻¹b⁻¹=1，故π₁(T²)≅Z×Z（交换群）。这正是Hatcher §1.2的经典计算。","difficulty":"medium","chapter":"ch1","subject":"topo"},{"q":"Klein瓶K的基本群用生成元a,b的表现为？","options":["⟨a,b | aba⁻¹b⁻¹ = 1⟩","⟨a,b | aba⁻¹b = 1⟩","⟨a,b | a² = b² = 1⟩","⟨a,b⟩"],"answer":1,"explanation":"Klein瓶也可由正方形对边粘合得到，但一组对边反向粘合，得关系abab⁻¹=1或等价地aba⁻¹b=1。这是非交换群，与环面T²的π₁=Z×Z（交换）不同，因此Klein瓶与环面不同伦等价。","difficulty":"medium","chapter":"ch1","subject":"topo"},{"q":"道路提升定理（Path Lifting Property）说的是：对于覆叠p: X̃→X，给定X̃中一点x̃₀和X中起点为p(x̃₀)的道路γ，存在什么？","options":["无穷多条提升道路","唯一的提升道路γ̃满足γ̃(0)=x̃₀","提升道路γ̃当且仅当γ是闭路","提升道路存在但不一定唯一"],"answer":1,"explanation":"道路提升定理：存在唯一的提升道路γ̃: [0,1]→X̃使p∘γ̃=γ且γ̃(0)=x̃₀。唯一性来自覆叠空间的局部同胚和离散纤维性质。这是覆叠空间理论最基本的定理（Hatcher命题1.30）。","difficulty":"easy","chapter":"ch1","subject":"topo"},{"q":"同伦提升定理（Homotopy Lifting Property）保证：对覆叠p: X̃→X，底空间中的同伦H: Y×I→X可提升为什么？","options":["仅当Y是单连通时","对任意空间Y，给定H的部分提升，存在唯一提升H̃","仅当H是道路同伦","仅当X是CW复形"],"answer":1,"explanation":"同伦提升定理：若H: Y×I→X有提升h̃: Y×{0}→X̃，则存在唯一提升H̃: Y×I→X̃扩展h̃。这是覆叠空间具有「同伦提升性质」的精确表述，是覆叠空间分类理论的基础。","difficulty":"hard","chapter":"ch1","subject":"topo"},{"q":"设X是道路连通、局部道路连通、半局部单连通空间。X的万有覆叠X̃的基本群是什么？","options":["π₁(X)","平凡群","Z","与X相同"],"answer":1,"explanation":"万有覆叠X̃是单连通的，即π₁(X̃) = {e}。这是万有覆叠的定义特征。由覆叠空间分类，万有覆叠对应π₁(X)的平凡子群。万有覆叠是「最大」的覆叠空间。","difficulty":"medium","chapter":"ch1","subject":"topo"},{"q":"实射影平面RP²的基本群π₁(RP²)是什么？","options":["Z","Z₂ = Z/2Z","平凡群","Z × Z"],"answer":1,"explanation":"S²是RP²的二重万有覆叠（对径映射p: S²→RP²）。覆叠变换群为Z/2，故π₁(RP²) ≅ Z/2。唯一的非平凡环路是连接一对对径点的路径在RP²中的投影。此环路绕两次可缩为一点。","difficulty":"medium","chapter":"ch1","subject":"topo"},{"q":"设p: X̃→X是覆叠映射。提升判据（Lifting Criterion）说：映射f: Y→X可提升到X̃当且仅当什么？","options":["f是连续满射","f_*(π₁(Y)) ⊆ p_*(π₁(X̃))","Y是单连通的","f是同伦等价"],"answer":1,"explanation":"提升判据：对充分好的空间Y，存在提升f̃: Y→X̃使p∘f̃=f当且仅当f_*(π₁(Y,y₀)) ⊆ p_*(π₁(X̃, x̃₀))。这是Hatcher命题1.33，是覆叠空间理论中判断映射能否提升的核心工具。","difficulty":"hard","chapter":"ch1","subject":"topo"},{"q":"n维标准单纯形Δⁿ的顶点数是多少？","options":["n","n+1","2n","n²"],"answer":1,"explanation":"Δⁿ = {(t₀,...,t_n)∈R^{n+1} | Σt_i=1, t_i≥0}，有n+1个顶点（每个坐标轴上的单位点）。Δ⁰是点，Δ¹是线段，Δ²是三角形，Δ³是四面体。顶点数是单纯形的基本参数。","difficulty":"easy","chapter":"ch2","subject":"topo"},{"q":"边缘算子∂_n: C_n→C_{n-1}的核心性质∂_{n-1}∘∂_n = 0反映了什么？","options":["链复形是正合的","边界没有边界","同调群为零","链群是自由的"],"answer":1,"explanation":"∂_{n-1}∘∂_n = 0反映了几何事实：单纯形的边界本身没有边界。例如三角形边界是三条边，每条边的边界是两个顶点，但两次取边界后正负抵消。这是链复形定义的核心，使得同调群H_n = Ker ∂_n / Im ∂_{n+1}有意义。","difficulty":"easy","chapter":"ch2","subject":"topo"},{"q":"奇异同调群H_n(X)与单纯同调群相比，其优势在于？","options":["只适用于单纯复形","定义适用于任意拓扑空间，且满足Eilenberg-Steenrod公理","计算更简单","只适用于紧致空间"],"answer":1,"explanation":"奇异同调通过任意连续映射σ: Δⁿ→X（奇异单形）定义，适用于所有拓扑空间。它满足Eilenberg-Steenrod公理，且对CW复形与单纯同调一致。这是Hatcher第2章的核心内容。","difficulty":"easy","chapter":"ch2","subject":"topo"},{"q":"Eilenberg-Steenrod同调公理中，「维数公理」说的是什么？","options":["H_n(X)对所有n都有定义","H_n(pt) = Z当n=0，否则为0","H_n(X)是有限生成的","dim H_n = dim X"],"answer":1,"explanation":"维数公理：H_n({pt}) = Z（n=0）且H_n({pt}) = 0（n≠0）。点的同调只在0维非平凡。此公理排除了广义同调论（如K-理论、配边），是普通同调论的特征公理。","difficulty":"medium","chapter":"ch2","subject":"topo"},{"q":"切除定理（Excision Theorem）说的是：若Z的闭包⊂A的内部，则包含映射(A, A∩B)→(A∪B, B)诱导什么？","options":["同调群同构","同伦群同构","仅是单同态","仅是满同态"],"answer":1,"explanation":"切除定理：包含映射(A, A∩B)→(A∪B, B)诱导同调群的同构H_n(A, A∩B) ≅ H_n(A∪B, B)。这等价于H_n(X, A) ≅ H_n(XZ, AZ)。切除是计算相对同调群的核心工具，也是同调论区别于同伦论的关键定理。","difficulty":"medium","chapter":"ch2","subject":"topo"},{"q":"Mayer-Vietoris序列适用于什么情形？","options":["仅当X是紧致的","X = A∪B，其中A,B是子空间且满足切除条件","仅当X是单连通的","仅当X是CW复形"],"answer":1,"explanation":"Mayer-Vietoris序列：若X = int(A)∪int(B)（或A,B是子复形对），则存在长正合序列...→H_n(A∩B)→H_n(A)⊕H_n(B)→H_n(X)→H_{n-1}(A∩B)→...。这是「同调论的Van Kampen定理」，将空间分解为两部分的同调信息拼接。","difficulty":"medium","chapter":"ch2","subject":"topo"},{"q":"用Mayer-Vietoris序列计算S²的同调群。将S²分解为两个半球D²。H₁(S²) = ?","options":["Z","0","Z × Z","Z₂"],"answer":1,"explanation":"S² = D²_+ ∪ D²_-，交集≃S¹。Mayer-Vietoris序列：...→H₁(D²_+)⊕H₁(D²_-)→H₁(S²)→H₀(S¹)→H₀(D²_+)⊕H₀(D²_-)→H₀(S²)→0。H₁(D²)=0，H₀(S¹)≅Z，H₀(D²)≅Z。由正合性得H₁(S²)=0（且H₂(S²)≅Z）。","difficulty":"medium","chapter":"ch2","subject":"topo"},{"q":"CW复形X的胞腔同调中，n维胞腔对应什么？","options":["链群C_n的生成元","同调群H_n的生成元","边缘算子的核","同伦群的生成元"],"answer":0,"explanation":"在CW复形的胞腔同调中，链群C_n^{CW}(X)是由X的n维胞腔生成的自由交换群，每个n维胞腔对应一个生成元。边缘算子∂_n由附着映射的度数决定。这是Hatcher §2.2的核心内容，极大地简化了同调计算。","difficulty":"medium","chapter":"ch2","subject":"topo"},{"q":"CW复形X的胞腔同调中，边缘算子∂_n: C_n^{CW}→C_{n-1}^{CW}的矩阵元由什么决定？","options":["胞腔的维数","附着映射的度数（degree）","胞腔的大小","胞腔的位置"],"answer":1,"explanation":"∂_n(e_αⁿ) = Σ_β d_αβ e_β^{n-1}，其中d_αβ是附着映射S^{n-1}→X^{n-1}→X^{n-1}/X^{n-2}≅∨S^{n-1}投射到第β个S^{n-1}的度数。这是胞腔同调的核心计算公式（Hatcher命题2.2.7）。","difficulty":"medium","chapter":"ch2","subject":"topo"},{"q":"有限CW复形X的Euler示性数χ(X)定义为？","options":["χ(X) = Σ_n (-1)^n rank H_n(X)","χ(X) = Σ_n rank H_n(X)","χ(X) = dim X","χ(X) = Σ_n (-1)^n dim C_n"],"answer":0,"explanation":"χ(X) = Σ_{n≥0} (-1)^n rank H_n(X) = Σ_{n≥0} (-1)^n (n维胞腔数)。两者相等是因为同调群是链复形的同调，而交错和与边缘算子无关。例如S²有两个胞腔（0维和2维），χ(S²)=1+1=2，H₂=Z, H₀=Z，χ=1+1=2。","difficulty":"medium","chapter":"ch2","subject":"topo"},{"q":"实射影平面RP²的CW结构：一个0维胞腔、一个1维胞腔、一个2维胞腔。附着映射∂_2(e²)的度数是多少？","options":["0","1","2","-1"],"answer":2,"explanation":"RP²的2维胞腔以度数为2的映射附着：S¹→S¹, z↦z²。因此胞腔链复形为：C₂=Z, C₁=Z, C₀=Z，∂_2(z)=2z，∂_1=0。故H₂(RP²)=0, H₁(RP²)=Z₂, H₀(RP²)=Z。这是胞腔同调的经典计算。","difficulty":"hard","chapter":"ch2","subject":"topo"},{"q":"环面T²的胞腔同调中，链复形C₂→C₁→C₀是什么样的？","options":["∂_2=0, ∂_1=0","∂_2≠0, ∂_1=0","∂_2=0, ∂_1≠0","∂_2≠0, ∂_1≠0"],"answer":0,"explanation":"T²有1个0维胞腔、2个1维胞腔（a和b）、1个2维胞腔，附着映射为aba⁻¹b⁻¹，其在C₁上的边缘为0（因为a+b-a-b=0）。故∂_2=0, ∂_1=0，H₂(T²)≅Z, H₁(T²)≅Z⊕Z, H₀(T²)≅Z。这是胞腔同调最简洁的计算之一。","difficulty":"medium","chapter":"ch2","subject":"topo"},{"q":"相对同调群H_n(X,A)的长正合序列...→H_n(A)→H_n(X)→H_n(X,A)→H_{n-1}(A)→...中，连接同态是什么？","options":["仅由包含映射诱导","∂: H_n(X,A)→H_{n-1}(A)由边缘算子诱导","由切除定理诱导","由Mayer-Vietoris诱导"],"answer":1,"explanation":"连接同态∂: H_n(X,A)→H_{n-1}(A)定义如下：取相对循环z∈Z_n(X,A)（∂z⊂A），则∂z∈Z_{n-1}(A)，其同调类为∂[z]。这是代数拓扑中长正合序列的标准构造，是推导Mayer-Vietoris和计算相对同调的核心工具。","difficulty":"hard","chapter":"ch2","subject":"topo"},{"q":"设X是道路连通空间。H_0(X)的秩（rank）是什么？","options":["0","1","等于连通分支数","等于π₁(X)的秩"],"answer":1,"explanation":"对于道路连通空间X，H_0(X) ≅ Z（秩为1）。生成元为任意点。一般地，H_0(X) ≅ Z^{⊕c}，其中c是X的道路连通分支数。H_0度量了空间的连通性。约化同调H̃_0 = 0对道路连通空间。","difficulty":"easy","chapter":"ch2","subject":"topo"},{"q":"链同伦（chain homotopy）在链复形之间的链映射f, g: C_*→D_*之间定义了同伦等价。若f ≃ g（链同伦），则它们诱导的同调群同态有什么关系？","options":["f_* ≠ g_*","f_* = g_*","f_* = -g_*","f_* = 0"],"answer":1,"explanation":"链同伦的链映射诱导相同的同调同态：f_* = g_*: H_n(C)→H_n(D)。链同伦P满足f - g = ∂_D P + P ∂_C，当作用于循环z时，(f-g)(z) = ∂_D(Pz)，是边界。这是代数拓扑中同伦不变性的代数基础。","difficulty":"hard","chapter":"ch2","subject":"topo"},{"q":"上同调群H^n(X; G)的定义中，上链群C^n(X; G)是什么？","options":["C_n(X) ⊗ G","Hom(C_n(X), G)","C_n(X) × G","G ⊗ C_n(X)"],"answer":1,"explanation":"C^n(X; G) = Hom(C_n(X), G)，即从链群到系数群G的同态集合。上边缘δ: C^n→C^{n+1}定义为(δφ)(σ) = φ(∂σ)。上同调H^n = Ker δ / Im δ。这是同调的对偶构造。","difficulty":"easy","chapter":"ch3","subject":"topo"},{"q":"上边缘算子δ: C^n→C^{n+1}与边缘算子∂: C_{n+1}→C_n的关系是什么？","options":["δ = ∂⁻¹","(δφ)(σ) = φ(∂σ)（差符号）","δ = ∂","δ = -∂"],"answer":1,"explanation":"上边缘算子定义为(δφ)(σ) = (-1)^{n+1} φ(∂σ)（或等价地δφ = φ∘∂）。核心性质δ² = 0来自∂² = 0：(δ²φ)(σ) = δφ(∂σ) = φ(∂²σ) = 0。","difficulty":"easy","chapter":"ch3","subject":"topo"},{"q":"Cup积⌣: H^p(X) × H^q(X) → H^{p+q}(X)在上链层面如何定义？","options":["(φ⌣ψ)(σ) = φ(σ)ψ(σ)","(φ⌣ψ)(σ) = φ(σ|_{[v₀,...,v_p]}) · ψ(σ|_{[v_p,...,v_{p+q}]})","(φ⌣ψ)(σ) = φ(σ) + ψ(σ)","(φ⌣ψ)(σ) = φ(ψ(σ))"],"answer":1,"explanation":"Cup积在上链层面：(φ⌣ψ)(σ) = φ(σ|_{[v₀,...,v_p]}) · ψ(σ|_{[v_p,...,v_{p+q}]})，其中σ|_{[v₀,...,v_p]}是σ的前p+1个顶点。这使上同调H^*(X)成为分次环。Cup积是上同调区别于同调的最重要额外结构。","difficulty":"easy","chapter":"ch3","subject":"topo"},{"q":"环面T²的上同调环H^*(T²; Z)作为分次环的结构是什么？","options":["Z[x]/(x²) 其中|x|=1","Λ_Z(a,b)（外代数），其中|a|=|b|=1","Z[x]/(x³) 其中|x|=2","Z[x,y]/(x²,y²) 其中|x|=|y|=2"],"answer":1,"explanation":"T² = S¹×S¹。H^*(S¹)≅Λ_Z(a)，|a|=1。由Kunneth公式，H^*(T²)≅H^*(S¹)⊗H^*(S¹)≅Λ_Z(a,b)，其中a,b∈H¹且a²=b²=0，ab是H²的生成元。这是外代数与外积结构的经典例子。","difficulty":"medium","chapter":"ch3","subject":"topo"},{"q":"万有系数定理（Universal Coefficient Theorem）给出上同调群H^n(X; G)与同调群的关系。其分裂短正合序列为？","options":["0→H^n(X)⊗G→H^n(X;G)→Tor(H_{n+1}(X),G)→0","0→Ext(H_{n-1}(X),G)→H^n(X;G)→Hom(H_n(X),G)→0","0→H_n(X)⊗G→H_n(X;G)→Tor(H_{n-1}(X),G)→0","0→Hom(H_n(X),G)→H^n(X;G)→Ext(H_{n-1}(X),G)→0"],"answer":1,"explanation":"万有系数定理：0→Ext(H_{n-1}(X), G)→H^n(X;G)→Hom(H_n(X),G)→0是分裂短正合序列（但不自然分裂）。这意味着上同调由同调+Ext项决定。当G=Z且H_{n-1}(X)无挠时，H^n(X;Z)≅Hom(H_n(X),Z)⊕Ext(H_{n-1}(X),Z)。","difficulty":"medium","chapter":"ch3","subject":"topo"},{"q":"Kunneth公式给出H^*(X×Y)与H^*(X)和H^*(Y)的关系。对于域系数，Kunneth公式的简化形式是什么？","options":["H^*(X×Y) ≅ H^*(X) ⊕ H^*(Y)","H^*(X×Y) ≅ H^*(X) ⊗ H^*(Y)（分次张量积）","H^*(X×Y) ≅ H^*(X) × H^*(Y)","H^*(X×Y) ≅ H^*(X) * H^*(Y)"],"answer":1,"explanation":"对于域系数，Kunneth公式简化为分次张量积同构：H^*(X×Y; k) ≅ H^*(X; k) ⊗_k H^*(Y; k)。对于整数系数，需加上Tor项。这是计算乘积空间上同调的基本工具。","difficulty":"medium","chapter":"ch3","subject":"topo"},{"q":"Poincaré对偶定理（定向情形）断言：对于n维紧致定向闭流形M，有什么同构？","options":["H^k(M) ≅ H_n(M)","H^k(M) ≅ H_{n-k}(M)","H^k(M) ≅ H^k(M)","H^k(M) ≅ H_{n+k}(M)"],"answer":1,"explanation":"Poincaré对偶：H^k(M) ≅ H_{n-k}(M)。这个同构由与基本类[M]的Cap积给出：D(α) = α⌢[M]。特别地，H^n(M) ≅ H_0(M) ≅ Z。这是流形拓扑中最深刻的定理之一。","difficulty":"hard","chapter":"ch3","subject":"topo"},{"q":"实射影平面RP²的上同调环H^*(RP²; Z₂)作为分次环的结构是什么？","options":["Z₂[x]/(x²) 其中|x|=1","Z₂[x]/(x³) 其中|x|=1","Z₂[x]/(x²) 其中|x|=2","Z₂[x] 其中|x|=1"],"answer":1,"explanation":"H^*(RP²; Z₂) ≅ Z₂[x]/(x³)，其中|x|=1。即H⁰=Z₂, H¹=Z₂（由x生成）, H²=Z₂（由x²生成）。x³=0因为RP²是2维的。这与S²的上同调环Z₂[x]/(x²)（|x|=2）不同，说明RP²和S²不同伦等价。","difficulty":"hard","chapter":"ch3","subject":"topo"},{"q":"复射影空间CPⁿ的上同调环H^*(CPⁿ; Z)是什么？","options":["Z[x]/(x^{n+1}) 其中|x|=2","Z[x]/(x^{n+1}) 其中|x|=1","Λ_Z(x) 其中|x|=1","Z[x,y]/(x²,y²)"],"answer":0,"explanation":"H^*(CPⁿ; Z) ≅ Z[x]/(x^{n+1})，其中|x|=2。即上同调群只在偶数维非零：H^{2k}(CPⁿ)≅Z（k=0,...,n）。生成元x是超平面类的对偶（或Fubini-Study度量的Kähler形式）。这是Hatcher §3.2的经典计算。","difficulty":"medium","chapter":"ch3","subject":"topo"},{"q":"S²∨S⁴（2维球面和4维球面粘合于一点）的上同调环H^*(S²∨S⁴; Z)是什么？","options":["Z[x]/(x²)⊗Z[y]/(y²)","Z[x,y]/(x²,y²,xy)","Z[x]/(x³)","Z[x,y]/(x²,y²)不含xy"],"answer":1,"explanation":"S²∨S⁴中，H²和H⁴分别由x和y生成。由于这两维来自不同球面，Cup积x⌣y=0（它们支撑在不交的子空间上）。此外x²=0（因为x⌣x∈H⁴但来自S²的H⁴为零），y²=0（因为y⌣y∈H⁸为零）。故环为Z[x,y]/(x²,y²,xy)，|x|=2,|y|=4。","difficulty":"hard","chapter":"ch3","subject":"topo"},{"q":"Cap积⌢: H_k(X) × H^l(X) → H_{k-l}(X)与Cup积的对偶关系是什么？","options":["⟨φ⌣ψ, σ⟩ = ⟨φ, σ⟩⟨ψ, σ⟩","⟨φ⌣ψ, σ⟩ = ⟨φ, σ|_{front}⟩·⟨ψ, σ|_{back}⟩","⟨φ, ψ⌢σ⟩ = ⟨φ⌣ψ, σ⟩","没有关系"],"answer":2,"explanation":"Cap积与Cup积满足对偶关系：⟨φ, ψ⌢σ⟩ = ⟨φ⌣ψ, σ⟩。在Poincaré对偶H^k(M)≅H_{n-k}(M)中，同构由α↦α⌢[M]给出（[M]是基本类）。这体现了Cap积和Cup积的紧密联系。","difficulty":"medium","chapter":"ch3","subject":"topo"},{"q":"万有系数定理中，Ext(H_{n-1}(X), Z)项何时为零？","options":["总是为零","当H_{n-1}(X)是自由交换群时","当H_{n-1}(X)是挠群时","当X是单连通时"],"answer":1,"explanation":"Ext(H, Z) = 0当且仅当H是自由交换群（没有挠元）。因为Ext(Z, Z)=0且Ext(Z_m, Z)=Z_m。当H_{n-1}(X)无挠时，H^n(X; Z)≅Hom(H_n(X), Z)，即上同调完全由同调决定。","difficulty":"medium","chapter":"ch3","subject":"topo"},{"q":"对于闭曲面M_g（亏格g的定向曲面），H¹(M_g; Z)的秩是多少？","options":["g","2g","1","0"],"answer":1,"explanation":"M_g中，H₁(M_g; Z)≅Z^{2g}（由2g个1维循环生成）。由万有系数定理，H¹(M_g; Z) ≅ Hom(H₁(M_g), Z) ⊕ Ext(H₀(M_g), Z) = Hom(Z^{2g}, Z) ⊕ 0 ≅ Z^{2g}。故秩为2g。由Poincaré对偶，H¹(M_g)≅H₁(M_g)。","difficulty":"medium","chapter":"ch3","subject":"topo"},{"q":"de Rham上同调H^*_{dR}(M)与奇异上同调H^*(M; R)的关系是什么？","options":["没有关系","de Rham定理：H^*_{dR}(M) ≅ H^*(M; R)（作为环同构）","H^*_{dR}(M) ≅ H^*(M; Z)","H^*_{dR}(M) ≅ H_*(M; R)"],"answer":1,"explanation":"de Rham定理：对光滑流形M，de Rham上同调（微分形式的上同调）与奇异上同调（实系数）存在环同构。Cup积对应微分形式的外积。这是联系分析与拓扑的桥梁，由de Rham在1931年证明。","difficulty":"medium","chapter":"ch3","subject":"topo"},{"q":"设X是道路连通空间。H⁰(X; G)等于什么？","options":["0","G","Hom(G, Z)","G⊕G"],"answer":1,"explanation":"H⁰(X; G) ≅ G（对于道路连通空间）。H⁰由在0维单形上取常数值的上链生成，上边缘条件自动满足。一般地，H⁰(X; G) ≅ G^{⊕c}，其中c是道路连通分支数。H⁰度量了「局部常值函数」的空间。","difficulty":"easy","chapter":"ch3","subject":"topo"},{"q":"高阶同伦群π_n(X)的定义中，元素是映射S^n→X的同伦类。与基本群π₁不同，π_n(X)（n≥2）总是？","options":["交换群","非交换群","自由群","有限群"],"answer":0,"explanation":"对n≥2，π_n(X)总是交换群。这是高阶同伦群与基本群最根本的区别。直观上，n≥2时有足够空间将两个映射「交换位置」。证明利用S^n上两个基点不动的同伦可交换。","difficulty":"easy","chapter":"ch4","subject":"topo"},{"q":"π_n(S^n)等于什么？","options":["Z","Z₂","0","Z × Z"],"answer":0,"explanation":"π_n(S^n) ≅ Z，由恒等映射的度数为1生成。Hurewicz定理的同态h: π_n(S^n)→H_n(S^n)≅Z是同构，因为S^n是(n-1)连通的。这是同伦群中最基本的计算，也是Hurewicz定理最直接的应用。","difficulty":"easy","chapter":"ch4","subject":"topo"},{"q":"Hopf纤维化S³→S²的纤维是S¹。由纤维化的长正合序列，π₂(S²)与π₂(S³)的关系是什么？","options":["π₂(S²) ≅ π₂(S³)","π₂(S²) ≅ π₁(S¹)","π₂(S²) ≅ π₂(S³) ⊕ π₂(S¹)","π₂(S²) ≅ π₃(S²)"],"answer":1,"explanation":"纤维化S¹→S³→S²的长正合序列：...→π₂(S¹)→π₂(S³)→π₂(S²)→π₁(S¹)→π₁(S³)→...。π₂(S¹)=0, π₁(S³)=0, π₁(S¹)=Z, π₂(S³)=0。由正合性0→π₂(S²)→Z→0，故π₂(S²)≅Z。这是计算π₂(S²)的经典方法。","difficulty":"easy","chapter":"ch4","subject":"topo"},{"q":"Whitehead定理的内容是：若f: X→Y是CW复形之间的连续映射，且f诱导所有同伦群的同构，则f是什么？","options":["同胚","同伦等价","覆叠映射","纤维化"],"answer":1,"explanation":"Whitehead定理：若CW复形间映射f: X→Y诱导所有同伦群同构f_*: π_n(X)≅π_n(Y)（对所有n），则f是同伦等价。这是同伦论的核心定理，表明同伦群完全刻画了CW复形的同伦型。","difficulty":"medium","chapter":"ch4","subject":"topo"},{"q":"Hurewicz定理断言：若X是(n-1)连通的（n≥2），则π_n(X)与H_n(X)的关系是什么？","options":["π_n(X) ≅ H_n(X)（Hurewicz同态是同构）","π_n(X) ≅ H_{n-1}(X)","π_n(X) ≅ H_{n+1}(X)","π_n(X) ≅ H_n(X) ⊕ Z"],"answer":0,"explanation":"Hurewicz定理：若X是(n-1)连通的（即π_i(X)=0对i<n），则Hurewicz同态h: π_n(X)→H_n(X)是同构（n≥2时）。特别地，第一个非平凡的同伦群与同调群同构。这是联系同伦论与同调论的基本定理。","difficulty":"medium","chapter":"ch4","subject":"topo"},{"q":"π₃(S²)等于什么？","options":["0","Z","Z₂","Z × Z"],"answer":1,"explanation":"π₃(S²) ≅ Z，由Hopf映射S³→S²生成。这是Hopf在1931年的著名发现：存在非平凡映射S³→S²（Hopf纤维化）。由纤维化S¹→S³→S²的长正合序列得π₃(S²)≅π₃(S³)≅Z。这是第一个k>n非平凡π_k(S^n)的例子。","difficulty":"medium","chapter":"ch4","subject":"topo"},{"q":"纤维化F→E→B的长正合同伦序列是什么？","options":["...→π_n(F)→π_n(E)→π_n(B)→π_{n-1}(F)→...","...→π_n(B)→π_n(E)→π_n(F)→π_{n-1}(B)→...","...→π_n(E)→π_n(F)→π_n(B)→π_{n-1}(E)→...","...→π_n(F)→π_n(B)→π_n(E)→π_{n-1}(F)→..."],"answer":0,"explanation":"纤维化F→E→B的长正合序列：...→π_n(F)→π_n(E)→π_n(B)→π_n(F)→...→π₀(F)→π₀(E)→π₀(B)。这是计算同伦群最强大的工具之一，通过已知空间的同伦群推导纤维和全空间的同伦群。","difficulty":"medium","chapter":"ch4","subject":"topo"},{"q":"π₄(S³)等于什么？","options":["Z","Z₂","0","Z × Z"],"answer":1,"explanation":"π₄(S³) ≅ Z₂。这是球面同伦群最早的「意外」结果之一。由Frenkel和Pontryagin独立计算。说明球面同伦群非常复杂，即使k=n+1时也不一定为Z。一般地，π_{n+1}(S^n) ≅ Z₂（n≥3）。","difficulty":"hard","chapter":"ch4","subject":"topo"},{"q":"Freudenthal悬挂定理（Freudenthal Suspension Theorem）断言：悬挂同态Σ: π_k(S^n)→π_{k+1}(S^{n+1})在什么条件下是同构？","options":["k ≤ 2n-2","k ≤ n","k = n","总是同构"],"answer":0,"explanation":"Freudenthal悬挂定理：悬挂同态Σ: π_k(S^n)→π_{k+1}(S^{n+1})在k ≤ 2n-2时是同构，在k = 2n-1时是满同态。这解释了为什么球面同伦群在稳定范围（k-n较小时）呈现规律性，产生了稳定同伦群的概念。","difficulty":"hard","chapter":"ch4","subject":"topo"},{"q":"Eilenberg-MacLane空间K(G,n)的定义特征是什么？","options":["π_k(K(G,n)) = G（k=n）且其他同伦群为零","H_k(K(G,n)) = G（k=n）且其他同调群为零","所有同伦群都是G","所有同调群都是G"],"answer":0,"explanation":"K(G,n)是满足π_n(K(G,n))≅G且π_k(K(G,n))=0（k≠n）的CW复形。例如K(Z,1)≃S¹, K(Z,2)≃CP^∞, K(Z₂,1)≃RP^∞。K(G,n)表示上同调：H^n(X;G)≅[X, K(G,n)]。","difficulty":"medium","chapter":"ch4","subject":"topo"},{"q":"Hurewicz定理的更一般形式：若X是(n-1)连通的，则Hurewicz同态h: π_k(X)→H_k(X)在什么范围内是满射/同构？","options":["对所有k","k≤n时同构，k=n+1时满射","仅k=n时同构","仅k=n+1时同构"],"answer":1,"explanation":"Hurewicz定理的完整形式：若X是(n-1)连通的，则h: π_k(X)→H_k(X)对k≤n是同构，对k=n+1是满射。这是连通性与Hurewicz同态关系的最完整表述，在计算具体同伦群时非常有用。","difficulty":"hard","chapter":"ch4","subject":"topo"},{"q":"设X是单连通CW复形，且H_k(X) = 0对所有k < n。由Hurewicz定理，以下哪个结论成立？","options":["π_k(X) = 0对所有k < n","π_n(X) ≅ H_n(X)","π_k(X) ≅ H_k(X)对所有k","π_n(X) = 0"],"answer":1,"explanation":"由相对Hurewicz定理，若X是单连通且H_k(X)=0对k<n，则π_k(X)=0对k<n，且π_n(X)≅H_n(X)（Hurewicz同态是同构）。这是一个经常使用的计算技巧：利用同调信息推导同伦群。","difficulty":"medium","chapter":"ch4","subject":"topo"},{"q":"Whitehead定理的另一种形式：若X,Y是单连通CW复形，且f: X→Y诱导同调同构，则f是什么？","options":["同胚","同伦等价","覆叠映射","纤维化"],"answer":1,"explanation":"Whitehead定理的同调版本：若X,Y是单连通CW复形，且f诱导同调同构f_*: H_n(X)≅H_n(Y)（对所有n），则f是同伦等价。这是通过Hurewicz定理和原始的Whitehead定理得到的。注意单连通条件不可忽略。","difficulty":"medium","chapter":"ch4","subject":"topo"},{"q":"Hopf不变量的定义：对映射f: S^{2n-1}→S^n，Hopf不变量H(f) ∈ Z。H(f)与什么结构有关？","options":["f的映射度","f的映射锥的上同调环结构","f的同伦群","f的同调群"],"answer":1,"explanation":"Hopf不变量H(f)由映射锥C_f = S^n ∪_f D^{2n}的上同调环决定：H^n(C_f)≅Z, H^{2n}(C_f)≅Z，生成元x²=H(f)·y。H(f)非零当且仅当f不零伦。Hopf映射S³→S²的H(f)=1，这是Hopf不变量的经典例子。","difficulty":"hard","chapter":"ch4","subject":"topo"},{"q":"设X是道路连通空间。π₁(X)的交换化（abelianization）与H₁(X)的关系是什么？","options":["π₁(X)_{ab} ≅ H₁(X)","π₁(X) ≅ H₁(X)","π₁(X)_{ab} ≅ H₁(X) ⊕ Z","π₁(X)_{ab} ≅ H₂(X)"],"answer":0,"explanation":"Hurewicz定理（n=1情形）：H₁(X) ≅ π₁(X)_{ab} = π₁(X)/[π₁(X),π₁(X)]。即一维同调群是基本群的交换化。例如8字形空间：π₁=Z*Z（非交换），H₁=Z⊕Z（交换化）。这是Hurewicz定理在n=1时的特殊形式。","difficulty":"easy","chapter":"ch4","subject":"topo"}];
const ALL_CHAPTERS = [{"id":"ch1","title":"什么是曲率？","en":"What Is Curvature?","desc":"引入曲率概念，回顾平面曲线和空间曲面的曲率，为黎曼几何提供直觉基础。","subject":"riemann","colorKey":"ch1"},{"id":"ch2","title":"黎曼度量","en":"Riemannian Metrics","desc":"定义黎曼度量、张量场、等距映射，建立流形上的几何结构。","subject":"riemann","colorKey":"ch2"},{"id":"ch3","title":"模型黎曼流形","en":"Model Riemannian Manifolds","desc":"研究欧氏空间、球面、双曲空间三种常曲率模型空间。","subject":"riemann","colorKey":"ch3"},{"id":"ch4","title":"联络","en":"Connections","desc":"引入仿射联络、Levi-Civita联络、协变导数，建立平行移动理论。","subject":"riemann","colorKey":"ch4"},{"id":"ch5","title":"测地线与距离","en":"Geodesics and Distance","desc":"测地线方程、指数映射、距离函数、完备性。","subject":"riemann","colorKey":"ch5"},{"id":"ch6","title":"曲率","en":"Curvature","desc":"曲率张量、截面曲率、Ricci曲率、标量曲率。","subject":"riemann","colorKey":"ch6"},{"id":"ch7","title":"黎曼子流形","en":"Riemannian Submanifolds","desc":"浸入与嵌入、第二基本形式、Gauss-Codazzi方程。","subject":"riemann","colorKey":"ch7"},{"id":"ch8","title":"Gauss-Bonnet定理","en":"The Gauss–Bonnet Theorem","desc":"局部与全局Gauss-Bonnet定理、Euler示性数、曲面分类。","subject":"riemann","colorKey":"ch8"},{"id":"ch9","title":"Jacobi场","en":"Jacobi Fields","desc":"Jacobi方程、共轭点、割点、测地线变分。","subject":"riemann","colorKey":"ch9"},{"id":"ch10","title":"比较定理","en":"Comparison Theorems","desc":"Rauch比较定理、Toponogov定理、体积比较、曲率下界控制。","subject":"riemann","colorKey":"ch10"},{"id":"ch1","title":"基本群与覆叠空间","en":"Fundamental Group and Covering Spaces","desc":"引入同伦、基本群、覆叠空间等核心概念，建立代数拓扑的基本语言。","subject":"topo","colorKey":"ch1_t"},{"id":"ch2","title":"同调论","en":"Homology","desc":"通过单纯形、链复形和正合序列研究空间的同调不变量，是可计算性最强的代数拓扑工具。","subject":"topo","colorKey":"ch2_t"},{"id":"ch3","title":"上同调论","en":"Cohomology","desc":"在同调的对偶视角下引入上链复形、Cup积和上同调环，揭示更丰富的代数结构。","subject":"topo","colorKey":"ch3_t"},{"id":"ch4","title":"同伦群","en":"Homotopy Groups","desc":"推广基本群到高维，引入高阶同伦群、纤维化以及Whitehead和Hurewicz定理。","subject":"topo","colorKey":"ch4_t"}];
const SUBJECTS = [{"id":"riemann","name":"黎曼几何","en":"Riemannian Geometry","shortName":"黎曼","color":"#2563eb","data":{"chapters":[{"id":"ch1","title":"什么是曲率？","en":"What Is Curvature?","desc":"引入曲率概念，回顾平面曲线和空间曲面的曲率，为黎曼几何提供直觉基础。"},{"id":"ch2","title":"黎曼度量","en":"Riemannian Metrics","desc":"定义黎曼度量、张量场、等距映射，建立流形上的几何结构。"},{"id":"ch3","title":"模型黎曼流形","en":"Model Riemannian Manifolds","desc":"研究欧氏空间、球面、双曲空间三种常曲率模型空间。"},{"id":"ch4","title":"联络","en":"Connections","desc":"引入仿射联络、Levi-Civita联络、协变导数，建立平行移动理论。"},{"id":"ch5","title":"测地线与距离","en":"Geodesics and Distance","desc":"测地线方程、指数映射、距离函数、完备性。"},{"id":"ch6","title":"曲率","en":"Curvature","desc":"曲率张量、截面曲率、Ricci曲率、标量曲率。"},{"id":"ch7","title":"黎曼子流形","en":"Riemannian Submanifolds","desc":"浸入与嵌入、第二基本形式、Gauss-Codazzi方程。"},{"id":"ch8","title":"Gauss-Bonnet定理","en":"The Gauss–Bonnet Theorem","desc":"局部与全局Gauss-Bonnet定理、Euler示性数、曲面分类。"},{"id":"ch9","title":"Jacobi场","en":"Jacobi Fields","desc":"Jacobi方程、共轭点、割点、测地线变分。"},{"id":"ch10","title":"比较定理","en":"Comparison Theorems","desc":"Rauch比较定理、Toponogov定理、体积比较、曲率下界控制。"}],"nodes":[{"id":"r1","label":"平面曲线曲率","chapter":"ch1","layer":0,"desc":"平面曲线的曲率度量曲线偏离直线的程度，由曲率半径的倒数给出，是曲率概念的最初等形式。","content":"平面曲线的曲率是微分几何中最基本的曲率概念。对于弧长参数化的平面曲线 γ(s)，曲率定义为 κ(s) = |γ''(s)|，即单位切向量沿曲线的旋转速率。对于一般参数化曲线，曲率公式为 κ = |γ' × γ''| / |γ'|³。曲率半径 R = 1/κ 表示在该点处最佳逼近圆的半径。曲率为正表示曲线向左侧弯曲，为负表示向右侧弯曲（在给定定向后）。Frenet标架 {T, N} 构成了曲线上的活动正交标架，满足 Frenet 方程 dT/ds = κN, dN/ds = -κT。曲率完全决定了平面曲线的形状（基本定理：曲率函数相同且相差刚体运动的曲线等价）。","understanding":"可以想象在弯曲的道路上开车：曲率大的地方需要急转弯，方向盘转得厉害；曲率小的地方接近直线，几乎不用转方向盘。曲率半径就是'等效转弯半径'——如果前方弯道是半径为50米的圆弧，曲率就是1/50=0.02。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"a1\" markerWidth=\"8\" markerHeight=\"6\" refX=\"8\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L8,3 L0,6 Z\" fill=\"#2563eb\"/></marker></defs><path d=\"M20,160 Q60,100 100,70 Q140,40 180,30\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.5\"/><path d=\"M100,70 Q120,130 140,155\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1.5\" stroke-dasharray=\"5,3\"/><circle cx=\"100\" cy=\"70\" r=\"3\" fill=\"#dc2626\"/><circle cx=\"125\" cy=\"112\" r=\"2\" fill=\"#dc2626\"/><text x=\"115\" y=\"50\" font-size=\"11\" fill=\"#2563eb\" font-family=\"serif\" font-style=\"italic\">κ = 1/R</text><text x=\"105\" y=\"140\" font-size=\"9\" fill=\"#dc2626\">R</text><line x1=\"100\" y1=\"70\" x2=\"125\" y2=\"112\" stroke=\"#dc2626\" stroke-width=\"1\"/></svg>","examples":[{"title":"圆的曲率","content":"半径为R的圆在每一点曲率恒为 1/R。这是最简单的等曲率曲线，也是研究曲率的基准。"},{"title":"抛物线的曲率","content":"抛物线 y=x² 在顶点 x=0 处曲率最大 κ=2，远离顶点时曲率趋近于0，反映抛物线'越远越平'的特性。"},{"title":"回旋曲线","content":"回旋曲线（Clothoid）的曲率随弧长线性增长，广泛用于公路铁路过渡段设计，使车辆平顺地从直线进入弯道。"}],"theorems":[{"name":"平面曲线基本定理","statement":"给定任意光滑函数 κ(s) > 0，存在唯一（差刚体运动）的平面曲线以 κ(s) 为其曲率函数。","proof":"通过解Frenet方程 dT/ds=κN, dN/ds=-κT 的常微分方程组，由Picard-Lindelof定理保证解的存在唯一性。给定初始位置和初始切向量，曲线由 γ(s)=γ(0)+∫₀ˢ T(u)du 确定。两条曲率相同的曲线可通过刚体运动使初始条件重合，从而唯一确定同一曲线。"}],"applications":"公路铁路设计中的缓和曲线使用回旋曲线保证曲率连续变化，避免车辆在直线与圆弧之间突然转向。数控加工中的刀具路径规划也需考虑曲率约束。","refs":{"book":"Lee","ch":"Ch.1","sec":"§1.1"}},{"id":"r2","label":"曲线的挠率","chapter":"ch1","layer":1,"desc":"空间曲线的挠率度量曲线偏离其密切平面的程度，与曲率一起构成Frenet-Serret方程的核心几何不变量。","content":"对于空间曲线，除了曲率还需要挠率 τ 来描述其完整几何。挠率定义为副法向量 B 沿弧长的变化率：τ = -N·B'。在Frenet-Serret标架 {T, N, B} 下，满足方程组 dT/ds = κN, dN/ds = -κT + τB, dB/ds = -τN。曲率描述曲线在密切平面内弯曲的速率，挠率描述密切平面绕切线旋转的速率。平面曲线的挠率恒为零。曲率和挠率函数共同决定了空间曲线的形状（差刚体运动）。","understanding":"想象一个螺旋楼梯：曲率是楼梯每步的'转弯程度'，挠率是楼梯'上升的速率'。如果挠率为零，楼梯就变成了平面上的一个圆弧，没有上升。挠率越大，盘旋上升得越快。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M30,100 C50,60 90,60 100,100 C110,140 150,140 170,100\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><path d=\"M30,100 C50,50 90,50 100,100 C110,150 150,150 170,100\" fill=\"none\" stroke=\"#7c3aed\" stroke-width=\"1.5\" stroke-dasharray=\"4,4\"/><text x=\"10\" y=\"50\" font-size=\"10\" fill=\"#2563eb\">T (切向)</text><text x=\"10\" y=\"70\" font-size=\"10\" fill=\"#7c3aed\">B (副法向)</text><text x=\"10\" y=\"90\" font-size=\"9\" fill=\"#dc2626\">τ = -N·B'</text><circle cx=\"100\" cy=\"100\" r=\"3\" fill=\"#dc2626\"/></svg>","examples":[{"title":"圆柱螺旋线","content":"螺旋线 r(t) = (cos t, sin t, at) 有常曲率 κ = 1/(1+a²) 和常挠率 τ = a/(1+a²)，是最简单的空间曲线。"},{"title":"DNA双螺旋","content":"DNA双螺旋结构的曲率和挠率决定了其超螺旋构型，影响基因表达调控。挠率的变化与拓扑异构酶活性相关。"}],"theorems":[{"name":"空间曲线基本定理","statement":"给定光滑函数 κ(s) > 0 和 τ(s)，存在唯一（差刚体运动）的空间曲线以 κ 和 τ 为其曲率和挠率。","proof":"通过解Frenet-Serret方程 dT/ds=κN, dN/ds=-κT+τB, dB/ds=-τN 的线性ODE组，由存在唯一性定理保证解。Frenet标架确定后，曲线由 γ(s)=γ(0)+∫₀ˢ T(u)du 恢复。初始位置和初始Frenet标架的选择对应刚体运动自由度，曲率κ和挠率τ是两个完整的几何不变量。"}],"applications":"DNA超螺旋结构的力学分析；机器人路径规划中末端执行器的姿态控制；电线电缆的缠绕和铺设设计。","refs":{"book":"Lee","ch":"Ch.1","sec":"§1.2"}},{"id":"r3","label":"曲面的Gauss曲率","chapter":"ch1","layer":0,"desc":"Gauss曲率是曲面最核心的内蕴曲率，定义为两个主曲率的乘积，决定了曲面局部几何的定性行为。","content":"对于R³中的曲面，在每一点沿法线方向可以定义形状算子（Weingarten映射），其特征值 κ₁, κ₂ 称为主曲率。Gauss曲率定义为 K = κ₁κ₂，平均曲率定义为 H = (κ₁+κ₂)/2。K > 0 的点是椭圆点（如球面），K < 0 的点是双曲点（如鞍面），K = 0 的点是抛物点或平点。Gauss的'绝妙定理'（Theorema Egregium）指出：Gauss曲率仅仅依赖于曲面的第一基本形式（度量），是曲面的内蕴不变量——这意味着曲面上的'二维居民'无需离开曲面就能检测到曲率。","understanding":"如果把一张纸弯曲成圆柱面，纸上的蚂蚁无法感知弯曲——因为圆柱面的Gauss曲率为零。但如果把纸捏成球面，蚂蚁就能通过测量三角形内角和是否大于180度来感知曲率。这就是Gauss绝妙定理的精髓：某些弯曲是内蕴的，某些只是外部的。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><ellipse cx=\"100\" cy=\"100\" rx=\"70\" ry=\"50\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><ellipse cx=\"100\" cy=\"100\" rx=\"50\" ry=\"30\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1\"/><ellipse cx=\"100\" cy=\"100\" rx=\"20\" ry=\"50\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1\"/><text x=\"130\" y=\"50\" font-size=\"10\" fill=\"#2563eb\">κ₁</text><text x=\"60\" y=\"55\" font-size=\"10\" fill=\"#dc2626\">κ₂</text><text x=\"70\" y=\"150\" font-size=\"11\" fill=\"#7c3aed\">K = κ₁κ₂</text><circle cx=\"100\" cy=\"100\" r=\"2.5\" fill=\"#7c3aed\"/></svg>","examples":[{"title":"球面","content":"半径为R的球面上每点主曲率均为 1/R，Gauss曲率恒为 K = 1/R² > 0，是常正曲率曲面的典型。"},{"title":"伪球面","content":"伪球面（tractroid）的Gauss曲率恒为 -1，是常负曲率曲面，黎曼之前就已发现其内蕴几何与双曲几何一致。"},{"title":"环面","content":"环面上外侧区域 K > 0（椭圆点），内侧区域 K < 0（双曲点），顶部和底部圆周上 K = 0，展示了曲率如何在曲面上变化。"}],"theorems":[{"name":"Gauss绝妙定理","statement":"Gauss曲率 K 仅由曲面的第一基本形式及其导数决定，是等距变换下的不变量。","proof":"Gauss通过直接计算发现：虽然K的定义涉及第二基本形式（外蕴量），但将Christoffel符号用度量张量及其导数表示后，曲率张量R^l_ijk完全由g_ij及其一阶、二阶导数决定。在二维情形，K = R^1_212/det(g)，因此K仅依赖于第一基本形式。这是历史上首次证明曲率可以是内蕴量。"}],"applications":"薄膜和壳体结构的力学分析中，Gauss曲率决定刚度；计算机图形学中网格曲面平滑和特征检测；地理信息系统中的地形曲率分析。","refs":{"book":"Lee","ch":"Ch.1","sec":"§1.3"}},{"id":"r4","label":"曲率的内蕴性","chapter":"ch1","layer":1,"desc":"内蕴曲率是仅依赖于流形自身度量结构而不依赖于外围嵌入方式的几何量，是黎曼几何的核心思想。","content":"曲率的内蕴性是黎曼几何区别于古典微分几何的根本特征。Gauss的绝妙定理首次揭示了曲率可以是内蕴的：曲面的Gauss曲率可以通过度量张量 g_ij 及其导数计算，不需要知道曲面在R³中的嵌入方式。这直接启发了黎曼在1854年就职演讲中提出的n维流形概念。内蕴曲率意味着：两个等距的黎曼流形具有相同的曲率性质，即便它们在外观上完全不同。例如，平面和圆柱面等距，因此内蕴曲率都为零。内蕴曲率的计算依赖于Christoffel符号和曲率张量，这些量完全由度量张量决定。","understanding":"在平面上画一个三角形，内角和恰好180度。把纸弯成圆柱面，三角形内角和还是180度——因为弯曲只是'外部'的。但如果把纸压成球面的一部分，三角形内角和就大于180度了——因为球面的曲率是'内蕴'的，改变了空间本身的几何。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"20\" y=\"30\" width=\"70\" height=\"70\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><polygon points=\"35,85 55,40 80,80\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"30\" y=\"115\" font-size=\"9\" fill=\"#2563eb\">平面 K=0</text><text x=\"38\" y=\"130\" font-size=\"8\" fill=\"#dc2626\">内角和=180°</text><path d=\"M130,30 Q150,30 155,50 Q160,70 155,90 Q150,110 130,110\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><path d=\"M130,30 Q110,30 105,50 Q100,70 105,90 Q110,110 130,110\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"100\" y=\"135\" font-size=\"9\" fill=\"#2563eb\">圆柱面 K=0</text><text x=\"108\" y=\"148\" font-size=\"8\" fill=\"#dc2626\">内角和=180°</text><text x=\"60\" y=\"165\" font-size=\"10\" fill=\"#7c3aed\" font-weight=\"bold\">等距 → 内蕴曲率相等</text></svg>","examples":[{"title":"平面与圆柱面","content":"平面和圆柱面是等距的。将平面
