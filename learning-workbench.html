\"#7c3aed\">S = tr(Ric) = 标量曲率</text></svg>","examples":[{"title":"球面Sⁿ","content":"半径为R的Sⁿ上，Ric = (n-1)/R² · g，S = n(n-1)/R²。是Einstein流形，Ricci曲率与度量成比例。"},{"title":"Einstein度量","content":"K3曲面上的Calabi-Yau度量是Ricci平坦的（Ric=0），但不平坦（R≠0），是Einstein流形的典型例子。"},{"title":"Schwarzschild时空","content":"Schwarzschild解是真空Einstein方程 Ric=0 的解，Ricci曲率为零但曲率张量非零（Weyl张量非零）。"}],"theorems":[{"name":"Schur引理","statement":"若连通黎曼流形(n≥3)在所有点的截面曲率仅依赖于点而不依赖于截面方向，则截面曲率是常数（流形是常曲率空间）。","proof":"设每点截面曲率K(p)不依赖于方向。则曲率张量满足 R(X,Y)Z = K(p)(⟨Y,Z⟩X - ⟨X,Z⟩Y)。对此式求协变导数，利用第二Bianchi恒等式和n≥3的条件，可得∇K = 0，即K是常数。证明关键在于：若n≥3，Bianchi恒等式给出足够多的方程迫使K的梯度为零。n=2时Schur引理不成立（任何二维流形自动满足截面曲率仅依赖于点）。"}],"applications":"Einstein场方程 Ric - (1/2)Sg = 8πGT 描述引力；宇宙学中FRW度量的Ricci曲率决定宇宙膨胀；Ricci流用于几何化猜想证明。","refs":{"book":"Lee","ch":"Ch.6","sec":"§6.3"},"subject":"riemann"},{"id":"r31","label":"Bianchi恒等式","chapter":"ch6","layer":1,"desc":"Bianchi恒等式是曲率张量的协变导数满足的微分恒等式，是Einstein场方程与守恒律联系的几何基础。","content":"第二Bianchi恒等式（或微分Bianchi恒等式）表达为 ∇_m R^l_ijk + ∇_i R^l_jmk + ∇_j R^l_mik = 0。缩并两次得到缩并的第二Bianchi恒等式：∇^j R_ij = (1/2)∇_i S，或等价地，Einstein张量 G_ij = R_ij - (1/2)S g_ij 满足 ∇^j G_ij = 0。这是几何版的'守恒律'，在广义相对论中对应能量-动量守恒 ∇^j T_ij = 0。第一Bianchi恒等式是代数的，第二Bianchi是微分的，两者都是曲率张量的基本性质。","understanding":"Bianchi恒等式就像是曲率的'自洽性条件'。它说曲率不能任意分布——曲率的变化必须满足某种约束。就像沙堆不能任意堆积（有自然的倾斜角限制），曲率也有'堆积规则'。在物理中，这对应着'能量和动量守恒'——曲率（引力）的分布必须满足守恒律。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"100,20 170,70 150,130 50,130 30,70\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><circle cx=\"100\" cy=\"75\" r=\"3\" fill=\"#dc2626\"/><line x1=\"100\" y1=\"75\" x2=\"120\" y2=\"55\" stroke=\"#dc2626\" stroke-width=\"1\"/><line x1=\"100\" y1=\"75\" x2=\"75\" y2=\"65\" stroke=\"#dc2626\" stroke-width=\"1\"/><line x1=\"100\" y1=\"75\" x2=\"105\" y2=\"100\" stroke=\"#dc2626\" stroke-width=\"1\"/><text x=\"125\" y=\"50\" font-size=\"8\" fill=\"#dc2626\">∇_mR</text><text x=\"40\" y=\"40\" font-size=\"9\" fill=\"#2563eb\">∇_{[m}R^l_{ij]k} = 0</text><text x=\"40\" y=\"55\" font-size=\"8\" fill=\"#7c3aed\">Bianchi → ∇^jG_{ij} = 0</text></svg>","examples":[{"title":"缩并Bianchi恒等式","content":"∇^jG_ij = 0 是Einstein场方程中 ∇^jT_ij = 0（能量-动量守恒）的几何对应，是场方程自洽性的保证。"},{"title":"Einstein流形","content":"Einstein流形（Ric = λg）自动满足缩并Bianchi恒等式，标量曲率S为常数（当n≥3）。"},{"title":"Yang-Mills理论","content":"Yang-Mills理论的Bianchi恒等式 d_A F = 0 是曲率2-形式F的微分恒等式，与黎曼几何的Bianchi恒等式结构类似。"}],"theorems":[{"name":"第二Bianchi恒等式","statement":"∇_m R^l_ijk + ∇_i R^l_jmk + ∇_j R^l_mik = 0。缩并得 ∇^j R_ij = (1/2)∇_i S。","proof":"对曲率张量定义取协变导数，利用无挠性和度量相容性交换导数顺序。在法坐标下（某点处Γ=0），∇_m R^l_ijk = ∂_m R^l_ijk，展开R^l_ijk的表达式后轮换求和，所有项抵消。缩并过程：对R^l_ijk取迹l=k得R_ij，再对第二Bianchi恒等式缩并l=k, j=m得 ∇_m R^m_i + ∇_i R^m_jm - ∇_m R^m_ij = 0，即 2∇^j R_ij = ∇_i S。"}],"applications":"广义相对论中能量-动量守恒的几何保证；规范场论中的Bianchi恒等式；Ricci流理论中的曲率演化方程。","refs":{"book":"Lee","ch":"Ch.6","sec":"§6.4"},"subject":"riemann"},{"id":"r32","label":"Weyl曲率张量","chapter":"ch6","layer":2,"desc":"Weyl曲率张量是曲率张量中去掉Ricci曲率信息后的'纯弯曲'部分，是共形变换下的不变量。","content":"Weyl曲率张量W（维数n≥3）定义为 W_ijkl = R_ijkl - (1/(n-2))(g_ik R_jl - g_il R_jk + g_jl R_ik - g_jk R_il) + (S/((n-1)(n-2)))(g_ik g_jl - g_il g_jk)。Weyl张量具有与曲率张量相同的代数对称性，且所有迹为零（W^i_jkl = 0）。Weyl张量是共形不变量：若 g' = e^{2f}g，则 W' = e^{2f}W。Weyl张量为零是度量共形平坦的充要条件（n≥4）。在二维，Weyl张量不定义（曲率只有Gauss曲率）。在三维，Weyl张量恒为零（曲率完全由Ricci曲率决定）。","understanding":"Weyl张量是曲率中去掉'膨胀'和'收缩'之后剩下的'纯扭曲'。Ricci曲率描述体积如何变化，Weyl曲率描述形状如何扭曲。在广义相对论中，真空区域Ricci=0但Weyl≠0，引力波就是Weyl曲率的传播。就像拉扯一块橡皮膜：Ricci曲率描述面积的缩放，Weyl曲率描述形状的畸变。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"30\" y=\"50\" width=\"60\" height=\"60\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"40\" y=\"70\" font-size=\"9\" fill=\"#dc2626\">Ricci</text><text x=\"35\" y=\"85\" font-size=\"8\" fill=\"#dc2626\">体积变化</text><polygon points=\"130,50 160,55 165,90 135,100\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"140\" y=\"70\" font-size=\"9\" fill=\"#2563eb\">Weyl</text><text x=\"135\" y=\"85\" font-size=\"8\" fill=\"#2563eb\">形状扭曲</text><text x=\"50\" y=\"130\" font-size=\"9\" fill=\"#7c3aed\">R = Ricci + Weyl + 标量</text><text x=\"45\" y=\"145\" font-size=\"8\" fill=\"#7c3aed\">Weyl在共形变换下不变</text></svg>","examples":[{"title":"共形平坦流形","content":"Sⁿ, Hⁿ, Rⁿ 都是共形平坦的（Weyl=0）。球面和双曲空间与欧氏空间共形等价。"},{"title":"Schwarzschild时空","content":"Schwarzschild解有Ricci=0（真空）但Weyl≠0，其Weyl张量描述潮汐力，即引力场中物体的拉伸和压缩。"},{"title":"二维的退化","content":"二维时Weyl张量无定义，所有曲率信息由Gauss曲率（标量曲率的一半）给出，反映二维几何的特殊性。"}],"theorems":[{"name":"Weyl共形不变性","statement":"在共形变换 g' = e^{2f}g 下，Weyl张量变换为 W' = e^{2f}W。W=0 是度量共形平坦的充要条件（n≥4）。","proof":"共形变换下Christoffel符号的变换包含∇f项：Γ'^k_ij = Γ^k_ij + δ^k_i ∂_j f + δ^k_j ∂_i f - g_ij g^{kl} ∂_l f。代入曲率张量公式，Ricci曲率和标量曲率都产生复杂的变换。Weyl精心构造了这些量的组合，使得变换中所有含f的项恰好抵消。n=3时Weyl张量恒为零（曲率完全由Ricci决定），n=2时Weyl张量不定义。"}],"applications":"广义相对论中引力波的描述（Weyl曲率传播）；共形几何中的不变量理论；宇宙学中原始引力波的分析。","refs":{"book":"Lee","ch":"Ch.6","sec":"§6.5"},"subject":"riemann"},{"id":"r33","label":"Ricci恒等式与交换子","chapter":"ch6","layer":1,"desc":"Ricci恒等式给出协变导数交换子与曲率张量的关系，是计算张量场二阶协变导数差异的基本工具。","content":"Ricci恒等式（或Ricci公式）给出张量场协变导数交换子的表达式。对于向量场：∇_i∇_j X^k - ∇_j∇_i X^k = R^k_lij X^l（符号约定因书而异）。对于1-形式：∇_i∇_j ω_k - ∇_j∇_i ω_k = -R^l_kij ω_l。对于一般张量，每个指标贡献一个曲率项。对于函数，协变导数交换子为零（∇_i∇_j f = ∇_j∇_i f）。Ricci恒等式在Bochner技巧、Weitzenböck公式和Hodge理论中起核心作用。","understanding":"Ricci恒等式说：你无法交换协变导数的顺序而不付出代价——这个代价就是曲率。在平坦空间中，你可以先对x求导再对y求导，或者反过来，结果一样。在弯曲空间中，交换顺序后会多出一个曲率项。这就像旋转一个向量：在平坦地面上，旋转顺序无所谓；在地球表面，先向东再向北旋转与先向北再向东旋转，结果不同。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M30,50 Q50,45 70,55 Q90,65 110,50\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><line x1=\"70\" y1=\"55\" x2=\"90\" y2=\"35\" stroke=\"#dc2626\" stroke-width=\"1.5\" marker-end=\"url(#ar3)\"/><line x1=\"70\" y1=\"55\" x2=\"50\" y2=\"40\" stroke=\"#dc2626\" stroke-width=\"1.5\" marker-end=\"url(#ar3)\"/><text x=\"75\" y=\"30\" font-size=\"9\" fill=\"#dc2626\">∇_j</text><text x=\"30\" y=\"35\" font-size=\"9\" fill=\"#dc2626\">∇_i</text><text x=\"25\" y=\"100\" font-size=\"9\" fill=\"#2563eb\">[∇_i,∇_j]X^k = R^k_{lij}X^l</text><text x=\"25\" y=\"115\" font-size=\"8\" fill=\"#7c3aed\">交换子 = 曲率</text><defs><marker id=\"ar3\" markerWidth=\"8\" markerHeight=\"6\" refX=\"8\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L8,3 L0,6 Z\" fill=\"#dc2626\"/></marker></defs></svg>","examples":[{"title":"向量场的Ricci恒等式","content":"∇_i∇_j X^k - ∇_j∇_i X^k = R^k_lij X^l。这是曲率张量作为协变导数交换子的经典定义。"},{"title":"Hessian的对称性","content":"对函数f，∇²f = ∇_i∇_j f 是对称的，因为函数没有指标可让曲率作用。"},{"title":"Bochner公式","content":"(1/2)Δ|∇f|² = |∇²f|² + ⟨∇f, ∇Δf⟩ + Ric(∇f,∇f)，是Bochner技巧的核心，联系了Laplace算子和Ricci曲率。"}],"theorems":[{"name":"Ricci恒等式","statement":"对于向量场X，∇_i∇_j X^k - ∇_j∇_i X^k = R^k_lij X^l。这是曲率张量的等价定义。","proof":"直接计算协变导数的交换子。∇_i X^k = ∂_i X^k + Γ^k_il X^l，再求∇_j得 ∇_j∇_i X^k = ∂_j(∂_i X^k + Γ^k_il X^l) + Γ^k_jm(∂_i X^m + Γ^m_il X^l) - Γ^m_ji(∂_m X^k + Γ^k_ml X^l)。交换i,j后相减，∂_j∂_i X^k项抵消，整理含Γ和∂Γ的项恰好给出曲率张量R^k_lij = ∂_i Γ^k_jl - ∂_j Γ^k_il + Γ^m_jl Γ^k_im - Γ^m_il Γ^k_jm。这证明曲率张量确实度量协变导数的不可交换性。"}],"applications":"Bochner技巧用于证明消没定理（如紧致Ricci正曲率流形上无调和1-形式）；Hodge理论中Laplace算子的Weitzenböck公式；几何分析中曲率与拓扑的关系。","refs":{"book":"Lee","ch":"Ch.6","sec":"§6.6"},"subject":"riemann"},{"id":"r34","label":"曲率与拓扑","chapter":"ch6","layer":3,"desc":"曲率条件对拓扑施加刚性约束，如正曲率导致基本群有限，负曲率导致万有覆盖可缩，是黎曼几何最深层的联系。","content":"曲率与拓扑的关系是黎曼几何的核心课题。Bonnet-Myers定理：若Ricci曲率满足 Ric ≥ (n-1)/R² · g，则流形紧致且直径 ≤ πR，基本群有限。Cartan-Hadamard定理：若截面曲率非正，则万有覆盖空间微分同胚于Rⁿ（因此同伦群 π_k(M)=0，k≥2）。Synge定理：若紧致可定向偶维流形截面曲率处处为正，则单连通。Cheeger-Gromoll分裂定理：若完备非紧致流形 Ric ≥ 0 且包含一条直线，则等距于乘积 R×N。Gromov紧致性定理：截面曲率有界、直径有界、体积有下界的流形集合在Gromov-Hausdorff拓扑下紧致。","understanding":"曲率像'拓扑的把手'。正曲率把流形'捏紧'——足够强的正曲率会迫使流形成为紧致球面的商空间。负曲率把流形'撑开'——使流形变得像双曲空间一样'辽阔'。这就像吹气球：正曲率把气球吹圆，负曲率使气球变成马鞍形。曲率条件就是'几何约束'，它决定了流形能'长成什么拓扑形状'。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"60\" cy=\"60\" r=\"35\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"50\" y=\"55\" font-size=\"10\" fill=\"#dc2626\">Ric>0</text><text x=\"38\" y=\"75\" font-size=\"8\" fill=\"#2563eb\">π₁有限</text><path d=\"M130,45 Q150,25 165,35 Q180,45 160,55 Q145,65 130,45Z\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"135\" y=\"50\" font-size=\"9\" fill=\"#dc2626\">K≤0</text><text x=\"135\" y=\"65\" font-size=\"8\" fill=\"#dc2626\">万有覆盖=Rⁿ</text><text x=\"40\" y=\"120\" font-size=\"9\" fill=\"#7c3aed\">曲率 → 拓扑刚性约束</text></svg>","examples":[{"title":"Bonnet-Myers定理","content":"若完备黎曼流形 Ric ≥ (n-1)c > 0，则直径 ≤ π/√c。球面 Sⁿ(1) 达到此上界，是刚性情形。"},{"title":"Cartan-Hadamard定理","content":"若完备单连通流形截面曲率 ≤ 0，则它微分同胚于 Rⁿ。双曲空间 Hⁿ 是典型例子。"},{"title":"Gromov的Betti数界","content":"若截面曲率有界 |K| ≤ 1 且直径 ≤ D，则所有Betti数有仅依赖于n和D的上界，是曲率控制拓扑的深刻结果。"}],"theorems":[{"name":"Bonnet-Myers定理","statement":"若完备黎曼流形 Ric ≥ (n-1)/R² · g，则直径 ≤ πR，且基本群有限。","proof":"设γ: [0,L] → M是长度L > πR的最短测地线。沿γ构造n-1个平行法向量场E_i(t)，定义变分向量场V_i(t) = sin(πt/L)E_i(t)。计算第二变分δ²E(V_i,V_i) = ∫₀^L (sin²(πt/L)|E_i'|² - sin²(πt/L)⟨R(E_i,γ')γ',E_i⟩) dt。对i求和，利用Ricci下界和|E_i'|=0得δ²E < 0，与γ是最短测地线矛盾。故L ≤ πR。万有覆盖的紧致性由类似论证得出。"}],"applications":"宇宙学中宇宙拓扑的推断（CMB数据约束宇宙曲率）；三维流形几何化纲领；微分几何中刚性定理。","refs":{"book":"Lee","ch":"Ch.6","sec":"§6.7"},"subject":"riemann"},{"id":"r35","label":"第二基本形式","chapter":"ch7","layer":0,"desc":"第二基本形式度量子流形在外围空间中的弯曲方式，是子流形几何的核心张量，与平均曲率向量密切相关。","content":"对于浸入子流形 M⊂N，切空间分解为 T_pN = T_pM ⊕ N_pM（法空间）。第二基本形式 II: TM×TM → NM 定义为 II(X,Y) = (∇^N_X Y)^⊥，即N中联络的协变导数在法方向上的投影。它是 C^∞-双线性的，且对称（因Levi-Civita联络无挠）。在局部坐标下，II_ij^α = h^α_ij。自身在法空间的取值使得余维数>1时第二基本形式包含更丰富的信息。平均曲率向量 H = (1/n)tr(II) 是第二基本形式的迹，极小曲面（H=0）是其最重要的特例。","understanding":"第二基本形式描述子流形如何'弯曲'嵌入外围空间。第一基本形式告诉你子流形上的'内部距离'，第二基本形式告诉你子流形'朝哪个方向弯曲'和'弯曲多少'。就像一张纸可以平放在桌上（II=0），也可以弯曲成柱面（II≠0）——但弯曲后纸上的内部距离保持不变（第一基本形式不变）。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M20,150 Q60,100 100,90 Q140,80 180,110\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.5\"/><line x1=\"100\" y1=\"90\" x2=\"130\" y2=\"55\" stroke=\"#dc2626\" stroke-width=\"1.5\" marker-end=\"url(#ar4)\"/><line x1=\"100\" y1=\"90\" x2=\"100\" y2=\"60\" stroke=\"#7c3aed\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/><text x=\"132\" y=\"50\" font-size=\"9\" fill=\"#dc2626\">X</text><text x=\"85\" y=\"55\" font-size=\"9\" fill=\"#7c3aed\">II(X,X)</text><text x=\"30\" y=\"40\" font-size=\"9\" fill=\"#2563eb\">II = (∇^N_X Y)^⊥</text><text x=\"30\" y=\"55\" font-size=\"8\" fill=\"#7c3aed\">法方向投影</text><defs><marker id=\"ar4\" markerWidth=\"8\" markerHeight=\"6\" refX=\"8\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L8,3 L0,6 Z\" fill=\"#dc2626\"/></marker></defs></svg>","examples":[{"title":"R³中的曲面","content":"R³中曲面M的第二基本形式 II = Ldu²+2Mdudv+Ndv²。主曲率是形状算子（Weingarten映射）的特征值。"},{"title":"超曲面","content":"余维数为1的超曲面，第二基本形式可写为 II = h·g，其中h是对称(0,2)-张量。平均曲率 H = (1/n)tr(h)。"},{"title":"全测地子流形","content":"若第二基本形式恒为零，子流形称为全测地子流形。球面Sⁿ中赤道Sⁿ⁻¹是全测地的，但一般的纬线不是。"}],"theorems":[{"name":"Gauss公式","statement":"∇^N_X Y = ∇^M_X Y + II(X,Y)，将N中联络分解为M中联络与第二基本形式之和。","proof":"将N中Levi-Civita联络∇^N_X Y分解为切向和法向分量：∇^N_X Y = (∇^N_X Y)^T + (∇^N_X Y)^⊥。切向分量满足Levi-Civita联络的公理（无挠、度量相容），故为M的Levi-Civita联络∇^M_X Y。法向分量定义为第二基本形式II(X,Y) = (∇^N_X Y)^⊥。对称性由∇^N的无挠性保证：II(X,Y) - II(Y,X) = (∇^N_X Y - ∇^N_Y X)^⊥ = [X,Y]^⊥ = 0（因X,Y切于M，其Lie括号也切于M）。"}],"applications":"极小曲面理论（如肥皂膜）；计算机图形学中曲面表示和重建；薄膜结构力学分析。","refs":{"book":"Lee","ch":"Ch.7","sec":"§7.1"},"subject":"riemann"},{"id":"r36","label":"Gauss方程","chapter":"ch7","layer":1,"desc":"Gauss方程将子流形的内蕴曲率与外蕴曲率（第二基本形式）联系起来，是子流形几何的核心公式。","content":"Gauss方程表达了子流形M的曲率张量R^M与外围空间N的曲率张量R^N及第二基本形式II的关系：⟨R^M(X,Y)Z,W⟩ = ⟨R^N(X,Y)Z,W⟩ + ⟨II(X,W), II(Y,Z)⟩ - ⟨II(X,Z), II(Y,W)⟩。对于超曲面在R³中，这退化为 Gauss 绝妙定理：K = det(II)/det(I) = (LN-M²)/(EG-F²)。Gauss方程揭示了子流形的内蕴曲率有两个来源：外围空间的曲率'拉回'和第二基本形式的'弯曲'贡献。对于欧氏空间中的子流形（R^N=0），曲率完全由第二基本形式决定。","understanding":"Gauss方程就像'曲率守恒定律'：子流形的总曲率 = 外围空间的曲率贡献 + 子流形自身弯曲的贡献。如果放在平坦空间中（像R³中的曲面），子流形所有的曲率都来自自身弯曲。这解释了为什么纸可以弯曲但Gauss曲率保持为零——第二基本形式变化时，有趣的是曲率张量保持为零。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M20,130 Q80,60 140,70 Q180,80 180,110\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"30\" y=\"50\" font-size=\"9\" fill=\"#2563eb\">R^M = R^N + II∧II</text><text x=\"30\" y=\"65\" font-size=\"8\" fill=\"#dc2626\">内蕴曲率 = 外围曲率 + 外蕴弯曲</text><text x=\"30\" y=\"80\" font-size=\"8\" fill=\"#7c3aed\">Gauss绝妙定理: K = det(II)/det(I)</text><circle cx=\"100\" cy=\"70\" r=\"2\" fill=\"#dc2626\"/></svg>","examples":[{"title":"R³中曲面","content":"R³中曲面的Gauss方程：K = (LN-M²)/(EG-F²)。Gauss发现这仅依赖于第一基本形式，是绝妙定理。"},{"title":"常曲率空间中的子流形","content":"在Sⁿ或Hⁿ中的子流形，Gauss方程包含外围常曲率贡献：K^M = c + det(II)/det(I)。"},{"title":"平坦子流形","content":"若Rⁿ中曲面的Gauss曲率为零，则第二基本形式必退化（det(II)=0），曲面是可展曲面。"}],"theorems":[{"name":"Gauss方程","statement":"⟨R^M(X,Y)Z,W⟩ = ⟨R^N(X,Y)Z,W⟩ + ⟨II(X,W),II(Y,Z)⟩ - ⟨II(X,Z),II(Y,W)⟩。","proof":"从Gauss公式∇^N_X Y = ∇^M_X Y + II(X,Y)出发，计算R^N(X,Y)Z = ∇^N_X∇^N_Y Z - ∇^N_Y∇^N_X Z - ∇^N_{[X,Y]} Z。将每个∇^N替换为∇^M + II，展开后取与W的内积。由于法向量与切向量正交，⟨II(·,·), W⟩ = 0，故交叉项消失。仅保留⟨R^M(X,Y)Z,W⟩和⟨II(X,W),II(Y,Z)⟩ - ⟨II(X,Z),II(Y,W)⟩两项。这是Gauss绝妙定理的高维推广。"}],"applications":"薄膜和壳体结构的力学分析；计算共形几何中的曲面分类；计算机视觉中从运动恢复结构。","refs":{"book":"Lee","ch":"Ch.7","sec":"§7.2"},"subject":"riemann"},{"id":"r37","label":"Codazzi方程","chapter":"ch7","layer":1,"desc":"Codazzi方程是第二基本形式协变导数的对称性条件，与Gauss方程一起构成子流形几何的基本方程。","content":"Codazzi方程（或Codazzi-Mainardi方程）表达了第二基本形式协变导数的对称性：∇^⊥_X II(Y,Z) - II(∇^M_X Y, Z) - II(Y, ∇^M_X Z) 关于X,Y对称。在局部坐标下，(∇_i h)_jk = (∇_j h)_ik。对于超曲面，这简化为 ∇_i h_jk = ∇_j h_ik。Codazzi方程与Gauss方程一起构成子流形理论的基本方程。两者是子流形存在性的可积性条件：给定满足Gauss-Codazzi方程的度量g和第二基本形式h，存在（局部唯一的）浸入实现它们。","understanding":"Codazzi方程说第二基本形式的变化是'协调的'——你不能随意指定第二基本形式在不同点的值，它的变化必须满足某种一致性。就像搭积木，每块积木的弯曲方式必须与相邻积木匹配，否则拼不起来。Gauss方程控制'水平'一致性，Codazzi方程控制'垂直'一致性。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M30,130 Q70,80 110,75 Q150,70 170,90\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><line x1=\"70\" y1=\"87\" x2=\"70\" y2=\"65\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><line x1=\"110\" y1=\"82\" x2=\"110\" y2=\"60\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"55\" y=\"60\" font-size=\"8\" fill=\"#dc2626\">II(X,Y)</text><text x=\"95\" y=\"55\" font-size=\"8\" fill=\"#dc2626\">II(Y,X)</text><text x=\"30\" y=\"45\" font-size=\"9\" fill=\"#2563eb\">∇_X(II(Y,Z)) = ∇_Y(II(X,Z))</text><text x=\"30\" y=\"60\" font-size=\"8\" fill=\"#7c3aed\">Codazzi: 法丛联络的对称性</text></svg>","examples":[{"title":"R³中曲面","content":"R³中曲面的Codazzi方程：L_v - M_u = LΓ¹_12 + M(Γ²_12-Γ¹_11) - NΓ²_11 等，以Christoffel符号表示。"},{"title":"常平均曲率曲面","content":"常平均曲率曲面（如肥皂膜）的Codazzi方程与Gauss方程一起构成可积系统，是CMC曲面理论的基础。"},{"title":"等距嵌入","content":"Nash等距嵌入定理保证了任何黎曼流形可等距嵌入到足够高维的欧氏空间中，Gauss-Codazzi方程是其局部可积性条件。"}],"theorems":[{"name":"Codazzi方程","statement":"(∇_X II)(Y,Z) = (∇_Y II)(X,Z)，即第二基本形式的协变导数在切向分量中对称。","proof":"从Gauss公式出发，计算R^N(X,Y)Z的法向分量。一方面，R^N(X,Y)Z = ∇^N_X(∇^M_Y Z + II(Y,Z)) - ∇^N_Y(∇^M_X Z + II(X,Z)) - (∇^M_{[X,Y]} Z + II([X,Y],Z))。取法向分量，利用∇^N的法向导数定义为法联络∇^⊥，得(R^N(X,Y)Z)^⊥ = ∇^⊥_X II(Y,Z) - II(∇^M_X Y, Z) - II(Y, ∇^M_X Z) - [X↔Y项] - II([X,Y],Z)。利用无挠性整理得Codazzi方程。"}],"applications":"弹性壳体理论中变形协调条件；Nash等距嵌入定理；计算共形几何中曲面匹配。","refs":{"book":"Lee","ch":"Ch.7","sec":"§7.3"},"subject":"riemann"},{"id":"r38","label":"极小曲面与CMC曲面","chapter":"ch7","layer":1,"desc":"极小曲面（H=0）和常平均曲率曲面（H=const）是子流形理论中最重要且研究最深入的曲面类。","content":"极小曲面是平均曲率恒为零的子流形，是面积泛函的临界点。面积泛函的第一变分给出 δArea = -∫⟨H, V⟩ dV，因此极小曲面是面积泛函的驻点。极小曲面在自然界中作为肥皂膜出现。极小曲面方程是非线性椭圆型偏微分方程。常平均曲率（CMC）曲面满足 H = const，是等周问题的解。球面是唯一紧致无边的CMC曲面（Alexandrov定理）。CMC曲面在物理中作为界面（如毛细管中的液面）出现。","understanding":"极小曲面就像绷在框架上的肥皂膜——它使自己面积最小。如果把一个线圈浸入肥皂水，拉出的膜就是极小曲面，因为表面张力使膜面积最小化。常平均曲率曲面就像肥皂泡——内部压力使膜向外鼓起，形成均匀的曲率。极小曲面是H=0的情况，肥皂泡是H=常数的情况。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M20,100 Q50,60 100,70 Q150,80 180,60\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><path d=\"M20,100 Q50,140 100,130 Q150,120 180,140\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><path d=\"M40,95 Q70,90 100,100 Q130,110 160,100\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><text x=\"85\" y=\"85\" font-size=\"9\" fill=\"#dc2626\">H=0</text><text x=\"40\" y=\"50\" font-size=\"9\" fill=\"#2563eb\">极小曲面</text><text x=\"40\" y=\"160\" font-size=\"8\" fill=\"#7c3aed\">δArea = 0 ⇔ H=0</text></svg>","examples":[{"title":"悬链面","content":"悬链面由悬链线绕轴旋转生成，是唯一的极小旋转曲面（除平面外），Gauss曲率处处为负。"},{"title":"螺旋面","content":"螺旋面是直纹极小曲面，与悬链面共形等价，在DNA分子结构和纳米材料中有应用。"},{"title":"球面","content":"球面是唯一紧致无边CMC曲面（Alexandrov定理），H=1/R，是等周问题（给定面积最大体积）的解。"}],"theorems":[{"name":"Alexandrov定理","statement":"R³中唯一紧致无边常平均曲率曲面是球面。","proof":"Alexandrov使用'反射法'（moving plane method）证明。设M是紧致无边CMC曲面。取任意方向，用垂直于该方向的平面族从远处推进，反射曲面的一部分。利用CMC条件和Hopf引理（椭圆方程的极值原理），证明M关于推进平面的反射必然与M重合，且M在每一步必须关于该平面对称。由于方向任意，M必须关于所有方向对称，故为球面。此方法后被推广到高维和更一般的曲率条件。"}],"applications":"肥皂膜和气泡的数学建模；张拉膜结构建筑设计；生物膜和细胞膜的几何分析；微重力环境下液体界面。","refs":{"book":"Lee","ch":"Ch.7","sec":"§7.4"},"subject":"riemann"},{"id":"r39","label":"子流形上的曲率与控制","chapter":"ch7","layer":2,"desc":"子流形的曲率受外围空间曲率约束，通过Gauss方程可将外围曲率条件转化为子流形的内蕴曲率条件。","content":"Gauss方程的一个直接推论是：若外围空间N的截面曲率有界 K_N ≤ c，则子流形M的截面曲率满足 K_M ≤ c + |II|²（粗略上界）。特别地，若N是欧氏空间（c=0），则 K_M ≤ |II|²。对于球面Sⁿ中的子流形，K_M ≤ 1 + |II|²。反之，若外围空间曲率有下界，子流形也有类似的下界估计。这些不等式在子流形的pinching问题和刚性定理中起关键作用。Lawson和Simons的著名结果：Sⁿ中不存在紧致极小子流形具有处处低余维数。","understanding":"子流形的曲率不能'太离谱'——它受外围空间的约束。就像在盒子里搭建弯曲的管道，管道的弯曲程度取决于盒子的尺寸和形状。在球面Sⁿ中，子流形的曲率被球面本身的正曲率'抬升'；在双曲空间中，子流形的曲率可能被'压低'。欧氏空间中的子流形曲率完全由自身弯曲（第二基本形式）决定。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"100\" cy=\"100\" r=\"70\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><path d=\"M60,60 Q80,80 90,100 Q100,120 120,140\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/><text x=\"30\" y=\"40\" font-size=\"9\" fill=\"#2563eb\">外围空间N</text><text x=\"30\" y=\"55\" font-size=\"9\" fill=\"#dc2626\">子流形M</text><text x=\"30\" y=\"70\" font-size=\"8\" fill=\"#7c3aed\">K_M ≤ K_N + |II|²</text><circle cx=\"90\" cy=\"100\" r=\"2\" fill=\"#dc2626\"/></svg>","examples":[{"title":"S³中的极小曲面","content":"S³中极小曲面（H=0）的Gauss曲率K≤1。Lawson构造了S³中任意亏格的紧致极小曲面。"},{"title":"球面中的极小子流形","content":"Sⁿ中极小子流形满足 Δx = -nx，其中x是位置向量。这是Simons研究Sⁿ中极小子流形刚性定理的出发点。"},{"title":"曲率pinching","content":"若Sⁿ中子流形截面曲率满足 K > (n-2)/(2n-3)，则子流形是全测地的（即球面的大球面）。"}],"theorems":[{"name":"Simons不等式","statement":"Sⁿ中极小子流形第二基本形式满足 Δ|II|² ≥ -2|II|² + 相关项，是极小子流形刚性理论的基础。","proof":"利用Bochner技巧，计算第二基本形式的Laplacian Δ|II|² = 2|∇II|² + 2⟨II, ΔII⟩。通过Codazzi方程和Gauss方程，将ΔII用曲率张量和II本身表示。在Sⁿ中，Ricci曲率为(n-1)，代入得Simons不等式：Δ|II|² ≥ -2|II|² + (2-1/p)|∇II|² + 低阶项（p为余维数）。当|II|²足够小时，不等式迫使|II|=0，即子流形是全测地的。这是Sⁿ中极小子流形刚性定理的核心。"}],"applications":"几何分析中极小子流形的正则性理论；球面中极小子流形的分类；广义相对论中膜世界（braneworld）模型。","refs":{"book":"Lee","ch":"Ch.7","sec":"§7.5"},"subject":"riemann"},{"id":"r40","label":"测地曲率与局部Gauss-Bonnet","chapter":"ch8","layer":0,"desc":"局部Gauss-Bonnet定理将曲面上区域的总曲率与边界测地曲率积分和角盈联系起来，是全局定理的基石。","content":"对于曲面M上由分段光滑测地线段围成的区域Ω，局部Gauss-Bonnet定理表述为：∫_Ω K dA + ∫_∂Ω κ_g ds + Σ(π-α_i) = 2πχ(Ω)，其中κ_g是边界曲线的测地曲率，α_i是顶点处的内角。对于测地三角形（边界为测地线，κ_g=0），简化为 ∫_Ω K dA = α₁+α₂+α₃ - π。这直接给出了球面三角形内角和>π，双曲三角形内角和<π。测地曲率度量曲线在曲面内偏离测地线的程度。","understanding":"局部Gauss-Bonnet定理是'三角形内角和定理'的弯曲空间版本。在平面上，三角形内角和是180度；在球面上，三角形内角和大于180度，多出的部分恰好等于三角形内Gauss曲率的积分；在双曲面上，内角和小于180度，缺少的部分等于曲率积分的绝对值。曲率就是'角度盈余'或'角度缺额'的密度。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"100,20 160,100 40,100\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"80\" y=\"80\" font-size=\"10\" fill=\"#dc2626\">α₁</text><text x=\"120\" y=\"80\" font-size=\"10\" fill=\"#dc2626\">α₂</text><text x=\"100\" y=\"40\" font-size=\"10\" fill=\"#dc2626\">α₃</text><text x=\"50\" y=\"130\" font-size=\"9\" fill=\"#2563eb\">∫K dA = Σα_i - π</text><text x=\"50\" y=\"145\" font-size=\"8\" fill=\"#7c3aed\">K>0 → 内角和>π</text></svg>","examples":[{"title":"球面三角形","content":"球面上由赤道和两条经线构成的三角形，面积为 πR²/2（1/8球面），内角和=3π/2，Gauss曲率积分=π/2。"},{"title":"测地三角形","content":"测地三角形（边界为测地线）满足 ∫K dA = Σα_i - π。在平面上，K=0，α₁+α₂+α₃=π。"},{"title":"区域上的Gauss-Bonnet","content":"球面上半径为θ的球冠，边界测地曲率 κ_g=cotθ/R，Gauss曲率积分与边界贡献之和满足局部Gauss-Bonnet。"}],"theorems":[{"name":"局部Gauss-Bonnet定理","statement":"∫_Ω K dA + ∫_∂Ω κ_g ds + Σ(π-α_i) = 2πχ(Ω)。","proof":"将区域Ω三角剖分。在每个三角形上，取正交活动标架{e₁,e₂}，联络1-形式ω¹₂满足dω¹₂ = -K dA。由Stokes定理，∫_Δ K dA = -∫_∂Δ ω¹₂。在每条边上，-∫_∂Δ ω¹₂ = ∫_∂Δ κ_g ds（测地曲率定义）。在顶点处，角度变化给出π-α_i的贡献。对所有三角形求和，内部边抵消，顶点处角度和给出2πχ(Ω)-Σα_i。整理即得局部Gauss-Bonnet公式。"}],"applications":"地理学中球面三角测量；导航中的大圆航法计算；CAD/CAM中自由曲面分析和加工路径规划。","refs":{"book":"Lee","ch":"Ch.8","sec":"§8.1"},"subject":"riemann"},{"id":"r41","label":"全局Gauss-Bonnet定理","chapter":"ch8","layer":0,"desc":"全局Gauss-Bonnet定理将闭曲面Gauss曲率积分与Euler示性数联系起来，是微分几何与拓扑学的里程碑。","content":"全局Gauss-Bonnet定理：对于紧致定向二维黎曼流形M（无边），∫_M K dA = 2πχ(M)。其中χ(M)是Euler示性数，χ(M) = 2-2g（g为亏格）。推论：球面（χ=2）总曲率4π，环面（χ=0）总曲率0，亏格≥2曲面总曲率负。对于带边曲面：∫_M K dA + ∫_∂M κ_g ds = 2πχ(M)。Gauss-Bonnet定理是Atiyah-Singer指标定理的雏形，将局部几何量（曲率）的积分与全局拓扑不变量（Euler示性数）联系起来。","understanding":"Gauss-Bonnet定理说，无论你怎样扭曲一个曲面，其Gauss曲率的积分永远不变，只取决于曲面的'洞数'（亏格）。球面没有洞，总曲率4π；甜甜圈有一个洞，总曲率0；两个洞的曲面（8字形），总曲率-4π。这就像工资总额：你可以重新分配，但总额不变——曲率可以从一处挪到另一处，但总曲率由拓扑决定。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"50\" cy=\"50\" r=\"25\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"42\" y=\"55\" font-size=\"10\" fill=\"#dc2626\">g=0</text><text x=\"30\" y=\"90\" font-size=\"9\" fill=\"#2563eb\">∫K=4π</text><ellipse cx=\"140\" cy=\"50\" rx=\"28\" ry=\"18\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><circle cx=\"140\" cy=\"50\" r=\"12\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"1\"/><text x=\"128\" y=\"55\" font-size=\"10\" fill=\"#dc2626\">g=1</text><text x=\"120\" y=\"90\" font-size=\"9\" fill=\"#2563eb\">∫K=0</text><path d=\"M60,135 Q75,125 85,135 Q95,145 110,135 Q125,125 140,135\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><path d=\"M85,135 Q80,120 70,125 Q60,130 75,145 Q90,155 100,145 Q110,135 105,125\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"100\" y=\"160\" font-size=\"9\" fill=\"#dc2626\">g=2</text><text x=\"100\" y=\"175\" font-size=\"8\" fill=\"#2563eb\">∫K=-4π</text></svg>","examples":[{"title":"球面S²","content":"S²: χ=2, ∫K dA = 4π。无论球面半径多大，总曲率不变。K=1/R²，面积=4πR²，乘积恒为4π。"},{"title":"环面T²","content":"环面: χ=0, ∫K dA = 0。外侧正曲率与内侧负曲率恰好抵消，总积分为零。"},{"title":"亏格2曲面","content":"双环面: χ=-2, ∫K dA = -4π。负总曲率是亏格≥2的闭曲面的特征。"}],"theorems":[{"name":"全局Gauss-Bonnet定理","statement":"对于紧致定向二维黎曼流形M（无边），∫_M K dA = 2πχ(M)。","proof":"将M三角剖分为测地三角形（∂M=∅，无边界项）。在每个三角形Δ_i上应用局部Gauss-Bonnet：∫_{Δ_i} K dA + Σ(π-α_ij) = 2π。对所有三角形求和：∫_M K dA + Σ_{所有顶点}(π-α) = 2πF。在每个顶点处，周围三角形内角之和为2π，故Σ(π-α) = πV - 2πV = -πV。又三角剖分满足3F = 2E。代入得∫_M K dA = 2πF - πV = 2πF - π(2E/3·3/2) = 2π(V-E+F) = 2πχ(M)。"}],"applications":"拓扑数据分析中曲率积分的拓扑推断；计算机图形学中网格亏格检测；理论物理中AdS/CFT对偶的拓扑约束。","refs":{"book":"Lee","ch":"Ch.8","sec":"§8.2"},"subject":"riemann"},{"id":"r42","label":"Euler示性数与曲面分类","chapter":"ch8","layer":1,"desc":"Euler示性数χ(M)是曲面最重要的拓扑不变量，通过Gauss-Bonnet定理与几何曲率联系，给出闭曲面的完全分类。","content":"Euler示性数χ(M)可通过三角剖分定义：χ = V - E + F（顶点数-边数+面数），与剖分无关。对于紧致定向曲面，χ = 2 - 2g，其中g是亏格。所有紧致定向曲面按亏格分类：S²(g=0, χ=2)，T²(g=1, χ=0)，Σ_g(g≥2, χ<0)。Gauss-Bonnet定理给出了曲率总和的拓扑约束。Chern将Gauss-Bonnet定理推广到高维（Chern-Gauss-Bonnet定理），用Pfaffian形式表示Euler类。Euler示性数还是Atiyah-Singer指标定理中Dirac算子指标的重要组成部分。","understanding":"Euler示性数就是'顶点-边+面'的计数，它不依赖于你如何剖分曲面。一个立方体的表面：8个顶点+6个面-12条边=2，和球面一样。任何能被'吹成球'的形状，Euler示性数都是2。每加一个洞（像甜甜圈），Euler示性数减2。所以Euler示性数就是'2减2倍洞数'。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"50,40 90,40 110,55 70,55\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1\"/><polygon points=\"50,40 70,55 70,85 50,70\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1\"/><polygon points=\"90,40 110,55 110,85 90,70\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1\"/><polygon points=\"50,70 70,85 90,70\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1\"/><polygon points=\"70,55 90,70 110,55 90,40\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1\"/><text x=\"120\" y=\"50\" font-size=\"9\" fill=\"#dc2626\">V=5</text><text x=\"120\" y=\"65\" font-size=\"9\" fill=\"#2563eb\">E=9</text><text x=\"120\" y=\"80\" font-size=\"9\" fill=\"#7c3aed\">F=6</text><text x=\"100\" y=\"120\" font-size=\"10\" fill=\"#dc2626\">χ = V-E+F = 2</text></svg>","examples":[{"title":"正多面体","content":"五种正多面体均满足χ=2（Euler公式）：正四面体(4-6+4=2)，立方体(8-12+6=2)，正八面体(6-12+8=2)等。"},{"title":"环面剖分","content":"环面可剖分为16个矩形，V=16, E=32, F=16，χ=0。任何剖分都给出χ=0。"},{"title":"Klein瓶","content":"Klein瓶（不可定向）χ=0。不可定向曲面χ=2-k，其中k为交叉帽数。Gauss-Bonnet需修正为包含定向覆盖。"}],"theorems":[{"name":"Chern-Gauss-Bonnet定理","statement":"对于紧致可定向偶维黎曼流形M²ⁿ，∫_M Pf(Ω) = (2π)^n χ(M)，其中Pf(Ω)是曲率形式的Pfaffian。","proof":"Chern的证明思路：在M的单位球丛SM上构造一个(2n-1)-形式Π，使得dΠ = π*Pf(Ω)（其中π: SM→M是投影）。这是通过曲率形式Ω在球丛上的'超渡'构造完成的。然后利用Stokes定理，∫_M Pf(Ω) = ∫_{SM} dΠ = ∫_{∂(SM)} Π。但∂(SM)的结构由M的拓扑决定，计算边界积分给出Euler示性数。核心是Chern发现Pfaffian恰有正确的微分性质。"}],"applications":"计算拓扑中网格的Euler示性数计算；分子生物学中蛋白质表面的拓扑分析；计算机图形学中网格简化和特征检测。","refs":{"book":"Lee","ch":"Ch.8","sec":"§8.3"},"subject":"riemann"},{"id":"r43","label":"高维Gauss-Bonnet-Chern定理","chapter":"ch8","layer":3,"desc":"Chern将Gauss-Bonnet定理推广到高维偶维流形，用曲率形式的Pfaffian表示Euler示性数，是20世纪几何学的里程碑。","content":"Chern-Gauss-Bonnet定理（1944年）：对于紧致可定向偶维黎曼流形M²ⁿ，∫_M Pf(Ω) = (2π)^n χ(M)。其中Ω是曲率2-形式，Pf(Ω)是Pfaffian多项式。Pfaffian是曲率形式的多项式，在二维退化为 K/(2π)，在四维为 (1/32π²)ε^{ijkl} R^ab_ij ∧ R^cd_kl。这一定理深刻揭示了局部微分几何与全局拓扑的关系，是陈省身最伟大的贡献之一。它也是Atiyah-Singer指标定理的特殊情形（Euler算子的指标）。在规范场论中，Chern-Weil理论将这一思想推广到任意向量丛。","understanding":"Chern的工作说：你不需要看到整个流形，只需要在流形上做曲率测量，把这些测量结果加起来，就能知道流形的'洞数'。这就像不用剥橘子就能通过表面纹理知道里面有几瓣。在二维，这很简单（Gauss-Bonnet）；在四维，需要用到曲率张量的复杂组合（Pfaffian）。Chern找到了这个'组合配方'。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"20\" y=\"40\" width=\"160\" height=\"120\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"50\" y=\"70\" font-size=\"10\" fill=\"#dc2626\">2n维流形 M</text><text x=\"45\" y=\"90\" font-size=\"9\" fill=\"#2563eb\">∫_M Pf(Ω) = (2π)^n χ(M)</text><text x=\"50\" y=\"110\" font-size=\"8\" fill=\"#7c3aed\">n=1: Gauss-Bonnet</text><text x=\"50\" y=\"125\" font-size=\"8\" fill=\"#7c3aed\">n=2: 4维Chern-Gauss-Bonnet</text><text x=\"50\" y=\"140\" font-size=\"8\" fill=\"#7c3aed\">一般: Atiyah-Singer指标定理</text></svg>","examples":[{"title":"二维退化","content":"n=1时，Pf(Ω) = K/(2π) * dA，Chern-Gauss-Bonnet退化为经典Gauss-Bonnet定理。"},{"title":"四维公式","content":"四维时 ∫_M (1/32π²)|W|² + ... = χ(M)，包含Weyl张量的贡献。引力瞬子的拓扑荷由此公式确定。"},{"title":"CP²的Euler示性数","content":"CP²配备Fubini-Study度量，χ(CP²)=3。Chern-Gauss-Bonnet公式给出曲率形式的积分等于3(2π)²。"}],"theorems":[{"name":"Chern-Gauss-Bonnet定理","statement":"对于紧致可定向偶维黎曼流形M²ⁿ，∫_M Pf(Ω) = (2π)^n χ(M)。","proof":"Chern（1944）的证明是微分几何的里程碑。核心构造：在球丛SM上定义超渡形式Π，使得其外微分恰好是Pfaffian的拉回。利用Stokes定理将M上的积分转化为球丛边界上的积分。球丛的Euler类与Euler示性数的关系由障碍理论保证。在二维，Pf(Ω) = K/(2π) dA，退化为经典Gauss-Bonnet。在四维，Pf(Ω) = (1/32π²)ε^{ijkl} R^ab_ij ∧ R^cd_kl，涉及曲率张量的二次型。"}],"applications":"引力理论中引力瞬子的拓扑荷计算；弦论中紧致化流形的选择；拓扑绝缘体中的拓扑不变量（TKNN不变量）。","refs":{"book":"Lee","ch":"Ch.8","sec":"§8.4"},"subject":"riemann"},{"id":"r44","label":"Jacobi方程与Jacobi场","chapter":"ch9","layer":0,"desc":"Jacobi场描述沿测地线的无穷小变分，满足Jacobi方程，是研究测地线稳定性和共轭点的核心工具。","content":"Jacobi场J(t)是沿测地线γ(t)的向量场，满足Jacobi方程：∇_γ'∇_γ' J + R(J, γ')γ' = 0。J(t)的几何意义是测地线变分 Γ(s,t) = exp_γ(t)(sJ(t)) 的变分向量场 ∂Γ/∂s|_{s=0}。Jacobi方程是二阶线性ODE，给定J(0)和J'(0)（其中J'(0)=∇_γ'J|_{t=0}）有唯一解。Jacobi场的维数为2n（由n维初始位置和n维初始速度决定）。垂直于γ'的Jacobi场称为法Jacobi场，维数为2(n-1)。Jacobi场是研究共轭点、割点和曲率对测地线行为影响的基本工具。","understanding":"Jacobi场描述了一簇测地线如何相互偏离。想象一群蚂蚁从同一点出发，沿不同但相近的大圆行走。Jacobi场描述了任意时刻蚂蚁之间的相对位置。如果蚂蚁们开始靠近（聚焦），说明曲率为正；如果蚂蚁们越来越远（发散），说明曲率为负。曲率就是通过Jacobi方程来控制测地线族的'会聚'或'发散'。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M30,150 Q50,100 70,80 Q90,60 120,50\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><path d=\"M25,148 Q45,95 65,75 Q85,55 115,45\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1\"/><path d=\"M35,152 Q55,105 75,85 Q95,65 125,55\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1\"/><line x1=\"70\" y1=\"80\" x2=\"65\" y2=\"75\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/><line x1=\"70\" y1=\"80\" x2=\"75\" y2=\"85\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/><text x=\"75\" y=\"72\" font-size=\"9\" fill=\"#7c3aed\">J(t)</text><text x=\"30\" y=\"40\" font-size=\"9\" fill=\"#2563eb\">∇_γ'∇_γ'J + R(J,γ')γ' = 0</text><text x=\"30\" y=\"55\" font-size=\"8\" fill=\"#dc2626\">测地线变分</text></svg>","examples":[{"title":"欧氏空间","content":"Rⁿ中曲率为零，Jacobi方程退化为 J''(t)=0，解为 J(t)=J(0)+tJ'(0)，Jacobi场线性增长。"},{"title":"球面Sⁿ","content":"Sⁿ(1)上，法Jacobi方程为 J''+J=0（因R(J,γ')γ'=J），解为 J(t)=sin(t)·A+cos(t)·B，呈周期振荡。"},{"title":"双曲空间Hⁿ","content":"Hⁿ(-1)上，法Jacobi方程为 J''-J=0，解为 J(t)=sinh(t)·A+cosh(t)·B，指数增长。"}],"theorems":[{"name":"Jacobi方程","statement":"沿测地线γ的Jacobi场J满足 ∇_γ'∇_γ' J + R(J, γ')γ' = 0。","proof":"设Γ(s,t)是测地线变分，Γ(0,t)=γ(t)，J(t)=∂Γ/∂s|_{s=0}。由测地线条件∇_t ∂Γ/∂t = 0，对s求导得∇_s∇_t ∂Γ/∂t = 0。利用无挠性交换协变导数：∇_s∇_t ∂Γ/∂t = ∇_t∇_s ∂Γ/∂t + R(∂Γ/∂s, ∂Γ/∂t)∂Γ/∂t。再次交换∇_t∇_s ∂Γ/∂t = ∇_t∇_t ∂Γ/∂s。在s=0处，∂Γ/∂t=γ'，∂Γ/∂s=J，得 ∇_γ'∇_γ' J + R(J,γ')γ' = 0。这是几何光学中'测地线偏离方程'的数学基础。"}],"applications":"天体力学中行星轨道稳定性分析；广义相对论中测地线偏离方程（潮汐力）；宇宙学中光锥的聚焦效应。","refs":{"book":"Lee","ch":"Ch.9","sec":"§9.1"},"subject":"riemann"},{"id":"r45","label":"共轭点","chapter":"ch9","layer":0,"desc":"共轭点是沿测地线存在非零Jacobi场在两端都为零的点对，是测地线最短性失效的前兆，与割点密切相关。","content":"点q = γ(b)称为p = γ(a)沿测地线γ的共轭点，如果存在非零Jacobi场J满足J(a)=J(b)=0。共轭点的重数等于满足此条件的线性无关Jacobi场的个数。共轭点的第一变分特征：b是p的共轭点当且仅当指数映射exp_p在bγ'(0)处有退化微分。共轭点总是出现在割点之前或同时：若γ(b)是p沿γ的第一个割点，则要么γ(b)是p的共轭点，要么有另一条同样长度的测地线连接p和γ(b)。共轭点的分布由曲率控制：正曲率产生共轭点，负曲率抑制共轭点。","understanding":"共轭点就像测地线的'焦点'。从一点出发的所有测地线在共轭点处'汇聚'。在球面上，北极的对径点（南极）是北极的共轭点——所有从北极出发的大圆都在南极汇聚。当多条测地线汇聚于同一点时，它们中至少有一条在越过该点后不再是最短路径。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"60\" cy=\"60\" r=\"3\" fill=\"#dc2626\"/><text x=\"50\" y=\"50\" fill=\"#dc2626\" font-size=\"9\">p</text><circle cx=\"140\" cy=\"100\" r=\"3\" fill=\"#7c3aed\"/><text x=\"145\" y=\"95\" fill=\"#7c3aed\" font-size=\"9\">q</text><path d=\"M60,60 Q80,70 100,80 Q120,90 140,100\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><path d=\"M60,60 Q90,80 110,90 Q130,95 140,100\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1\" stroke-dasharray=\"4,4\"/><path d=\"M60,60 Q70,90 90,100 Q110,105 140,100\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1\" stroke-dasharray=\"4,4\"/><text x=\"90\" y=\"65\" font-size=\"8\" fill=\"#7c3aed\">J(0)=0</text><text x=\"130\" y=\"85\" font-size=\"8\" fill=\"#7c3aed\">J(b)=0</text></svg>","examples":[{"title":"球面Sⁿ","content":"Sⁿ(1)上，从p出发的测地线在距离π处到达对径点-p，这是p的共轭点。第一个共轭点出现在距离π处。"},{"title":"欧氏空间","content":"Rⁿ中不存在共轭点。所有测地线（直线）永不相交，Jacobi场J(t)=J(0)+tJ'(0)只在t=0时为零。"},{"title":"平坦环面T²","content":"T²上虽无共轭点（曲率为零），但存在割点（因多条等长测地线连接同两点），展示共轭点与割点的区别。"}],"theorems":[{"name":"共轭点定理","statement":"若γ(b)是γ(a)的第一个共轭点，则γ在[a,b]上最短，但在[a,b+ε]上不再最短（ε>0）。","proof":"若γ(b)是γ(a)的第一个共轭点，则存在非零Jacobi场J满足J(a)=J(b)=0。将J扩展为沿γ的变分场（在[a,b]上为零，在b之后非零）。计算第二变分：在[a,b]上δ²E(J,J)=0（因为J是Jacobi场且满足边界条件），在[b,b+ε]上可构造使δ²E<0的变分。因此存在从γ(a)到γ(b+ε)的比γ更短的曲线。这证明了第一个共轭点之后测地线不再是最短的。"}],"applications":"最优控制理论中轨迹的共轭点检测；航天器轨道优化；光学中焦散线和聚焦现象。","refs":{"book":"Lee","ch":"Ch.9","sec":"§9.2"},"subject":"riemann"},{"id":"r46","label":"第二变分公式","chapter":"ch9","layer":1,"desc":"第二变分公式给出能量泛函的二阶导数，用Jacobi场和曲率表达，是判断测地线稳定性的基本工具。","content":"能量泛函E(γ)在测地线处的第二变分公式为：δ²E(V,W) = ∫⟨∇_γ'V, ∇_γ'W⟩ - ⟨R(V,γ')γ', W⟩ dt（对分段光滑变分场V,W）。当V=W为法Jacobi场时，δ²E(V,V) = -∫⟨V, ∇_γ'∇_γ'V + R(V,γ')γ'⟩ dt + 边界项。如果测地线γ上存在共轭点，则存在变分场使第二变分为负，即γ不是极小值。Morse指标定理：测地线上共轭点（计重数）的个数等于第二变分负特征值的个数（Morse指标）。这建立了变分理论与Jacobi场理论的桥梁。","understanding":"第二变分公式就像'二阶导数测试'。对于函数，二阶导数为正意味着极小值。对于测地线，第二变分公式告诉你路径的长度是否真的是极小值。如果存在一个'扰动方向'使得长度减小（第二变分为负），那么这条测地线就不是最短路径。共轭点就是这种'扰动方向'存在的标志。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M30,30 Q100,50 170,150\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"100\" y=\"45\" font-size=\"9\" fill=\"#2563eb\">γ (测地线)</text><path d=\"M30,30 Q70,70 100,100 Q140,135 170,150\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1\" stroke-dasharray=\"4,4\"/><text x=\"75\" y=\"80\" font-size=\"8\" fill=\"#dc2626\">γ+εV</text><text x=\"25\" y=\"170\" font-size=\"9\" fill=\"#7c3aed\">δ²E(V,V) = ∫|∇V|² - ⟨R(V,γ')γ',V⟩</text></svg>","examples":[{"title":"球面上的大圆","content":"S²上长度小于π的大圆弧是极小值，第二变分正定。长度等于π的大圆弧（半圆）有零特征值（共轭点）。"},{"title":"Morse指标定理","content":"Morse指标定理：能量泛函在测地线上的Morse指标等于共轭点的个数（计重数），将变分理论与Jacobi场理论联系起来。"},{"title":"极小曲面的第二变分","content":"极小曲面的第二变分公式涉及Jacobi算子 Δ + |II|² + Ric(ν,ν)，是研究极小曲面稳定性的基础。"}],"theorems":[{"name":"第二变分公式","statement":"δ²E(V,V) = ∫_a^b (|∇_γ'V|² - ⟨R(V,γ')γ',V⟩) dt。若γ上存在共轭点，则存在V使δ²E(V,V)<0。","proof":"考虑能量泛函E(γ_s)对变分参数s的二阶导数。设Γ(s,t)为变分，V(t)=∂Γ/∂s|_{s=0}。计算d²E/ds²|_{s=0} = ∫(⟨∇_s∂Γ/∂t, ∇_s∂Γ/∂t⟩ + ⟨∂Γ/∂t, ∇_s∇_s∂Γ/∂t⟩) dt|_{s=0}。利用无挠性交换导数，∇_s∂Γ/∂t = ∇_t V，∇_s∇_s∂Γ/∂t = ∇_t∇_s V + R(V,γ')V。代入得δ²E = ∫(|∇_γ'V|² - ⟨R(V,γ')γ',V⟩) dt + 边界项。若存在共轭点，取对应Jacobi场为零边界条件的变分，得δ²E=0。"}],"applications":"Morse理论在测地线问题中的应用；极小曲面稳定性分析；结构力学中屈曲分析（失稳路径）。","refs":{"book":"Lee","ch":"Ch.9","sec":"§9.3"},"subject":"riemann"},{"id":"r47","label":"测地线变分与Morse理论","chapter":"ch9","layer":2,"desc":"Morse理论将能量泛函的临界点拓扑与流形本身的拓扑联系起来，Jacobi场和共轭点提供了Morse指标的计算工具。","content":"Morse理论在黎曼几何中的应用是研究路径空间Ω(M;p,q)的拓扑。能量泛函E: Ω→R的临界点是测地线，Morse指标（第二变分负特征值个数）等于沿测地线的共轭点个数。Morse不等式给出：临界点个数 ≥ Betti数之和。特别地，若M的拓扑非平凡，则必存在连接p,q的测地线。对于闭测地线，Lyusternik-Fet定理保证任何紧致流形上存在闭测地线。Bott的等变Morse理论将这一结果推广到带对称性的情形。Morse理论是连接分析与拓扑的桥梁。","understanding":"Morse理论就像'地形分析'：能量泛函是'地形高度'，测地线是'山顶'、'山谷'或'鞍点'（临界点）。每个临界点有一个'指标'（向下方向的数量），通过数地形图上各类临界点的个数，可以推断地形的'洞数'（Betti数）。这就像看地形图推断地下结构——不需要挖掘就能知道。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M30,150 Q60,100 100,90 Q140,80 170,110\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"60\" cy=\"100\" r=\"3\" fill=\"#dc2626\"/><text x=\"50\" y=\"95\" font-size=\"8\" fill=\"#dc2626\">临界点</text><circle cx=\"140\" cy=\"80\" r=\"3\" fill=\"#dc2626\"/><text x=\"130\" y=\"90\" font-size=\"8\" fill=\"#dc2626\">临界点</text><text x=\"30\" y=\"50\" font-size=\"9\" fill=\"#2563eb\">E: Ω → R</text><text x=\"30\" y=\"65\" font-size=\"8\" fill=\"#7c3aed\">Morse指标 = 共轭点数</text><text x=\"30\" y=\"80\" font-size=\"8\" fill=\"#dc2626\">临界点数 ≥ Σβ_i</text></svg>","examples":[{"title":"球面Sⁿ上的测地线","content":"Sⁿ上连接对径点的测地线有无穷多条（所有大圆），Morse理论解释了为什么临界点有如此高的退化性。"},{"title":"Lie群上的闭测地线","content":"紧致Lie群上，单参数子群是闭测地线。Morse理论可以估计闭测地线的数量和分布。"},{"title":"Bott周期定理","content":"Bott将Morse理论应用于Loop空间Ω(Sⁿ)，得到了稳定同伦群的Bott周期性定理。"}],"theorems":[{"name":"Morse指标定理","statement":"能量泛函在测地线上的Morse指标等于沿该测地线的共轭点个数（计重数）。","proof":"Morse指标是第二变分δ²E的负特征值个数。将第二变分写为∫⟨LV,V⟩ dt，其中L = -∇_γ'² - R(·,γ')γ'是Jacobi算子。L的特征值问题等价于Sturm-Liouville问题。由Sturm比较定理，特征值变号恰好发生在Jacobi场有零点时，即共轭点处。每个共轭点贡献一个负特征值（重数由共轭点的重数决定）。因此Morse指标 = 共轭点个数（计重数）。这是Morse理论在变分法中的核心结论。"}],"applications":"Morse同调与Floer同调理论；拓扑数据分析中的Morse-Smale复形；量子力学中路径积分的半经典近似。","refs":{"book":"Lee","ch":"Ch.9","sec":"§9.4"},"subject":"riemann"},{"id":"r48","label":"Rauch比较定理","chapter":"ch10","layer":0,"desc":"Rauch比较定理比较曲率有上下界的流形中Jacobi场的增长，是曲率下界控制几何行为的核心工具。","content":"Rauch比较定理：设M和M~是完备黎曼流形，截面曲率满足 K ≥ K~。沿测地线γ和γ~，给定初始条件相同的Jacobi场J和J~，若γ上无共轭点，则 |J(t)| ≤ |J~(t)|。等价地，正曲率使Jacobi场增长变慢（或振荡），负曲率使Jacobi场增长变快。Rauch定理是几乎所有比较定理（体积比较、距离比较、Toponogov定理）的基石。其证明基于第二变分公式和指标形式。Rauch定理的关键应用是证明球面定理：若截面曲率介于1/4和1之间，则流形同胚于球面。","understanding":"Rauch定理说：曲率越大，空间越'紧'，Jacobi场（测地线的偏离）增长越慢。在球面上（正曲率），Jacobi场振荡，从北极出发的测地线先发散后汇聚；在双曲空间（负曲率），Jacobi场指数增长，测地线永远发散。曲率就像一个'弹簧'——正曲率是拉力，负曲率是推力。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M30,150 Q40,120 50,100 Q60,80 70,70\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/><text x=\"35\" y=\"140\" font-size=\"8\" fill=\"#dc2626\">K小</text><path d=\"M30,150 Q35,110 40,90 Q45,70 50,60\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"15\" y=\"140\" font-size=\"8\" fill=\"#2563eb\">K大</text><text x=\"30\" y=\"50\" font-size=\"9\" fill=\"#7c3aed\">|J(t)| ≤ |J~(t)|</text><text x=\"30\" y=\"65\" font-size=\"8\" fill=\"#dc2626\">当 K ≥ K~</text><text x=\"30\" y=\"80\" font-size=\"8\" fill=\"#2563eb\">正曲率→Jacobi场增长慢</text></svg>","examples":[{"title":"球面vs欧氏空间","content":"Sⁿ(1)上Jacobi场满足J''+J=0，|J(t)|≤|J(0)|cos t+|J'(0)|sin t。Rⁿ上J''=0，|J(t)|=|J(0)+tJ'(0)|线性增长。"},{"title":"双曲空间vs欧氏空间","content":"Hⁿ(-1)上J''-J=0，|J(t)|指数增长。Rauch定理给出：负曲率空间中Jacobi场增长快于欧氏空间。"},{"title":"球面定理","content":"若截面曲率 1/4 < K ≤ 1，则流形同胚于Sⁿ。上界1防止过大的曲率，下界1/4由Rauch定理和共轭点比较得出。"}],"theorems":[{"name":"Rauch比较定理","statement":"若 K_M ≥ K_M~，则沿等长测地线且相同初始条件的Jacobi场满足 |J(t)| ≤ |J~(t)|（在无共轭点区间）。","proof":"考虑函数f(t) = |J(t)|²/|J~(t)|²。计算f'(t)并利用Jacobi方程。关键步骤：定义指标形式I_t(J,J) = ∫_0^t (|∇J|² - ⟨R(J,γ')γ',J⟩) ds。由曲率条件K_M ≥ K_M~，有I_t(J,J) ≤ I_t(J~,J~)。然后利用指标形式的性质，比较J和J~的增长率。通过分析f(t)的导数并用曲率不等式，可证f(t) ≤ 1，即|J(t)| ≤ |J~(t)|。这是所有比较定理的基石。"}],"applications":"球面定理和刚性定理；广义相对论中奇点定理（如Hawking-Penrose定理）；Gromov-Hausdorff收敛理论。","refs":{"book":"Lee","ch":"Ch.10","sec":"§10.1"},"subject":"riemann"},{"id":"r49","label":"Toponogov定理","chapter":"ch10","layer":1,"desc":"Toponogov定理将截面曲率下界与测地三角形的边长和角度关系联系起来，是理解曲率几何效应的几何化工具。","content":"Toponogov定理：设M是完备黎曼流形，截面曲率满足 K ≥ c。以测地线段为边的三角形，其边长满足与常曲率c空间中的比较三角形（Alexandrov三角形）相同的边长-角度不等式。具体地，若M中三角形边长a,b,c与常曲率c空间中三角形边长相同，则M中对应边所对的角度不小于常曲率空间中的对应角度。换言之，曲率下界决定了三角形'张开'的程度。Toponogov定理是Rauch定理的全局化，也是研究曲率有下界的度量空间（Alexandrov空间）的出发点。","understanding":"Toponogov定理说：曲率越大的空间，三角形越'胖'（内角越大）。在球面上（正曲率），三角形内角和大于180度；在欧氏空间中等于180度；在双曲空间中小于180度。如果你知道一个空间的最小曲率，你就能知道三角形最多能有多'瘦'。这就像知道了地面的'隆起程度'，就能推断道路的最短路径。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"100,30 160,120 40,120\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"90\" y=\"100\" font-size=\"9\" fill=\"#dc2626\">α</text><text x=\"120\" y=\"100\" font-size=\"9\" fill=\"#dc2626\">β</text><text x=\"100\" y=\"50\" font-size=\"9\" fill=\"#dc2626\">γ</text><polygon points=\"100,55 140,115 60,115\" fill=\"none\" stroke=\"#7c3aed\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><text x=\"80\" y=\"140\" font-size=\"9\" fill=\"#2563eb\">K≥c → α≥α_c</text><text x=\"80\" y=\"155\" font-size=\"8\" fill=\"#7c3aed\">比较三角形</text></svg>","examples":[{"title":"球面定理的应用","content":"Toponogov定理是证明球面定理的关键工具：曲率在1/4和1之间的流形，其三角形角度与球面三角形比较，可推出直径上界。"},{"title":"Alexandrov空间","content":"Toponogov定理启发了Alexandrov空间的定义：度量空间满足'三角形内角≥比较三角形内角'，推广了曲率下界概念。"},{"title":"分裂定理","content":"Cheeger-Gromoll分裂定理的证明依赖于Toponogov定理：若Ric≥0且存在直线，则流形分裂为R×N。"}],"theorems":[{"name":"Toponogov定理","statement":"若截面曲率 K ≥ c，则对任意测地三角形，其顶角不小于常曲率c空间中同边长三角形的对应角。","proof":"Toponogov的证明是Rauch定理的全局化应用。给定测地三角形Δ(p,q,r)，考虑测地线γ连接p到q。在常曲率c空间中构造比较三角形Δ~(p~,q~,r~)（边长相同）。沿γ构造Jacobi场J，比较|J|与|J~|。Rauch定理给出|J(t)| ≤ |J~(t)|。然后利用铰链构造（hinge construction），将角度比较转化为长度比较，再由余弦定理得出角度不等式。这是从局部曲率比较到全局几何比较的关键步骤。"}],"applications":"Alexandrov几何的度量空间理论；Perelman对Poincaré猜想的证明；Gromov-Hausdorff收敛中的极限空间分析。","refs":{"book":"Lee","ch":"Ch.10","sec":"§10.2"},"subject":"riemann"},{"id":"r50","label":"体积比较定理","chapter":"ch10","layer":1,"desc":"Bishop-Gromov体积比较定理给出曲率有下界的流形中测地球体积的上界，是黎曼几何最基本的比较定理之一。","content":"Bishop-Gromov体积比较定理：若完备黎曼流形M满足 Ric ≥ (n-1)c·g，则对任意p∈M，比值 Vol(B(p,r)) / V_c(r) 随r单调非增，且 ≤ 1。其中V_c(r)是常曲率c空间中半径为r的球的体积。特别地，Vol(B(p,r)) ≤ V_c(r)。当c=0时，Vol(B(p,r)) ≤ ω_n r^n（欧氏体积）。当c>0时，Bonnet-Myers定理给出直径上界。Gromov的紧致性定理直接依赖于体积比较：截面曲率有界、直径有界、体积有下界的流形集合在Gromov-Hausdorff拓扑下紧致。体积比较还是研究Ricci曲率下界空间的基础。","understanding":"体积比较定理说：曲率限制了空间能'装下'多少体积。在正曲率空间中，球的体积小于欧氏空间中同半径球的体积（因为空间被'捏紧'了）。在负曲率空间中，球的体积可以远远大于欧氏空间（因为空间被'撑开'了）。这个定理是理解宇宙大小和形状的基本工具：如果宇宙的平均曲率为正，它的总体积是有限的。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"60\" cy=\"60\" r=\"30\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/><text x=\"30\" y=\"50\" font-size=\"8\" fill=\"#dc2626\">K>0</text><text x=\"30\" y=\"65\" font-size=\"8\" fill=\"#dc2626\">体积小</text><circle cx=\"140\" cy=\"60\" r=\"45\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"125\" y=\"50\" font-size=\"8\" fill=\"#2563eb\">K<0</text><text x=\"125\" y=\"65\" font-size=\"8\" fill=\"#2563eb\">体积大</text><text x=\"50\" y=\"120\" font-size=\"9\" fill=\"#7c3aed\">Vol(B(p,r)) ≤ V_c(r)</text><text x=\"50\" y=\"135\" font-size=\"8\" fill=\"#dc2626\">Ric ≥ (n-1)c → 体积上界</text></svg>","examples":[{"title":"Ricci平坦流形","content":"若Ric≥0，则Vol(B(p,r))/r^n单调非增，且Vol(B(p,r)) ≤ ω_n r^n。Calabi-Yau流形是Ricci平坦的。"},{"title":"正Ricci曲率","content":"若Ric≥(n-1)（即Sⁿ标准度量），则Vol(B(p,r))/V_Sⁿ(r)单调非增，且Vol(B(p,r)) ≤ Vol(Sⁿ) = 2π^{(n+1)/2}/Γ((n+1)/2)。"},{"title":"Gromov紧致性","content":"Gromov紧致性定理：满足|K|≤1, diam≤D, vol≥v>0的n维流形组成的集合在Gromov-Hausdorff拓扑下紧致。"}],"theorems":[{"name":"Bishop-Gromov定理","statement":"若Ric≥(n-1)c·g，则函数 r ↦ Vol(B(p,r))/V_c(r) 单调非增，≤1，且lim_{r→0}=1。","proof":"在法坐标下，体积元dV = A(t,θ) dt dθ，其中A(t,θ)是沿径向测地线的Jacobi场的行列式。Ricci曲率下界给出A(t,θ)满足的微分不等式：A'/A ≤ A_c'/A_c（其中A_c是常曲率c空间中的对应量）。由此A(t,θ)/A_c(t)单调非增，且lim_{t→0} A(t,θ)/A_c(t) = 1。积分得Vol(B(p,r))/V_c(r)单调非增且≤1。Gromov的贡献是将Bishop的逐点比较推广为整体比较。"}],"applications":"Gromov-Hausdorff收敛理论；Ricci流的奇点分析；Perelman的约化体积单调性。","refs":{"book":"Lee","ch":"Ch.10","sec":"§10.3"},"subject":"riemann"},{"id":"r51","label":"Bonnet-Myers定理与直径界","chapter":"ch10","layer":0,"desc":"Bonnet-Myers定理给出正Ricci曲率下流形的直径上界和基本群有限性，是曲率控制全局几何的经典结果。","content":"Bonnet-Myers定理：若完备黎曼流形M满足 Ric ≥ (n-1)/R² · g，则M紧致且直径 diam(M) ≤ πR。此外，M的万有覆盖空间也紧致，因此基本群 π₁(M) 有限。证明思路：沿任意最短测地线构造Jacobi场，利用第二变分公式和Ricci曲率下界，如果测地线长度超过πR，则存在变分使能量减小，矛盾。球面Sⁿ(R)达到直径上界，是刚性情形。Bonnet-Myers定理是最早将曲率下界与全局拓扑联系起来的定理之一，开启了几何拓扑学的新纪元。","understanding":"Bonnet-Myers定理说：如果空间'平均'弯曲程度足够大（正Ricci曲率），那么空间必然是一个'有限'的宇宙——你不可能走无限远，因为空间会'弯曲回来'。球面就是最好的例子：从北极出发，走πR的距离就到达南极，再往前走就回到北极了。正曲率把空间'封闭'起来了。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"100\" cy=\"100\" r=\"55\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"100\" cy=\"100\" r=\"3\" fill=\"#dc2626\"/><text x=\"105\" y=\"95\" font-size=\"9\" fill=\"#dc2626\">p</text><line x1=\"100\" y1=\"45\" x2=\"100\" y2=\"100\" stroke=\"#dc2626\" stroke-width=\"1.5\" stroke-dasharray=\"4,4\"/><text x=\"85\" y=\"70\" font-size=\"8\" fill=\"#dc2626\">≤πR</text><text x=\"25\" y=\"40\" font-size=\"9\" fill=\"#2563eb\">Ric ≥ (n-1)/R²</text><text x=\"25\" y=\"55\" font-size=\"8\" fill=\"#7c3aed\">→ diam ≤ πR</text><text x=\"25\" y=\"70\" font-size=\"8\" fill=\"#dc2626\">→ π₁有限</text></svg>","examples":[{"title":"球面Sⁿ(R)","content":"Sⁿ(R)的Ricci曲率为 (n-1)/R²，直径恰好为πR，达到Bonnet-Myers定理的上界。这是刚性情形。"},{"title":"实射影空间RPⁿ","content":"RPⁿ的Ricci曲率与Sⁿ相同，但直径仅πR/2，基本群为Z₂，验证了Bonnet-Myers定理的有限性结论。"},{"title":"非紧致正Ricci流形","content":"存在Ricci曲率为正的非紧致流形（如R²上的旋转抛物面），说明Ricci正不能保证紧致性，需要一致下界。"}],"theorems":[{"name":"Bonnet-Myers定理","statement":"若完备黎曼流形满足 Ric ≥ (n-1)/R² · g，则 diam(M) ≤ πR，且 π₁(M) 有限。","proof":"设γ: [0,L] → M是长度L的最短测地线。沿γ取n-1个平行标准正交法向量场E_i。定义变分V_i(t) = sin(πt/L)E_i(t)。第二变分公式：δ²E(V_i,V_i) = ∫₀^L (cos²(πt/L)π²/L² - sin²(πt/L)⟨R(E_i,γ')γ',E_i⟩) dt。对i=1至n-1求和，利用Ricci下界条件，得 Σδ²E < 0（若L > πR）。但γ是最短测地线，第二变分应非负，矛盾。故L ≤ πR。万有覆盖的紧致性由类似论证及基本群作用的不连续性得出。"}],"applications":"宇宙学中宇宙年龄和大小估计；几何拓扑中流形分类；广义相对论中闭合宇宙模型。","refs":{"book":"Lee","ch":"Ch.10","sec":"§10.4"},"subject":"riemann"},{"id":"r52","label":"Gromov-Hausdorff收敛与极限空间","chapter":"ch10","layer":3,"desc":"Gromov-Hausdorff收敛是度量空间之间的收敛概念，曲率有界流形序列的极限空间分析是当代几何分析的前沿。","content":"Gromov-Hausdorff距离d_GH(X,Y)度量两个紧致度量空间之间的'形状差异'，定义为等距嵌入到同一度量空间后Hausdorff距离的下确界。Gromov紧致性定理：满足|K|≤1, diam≤D, vol≥v>0的n维黎曼流形集合在GH拓扑下紧致。极限空间可以是奇异空间（Alexandrov空间），具有推广的曲率条件。Fukaya的破裂理论（collapse theory）研究体积趋于零的序列，极限空间可以是低维的。Cheeger-Colding理论研究了Ricci曲率有下界序列的极限空间结构和正则性。","understanding":"Gromov-Hausdorff收敛就像'形状的极限'。想象一系列越来越细的环面（甜甜圈越来越薄），它们的极限是一条线段（一维）。或者想象一个球面被压扁，极限是一个圆盘。Gromov-Hausdorff收敛允许维数在极限中'崩塌'。Perelman证明Poincaré猜想时就用到了Gromov-Hausdorff收敛来分析Ricci流中的奇点。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><ellipse cx=\"60\" cy=\"60\" rx=\"30\" ry=\"20\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"45\" y=\"95\" font-size=\"8\" fill=\"#dc2626\">M₁</text><ellipse cx=\"120\" cy=\"60\" rx=\"25\" ry=\"15\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"105\" y=\"95\" font-size=\"8\" fill=\"#2563eb\">M₂</text><line x1=\"60\" y1=\"120\" x2=\"170\" y2=\"120\" stroke=\"#7c3aed\" stroke-width=\"2\"/><text x=\"100\" y=\"135\" font-size=\"8\" fill=\"#7c3aed\">M_∞ (极限)</text><text x=\"30\" y=\"160\" font-size=\"8\" fill=\"#dc2626\">d_GH(M_i, M_∞) → 0</text></svg>","examples":[{"title":"环面崩塌","content":"平坦环面T²(R,r)（大半径R固定，小半径r→0）的GH极限是圆S¹(R)，维数从2崩塌到1。"},{"title":"Perelman的W-functional","content":"Perelman引入W-泛函的单调性，可用于分析Ricci流的GH极限，证明Poincaré猜想时起了关键作用。"},{"title":"Cheeger-Colding理论","content":"Ricci曲率有下界序列的GH极限空间具有'几乎处处'可微结构，是Lipschitz流形，推广了经典黎曼几何。"}],"theorems":[{"name":"Gromov紧致性定理","statement":"满足|K|≤1, diam≤D, vol≥v>0的n维黎曼流形在Gromov-Hausdorff拓扑下是紧致的。","proof":"Gromov的证明基于两个关键步骤。第一，在曲率有界和直径有界的条件下，利用Bishop-Gromov不等式可以构造覆盖流形的ε-网（ε-net），网的点数由n, D, v控制。第二，有了ε-网后，可以构造到R^N（N依赖于ε和n）的嵌入，距离由网的组合结构确定。所有满足条件的流形可以嵌入到同一个紧致度量空间中，由此得到GH紧致性。体积下界防止流形'崩塌'到低维。"}],"applications":"Ricci流中奇点形成分析；Perelman的Poincaré猜想证明；大数据分析中的度量空间嵌入和降维。","refs":{"book":"Lee","ch":"Ch.10","sec":"§10.5"},"subject":"riemann"},{"id":"t1","label":"同伦与同伦等价","chapter":"ch1","layer":0,"desc":"连续映射之间的连续变形关系，是代数拓扑中最基本的等价概念。","content":"设 X, Y 为拓扑空间，f, g: X→Y 为连续映射。若存在连续映射 H: X×[0,1]→Y 使得 H(x,0)=f(x) 且 H(x,1)=g(x)，则称 f 与 g 同伦，记作 f ≃ g。空间 X 与 Y 同伦等价是指存在映射 f: X→Y 和 g: Y→X 使得 g∘f ≃ id_X 且 f∘g ≃ id_Y。同伦等价比同胚更弱，允许'压缩'维度，因此可缩空间（如 R^n）同伦等价于点。同伦等价保持基本群、同调群等所有代数拓扑不变量，是代数拓扑分类空间的基本等价关系。","understanding":"同伦可以想象为橡皮泥变形：如果两个映射可以通过连续变形互相转换，它们就是同伦的。同伦等价更进一步：两个空间如果能通过'捏扁'或'拉伸'（不撕裂）互相转化，就视为拓扑上'一样'。比如实心球可以捏成一点，所以它同伦等价于点；但圆圈不能捏成一点（因为中间有个洞），所以它与点不同伦等价。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><defs><marker id=\"ar1\" markerWidth=\"6\" markerHeight=\"6\" refX=\"5\" refY=\"3\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#333\"/></marker></defs><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"60\" cy=\"70\" r=\"25\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.5\"/><circle cx=\"140\" cy=\"70\" r=\"25\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.5\"/><path d=\"M60,95 C60,120 140,120 140,95\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/><line x1=\"90\" y1=\"70\" x2=\"110\" y2=\"70\" stroke=\"#333\" stroke-width=\"2\" marker-end=\"url(#ar1)\"/><text x=\"55\" y=\"60\" font-size=\"10\" fill=\"#2563eb\">f</text><text x=\"150\" y=\"60\" font-size=\"10\" fill=\"#2563eb\">g</text><text x=\"75\" y=\"110\" font-size=\"10\" fill=\"#dc2626\">H(t)</text><text x=\"60\" y=\"155\" font-size=\"12\" fill=\"#333\" font-weight=\"bold\">同伦 H: X×I→Y</text><text x=\"45\" y=\"175\" font-size=\"10\" fill=\"#666\">H(x,0)=f, H(x,1)=g</text></svg>","examples":[{"title":"R^n 的可缩性","content":"恒等映射 id: R^n→R^n 与常值映射 c₀(x)=0 同伦，同伦为 H(x,t)=(1-t)x。因此 R^n 同伦等价于点。"},{"title":"S^1 与 R²\\{0}","content":"S^1 与穿孔平面 R²\\{0} 同伦等价：径向投影 r(x)=x/|x| 与包含映射 i: S^1→R²\\{0} 互为同伦逆。"},{"title":"Möbius 带与 S^1","content":"Möbius 带沿中心线形变收缩到 S^1，两者同伦等价，但不同胚（Möbius 带是带边流形）。"}],"theorems":[{"name":"同伦是等价关系","statement":"连续映射间的同伦关系是等价关系（自反、对称、传递）。","proof":"自反性取H(x,t)=f(x)；对称性利用H(x,1-t)逆转同伦；传递性将两个同伦各加速一倍拼接。核心是利用[0,1]区间的重参数化，将两段同伦压缩到[0,1/2]和[1/2,1]中连续衔接。"},{"name":"同伦等价保持连通性","statement":"若 X ≃ Y，则 X 与 Y 有相同的连通分支数。","proof":"同伦等价映射f:X→Y诱导连通分支之间的双射。每个连通分支映射到连通分支，同伦逆g保证映射是单射和满射。特别地，连通空间的同伦等价像仍是连通的，因此连通性在同伦等价下保持不变。"}],"applications":"同伦等价是代数拓扑分类空间的基本工具。在机器人路径规划中，判断两个构型空间是否同伦等价可以简化运动规划问题。在数据分析中，持久同调利用同伦等价来识别不同尺度下的拓扑特征。","refs":[{"book":"Hatcher","ch":"Ch.0","sec":"§0.1"},{"book":"Munkres","ch":"Ch.9","sec":"§51"}],"subject":"topo"},{"id":"t2","label":"基本群的定义","chapter":"ch1","layer":1,"desc":"以基点为起终点的环路同伦类构成的群，是代数拓扑的第一个不变量。","content":"设 X 为拓扑空间，x₀∈X 为基点。X 中以 x₀ 为基点的环路是连续映射 γ: [0,1]→X 满足 γ(0)=γ(1)=x₀。两条环路 γ, η 的乘积定义为 (γ·η)(t) = γ(2t) (t≤1/2) 或 η(2t-1) (t≥1/2)。两条环路同伦若存在保持基点不动的同伦。基本群 π₁(X,x₀) 是所有环路同伦类的集合，群运算为环路乘积的诱导。单位元为常值环路，逆元为环路反向。若 X 道路连通，则不同基点对应的基本群同构。","understanding":"想象你在一个空间里散步，从起点出发必须回到起点。基本群记录的是所有'不能连续变形为彼此'的散步路线。在球面上，任何环路都可以缩成一点，所以基本群是平凡的；在圆环上，顺时针绕一圈和逆时针绕一圈是本质上不同的路线，它们构成无限循环群 Z。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"100\" cy=\"90\" r=\"60\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"100\" cy=\"90\" r=\"4\" fill=\"#dc2626\"/><text x=\"100\" y=\"82\" font-size=\"10\" fill=\"#dc2626\" text-anchor=\"middle\">x₀</text><path d=\"M100,90 C100,40 150,50 140,90 C130,130 100,120 100,90\" fill=\"none\" stroke=\"#059669\" stroke-width=\"2.5\"/><path d=\"M100,90 C100,50 60,55 70,90 C75,110 100,105 100,90\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"2.5\"/><text x=\"55\" y=\"70\" font-size=\"9\" fill=\"#059669\">γ</text><text x=\"130\" y=\"60\" font-size=\"9\" fill=\"#d97706\">η</text><text x=\"100\" y=\"175\" font-size=\"12\" fill=\"#333\" font-weight=\"bold\">π₁(X,x₀)</text><text x=\"100\" y=\"192\" font-size=\"10\" fill=\"#666\" text-anchor=\"middle\">环路同伦类</text></svg>","examples":[{"title":"S^1 的基本群","content":"π₁(S^1) ≅ Z。每个同伦类由绕数（整数）唯一确定，正向绕一圈对应1，反向对应-1。"},{"title":"S^n (n≥2) 的基本群","content":"π₁(S^n) ≅ {e}（平凡群）。高维球面上任何环路都可连续缩为一点。"},{"title":"环面 T^2 的基本群","content":"π₁(T^2) ≅ Z×Z，由赤道方向和经线方向的两个独立环路生成。"}],"theorems":[{"name":"基本群函子性","statement":"连续映射 f: X→Y 诱导群同态 f_*: π₁(X,x₀)→π₁(Y,f(x₀))，且 (f∘g)_* = f_*∘g_*。","proof":"定义f_*([γ])=[f∘γ]。验证群同态：(f_*(α·β))(t)在t≤1/2为f(α(2t))，在t≥1/2为f(β(2t-1))，恰好等于(f_*α)·(f_*β)。复合性(f∘g)_*=f_*∘g_*由定义直接推出。这表明π₁是Top到Grp的函子。"},{"name":"同伦不变性","statement":"若 f ≃ g rel x₀，则 f_* = g_*。特别地，同伦等价的空间有同构的基本群。","proof":"设f≃g rel x₀的同伦为H，则对任意环路γ，H(γ(s),t)给出f∘γ和g∘γ之间的同伦。故[f∘γ]=[g∘γ]，即f_*=g_*。同伦等价空间X≃Y时，f_*∘g_*=id和g_*∘f_*=id保证f_*是同构。"}],"applications":"基本群可用于证明Brouwer不动点定理（二维情形）、区分不同拓扑空间（如证明R²与R³不同胚），在扭结理论中区分不同扭结类型。在物理学中，Aharonov-Bohm效应的拓扑解释依赖于穿孔平面的非平凡基本群。","refs":[{"book":"Hatcher","ch":"Ch.1","sec":"§1.1"},{"book":"Munkres","ch":"Ch.9","sec":"§52"}],"subject":"topo"},{"id":"t3","label":"基本群的计算方法","chapter":"ch1","layer":2,"desc":"利用形变收缩、乘积空间性质和群论工具计算具体空间的基本群。","content":"计算基本群的基本策略：(1) 形变收缩法：X 形变收缩到子空间 A，则 π₁(X) ≅ π₁(A)；(2) 乘积公式：π₁(X×Y) ≅ π₁(X)×π₁(Y)；(3) Seifert-van Kampen 定理：将空间分解为两个开集，利用它们的并集和交集的基本群通过自由积与融合关系计算；(4) 群论技巧：计算基本群后，通常需要识别所得群（自由群、自由积、融合积等）。基本群的计算本质上是把拓扑问题转化为代数问题，利用已知空间的基本群作为'原子'。","understanding":"计算基本群就像解谜：你把复杂空间拆成简单部件（如圆、球），每个部件的基本群你已知，然后通过组合规则（如van Kampen定理）拼出整体的基本群。就像乐高积木，你知道每块积木是什么，然后根据搭建方式确定整体结构。例如，8字形空间可以看作两个圆粘在一起，其基本群是Z*Z（两个生成元的自由群）。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"80\" cy=\"60\" r=\"30\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"140\" cy=\"60\" r=\"30\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/><circle cx=\"110\" cy=\"60\" r=\"5\" fill=\"#7c3aed\"/><circle cx=\"80\" cy=\"120\" r=\"30\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"140\" cy=\"120\" r=\"30\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/><line x1=\"95\" y1=\"60\" x2=\"125\" y2=\"60\" stroke=\"#7c3aed\" stroke-width=\"2\" stroke-dasharray=\"4,2\"/><text x=\"60\" y=\"160\" font-size=\"10\" fill=\"#2563eb\">A</text><text x=\"145\" y=\"160\" font-size=\"10\" fill=\"#dc2626\">B</text><text x=\"96\" y=\"155\" font-size=\"10\" fill=\"#7c3aed\">A∩B</text><text x=\"100\" y=\"188\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">Van Kampen 分解</text></svg>","examples":[{"title":"图的基本群","content":"有限连通图 G 的基本群是秩为 1-χ(G) 的自由群，其中 χ(G)=V-E 为欧拉示性数。"},{"title":"环面 T^2","content":"将正方形对边粘合，用 van Kampen 定理得 π₁(T^2) ≅ ⟨a,b|aba⁻¹b⁻¹=1⟩ ≅ Z×Z。"},{"title":"Klein 瓶","content":"π₁(K) ≅ ⟨a,b|aba⁻¹b=1⟩，这是非交换群，表明 Klein 瓶的基本群与环面不同。"}],"theorems":[{"name":"Seifert-van Kampen 定理","statement":"若 X = U∪V 且 U∩V 道路连通，则 π₁(X) ≅ π₁(U)*π₁(V)/N，其中 N 由 π₁(U∩V) 中元素在包含映射下的像生成。","proof":"将X中环路分解为交替落在U和V中的片段，每段通过U∩V中的道路修正。群论上，π₁(U)和π₁(V)的生成元自由生成自由积，π₁(U∩V)在两个包含映射下的像的差异提供融合关系N，商掉N即得π₁(X)。核心是推出图表的万有性质。"},{"name":"乘积公式","statement":"π₁(X×Y, (x₀,y₀)) ≅ π₁(X,x₀) × π₁(Y,y₀)。","proof":"投影映射诱导同态p_*:π₁(X×Y)→π₁(X)×π₁(Y)，由p_*([γ])=([p_X∘γ],[p_Y∘γ])定义。逆映射：对([α],[β])构造γ(t)=(α(t),β(t))，即([α],[β])↦[α×β]。验证两者互为逆映射，利用乘积拓扑的万有性质。"}],"applications":"基本群计算在扭结理论中用于区分扭结（扭结补空间的基本群称为扭结群），在三维流形拓扑中用于分类Seifert纤维空间，在代数几何中用于计算代数曲线的拓扑类型。","refs":[{"book":"Hatcher","ch":"Ch.1","sec":"§1.2"},{"book":"Hatcher","ch":"Ch.1","sec":"§1.3"}],"subject":"topo"},{"id":"t4","label":"覆叠空间","chapter":"ch1","layer":1,"desc":"局部同胚于底空间且具有离散纤维的覆盖映射，是研究基本群的核心工具。","content":"覆叠空间 p: X̃→X 是满足局部平凡化条件的连续满射：对每个 x∈X，存在邻域 U 使得 p⁻¹(U) 同胚于 U×F（F 为离散空间）。覆叠空间的纤维 p⁻¹(x) 的基数称为覆叠次数。覆叠空间最重要的性质是道路提升定理：X 中任一道路可唯一提升到 X̃ 中（给定起点）；以及同伦提升定理：道路的同伦也可提升。覆叠空间与基本群通过 Galois 对应紧密关联：X̃ 的覆叠变换群 Γ 满足 π₁(X)/p_*π₁(X̃) ≅ Γ。","understanding":"覆叠空间就像多层停车场：每一层看起来和底层（底空间）局部一样，但总共有好几层。螺旋线是圆周的覆叠空间——螺旋线局部看起来像直线，圆周局部看起来也像直线，但螺旋线绕一圈不会回到原点，而是到了'上一层'。实数线 R 是圆周 S^1 的'万有覆叠'——它无限层，每层对应一个整数。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><path d=\"M30,30 Q100,10 170,30\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><path d=\"M30,60 Q100,40 170,60\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><path d=\"M30,90 Q100,70 170,90\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><path d=\"M30,120 Q100,100 170,120\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"100\" cy=\"165\" r=\"30\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.5\"/><line x1=\"85\" y1=\"30\" x2=\"85\" y2=\"165\" stroke=\"#333\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><line x1=\"115\" y1=\"30\" x2=\"115\" y2=\"165\" stroke=\"#333\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><text x=\"100\" y=\"185\" font-size=\"12\" fill=\"#333\" font-weight=\"bold\">p: X̃→X</text><text x=\"30\" y=\"20\" font-size=\"9\" fill=\"#059669\">覆盖空间 X̃</text><text x=\"70\" y=\"160\" font-size=\"9\" fill=\"#dc2626\">底空间 X</text></svg>","examples":[{"title":"R→S^1 (万有覆叠)","content":"p(t)=e^{2πit} 是万有覆叠映射，纤维为 Z，覆叠变换群为 Z（平移）。"},{"title":"S^n→RP^n (二重覆叠)","content":"对径映射 p(x)=[x] 是 S^n 到实射影空间 RP^n 的二重覆叠，覆叠变换群为 Z/2。"},{"title":"S^1→S^1 (n重覆叠)","content":"p(z)=z^n 是 n 重覆叠，纤维为 n 个点，诱导同态 p_* 将 π₁(S^1)≅Z 映射到 nZ。"}],"theorems":[{"name":"道路提升定理","statement":"对覆叠 p: X̃→X，X 中起点为 x₀ 的道路 γ 可唯一提升到 X̃ 中以任意 x̃₀∈p⁻¹(x₀) 为起点的道路 γ̃。","proof":"将[0,1]用Lebesgue数分解为有限个小区间[t_i,t_{i+1}]，使每个γ([t_i,t_{i+1}])落在平凡化邻域U内。在每段上利用局部同胚p⁻¹(U)≅U×F构造提升，由唯一性保证在相邻区间端点处衔接。核心是覆叠空间的局部乘积结构。"},{"name":"同伦提升定理","statement":"覆叠空间具有同伦提升性质：底空间中的道路同伦可提升到覆叠空间。","proof":"将同伦H:I×I→X用Lebesgue数分解为小方格，每个方格内H的像落在平凡化邻域中。在每个方格内利用局部乘积结构提升，确保沿方格边界的连续性。由下到上、左到右逐格构造完整的提升同伦。核心是紧致性保证有限分解。"}],"applications":"覆叠空间在物理学中用于描述自旋（SU(2)→SO(3)的二重覆叠），在晶体学中描述晶格结构，在复杂分析中用于定义黎曼面上的多值函数（如平方根）。","refs":[{"book":"Hatcher","ch":"Ch.1","sec":"§1.3"},{"book":"Munkres","ch":"Ch.9","sec":"§53"}],"subject":"topo"},{"id":"t5","label":"覆叠空间的分类","chapter":"ch1","layer":2,"desc":"覆叠空间与基本群的子群之间存在一一对应，这是Galois理论在拓扑中的体现。","content":"覆叠空间的分类定理是代数拓扑最重要的结构定理之一。设 X 是道路连通、局部道路连通且半局部单连通的空间（'好空间'）。则 X 的（连通）覆叠空间之间的等价类与 π₁(X) 的子群的共轭类一一对应：给定覆叠 p: X̃→X 和基点 x̃₀，对应子群为 p_*(π₁(X̃,x̃₀)) ⊂ π₁(X,p(x̃₀))。正规子群对应于正规覆叠（Galois覆叠），此时覆叠变换群同构于商群。对应万有覆叠的子群是平凡子群，万有覆叠是单连通的。","understanding":"覆叠空间的分类就像给基本群做'子群图鉴'：基本群的每个子群都对应一种覆叠方式。万有覆叠（单连通覆叠）对应平凡子群，它覆盖了所有其他覆叠空间。正规子群对应最'对称'的覆叠——覆叠变换群可以自由地作用在纤维上。这种对应关系体现了代数（群）和几何（覆叠空间）之间的深刻联系，类似于Galois理论中域扩张与子群之间的对应。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"40\" y=\"10\" width=\"120\" height=\"30\" rx=\"5\" fill=\"#e8f0fe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"100\" y=\"30\" font-size=\"10\" fill=\"#2563eb\" text-anchor=\"middle\">万有覆叠 X̃_univ</text><rect x=\"40\" y=\"60\" width=\"120\" height=\"30\" rx=\"5\" fill=\"#fef3c7\" stroke=\"#d97706\" stroke-width=\"1.5\"/><text x=\"100\" y=\"80\" font-size=\"10\" fill=\"#d97706\" text-anchor=\"middle\">中间覆叠 X̃₁</text><rect x=\"40\" y=\"110\" width=\"120\" height=\"30\" rx=\"5\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"100\" y=\"130\" font-size=\"10\" fill=\"#dc2626\" text-anchor=\"middle\">中间覆叠 X̃₂</text><rect x=\"40\" y=\"160\" width=\"120\" height=\"30\" rx=\"5\" fill=\"#e0f2fe\" stroke=\"#0d9488\" stroke-width=\"1.5\"/><text x=\"100\" y=\"180\" font-size=\"10\" fill=\"#0d9488\" text-anchor=\"middle\">底空间 X</text><line x1=\"100\" y1=\"40\" x2=\"100\" y2=\"60\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"90\" x2=\"100\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"140\" x2=\"100\" y2=\"160\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"165\" y=\"95\" font-size=\"9\" fill=\"#333\">←→ Galois对应</text></svg>","examples":[{"title":"S^1 的覆叠分类","content":"π₁(S^1)≅Z 的子群为 nZ。每个 n 对应一个 n 重覆叠 z↦z^n，万有覆叠为 R→S^1。"},{"title":"环面 T^2 的覆叠","content":"π₁(T^2)≅Z×Z 的子群格对应各种覆叠环面，万有覆叠为 R^2→T^2。"},{"title":"8字形的覆叠","content":"π₁(S^1∨S^1)≅F₂（自由群），其子群结构极其丰富，对应各种图作为覆叠空间。"}],"theorems":[{"name":"覆叠空间分类定理","statement":"设 X 满足适当条件，连通覆叠空间 p: X̃→X 的等价类与 π₁(X,x₀) 的子群的共轭类一一对应。","proof":"给定子群H⊂π₁(X)，取万有覆叠X̃_univ，定义等价关系x̃₁~x̃₂当且仅当p(x̃₁)=p(x̃₂)且连接道路在H中。商空间X̃_univ/~即为对应H的覆叠。反之，给定覆叠，取其p_*(π₁(X̃))。共轭类对应体现基点选择的不确定性。"},{"name":"万有覆叠的存在性","statement":"X 为半局部单连通 ⇔ X 存在万有覆叠。万有覆叠是单连通的覆叠空间。","proof":"构造：取X中以x₀为起点的道路同伦类集合，赋以由开集UV_α={[γ·η]:η是V_α中道路}生成的拓扑。投影映射取终点：p([γ])=γ(1)。半局部单连通性保证此拓扑使p成为覆叠映射。该空间单连通因为任何环路可收缩到基点。"}],"applications":"覆叠空间分类在代数几何中用于研究黎曼面的模空间，在表示论中研究基本群的线性表示，在Galois理论中为Grothendieck的远阿贝尔几何提供动机。","refs":[{"book":"Hatcher","ch":"Ch.1","sec":"§1.3"},{"book":"Munkres","ch":"Ch.13","sec":"§82"}],"subject":"topo"},{"id":"t6","label":"Van Kampen定理","chapter":"ch1","layer":2,"desc":"将空间分解为两个开集，利用其基本群通过自由积和融合关系计算整体的基本群。","content":"Seifert-van Kampen 定理是计算基本群最强大的工具。设 X = U∪V，其中 U, V 为开集，且 U∩V 道路连通。则基本群有推出图表：π₁(U∩V) → π₁(U) 和 π₁(U∩V) → π₁(V) 诱导同态，而 π₁(X) 是 π₁(U) 和 π₁(V) 的自由积关于 π₁(U∩V) 中元素在两个包含映射下像的关系的商。定理的核心思想是：X 中的环路可以分解为交替在 U 和 V 中的环路片段，而重合部分（U∩V 中的环路）提供融合关系。","understanding":"Van Kampen 定理就像拼图游戏：如果你知道每个拼图块（U 和 V）的基本群，以及它们重叠部分（U∩V）的基本群，你就可以通过'自由积后商掉重叠部分'来计算整个拼图的基本群。这个定理的精妙之处在于：它把拓扑问题（计算空间的基本群）完全转化为代数问题（计算群的自由积和商群），使得我们可以用纯代数方法处理拓扑问题。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><ellipse cx=\"75\" cy=\"80\" rx=\"55\" ry=\"45\" fill=\"#dbeafe\" fill-opacity=\"0.5\" stroke=\"#2563eb\" stroke-width=\"2\"/><ellipse cx=\"125\" cy=\"80\" rx=\"55\" ry=\"45\" fill=\"#fce7f3\" fill-opacity=\"0.5\" stroke=\"#dc2626\" stroke-width=\"2\"/><text x=\"55\" y=\"50\" font-size=\"11\" fill=\"#2563eb\" font-weight=\"bold\">U</text><text x=\"145\" y=\"50\" font-size=\"11\" fill=\"#dc2626\" font-weight=\"bold\">V</text><text x=\"90\" y=\"95\" font-size=\"10\" fill=\"#7c3aed\" font-weight=\"bold\">U∩V</text><text x=\"100\" y=\"140\" font-size=\"10\" fill=\"#333\">π₁(X) ≅</text><text x=\"100\" y=\"155\" font-size=\"10\" fill=\"#333\">π₁(U)*π₁(V)/N</text><text x=\"100\" y=\"180\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">Seifert-van Kampen</text></svg>","examples":[{"title":"楔和 S^1∨S^1","content":"取 U, V 为两个圆分别的开邻域，U∩V 可缩，故 π₁(S^1∨S^1) ≅ Z*Z ≅ F₂。"},{"title":"环面 T^2","content":"将环面沿子午线和赤道切开，U∩V 为环带，得 π₁(T^2) ≅ ⟨a,b|aba⁻¹b⁻¹⟩ ≅ Z×Z。"},{"title":"曲面基本群","content":"亏格 g 的可定向闭曲面 Σ_g 的基本群为 ⟨a₁,b₁,…,a_g,b_g|∏[a_i,b_i]=1⟩。"}],"theorems":[{"name":"Seifert-van Kampen定理","statement":"若 X=U∪V 且 U∩V 道路连通，则 π₁(X) ≅ π₁(U) *_{π₁(U∩V)} π₁(V)（融合自由积）。","proof":"包含映射诱导同态i_*:π₁(U∩V)→π₁(U)和j_*:π₁(U∩V)→π₁(V)。融合自由积由π₁(U)和π₁(V)的生成元生成，关系为i_*(γ)=j_*(γ)对所有γ∈π₁(U∩V)。正合性推出图表是推出图表，万有性质唯一确定π₁(X)。"},{"name":"推广形式","statement":"可推广到多个开集的覆盖，使用群胚或范畴论语言更简洁地表述。","proof":"对多个开集覆盖{U_α}，考虑基本群胚Π(X)作为所有道路同伦类的范畴。Π(X)同构于Π(U_α)沿Π(U_α∩U_β)的2-余极限。范畴论表述避免了基点选择问题，且自然处理多个开集的重叠关系，是Grothendieck的galois理论在拓扑中的体现。"}],"applications":"van Kampen 定理广泛应用于计算图、曲面、扭结补空间、CW复形的基本群。在低维拓扑中，用于分类曲面和三维流形；在扭结理论中，Wirtinger 表示法利用 van Kampen 定理计算扭结群。","refs":[{"book":"Hatcher","ch":"Ch.1","sec":"§1.2"},{"book":"Munkres","ch":"Ch.9","sec":"§59"}],"subject":"topo"},{"id":"t7","label":"基本群的应用","chapter":"ch1","layer":3,"desc":"利用基本群的不变性证明拓扑学中的重要定理，如Brouwer不动点定理和Borsuk-Ulam定理。","content":"基本群最经典的应用包括：(1) Brouwer 不动点定理（二维）：若 f: D²→D² 连续，则存在不动点。证明：假设无不动点，构造收缩映射 r: D²→S^1，诱导恒等映射在基本群上，但 π₁(D²)={e} 而 π₁(S^1)≅Z，矛盾。(2) 代数基本定理：任何非常数复系数多项式在 C 中有根。证明：假设无根，构造从 S^1 到 S^1 的映射，比较绕数。(3) Borsuk-Ulam 定理（二维）：对连续映射 f: S²→R²，存在对径点 x,-x 使得 f(x)=f(-x)。","understanding":"基本群就像一个'拓扑指纹'：如果两个空间的基本群不同，它们就不可能同胚（甚至不可能同伦等价）。这给了我们证明两个空间不同的有力工具。Brouwer 不动点定理的证明特别优雅：如果圆盘到自身没有不动点，你可以把每个点沿射线推到边界上，从而把圆盘收缩到圆周——但基本群告诉我们这是不可能的。拓扑学通过这种代数方法'看到'了几何中看不见的障碍。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"100\" cy=\"90\" r=\"55\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.5\"/><circle cx=\"100\" cy=\"90\" r=\"55\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1.5\" stroke-dasharray=\"5,3\"/><circle cx=\"100\" cy=\"90\" r=\"3\" fill=\"#dc2626\"/><text x=\"100\" y=\"80\" font-size=\"10\" fill=\"#dc2626\" text-anchor=\"middle\">x₀=f(x₀)</text><line x1=\"130\" y1=\"60\" x2=\"100\" y2=\"90\" stroke=\"#333\" stroke-width=\"1\" stroke-dasharray=\"3,2\"/><text x=\"135\" y=\"55\" font-size=\"9\" fill=\"#333\">x</text><text x=\"100\" y=\"170\" font-size=\"12\" fill=\"#333\" font-weight=\"bold\">Brouwer不动点定理</text><text x=\"100\" y=\"188\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">f: D²→D² 必有不动点</text></svg>","examples":[{"title":"代数基本定理","content":"设 p(z) 无根，定义 f_r: S^1→S^1 为 f_r(z)=p(rz)/|p(rz)|。r→0 时绕数为0，r→∞ 时绕数为 deg(p)，矛盾。"},{"title":"毛球定理","content":"S² 上不存在处处非零的连续切向量场。证明依赖于基本群和同伦的论证。"},{"title":"R² 与 R³ 不同胚","content":"若同胚，去掉一点后基本群分别为 Z 和 {e}，矛盾。推广：R^m ≅ R^n 当且仅当 m=n。"}],"theorems":[{"name":"Brouwer不动点定理","statement":"连续映射 f: D^n→D^n 必有不动点。二维情形可用基本群证明。","proof":"假设f无不动点，定义r(x)为从f(x)到x的射线与S^{n-1}的交点。r是收缩映射且r∘i=id_{S^{n-1}}。作用在π₁上得id_Z=r_*∘i_*:Z→{e}→Z，矛盾。高维情形用同调群类似论证：r_*在H_{n-1}上诱导恒等映射，但H_{n-1}(D^n)=0。"},{"name":"Borsuk-Ulam定理","statement":"对连续映射 f: S^n→R^n，存在 x∈S^n 使得 f(x)=f(-x)。","proof":"假设f(x)≠f(-x)恒成立，定义g(x)=(f(x)-f(-x))/|f(x)-f(-x)|:S^n→S^{n-1}。g是奇映射：g(-x)=-g(x)。考虑S^n到RP^n的二重覆叠，奇映射诱导RP^n→RP^{n-1}的映射，矛盾于同调群结构。核心是奇映射不能保持拓扑不变量。"}],"applications":"不动点定理在经济学（Nash均衡存在性）、计算机科学（程序语义学中的域理论）、博弈论中都有重要应用。基本群方法也用于机器人运动规划中的构型空间分析。","refs":[{"book":"Hatcher","ch":"Ch.1","sec":"§1.1"},{"book":"Munkres","ch":"Ch.9","sec":"§55"}],"subject":"topo"},{"id":"t8","label":"形变收缩与同伦型","chapter":"ch1","layer":1,"desc":"形变收缩是构造同伦等价的最常用方法，允许将空间连续压缩到其子空间上。","content":"形变收缩是比同伦等价更强的概念。设 A⊂X 为子空间，包含映射为 i: A↪X。若存在连续映射 r: X→A 使得 r∘i = id_A 且 i∘r ≃ id_X（同伦过程中保持 A 中的点不动），则称 A 是 X 的强形变收缩核。若同伦不要求保持 A 中点不动，则为弱形变收缩。若同伦过程中所有点沿特定路线移动，则为形变收缩。形变收缩是构造同伦等价的最直接方法，也是计算基本群的第一步：找到形变收缩核，将其基本群作为原空间的基本群。","understanding":"形变收缩就像把橡皮泥捏成更简单的形状：你可以把实心圆盘连续地捏成它的圆心，把圆柱体捏成它的底面圆周，把Möbius带捏成它的中心线。关键是不能撕裂——拓扑变形必须是连续的。形变收缩是代数拓扑中的'简化'操作：在计算基本群之前，先把空间简化到最简形式。注意形变收缩是可逆的（在同伦意义上），但逆过程（膨胀）不是形变收缩。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"160\" cy=\"100\" r=\"40\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"100\" cy=\"100\" r=\"40\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"2\" opacity=\"0.6\"/><circle cx=\"60\" cy=\"100\" r=\"40\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"2\" opacity=\"0.3\"/><circle cx=\"60\" cy=\"100\" r=\"5\" fill=\"#dc2626\"/><line x1=\"160\" y1=\"100\" x2=\"100\" y2=\"100\" stroke=\"#d97706\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/><line x1=\"100\" y1=\"100\" x2=\"65\" y2=\"100\" stroke=\"#d97706\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/><text x=\"60\" y=\"88\" font-size=\"10\" fill=\"#dc2626\" text-anchor=\"middle\">A</text><text x=\"100\" y=\"170\" font-size=\"12\" fill=\"#333\" font-weight=\"bold\">形变收缩 X↘A</text><text x=\"100\" y=\"188\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">圆盘→点 是形变收缩</text></svg>","examples":[{"title":"穿孔平面的形变收缩","content":"R²\\{0} 形变收缩到 S^1：径向投影 r(x)=x/|x| 是强形变收缩，故 π₁(R²\\{0})≅Z。"},{"title":"Möbius 带的形变收缩","content":"Möbius 带形变收缩到其中心圆周 S^1，故 π₁(Möbius)≅Z。"},{"title":"ℝ^n 的形变收缩","content":"ℝ^n 形变收缩到原点：H(x,t)=(1-t)x。故 ℝ^n 同伦等价于点，是可缩空间。"}],"theorems":[{"name":"形变收缩诱导同伦等价","statement":"若 A 是 X 的形变收缩核，则包含映射 i: A→X 是同伦等价，故 π₁(A)≅π₁(X)。","proof":"包含映射i:A→X和收缩映射r:X→A满足r∘i=id_A且i∘r≃id_X。故i和r互为同伦逆，i是同伦等价。作用于基本群得i_*:π₁(A)→π₁(X)是同构，r_*是其逆。这使计算基本群时可将空间简化到形变收缩核。"},{"name":"CW复形的形变收缩","statement":"CW 复形中，子复形若是形变收缩核，则可通过逐细胞收缩构造形变收缩。","proof":"对每个n维胞腔，沿径向将胞腔内部形变收缩到边界S^{n-1}。归纳地从高维到低维逐细胞收缩：先收缩最高维胞腔，保持已收缩部分不动。由于CW复形具有闭包有限性，归纳过程在有限步内完成，得到整体形变收缩。"}],"applications":"形变收缩是计算基本群和同调群的第一步简化操作。在数据拓扑分析中，持久同调利用不同半径下的形变收缩来捕捉数据中的多尺度拓扑特征。在机器人学中，构型空间的形变收缩用于简化运动规划。","refs":[{"book":"Hatcher","ch":"Ch.0","sec":"§0.2"},{"book":"Munkres","ch":"Ch.9","sec":"§58"}],"subject":"topo"},{"id":"t9","label":"单纯形与单纯复形","chapter":"ch2","layer":0,"desc":"单纯形是三角形到高维的推广，单纯复形是将空间剖分为单纯形的组合结构。","content":"n 维标准单纯形 Δ^n 是 R^{n+1} 中满足 ∑x_i=1, x_i≥0 的点的凸包。0维单纯形是点，1维是线段，2维是三角形，3维是四面体。单纯形的面是其低维子单纯形。单纯复形 K 是一组单纯形的集合，满足：(1) 若 σ∈K，则 σ 的所有面也属于 K；(2) 两个单纯形相交只能是公共面。单纯复形将空间离散化为组合对象，使得同调群可以通过纯代数方法计算（即线性代数）。三角剖分是将拓扑空间表示为单纯复形的同胚像。","understanding":"单纯形就是把'三角形'概念推广到任意维度：0维是点，1维是线段，2维是三角形，3维是四面体，4维及以上是它们的'高维表亲'。单纯复形就是用这些'三角形家族'来拼出任何形状——就像用三角形拼出恐龙模型一样。关键是每两个三角形要么不相交，要么共享一个完整的边或顶点，不能只是部分重叠。这种规则性使得我们可以用计算机处理拓扑问题。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"173\" cy=\"145\" r=\"4\" fill=\"#2563eb\"/><text x=\"173\" y=\"140\" font-size=\"8\" fill=\"#2563eb\">Δ⁰</text><line x1=\"20\" y1=\"145\" x2=\"130\" y2=\"145\" stroke=\"#dc2626\" stroke-width=\"3\"/><circle cx=\"20\" cy=\"145\" r=\"3\" fill=\"#dc2626\"/><circle cx=\"130\" cy=\"145\" r=\"3\" fill=\"#dc2626\"/><text x=\"70\" y=\"137\" font-size=\"8\" fill=\"#dc2626\">Δ¹</text><polygon points=\"60,170 120,170 90,120\" fill=\"none\" stroke=\"#059669\" stroke-width=\"2\"/><text x=\"80\" y=\"112\" font-size=\"8\" fill=\"#059669\">Δ²</text><polygon points=\"20,80 80,50 140,80 80,110\" fill=\"#dbeafe\" fill-opacity=\"0.3\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/><text x=\"70\" y=\"45\" font-size=\"8\" fill=\"#7c3aed\">Δ³</text><text x=\"100\" y=\"192\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">单纯形 0~3维</text></svg>","examples":[{"title":"圆周 S^1 的三角剖分","content":"S^1 可剖分为3条边和3个顶点（三角形边界），是最简单的三角剖分。"},{"title":"环面 T^2 的三角剖分","content":"T^2 至少需要14个三角形（7个顶点，21条边）的三角剖分，最小剖分对应其同调群。"},{"title":"射影平面 RP^2 的三角剖分","content":"RP^2 的最小三角剖分需要10个顶点，27条边，18个面，其同调群包含扭转。"}],"theorems":[{"name":"单纯逼近定理","statement":"任何连续映射 f: K→L 可被单纯映射逼近（在重心重分后）。","proof":"取L的开星形覆盖，K的紧致性保证存在Lebesgue数。将K充分重心重分，使每个单纯形的像落在L的某个开星形内。定义单纯逼近g将每个顶点映射到其像所在开星形的顶点。g与f同伦，且g是单纯映射。核心是开星形覆盖的Lebesgue数论证。"},{"name":"三角剖分存在性","statement":"光滑流形总是可三角剖分的；但存在不可三角剖分的拓扑流形。","proof":"光滑流形可嵌入R^N（Whitney嵌入定理），在R^N中取足够细的立方剖分，再将每个立方体细分为单纯形。光滑性保证剖分足够细时与流形同胚。Cairns和Whitehead证明光滑流形可三角剖分。但存在不可三角剖分的拓扑流形，如Freedman的E8流形。"}],"applications":"单纯复形是计算拓扑学的基础：有限元方法使用单纯形剖分求解偏微分方程，计算机图形学使用三角网格表示曲面，拓扑数据分析使用Vietoris-Rips和Cech复形捕捉数据的拓扑结构。","refs":[{"book":"Hatcher","ch":"Ch.2","sec":"§2.1"},{"book":"Munkres","ch":"Ch.1","sec":"§2"}],"subject":"topo"},{"id":"t10","label":"单纯同调群","chapter":"ch2","layer":1,"desc":"通过单纯复形的链复形定义同调群，是代数拓扑中最可计算的不变量。","content":"设 K 为单纯复形。n 维链群 C_n(K) 是以 K 的 n 维定向单纯形为基的自由阿贝尔群。边界算子 ∂_n: C_n(K)→C_{n-1}(K) 定义为 ∂_n[v_0,…,v_n] = ∑_{i=0}^n (-1)^i [v_0,…,v̂_i,…,v_n]，其中 v̂_i 表示去掉该顶点。关键性质：∂_{n-1}∘∂_n = 0，即边界没有边界。由此定义 n 维闭链群 Z_n = ker ∂_n，n 维边缘链群 B_n = im ∂_{n+1}。第 n 个单纯同调群为 H_n(K) = Z_n/B_n。同调群衡量'闭链但不是边缘'的链，即空间中的'洞'。","understanding":"同调群的直观理解：想象空间中有一个'洞'。在洞周围绕一圈是一个闭链（没有边界），但它不是任何曲面的边界（因为它包住了洞）。同调群就是记录所有这种'包住洞的闭链'，但把'可以填满的闭链'视为零。所以同调群的大小告诉你空间中有多少个独立的不同维度的洞：H_0 数连通分支，H_1 数一维洞（环），H_2 数二维洞（空腔），以此类推。边界算子的核心恒等式 ∂²=0 保证了'洞的边界没有洞'。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"5\" y=\"20\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"30\" y=\"39\" font-size=\"9\" fill=\"#2563eb\" text-anchor=\"middle\">C₂</text><rect x=\"75\" y=\"20\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"100\" y=\"39\" font-size=\"9\" fill=\"#dc2626\" text-anchor=\"middle\">C₁</text><rect x=\"145\" y=\"20\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#fef3c7\" stroke=\"#d97706\" stroke-width=\"1.5\"/><text x=\"170\" y=\"39\" font-size=\"9\" fill=\"#d97706\" text-anchor=\"middle\">C₀</text><line x1=\"58\" y1=\"35\" x2=\"73\" y2=\"35\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"65\" y=\"32\" font-size=\"8\" fill=\"#333\">∂₂</text><line x1=\"128\" y1=\"35\" x2=\"143\" y2=\"35\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"135\" y=\"32\" font-size=\"8\" fill=\"#333\">∂₁</text><text x=\"100\" y=\"65\" font-size=\"9\" fill=\"#dc2626\">∂₁∘∂₂ = 0</text><text x=\"100\" y=\"85\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">链复形</text><text x=\"100\" y=\"100\" font-size=\"10\" fill=\"#333\">H_n = ker ∂_n / im ∂_{n+1}</text><circle cx=\"100\" cy=\"145\" r=\"35\" fill=\"none\" stroke=\"#7c3aed\" stroke-width=\"2.5\"/><circle cx=\"100\" cy=\"145\" r=\"15\" fill=\"none\" stroke=\"#7c3aed\" stroke-width=\"1.5\" stroke-dasharray=\"4,2\"/><text x=\"100\" y=\"155\" font-size=\"10\" fill=\"#7c3aed\" text-anchor=\"middle\">H₁=Z</text><text x=\"100\" y=\"192\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">环面的洞 → H₁=Z²</text></svg>","examples":[{"title":"球面 S^2","content":"H_0(S^2)≅Z, H_1(S^2)=0, H_2(S^2)≅Z。一个二维洞（空腔），没有一维洞。"},{"title":"环面 T^2","content":"H_0(T^2)≅Z, H_1(T^2)≅Z², H_2(T^2)≅Z。两个独立的一维洞（赤道和经线），一个二维洞。"},{"title":"射影平面 RP^2","content":"H_0(RP^2)≅Z, H_1(RP^2)≅Z/2, H_2(RP^2)=0。存在扭转：非平凡的一维闭链绕两圈才成为边缘。"}],"theorems":[{"name":"∂²=0 定理","statement":"对任意 n，∂_n∘∂_{n+1}=0，因此 im ∂_{n+1} ⊂ ker ∂_n，同调群良定义。","proof":"直接计算：∂_{n-1}∂_n[v₀,...,v_n]=∑_{j<i}(-1)^{i+j}[...,v̂_j,...,v̂_i,...]+∑_{j>i}(-1)^{i+j-1}[...,v̂_i,...,v̂_j,...]。两项中每对面出现两次，符号相反，恰好相消。这是同调代数的核心恒等式，保证了'边界没有边界'。"},{"name":"同调的不变性","statement":"同胚的空间具有同构的单纯同调群；更一般地，同伦等价的空间有同构的同调群。","proof":"同胚直接诱导单纯复形间的同构，进而诱导链复形同构，故同调群同构。同伦不变性更深刻：需构造链同伦。对单纯映射f,g，构造棱柱算子P满足∂P+P∂=g_#-f_#，将单纯形×I剖分为单纯形之和。于是f_#和g_#链同伦，诱导相同同调。"}],"applications":"同调群在计算拓扑学中广泛应用：持久同调用于数据分析、图像识别、传感器网络覆盖分析；在计算生物学中预测蛋白质结构；在材料科学中分析多孔介质的拓扑结构。","refs":[{"book":"Hatcher","ch":"Ch.2","sec":"§2.1"},{"book":"Munkres","ch":"Ch.1","sec":"§5"}],"subject":"topo"},{"id":"t11","label":"奇异同调","chapter":"ch2","layer":1,"desc":"奇异同调通过连续映射定义同调，具有函子性和同伦不变性等优良性质。","content":"奇异同调是单纯同调的推广，不需要三角剖分即可定义。奇异 n 维单纯形是连续映射 σ: Δ^n→X。奇异链群 C_n(X) 是奇异单纯形生成的自由阿贝尔群，边界算子定义方式与单纯同调类似。奇异同调群 H_n(X) = ker ∂_n / im ∂_{n+1}。奇异同调的核心优势：(1) 函子性：连续映射 f: X→Y 诱导同态 f_*: H_n(X)→H_n(Y)；(2) 同伦不变性：同伦映射诱导相同同调同态；(3) 切除定理：适当条件下可切除子空间。这些性质使奇异同调成为代数拓扑中最强大的同调理论。","understanding":"奇异同调是单纯同调的'升级版'。单纯同调需要把空间切成三角形，但奇异同调直接使用连续映射来探测空间——任何连续映射从一个标准三角形到你的空间都能'采样'拓扑信息。'奇异'这个词指的是这些映射不需要是嵌入，可以有折叠和自交。这种灵活性使得奇异同调具有很好的理论性质（函子性、同伦不变性），但也使其链群通常无限维，实际计算时仍需转化为单纯同调或其他可计算形式。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><polygon points=\"30,30 80,20 90,60\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"60\" y=\"30\" font-size=\"9\" fill=\"#2563eb\">Δ²</text><path d=\"M120,100 C130,80 160,70 170,90 C180,110 150,120 140,100 Z\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/><text x=\"155\" y=\"80\" font-size=\"9\" fill=\"#dc2626\">σ(Δ²)</text><line x1=\"92\" y1=\"55\" x2=\"128\" y2=\"88\" stroke=\"#333\" stroke-width=\"1.5\" marker-end=\"url(#ar2)\"/><text x=\"110\" y=\"65\" font-size=\"8\" fill=\"#333\">σ</text><defs><marker id=\"ar2\" markerWidth=\"6\" markerHeight=\"6\" refX=\"5\" refY=\"3\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#333\"/></marker></defs><text x=\"100\" y=\"155\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">奇异同调</text><text x=\"100\" y=\"172\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">σ: Δⁿ→X 连续</text><text x=\"100\" y=\"188\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">函子性 + 同伦不变性</text></svg>","examples":[{"title":"可缩空间的同调","content":"若 X 可缩，则 H_0(X)≅Z 且 H_n(X)=0 (n>0)。奇异同调完美捕捉可缩性。"},{"title":"S^n 的同调","content":"H_0(S^n)≅Z, H_n(S^n)≅Z, 其他 H_k(S^n)=0。同调群体现了球面的'n维洞'。"},{"title":"同伦等价保持同调","content":"若 X≃Y，则 H_n(X)≅H_n(Y) ∀n。因此同调是比同胚更弱的拓扑不变量。"}],"theorems":[{"name":"同伦不变性定理","statement":"若 f≃g: X→Y，则 f_*=g_*: H_n(X)→H_n(Y)。特别地，同伦等价空间有同构同调群。","proof":"构造棱柱算子P:C_n(X)→C_{n+1}(Y)：对奇异单纯形σ:Δ^n→X，将棱柱Δ^n×I的标准三角剖分中每个(n+1)维单纯形通过f∘σ或g∘σ映射到Y。验证∂P+P∂=g_#-f_#，故f_#和g_#是链同伦的，诱导相同同调同态。核心是棱柱的三角剖分构造。"},{"name":"切除定理","statement":"若 Z⊂A⊂X 且 Z̄⊂Int(A)，则包含映射 (X\\Z, A\\Z)→(X,A) 诱导同调同构。","proof":"将X中的奇异链通过重心重分细分为小单纯形，使其像要么落在A中，要么落在X\\Z中。由条件Z̄⊂Int(A)，重分足够细时，每个单纯形若与Z相交，则其像必完全落在A中。故X中的链可分解为A和X\\Z中链的和，核心是重心重分将链'推入'A或X\\Z。"}],"applications":"奇异同调为同调论提供了坚实的理论基础，其公理化方法（Eilenberg-Steenrod公理）统一了各种同调理论。在微分拓扑中，de Rham同调与奇异同调的同构（de Rham定理）连接了分析与拓扑。","refs":[{"book":"Hatcher","ch":"Ch.2","sec":"§2.1"},{"book":"Munkres","ch":"Ch.4","sec":"§29"}],"subject":"topo"},{"id":"t12","label":"正合序列与切除","chapter":"ch2","layer":2,"desc":"正合序列是代数拓扑中的核心计算工具，特别是空间对的长正合序列。","content":"正合序列是群同态序列 ...→A→B→C→... 满足每个同态的像等于下一个同态的核。空间对 (X,A) 诱导同调长正合序列：...→H_n(A)→H_n(X)→H_n(X,A)→H_{n-1}(A)→...。连接同态 ∂: H_n(X,A)→H_{n-1}(A) 取相对闭链的边界。切除定理：若 Z⊂A⊂X 且闭包 Z̄⊂Int(A)，则 H_n(X\\Z, A\\Z)≅H_n(X,A)。正合序列和切除定理是计算同调群的两大支柱：正合序列连接不同空间的同调，切除定理允许'切除'不重要的部分。","understanding":"正合序列就像'同调记账'：它精确记录了空间、子空间和商空间之间的同调群如何相互关联。关键原则是'进多少出多少'——每个群中进入的映射的像，恰好等于出去的映射的核。切除定理则告诉你：在计算相对同调时，你可以把子空间内部'挖掉'而不改变同调。这就像做手术：只要切得干净（闭包在内部），拓扑结构不变。这两者结合，使得从简单空间计算复杂空间的同调成为可能。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"5\" y=\"55\" width=\"40\" height=\"20\" rx=\"3\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1\"/><text x=\"25\" y=\"69\" font-size=\"7\" fill=\"#2563eb\" text-anchor=\"middle\">Hn(A)</text><rect x=\"55\" y=\"55\" width=\"40\" height=\"20\" rx=\"3\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1\"/><text x=\"75\" y=\"69\" font-size=\"7\" fill=\"#dc2626\" text-anchor=\"middle\">Hn(X)</text><rect x=\"105\" y=\"55\" width=\"40\" height=\"20\" rx=\"3\" fill=\"#fef3c7\" stroke=\"#d97706\" stroke-width=\"1\"/><text x=\"125\" y=\"69\" font-size=\"7\" fill=\"#d97706\" text-anchor=\"middle\">Hn(X,A)</text><rect x=\"155\" y=\"55\" width=\"40\" height=\"20\" rx=\"3\" fill=\"#e0f2fe\" stroke=\"#0d9488\" stroke-width=\"1\"/><text x=\"175\" y=\"69\" font-size=\"7\" fill=\"#0d9488\" text-anchor=\"middle\">Hn₋₁(A)</text><line x1=\"46\" y1=\"65\" x2=\"53\" y2=\"65\" stroke=\"#333\" stroke-width=\"1\"/><line x1=\"96\" y1=\"65\" x2=\"103\" y2=\"65\" stroke=\"#333\" stroke-width=\"1\"/><line x1=\"146\" y1=\"65\" x2=\"153\" y2=\"65\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"100\" y=\"40\" font-size=\"9\" fill=\"#333\" font-weight=\"bold\">长正合序列</text><text x=\"100\" y=\"100\" font-size=\"10\" fill=\"#333\">im = ker (正合性)</text><text x=\"100\" y=\"120\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">切除定理</text><rect x=\"30\" y=\"140\" width=\"70\" height=\"40\" rx=\"2\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><rect x=\"90\" y=\"140\" width=\"70\" height=\"40\" rx=\"2\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"65\" y=\"165\" font-size=\"9\" fill=\"#dc2626\" text-anchor=\"middle\">A</text><text x=\"125\" y=\"165\" font-size=\"9\" fill=\"#2563eb\" text-anchor=\"middle\">XA</text><text x=\"100\" y=\"195\" font-size=\"8\" fill=\"#333\">Z̄⊂Int(A) ⇒ H(XZ,AZ)≅H(X,A)</text></svg>","examples":[{"title":"球面同调的计算","content":"利用 (D^n, S^{n-1}) 的长正合序列和切除定理，推出 H_k(S^n) ≅ Z (k=0,n) 或 0 (其他)。"},{"title":"Mayer-Vietoris序列","content":"由正合序列和切除定理导出，将空间分解为两个开集计算同调，是van Kampen定理的同调版本。"},{"title":"相对同调的计算","content":"利用 (X,A) 的长正合序列，从 H_n(A) 和 H_n(X) 可推出 H_n(X,A) 的部分信息。"}],"theorems":[{"name":"空间对长正合序列","statement":"对空间对 (X,A)，存在长正合序列 ...→H_n(A)→H_n(X)→H_n(X,A)→H_{n-1}(A)→...。","proof":"由短正合序列0→C_n(A)→C_n(X)→C_n(X,A)→0诱导同调长正合序列（蛇形引理）。连接同态∂:H_n(X,A)→H_{n-1}(A)定义为：取相对闭链的代表c∈C_n(X)，其边界∂c∈C_{n-1}(A)是A中的闭链，∂([c])=[∂c]。正合性验证依赖图追踪法。"},{"name":"切除定理(Eilenberg-Steenrod)","statement":"若 Z̄⊂Int(A)，则包含映射 (X\\Z, A\\Z)→(X,A) 诱导同调同构。","proof":"取U=X\\Z，则Ū⊂Int(A)的补集条件等价于Z̄⊂Int(A)。U和A的内部覆盖X。用重心重分将奇异链细分为落在U或A中的小链。证明C_n^{U+A}(X)的包含映射是链同伦等价，从而是拟同构。这是Eilenberg-Steenrod公理体系的切除公理。"}],"applications":"正合序列方法广泛用于同调代数和代数拓扑。在代数几何中，层上同调的长正合序列是核心工具；在微分拓扑中，用于计算流形的同调群；在K理论中，正合序列是基本计算工具。","refs":[{"book":"Hatcher","ch":"Ch.2","sec":"§2.1"},{"book":"Munkres","ch":"Ch.4","sec":"§32"}],"subject":"topo"},{"id":"t13","label":"Mayer-Vietoris序列","chapter":"ch2","layer":2,"desc":"同调版本的空间分解定理，通过两个开子集的同调群计算整个空间的同调群。","content":"Mayer-Vietoris 序列是同调论中与 van Kampen 定理地位相当的核心工具。设 X = U∪V，其中 U, V 为开集（或使内部覆盖 X 的子空间）。则存在长正合序列：...→H_n(U∩V)→H_n(U)⊕H_n(V)→H_n(X)→H_{n-1}(U∩V)→...。其中第一个映射为 (i_*, j_*)，i: U∩V→U, j: U∩V→V；第二个映射为 (k_*-l_*)，k: U→X, l: V→X。连接同态 ∂: H_n(X)→H_{n-1}(U∩V) 由'重心重分'构造。M-V序列是正合序列和切除定理的直接推论，但使用起来更加直接便利。","understanding":"Mayer-Vietoris 序列是'分而治之'策略的完美体现：把复杂空间切成两块 U 和 V，你知道每块以及它们重叠部分的同调，就能通过长正合序列推断整体的同调。这就像侦探破案：知道两个嫌疑人的各自信息以及他们的交集，就能推断整个案件。M-V 序列的魔法在于正合性：它精确限定了哪些组合是可能的，使得你从部分信息就能唯一确定整体结构。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><ellipse cx=\"75\" cy=\"55\" rx=\"50\" ry=\"35\" fill=\"#dbeafe\" fill-opacity=\"0.5\" stroke=\"#2563eb\" stroke-width=\"2\"/><ellipse cx=\"125\" cy=\"55\" rx=\"50\" ry=\"35\" fill=\"#fce7f3\" fill-opacity=\"0.5\" stroke=\"#dc2626\" stroke-width=\"2\"/><text x=\"50\" y=\"45\" font-size=\"10\" fill=\"#2563eb\" font-weight=\"bold\">U</text><text x=\"145\" y=\"45\" font-size=\"10\" fill=\"#dc2626\" font-weight=\"bold\">V</text><text x=\"92\" y=\"70\" font-size=\"9\" fill=\"#7c3aed\">U∩V</text><text x=\"100\" y=\"105\" font-size=\"9\" fill=\"#333\">...→Hn(U∩V)→Hn(U)⊕Hn(V)→</text><text x=\"100\" y=\"120\" font-size=\"9\" fill=\"#333\">Hn(X)→Hn₋₁(U∩V)→...</text><text x=\"100\" y=\"145\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">Mayer-Vietoris 序列</text><text x=\"100\" y=\"165\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">X = U ∪ V</text><text x=\"100\" y=\"180\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">分而治之计算同调</text></svg>","examples":[{"title":"球面 S^n 的同调","content":"将 S^n 分解为两个半球 D^n_+ 和 D^n_-，交为 S^{n-1}。M-V序列给出 H_k(S^n) 的递推计算。"},{"title":"环面 T^2 的同调","content":"用 M-V 序列分解环面为两个圆柱，交为两个圆周，得到 H_1(T^2)≅Z², H_2(T^2)≅Z。"},{"title":"Klein 瓶的同调","content":"M-V 序列给出 H_1(K)≅Z⊕Z/2, H_2(K)=0，与环面在 H_1 中有扭转分量不同。"}],"theorems":[{"name":"Mayer-Vietoris 定理","statement":"若 X = Int(U)∪Int(V)，则存在长正合序列连接 H_n(U∩V), H_n(U)⊕H_n(V), H_n(X)。","proof":"考虑短正合序列0→C_n(U∩V)→C_n(U)⊕C_n(V)→C_n^{U+V}(X)→0，其中C_n^{U+V}由像落在U或V中的链生成。由切除定理，H_n^{U+V}(X)≅H_n(X)。诱导长正合序列即Mayer-Vietoris序列。连接同态由重心重分构造：X中闭链分解为U和V中链的和。"},{"name":"诱导长正合序列","statement":"M-V 序列关于包含映射自然，且可通过上述图表直接构造，是正合序列和切除的推论。","proof":"连接同态∂:H_n(X)→H_{n-1}(U∩V)由重分构造：取X中闭链z，重分为u+v（u在U中，v在V中），则∂z=∂u=-∂v落在U∩V中。∂([z])=[∂u]∈H_{n-1}(U∩V)。自然性来自链映射的交换性：若f:X→Y保持覆盖，则诱导M-V序列间的映射交换。"}],"applications":"Mayer-Vietoris 序列广泛应用于计算流形、CW复形和代数簇的同调。在微分拓扑中，用于计算流形连通和（connected sum）的同调；在扭结理论中，用于计算扭结补空间的同调群。","refs":[{"book":"Hatcher","ch":"Ch.2","sec":"§2.2"},{"book":"Munkres","ch":"Ch.4","sec":"§33"}],"subject":"topo"},{"id":"t14","label":"CW复形的同调","chapter":"ch2","layer":2,"desc":"CW复形是现代代数拓扑的标准工作空间，其同调可通过胞腔结构高效计算。","content":"CW 复形由逐次粘贴胞腔构造：从离散点集 X⁰ 开始，通过粘贴映射 φ_α: S^{n-1}→X^{n-1} 将 n 维盘 D^n_α 粘贴上去得到 n 维骨架 X^n。CW 复形是代数拓扑的'标准工作空间'，兼具计算便利性和理论充分性。CW 复形的同调可通过胞腔链复形计算：C_n^{CW}(X) = H_n(X^n, X^{n-1})，这是自由阿贝尔群，秩等于 n 维胞腔数。边界算子由粘贴映射的度数确定。由此得到的胞腔同调与奇异同调同构。CW 复形涵盖几乎所有常见的拓扑空间。","understanding":"CW 复形就是'用乐高积木搭空间'：从一些点（0维积木）开始，粘上一些线段（1维积木），再粘上一些圆盘（2维积木），依此类推。'C'代表闭包有限（closure-finite），'W'代表弱拓扑（weak topology）。关键优势是：同调群的计算只需要知道每一维有多少块积木，以及它们是如何粘上去的——不需要处理无穷维的奇异链群。几乎所有你关心的空间（流形、代数簇、分类空间）都是CW复形。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"50\" cy=\"145\" r=\"4\" fill=\"#2563eb\"/><text x=\"50\" y=\"165\" font-size=\"8\" fill=\"#2563eb\" text-anchor=\"middle\">X⁰(点)</text><circle cx=\"100\" cy=\"145\" r=\"4\" fill=\"#2563eb\"/><circle cx=\"150\" cy=\"145\" r=\"4\" fill=\"#2563eb\"/><line x1=\"50\" y1=\"141\" x2=\"100\" y2=\"141\" stroke=\"#dc2626\" stroke-width=\"2\"/><text x=\"75\" y=\"135\" font-size=\"8\" fill=\"#dc
