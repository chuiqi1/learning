 115,45\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1\"/><path d=\"M35,152 Q55,105 75,85 Q95,65 125,55\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1\"/><line x1=\"70\" y1=\"80\" x2=\"65\" y2=\"75\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/><line x1=\"70\" y1=\"80\" x2=\"75\" y2=\"85\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/><text x=\"75\" y=\"72\" font-size=\"9\" fill=\"#7c3aed\">J(t)</text><text x=\"30\" y=\"40\" font-size=\"9\" fill=\"#2563eb\">∇_γ'∇_γ'J + R(J,γ')γ' = 0</text><text x=\"30\" y=\"55\" font-size=\"8\" fill=\"#dc2626\">测地线变分</text></svg>","examples":[{"title":"欧氏空间","content":"Rⁿ中曲率为零，Jacobi方程退化为 J''(t)=0，解为 J(t)=J(0)+tJ'(0)，Jacobi场线性增长。"},{"title":"球面Sⁿ","content":"Sⁿ(1)上，法Jacobi方程为 J''+J=0（因R(J,γ')γ'=J），解为 J(t)=sin(t)·A+cos(t)·B，呈周期振荡。"},{"title":"双曲空间Hⁿ","content":"Hⁿ(-1)上，法Jacobi方程为 J''-J=0，解为 J(t)=sinh(t)·A+cosh(t)·B，指数增长。"}],"theorems":[{"name":"Jacobi方程","statement":"沿测地线γ的Jacobi场J满足 ∇_γ'∇_γ' J + R(J, γ')γ' = 0。","proof":"设Γ(s,t)是测地线变分，Γ(0,t)=γ(t)，J(t)=∂Γ/∂s|_{s=0}。由测地线条件∇_t ∂Γ/∂t = 0，对s求导得∇_s∇_t ∂Γ/∂t = 0。利用无挠性交换协变导数：∇_s∇_t ∂Γ/∂t = ∇_t∇_s ∂Γ/∂t + R(∂Γ/∂s, ∂Γ/∂t)∂Γ/∂t。再次交换∇_t∇_s ∂Γ/∂t = ∇_t∇_t ∂Γ/∂s。在s=0处，∂Γ/∂t=γ'，∂Γ/∂s=J，得 ∇_γ'∇_γ' J + R(J,γ')γ' = 0。这是几何光学中'测地线偏离方程'的数学基础。"}],"applications":"天体力学中行星轨道稳定性分析；广义相对论中测地线偏离方程（潮汐力）；宇宙学中光锥的聚焦效应。","refs":{"book":"Lee","ch":"Ch.9","sec":"§9.1"}},{"id":"r45","label":"共轭点","chapter":"ch9","layer":0,"desc":"共轭点是沿测地线存在非零Jacobi场在两端都为零的点对，是测地线最短性失效的前兆，与割点密切相关。","content":"点q = γ(b)称为p = γ(a)沿测地线γ的共轭点，如果存在非零Jacobi场J满足J(a)=J(b)=0。共轭点的重数等于满足此条件的线性无关Jacobi场的个数。共轭点的第一变分特征：b是p的共轭点当且仅当指数映射exp_p在bγ'(0)处有退化微分。共轭点总是出现在割点之前或同时：若γ(b)是p沿γ的第一个割点，则要么γ(b)是p的共轭点，要么有另一条同样长度的测地线连接p和γ(b)。共轭点的分布由曲率控制：正曲率产生共轭点，负曲率抑制共轭点。","understanding":"共轭点就像测地线的'焦点'。从一点出发的所有测地线在共轭点处'汇聚'。在球面上，北极的对径点（南极）是北极的共轭点——所有从北极出发的大圆都在南极汇聚。当多条测地线汇聚于同一点时，它们中至少有一条在越过该点后不再是最短路径。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"60\" cy=\"60\" r=\"3\" fill=\"#dc2626\"/><text x=\"50\" y=\"50\" fill=\"#dc2626\" font-size=\"9\">p</text><circle cx=\"140\" cy=\"100\" r=\"3\" fill=\"#7c3aed\"/><text x=\"145\" y=\"95\" fill=\"#7c3aed\" font-size=\"9\">q</text><path d=\"M60,60 Q80,70 100,80 Q120,90 140,100\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><path d=\"M60,60 Q90,80 110,90 Q130,95 140,100\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1\" stroke-dasharray=\"4,4\"/><path d=\"M60,60 Q70,90 90,100 Q110,105 140,100\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1\" stroke-dasharray=\"4,4\"/><text x=\"90\" y=\"65\" font-size=\"8\" fill=\"#7c3aed\">J(0)=0</text><text x=\"130\" y=\"85\" font-size=\"8\" fill=\"#7c3aed\">J(b)=0</text></svg>","examples":[{"title":"球面Sⁿ","content":"Sⁿ(1)上，从p出发的测地线在距离π处到达对径点-p，这是p的共轭点。第一个共轭点出现在距离π处。"},{"title":"欧氏空间","content":"Rⁿ中不存在共轭点。所有测地线（直线）永不相交，Jacobi场J(t)=J(0)+tJ'(0)只在t=0时为零。"},{"title":"平坦环面T²","content":"T²上虽无共轭点（曲率为零），但存在割点（因多条等长测地线连接同两点），展示共轭点与割点的区别。"}],"theorems":[{"name":"共轭点定理","statement":"若γ(b)是γ(a)的第一个共轭点，则γ在[a,b]上最短，但在[a,b+ε]上不再最短（ε>0）。","proof":"若γ(b)是γ(a)的第一个共轭点，则存在非零Jacobi场J满足J(a)=J(b)=0。将J扩展为沿γ的变分场（在[a,b]上为零，在b之后非零）。计算第二变分：在[a,b]上δ²E(J,J)=0（因为J是Jacobi场且满足边界条件），在[b,b+ε]上可构造使δ²E<0的变分。因此存在从γ(a)到γ(b+ε)的比γ更短的曲线。这证明了第一个共轭点之后测地线不再是最短的。"}],"applications":"最优控制理论中轨迹的共轭点检测；航天器轨道优化；光学中焦散线和聚焦现象。","refs":{"book":"Lee","ch":"Ch.9","sec":"§9.2"}},{"id":"r46","label":"第二变分公式","chapter":"ch9","layer":1,"desc":"第二变分公式给出能量泛函的二阶导数，用Jacobi场和曲率表达，是判断测地线稳定性的基本工具。","content":"能量泛函E(γ)在测地线处的第二变分公式为：δ²E(V,W) = ∫⟨∇_γ'V, ∇_γ'W⟩ - ⟨R(V,γ')γ', W⟩ dt（对分段光滑变分场V,W）。当V=W为法Jacobi场时，δ²E(V,V) = -∫⟨V, ∇_γ'∇_γ'V + R(V,γ')γ'⟩ dt + 边界项。如果测地线γ上存在共轭点，则存在变分场使第二变分为负，即γ不是极小值。Morse指标定理：测地线上共轭点（计重数）的个数等于第二变分负特征值的个数（Morse指标）。这建立了变分理论与Jacobi场理论的桥梁。","understanding":"第二变分公式就像'二阶导数测试'。对于函数，二阶导数为正意味着极小值。对于测地线，第二变分公式告诉你路径的长度是否真的是极小值。如果存在一个'扰动方向'使得长度减小（第二变分为负），那么这条测地线就不是最短路径。共轭点就是这种'扰动方向'存在的标志。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M30,30 Q100,50 170,150\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"100\" y=\"45\" font-size=\"9\" fill=\"#2563eb\">γ (测地线)</text><path d=\"M30,30 Q70,70 100,100 Q140,135 170,150\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1\" stroke-dasharray=\"4,4\"/><text x=\"75\" y=\"80\" font-size=\"8\" fill=\"#dc2626\">γ+εV</text><text x=\"25\" y=\"170\" font-size=\"9\" fill=\"#7c3aed\">δ²E(V,V) = ∫|∇V|² - ⟨R(V,γ')γ',V⟩</text></svg>","examples":[{"title":"球面上的大圆","content":"S²上长度小于π的大圆弧是极小值，第二变分正定。长度等于π的大圆弧（半圆）有零特征值（共轭点）。"},{"title":"Morse指标定理","content":"Morse指标定理：能量泛函在测地线上的Morse指标等于共轭点的个数（计重数），将变分理论与Jacobi场理论联系起来。"},{"title":"极小曲面的第二变分","content":"极小曲面的第二变分公式涉及Jacobi算子 Δ + |II|² + Ric(ν,ν)，是研究极小曲面稳定性的基础。"}],"theorems":[{"name":"第二变分公式","statement":"δ²E(V,V) = ∫_a^b (|∇_γ'V|² - ⟨R(V,γ')γ',V⟩) dt。若γ上存在共轭点，则存在V使δ²E(V,V)<0。","proof":"考虑能量泛函E(γ_s)对变分参数s的二阶导数。设Γ(s,t)为变分，V(t)=∂Γ/∂s|_{s=0}。计算d²E/ds²|_{s=0} = ∫(⟨∇_s∂Γ/∂t, ∇_s∂Γ/∂t⟩ + ⟨∂Γ/∂t, ∇_s∇_s∂Γ/∂t⟩) dt|_{s=0}。利用无挠性交换导数，∇_s∂Γ/∂t = ∇_t V，∇_s∇_s∂Γ/∂t = ∇_t∇_s V + R(V,γ')V。代入得δ²E = ∫(|∇_γ'V|² - ⟨R(V,γ')γ',V⟩) dt + 边界项。若存在共轭点，取对应Jacobi场为零边界条件的变分，得δ²E=0。"}],"applications":"Morse理论在测地线问题中的应用；极小曲面稳定性分析；结构力学中屈曲分析（失稳路径）。","refs":{"book":"Lee","ch":"Ch.9","sec":"§9.3"}},{"id":"r47","label":"测地线变分与Morse理论","chapter":"ch9","layer":2,"desc":"Morse理论将能量泛函的临界点拓扑与流形本身的拓扑联系起来，Jacobi场和共轭点提供了Morse指标的计算工具。","content":"Morse理论在黎曼几何中的应用是研究路径空间Ω(M;p,q)的拓扑。能量泛函E: Ω→R的临界点是测地线，Morse指标（第二变分负特征值个数）等于沿测地线的共轭点个数。Morse不等式给出：临界点个数 ≥ Betti数之和。特别地，若M的拓扑非平凡，则必存在连接p,q的测地线。对于闭测地线，Lyusternik-Fet定理保证任何紧致流形上存在闭测地线。Bott的等变Morse理论将这一结果推广到带对称性的情形。Morse理论是连接分析与拓扑的桥梁。","understanding":"Morse理论就像'地形分析'：能量泛函是'地形高度'，测地线是'山顶'、'山谷'或'鞍点'（临界点）。每个临界点有一个'指标'（向下方向的数量），通过数地形图上各类临界点的个数，可以推断地形的'洞数'（Betti数）。这就像看地形图推断地下结构——不需要挖掘就能知道。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M30,150 Q60,100 100,90 Q140,80 170,110\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"60\" cy=\"100\" r=\"3\" fill=\"#dc2626\"/><text x=\"50\" y=\"95\" font-size=\"8\" fill=\"#dc2626\">临界点</text><circle cx=\"140\" cy=\"80\" r=\"3\" fill=\"#dc2626\"/><text x=\"130\" y=\"90\" font-size=\"8\" fill=\"#dc2626\">临界点</text><text x=\"30\" y=\"50\" font-size=\"9\" fill=\"#2563eb\">E: Ω → R</text><text x=\"30\" y=\"65\" font-size=\"8\" fill=\"#7c3aed\">Morse指标 = 共轭点数</text><text x=\"30\" y=\"80\" font-size=\"8\" fill=\"#dc2626\">临界点数 ≥ Σβ_i</text></svg>","examples":[{"title":"球面Sⁿ上的测地线","content":"Sⁿ上连接对径点的测地线有无穷多条（所有大圆），Morse理论解释了为什么临界点有如此高的退化性。"},{"title":"Lie群上的闭测地线","content":"紧致Lie群上，单参数子群是闭测地线。Morse理论可以估计闭测地线的数量和分布。"},{"title":"Bott周期定理","content":"Bott将Morse理论应用于Loop空间Ω(Sⁿ)，得到了稳定同伦群的Bott周期性定理。"}],"theorems":[{"name":"Morse指标定理","statement":"能量泛函在测地线上的Morse指标等于沿该测地线的共轭点个数（计重数）。","proof":"Morse指标是第二变分δ²E的负特征值个数。将第二变分写为∫⟨LV,V⟩ dt，其中L = -∇_γ'² - R(·,γ')γ'是Jacobi算子。L的特征值问题等价于Sturm-Liouville问题。由Sturm比较定理，特征值变号恰好发生在Jacobi场有零点时，即共轭点处。每个共轭点贡献一个负特征值（重数由共轭点的重数决定）。因此Morse指标 = 共轭点个数（计重数）。这是Morse理论在变分法中的核心结论。"}],"applications":"Morse同调与Floer同调理论；拓扑数据分析中的Morse-Smale复形；量子力学中路径积分的半经典近似。","refs":{"book":"Lee","ch":"Ch.9","sec":"§9.4"}},{"id":"r48","label":"Rauch比较定理","chapter":"ch10","layer":0,"desc":"Rauch比较定理比较曲率有上下界的流形中Jacobi场的增长，是曲率下界控制几何行为的核心工具。","content":"Rauch比较定理：设M和M~是完备黎曼流形，截面曲率满足 K ≥ K~。沿测地线γ和γ~，给定初始条件相同的Jacobi场J和J~，若γ上无共轭点，则 |J(t)| ≤ |J~(t)|。等价地，正曲率使Jacobi场增长变慢（或振荡），负曲率使Jacobi场增长变快。Rauch定理是几乎所有比较定理（体积比较、距离比较、Toponogov定理）的基石。其证明基于第二变分公式和指标形式。Rauch定理的关键应用是证明球面定理：若截面曲率介于1/4和1之间，则流形同胚于球面。","understanding":"Rauch定理说：曲率越大，空间越'紧'，Jacobi场（测地线的偏离）增长越慢。在球面上（正曲率），Jacobi场振荡，从北极出发的测地线先发散后汇聚；在双曲空间（负曲率），Jacobi场指数增长，测地线永远发散。曲率就像一个'弹簧'——正曲率是拉力，负曲率是推力。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M30,150 Q40,120 50,100 Q60,80 70,70\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/><text x=\"35\" y=\"140\" font-size=\"8\" fill=\"#dc2626\">K小</text><path d=\"M30,150 Q35,110 40,90 Q45,70 50,60\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"15\" y=\"140\" font-size=\"8\" fill=\"#2563eb\">K大</text><text x=\"30\" y=\"50\" font-size=\"9\" fill=\"#7c3aed\">|J(t)| ≤ |J~(t)|</text><text x=\"30\" y=\"65\" font-size=\"8\" fill=\"#dc2626\">当 K ≥ K~</text><text x=\"30\" y=\"80\" font-size=\"8\" fill=\"#2563eb\">正曲率→Jacobi场增长慢</text></svg>","examples":[{"title":"球面vs欧氏空间","content":"Sⁿ(1)上Jacobi场满足J''+J=0，|J(t)|≤|J(0)|cos t+|J'(0)|sin t。Rⁿ上J''=0，|J(t)|=|J(0)+tJ'(0)|线性增长。"},{"title":"双曲空间vs欧氏空间","content":"Hⁿ(-1)上J''-J=0，|J(t)|指数增长。Rauch定理给出：负曲率空间中Jacobi场增长快于欧氏空间。"},{"title":"球面定理","content":"若截面曲率 1/4 < K ≤ 1，则流形同胚于Sⁿ。上界1防止过大的曲率，下界1/4由Rauch定理和共轭点比较得出。"}],"theorems":[{"name":"Rauch比较定理","statement":"若 K_M ≥ K_M~，则沿等长测地线且相同初始条件的Jacobi场满足 |J(t)| ≤ |J~(t)|（在无共轭点区间）。","proof":"考虑函数f(t) = |J(t)|²/|J~(t)|²。计算f'(t)并利用Jacobi方程。关键步骤：定义指标形式I_t(J,J) = ∫_0^t (|∇J|² - ⟨R(J,γ')γ',J⟩) ds。由曲率条件K_M ≥ K_M~，有I_t(J,J) ≤ I_t(J~,J~)。然后利用指标形式的性质，比较J和J~的增长率。通过分析f(t)的导数并用曲率不等式，可证f(t) ≤ 1，即|J(t)| ≤ |J~(t)|。这是所有比较定理的基石。"}],"applications":"球面定理和刚性定理；广义相对论中奇点定理（如Hawking-Penrose定理）；Gromov-Hausdorff收敛理论。","refs":{"book":"Lee","ch":"Ch.10","sec":"§10.1"}},{"id":"r49","label":"Toponogov定理","chapter":"ch10","layer":1,"desc":"Toponogov定理将截面曲率下界与测地三角形的边长和角度关系联系起来，是理解曲率几何效应的几何化工具。","content":"Toponogov定理：设M是完备黎曼流形，截面曲率满足 K ≥ c。以测地线段为边的三角形，其边长满足与常曲率c空间中的比较三角形（Alexandrov三角形）相同的边长-角度不等式。具体地，若M中三角形边长a,b,c与常曲率c空间中三角形边长相同，则M中对应边所对的角度不小于常曲率空间中的对应角度。换言之，曲率下界决定了三角形'张开'的程度。Toponogov定理是Rauch定理的全局化，也是研究曲率有下界的度量空间（Alexandrov空间）的出发点。","understanding":"Toponogov定理说：曲率越大的空间，三角形越'胖'（内角越大）。在球面上（正曲率），三角形内角和大于180度；在欧氏空间中等于180度；在双曲空间中小于180度。如果你知道一个空间的最小曲率，你就能知道三角形最多能有多'瘦'。这就像知道了地面的'隆起程度'，就能推断道路的最短路径。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"100,30 160,120 40,120\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"90\" y=\"100\" font-size=\"9\" fill=\"#dc2626\">α</text><text x=\"120\" y=\"100\" font-size=\"9\" fill=\"#dc2626\">β</text><text x=\"100\" y=\"50\" font-size=\"9\" fill=\"#dc2626\">γ</text><polygon points=\"100,55 140,115 60,115\" fill=\"none\" stroke=\"#7c3aed\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><text x=\"80\" y=\"140\" font-size=\"9\" fill=\"#2563eb\">K≥c → α≥α_c</text><text x=\"80\" y=\"155\" font-size=\"8\" fill=\"#7c3aed\">比较三角形</text></svg>","examples":[{"title":"球面定理的应用","content":"Toponogov定理是证明球面定理的关键工具：曲率在1/4和1之间的流形，其三角形角度与球面三角形比较，可推出直径上界。"},{"title":"Alexandrov空间","content":"Toponogov定理启发了Alexandrov空间的定义：度量空间满足'三角形内角≥比较三角形内角'，推广了曲率下界概念。"},{"title":"分裂定理","content":"Cheeger-Gromoll分裂定理的证明依赖于Toponogov定理：若Ric≥0且存在直线，则流形分裂为R×N。"}],"theorems":[{"name":"Toponogov定理","statement":"若截面曲率 K ≥ c，则对任意测地三角形，其顶角不小于常曲率c空间中同边长三角形的对应角。","proof":"Toponogov的证明是Rauch定理的全局化应用。给定测地三角形Δ(p,q,r)，考虑测地线γ连接p到q。在常曲率c空间中构造比较三角形Δ~(p~,q~,r~)（边长相同）。沿γ构造Jacobi场J，比较|J|与|J~|。Rauch定理给出|J(t)| ≤ |J~(t)|。然后利用铰链构造（hinge construction），将角度比较转化为长度比较，再由余弦定理得出角度不等式。这是从局部曲率比较到全局几何比较的关键步骤。"}],"applications":"Alexandrov几何的度量空间理论；Perelman对Poincaré猜想的证明；Gromov-Hausdorff收敛中的极限空间分析。","refs":{"book":"Lee","ch":"Ch.10","sec":"§10.2"}},{"id":"r50","label":"体积比较定理","chapter":"ch10","layer":1,"desc":"Bishop-Gromov体积比较定理给出曲率有下界的流形中测地球体积的上界，是黎曼几何最基本的比较定理之一。","content":"Bishop-Gromov体积比较定理：若完备黎曼流形M满足 Ric ≥ (n-1)c·g，则对任意p∈M，比值 Vol(B(p,r)) / V_c(r) 随r单调非增，且 ≤ 1。其中V_c(r)是常曲率c空间中半径为r的球的体积。特别地，Vol(B(p,r)) ≤ V_c(r)。当c=0时，Vol(B(p,r)) ≤ ω_n r^n（欧氏体积）。当c>0时，Bonnet-Myers定理给出直径上界。Gromov的紧致性定理直接依赖于体积比较：截面曲率有界、直径有界、体积有下界的流形集合在Gromov-Hausdorff拓扑下紧致。体积比较还是研究Ricci曲率下界空间的基础。","understanding":"体积比较定理说：曲率限制了空间能'装下'多少体积。在正曲率空间中，球的体积小于欧氏空间中同半径球的体积（因为空间被'捏紧'了）。在负曲率空间中，球的体积可以远远大于欧氏空间（因为空间被'撑开'了）。这个定理是理解宇宙大小和形状的基本工具：如果宇宙的平均曲率为正，它的总体积是有限的。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"60\" cy=\"60\" r=\"30\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/><text x=\"30\" y=\"50\" font-size=\"8\" fill=\"#dc2626\">K>0</text><text x=\"30\" y=\"65\" font-size=\"8\" fill=\"#dc2626\">体积小</text><circle cx=\"140\" cy=\"60\" r=\"45\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"125\" y=\"50\" font-size=\"8\" fill=\"#2563eb\">K<0</text><text x=\"125\" y=\"65\" font-size=\"8\" fill=\"#2563eb\">体积大</text><text x=\"50\" y=\"120\" font-size=\"9\" fill=\"#7c3aed\">Vol(B(p,r)) ≤ V_c(r)</text><text x=\"50\" y=\"135\" font-size=\"8\" fill=\"#dc2626\">Ric ≥ (n-1)c → 体积上界</text></svg>","examples":[{"title":"Ricci平坦流形","content":"若Ric≥0，则Vol(B(p,r))/r^n单调非增，且Vol(B(p,r)) ≤ ω_n r^n。Calabi-Yau流形是Ricci平坦的。"},{"title":"正Ricci曲率","content":"若Ric≥(n-1)（即Sⁿ标准度量），则Vol(B(p,r))/V_Sⁿ(r)单调非增，且Vol(B(p,r)) ≤ Vol(Sⁿ) = 2π^{(n+1)/2}/Γ((n+1)/2)。"},{"title":"Gromov紧致性","content":"Gromov紧致性定理：满足|K|≤1, diam≤D, vol≥v>0的n维流形组成的集合在Gromov-Hausdorff拓扑下紧致。"}],"theorems":[{"name":"Bishop-Gromov定理","statement":"若Ric≥(n-1)c·g，则函数 r ↦ Vol(B(p,r))/V_c(r) 单调非增，≤1，且lim_{r→0}=1。","proof":"在法坐标下，体积元dV = A(t,θ) dt dθ，其中A(t,θ)是沿径向测地线的Jacobi场的行列式。Ricci曲率下界给出A(t,θ)满足的微分不等式：A'/A ≤ A_c'/A_c（其中A_c是常曲率c空间中的对应量）。由此A(t,θ)/A_c(t)单调非增，且lim_{t→0} A(t,θ)/A_c(t) = 1。积分得Vol(B(p,r))/V_c(r)单调非增且≤1。Gromov的贡献是将Bishop的逐点比较推广为整体比较。"}],"applications":"Gromov-Hausdorff收敛理论；Ricci流的奇点分析；Perelman的约化体积单调性。","refs":{"book":"Lee","ch":"Ch.10","sec":"§10.3"}},{"id":"r51","label":"Bonnet-Myers定理与直径界","chapter":"ch10","layer":0,"desc":"Bonnet-Myers定理给出正Ricci曲率下流形的直径上界和基本群有限性，是曲率控制全局几何的经典结果。","content":"Bonnet-Myers定理：若完备黎曼流形M满足 Ric ≥ (n-1)/R² · g，则M紧致且直径 diam(M) ≤ πR。此外，M的万有覆盖空间也紧致，因此基本群 π₁(M) 有限。证明思路：沿任意最短测地线构造Jacobi场，利用第二变分公式和Ricci曲率下界，如果测地线长度超过πR，则存在变分使能量减小，矛盾。球面Sⁿ(R)达到直径上界，是刚性情形。Bonnet-Myers定理是最早将曲率下界与全局拓扑联系起来的定理之一，开启了几何拓扑学的新纪元。","understanding":"Bonnet-Myers定理说：如果空间'平均'弯曲程度足够大（正Ricci曲率），那么空间必然是一个'有限'的宇宙——你不可能走无限远，因为空间会'弯曲回来'。球面就是最好的例子：从北极出发，走πR的距离就到达南极，再往前走就回到北极了。正曲率把空间'封闭'起来了。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"100\" cy=\"100\" r=\"55\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"100\" cy=\"100\" r=\"3\" fill=\"#dc2626\"/><text x=\"105\" y=\"95\" font-size=\"9\" fill=\"#dc2626\">p</text><line x1=\"100\" y1=\"45\" x2=\"100\" y2=\"100\" stroke=\"#dc2626\" stroke-width=\"1.5\" stroke-dasharray=\"4,4\"/><text x=\"85\" y=\"70\" font-size=\"8\" fill=\"#dc2626\">≤πR</text><text x=\"25\" y=\"40\" font-size=\"9\" fill=\"#2563eb\">Ric ≥ (n-1)/R²</text><text x=\"25\" y=\"55\" font-size=\"8\" fill=\"#7c3aed\">→ diam ≤ πR</text><text x=\"25\" y=\"70\" font-size=\"8\" fill=\"#dc2626\">→ π₁有限</text></svg>","examples":[{"title":"球面Sⁿ(R)","content":"Sⁿ(R)的Ricci曲率为 (n-1)/R²，直径恰好为πR，达到Bonnet-Myers定理的上界。这是刚性情形。"},{"title":"实射影空间RPⁿ","content":"RPⁿ的Ricci曲率与Sⁿ相同，但直径仅πR/2，基本群为Z₂，验证了Bonnet-Myers定理的有限性结论。"},{"title":"非紧致正Ricci流形","content":"存在Ricci曲率为正的非紧致流形（如R²上的旋转抛物面），说明Ricci正不能保证紧致性，需要一致下界。"}],"theorems":[{"name":"Bonnet-Myers定理","statement":"若完备黎曼流形满足 Ric ≥ (n-1)/R² · g，则 diam(M) ≤ πR，且 π₁(M) 有限。","proof":"设γ: [0,L] → M是长度L的最短测地线。沿γ取n-1个平行标准正交法向量场E_i。定义变分V_i(t) = sin(πt/L)E_i(t)。第二变分公式：δ²E(V_i,V_i) = ∫₀^L (cos²(πt/L)π²/L² - sin²(πt/L)⟨R(E_i,γ')γ',E_i⟩) dt。对i=1至n-1求和，利用Ricci下界条件，得 Σδ²E < 0（若L > πR）。但γ是最短测地线，第二变分应非负，矛盾。故L ≤ πR。万有覆盖的紧致性由类似论证及基本群作用的不连续性得出。"}],"applications":"宇宙学中宇宙年龄和大小估计；几何拓扑中流形分类；广义相对论中闭合宇宙模型。","refs":{"book":"Lee","ch":"Ch.10","sec":"§10.4"}},{"id":"r52","label":"Gromov-Hausdorff收敛与极限空间","chapter":"ch10","layer":3,"desc":"Gromov-Hausdorff收敛是度量空间之间的收敛概念，曲率有界流形序列的极限空间分析是当代几何分析的前沿。","content":"Gromov-Hausdorff距离d_GH(X,Y)度量两个紧致度量空间之间的'形状差异'，定义为等距嵌入到同一度量空间后Hausdorff距离的下确界。Gromov紧致性定理：满足|K|≤1, diam≤D, vol≥v>0的n维黎曼流形集合在GH拓扑下紧致。极限空间可以是奇异空间（Alexandrov空间），具有推广的曲率条件。Fukaya的破裂理论（collapse theory）研究体积趋于零的序列，极限空间可以是低维的。Cheeger-Colding理论研究了Ricci曲率有下界序列的极限空间结构和正则性。","understanding":"Gromov-Hausdorff收敛就像'形状的极限'。想象一系列越来越细的环面（甜甜圈越来越薄），它们的极限是一条线段（一维）。或者想象一个球面被压扁，极限是一个圆盘。Gromov-Hausdorff收敛允许维数在极限中'崩塌'。Perelman证明Poincaré猜想时就用到了Gromov-Hausdorff收敛来分析Ricci流中的奇点。","svg":"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"><ellipse cx=\"60\" cy=\"60\" rx=\"30\" ry=\"20\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"45\" y=\"95\" font-size=\"8\" fill=\"#dc2626\">M₁</text><ellipse cx=\"120\" cy=\"60\" rx=\"25\" ry=\"15\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"105\" y=\"95\" font-size=\"8\" fill=\"#2563eb\">M₂</text><line x1=\"60\" y1=\"120\" x2=\"170\" y2=\"120\" stroke=\"#7c3aed\" stroke-width=\"2\"/><text x=\"100\" y=\"135\" font-size=\"8\" fill=\"#7c3aed\">M_∞ (极限)</text><text x=\"30\" y=\"160\" font-size=\"8\" fill=\"#dc2626\">d_GH(M_i, M_∞) → 0</text></svg>","examples":[{"title":"环面崩塌","content":"平坦环面T²(R,r)（大半径R固定，小半径r→0）的GH极限是圆S¹(R)，维数从2崩塌到1。"},{"title":"Perelman的W-functional","content":"Perelman引入W-泛函的单调性，可用于分析Ricci流的GH极限，证明Poincaré猜想时起了关键作用。"},{"title":"Cheeger-Colding理论","content":"Ricci曲率有下界序列的GH极限空间具有'几乎处处'可微结构，是Lipschitz流形，推广了经典黎曼几何。"}],"theorems":[{"name":"Gromov紧致性定理","statement":"满足|K|≤1, diam≤D, vol≥v>0的n维黎曼流形在Gromov-Hausdorff拓扑下是紧致的。","proof":"Gromov的证明基于两个关键步骤。第一，在曲率有界和直径有界的条件下，利用Bishop-Gromov不等式可以构造覆盖流形的ε-网（ε-net），网的点数由n, D, v控制。第二，有了ε-网后，可以构造到R^N（N依赖于ε和n）的嵌入，距离由网的组合结构确定。所有满足条件的流形可以嵌入到同一个紧致度量空间中，由此得到GH紧致性。体积下界防止流形'崩塌'到低维。"}],"applications":"Ricci流中奇点形成分析；Perelman的Poincaré猜想证明；大数据分析中的度量空间嵌入和降维。","refs":{"book":"Lee","ch":"Ch.10","sec":"§10.5"}}],"edges":[{"source":"r1","target":"r2","label":"推广"},{"source":"r1","target":"r3","label":"维度推广"},{"source":"r3","target":"r4","label":"内蕴性"},{"source":"r4","target":"r5","label":"全局化"},{"source":"r3","target":"r6","label":"前提知识"},{"source":"r4","target":"r6","label":"前提知识"},{"source":"r6","target":"r7","label":"张量运算"},{"source":"r6","target":"r8","label":"对称性"},{"source":"r6","target":"r9","label":"诱导度量"},{"source":"r6","target":"r10","label":"测度"},{"source":"r6","target":"r11","label":"共形变换"},{"source":"r6","target":"r12","label":"前提知识"},{"source":"r8","target":"r15","label":"前提知识"},{"source":"r12","target":"r13","label":"正曲率模型"},{"source":"r12","target":"r14","label":"负曲率模型"},{"source":"r13","target":"r15","label":"分类"},{"source":"r14","target":"r15","label":"分类"},{"source":"r8","target":"r16","label":"Lie群"},{"source":"r12","target":"r17","label":"前提知识"},{"source":"r6","target":"r18","label":"前提知识"},{"source":"r17","target":"r18","label":"特殊化"},{"source":"r18","target":"r19","label":"平行移动"},{"source":"r18","target":"r20","label":"推广"},{"source":"r17","target":"r21","label":"挠率"},{"source":"r19","target":"r22","label":"和乐群"},{"source":"r18","target":"r23","label":"前提知识"},{"source":"r19","target":"r23","label":"前提知识"},{"source":"r23","target":"r24","label":"指数映射"},{"source":"r23","target":"r25","label":"距离"},{"source":"r24","target":"r26","label":"割点"},{"source":"r23","target":"r27","label":"变分原理"},{"source":"r18","target":"r28","label":"前提知识"},{"source":"r17","target":"r28","label":"前提知识"},{"source":"r28","target":"r29","label":"截面"},{"source":"r28","target":"r30","label":"缩并"},{"source":"r28","target":"r31","label":"恒等式"},{"source":"r28","target":"r32","label":"分解"},{"source":"r28","target":"r33","label":"交换子"},{"source":"r29","target":"r34","label":"拓扑"},{"source":"r30","target":"r34","label":"拓扑"},{"source":"r28","target":"r35","label":"前提知识"},{"source":"r18","target":"r35","label":"前提知识"},{"source":"r35","target":"r36","label":"Gauss方程"},{"source":"r35","target":"r37","label":"Codazzi方程"},{"source":"r35","target":"r38","label":"应用"},{"source":"r36","target":"r39","label":"曲率控制"},{"source":"r29","target":"r40","label":"前提知识"},{"source":"r3","target":"r40","label":"前提知识"},{"source":"r40","target":"r41","label":"全局化"},{"source":"r41","target":"r42","label":"拓扑"},{"source":"r41","target":"r43","label":"高维推广"},{"source":"r5","target":"r41","label":"前提知识"},{"source":"r23","target":"r44","label":"前提知识"},{"source":"r28","target":"r44","label":"前提知识"},{"source":"r44","target":"r45","label":"共轭点"},{"source":"r44","target":"r46","label":"第二变分"},{"source":"r46","target":"r47","label":"Morse理论"},{"source":"r27","target":"r46","label":"前提知识"},{"source":"r44","target":"r48","label":"前提知识"},{"source":"r29","target":"r48","label":"前提知识"},{"source":"r48","target":"r49","label":"推广"},{"source":"r48","target":"r50","label":"体积比较"},{"source":"r30","target":"r51","label":"前提知识"},{"source":"r50","target":"r52","label":"极限空间"},{"source":"r49","target":"r52","label":"极限空间"},{"source":"r34","target":"r51","label":"综合应用"},{"source":"r34","target":"r52","label":"综合应用"},{"source":"r41","target":"r34","label":"拓扑约束"},{"source":"r30","target":"r50","label":"前提知识"},{"source":"r1","target":"r40","label":"前提知识"},{"source":"r15","target":"r48","label":"模型空间"}],"quizzes":[{"q":"平面曲线曲率κ(s)的几何意义是什么？","options":["曲线切向量的长度","单位切向量沿曲线的旋转速率","曲线的弧长参数","曲线的挠率"],"answer":1,"explanation":"曲率κ(s) = |γ''(s)|，度量单位切向量沿弧长方向的旋转速率，即曲线偏离直线的程度。","difficulty":"easy","chapter":"ch1"},{"q":"二维球面S²的Gauss曲率是多少？","options":["0","1/R","1/R²","2/R²"],"answer":2,"explanation":"半径为R的球面S²，主曲率均为1/R，Gauss曲率K = κ₁κ₂ = 1/R²。","difficulty":"easy","chapter":"ch1"},{"q":"Gauss绝妙定理（Theorema Egregium）的核心内容是什么？","options":["曲面总曲率等于4π","Gauss曲率仅依赖于第一基本形式","曲面可嵌入R³","所有曲面都共形平坦"],"answer":1,"explanation":"Gauss证明Gauss曲率K仅由第一基本形式（度量）及其导数决定，是曲面的内蕴不变量，不需要外围空间信息。","difficulty":"medium","chapter":"ch1"},{"q":"Frenet-Serret方程中，dN/ds等于什么？","options":["κT","-κT + τB","κN","-τB"],"answer":1,"explanation":"Frenet-Serret方程：dT/ds=κN, dN/ds=-κT+τB, dB/ds=-τN。","difficulty":"medium","chapter":"ch1"},{"q":"圆柱面与平面等距，因此它们的Gauss曲率是什么关系？","options":["圆柱面曲率更大","平面曲率更大","两者曲率相等（均为0）","无法比较"],"answer":2,"explanation":"等距映射保持所有内蕴几何量。圆柱面可在不拉伸的情况下展开为平面，故Gauss曲率均为零。","difficulty":"easy","chapter":"ch1"},{"q":"环面上哪些区域的Gauss曲率为负？","options":["外侧","内侧","顶部和底部圆周","整个环面"],"answer":1,"explanation":"环面外侧K>0（椭圆点），内侧K<0（双曲点），顶部和底部圆周K=0（抛物点）。","difficulty":"medium","chapter":"ch1"},{"q":"闭曲面上Gauss曲率的积分等于什么？","options":["4π","2πχ(M)","0","曲面的面积"],"answer":1,"explanation":"Gauss-Bonnet定理：∫_M K dA = 2πχ(M)，其中χ(M)是Euler示性数。","difficulty":"medium","chapter":"ch1"},{"q":"空间曲线的挠率恒为零意味着什么？","options":["曲线是直线","曲线是平面曲线","曲线是球面曲线","曲线是测地线"],"answer":1,"explanation":"挠率τ度量曲线偏离密切平面的程度。τ=0意味着曲线始终在同一平面内，即平面曲线。","difficulty":"easy","chapter":"ch1"},{"q":"球面S²的Euler示性数χ(S²)是多少？","options":["0","1","2","4"],"answer":2,"explanation":"球面亏格g=0，χ=2-2g=2。总曲率∫K dA = 2π×2 = 4π。","difficulty":"easy","chapter":"ch1"},{"q":"以下哪种曲面Gauss曲率恒为零？","options":["球面","伪球面","可展曲面（如圆柱面、锥面）","环面"],"answer":2,"explanation":"可展曲面可与平面等距（不拉伸地展开），因此内蕴曲率为零。球面K=1/R²>0，伪球面K=-1，环面K有正有负。","difficulty":"hard","chapter":"ch1"},{"q":"黎曼度量g_ij必须是哪种矩阵？","options":["对称正定矩阵","对称半正定矩阵","任意对称矩阵","反对称矩阵"],"answer":0,"explanation":"黎曼度量是正定对称双线性型，在每点切空间上定义内积，因此g_ij是对称正定矩阵。","difficulty":"easy","chapter":"ch2"},{"q":"黎曼体积形式dV_g在局部坐标下等于什么？","options":["det(g) dx¹∧...∧dxⁿ","√(det g) dx¹∧...∧dxⁿ","tr(g) dx¹∧...∧dxⁿ","g dx¹∧...∧dxⁿ"],"answer":1,"explanation":"dV_g = √(det g) dx¹∧...∧dxⁿ，其中√(det g)是'拉伸因子'，描述坐标映射的面积/体积畸变。","difficulty":"easy","chapter":"ch2"},{"q":"等距映射保持以下哪些量？","options":["仅长度","长度和角度","长度、角度和曲率","仅曲率"],"answer":2,"explanation":"等距映射保持度量，因此保持所有内蕴几何量：长度、角度、面积、体积、曲率等。","difficulty":"easy","chapter":"ch2"},{"q":"音乐同构（♭和♯）描述了什么？","options":["切空间和余切空间之间的同构","不同流形之间的同构","度量张量的对称性","联络的无挠性"],"answer":0,"explanation":"黎曼度量建立了切空间TM与余切空间T*M之间的自然同构：♭降指标，♯升指标。","difficulty":"medium","chapter":"ch2"},{"q":"Myers-Steenrod定理关于等距群的结论是什么？","options":["等距群是无限维的","等距群是有限维Lie群，维数≤n(n+1)/2","等距群总是平凡的","等距群维数等于流形维数"],"answer":1,"explanation":"Myers-Steenrod定理：等距群是Lie变换群，维数≤n(n+1)/2。最大对称空间的等距群维数恰好达到此上界。","difficulty":"medium","chapter":"ch2"},{"q":"共形变换h = e^(2f)g保持什么量不变？","options":["长度","面积","角度","曲率"],"answer":2,"explanation":"共形变换保持角度不变（因为分子分母的缩放因子抵消），但长度、面积和曲率一般会改变。","difficulty":"medium","chapter":"ch2"},{"q":"拉回度量F*h的定义是什么？","options":["F*h = h","F*h = h(F(x))","(F*h)_p(v,w) = h_F(p)(dF_p(v), dF_p(w))","F*h = F·h"],"answer":2,"explanation":"拉回度量将外围空间N中度量h通过微分dF'拉回'到M上，定义M上的度量。","difficulty":"medium","chapter":"ch2"},{"q":"二维黎曼流形上的等温坐标存在性意味着什么？","options":["所有二维流形都是平坦的","所有二维黎曼度量局部共形平坦","二维流形没有曲率","二维流形总是等距于R²"],"answer":1,"explanation":"在二维，总存在局部坐标使度量形式为ds²=e^(2λ)(dx²+dy²)，即局部共形平坦。","difficulty":"hard","chapter":"ch2"},{"q":"梯度grad f与微分df的关系是什么？","options":["grad f = df","(grad f)^i = g^ij ∂_j f","grad f = -df","grad f = f·g"],"answer":1,"explanation":"梯度是微分通过度量升指标得到的向量场：(grad f)^i = g^ij ∂_j f。","difficulty":"medium","chapter":"ch2"},{"q":"紧致Lie群上总存在双不变度量的原因是什么？","options":["Lie群总是平坦的","通过平均化构造","Lie群维数有限","Lie群总是对称的"],"answer":1,"explanation":"紧致Lie群上可通过在群上对任意左不变度量取平均（积分）来构造不变的双不变度量。","difficulty":"hard","chapter":"ch2"},{"q":"欧氏空间Rⁿ的截面曲率是多少？","options":["1","0","-1","依赖于坐标"],"answer":1,"explanation":"欧氏空间是平坦的，Christoffel符号全为零，曲率张量恒为零，因此截面曲率恒为0。","difficulty":"easy","chapter":"ch3"},{"q":"球面Sⁿ(R)的截面曲率是多少？","options":["1/R","1/R²","R","R²"],"answer":1,"explanation":"半径为R的球面Sⁿ(R)是常截面曲率空间，K=1/R²。","difficulty":"easy","chapter":"ch3"},{"q":"双曲空间Hⁿ的截面曲率是多少？","options":["1","0","-1","不确定"],"answer":2,"explanation":"标准双曲空间Hⁿ的截面曲率恒为-1（可通过缩放改变绝对值，但符号恒为负）。","difficulty":"easy","chapter":"ch3"},{"q":"Poincaré圆盘模型中的'直线'对应什么？","options":["欧氏直线段","与边界垂直的圆弧","任意曲线","抛物线"],"answer":1,"explanation":"在Poincaré圆盘模型中，双曲直线是正交于单位圆边界的圆弧（包括直径）。","difficulty":"medium","chapter":"ch3"},{"q":"Killing-Hopf定理的内容是什么？","options":["所有流形都有等距群","完备单连通常曲率空间只有三种","曲率决定了拓扑","等距群总是紧致的"],"answer":1,"explanation":"Killing-Hopf定理：完备单连通常曲率黎曼流形等距于球面、欧氏空间或双曲空间（差缩放）。","difficulty":"medium","chapter":"ch3"},{"q":"球面S²上三角形的内角和与什么有关？","options":["三角形的边长","三角形的面积（曲率积分）","三角形的位置","三角形的形状"],"answer":1,"explanation":"球面三角形内角和=π+∫K dA=π+面积/R²。面积越大，内角和越大，可达3π。","difficulty":"medium","chapter":"ch3"},{"q":"紧致Lie群上双不变度量的截面曲率有什么性质？","options":["恒为负","恒为正","非负","恒为零"],"answer":2,"explanation":"紧致Lie群配备双不变度量，截面曲率K(X,Y)=|[X,Y]|²/4≥0，非负。","difficulty":"hard","chapter":"ch3"},{"q":"双曲平面上圆的周长随半径如何增长？","options":["线性增长","多项式增长","指数增长","有界"],"answer":2,"explanation":"双曲平面中半径为r的圆的周长=2π sinh(r)≈πe^r，指数增长，远快于欧氏平面的2πr。","difficulty":"medium","chapter":"ch3"},{"q":"球面S³与哪个Lie群微分同胚？","options":["SO(3)","SU(2)","SL(2,R)","U(1)"],"answer":1,"explanation":"S³与SU(2)微分同胚。SU(2)作为Lie群配备双不变度量，等距于单位球面S³。","difficulty":"hard","chapter":"ch3"},{"q":"常曲率流形（空间形式）的构造方式是什么？","options":["直接定义度量","模型空间模去离散等距子群","任意黎曼流形","乘积流形"],"answer":1,"explanation":"常曲率流形（空间形式）是模型空间（Sⁿ, Rⁿ, Hⁿ）模去一个作用自由且常态的离散等距子群的商空间。","difficulty":"hard","chapter":"ch3"},{"q":"Levi-Civita联络由哪两个条件唯一确定？","options":["无挠性和平坦性","无挠性和度量相容性","度量相容性和平坦性","对称性和正定性"],"answer":1,"explanation":"黎曼几何基本定理：存在唯一的无挠性（T=0）和度量相容性（∇g=0）的联络，即Levi-Civita联络。","difficulty":"easy","chapter":"ch4"},{"q":"Christoffel符号Γ^k_ij的表达式是什么？","options":["∂_i g_jk","g^kl(∂_i g_jl + ∂_j g_il - ∂_l g_ij)/2","g_ij ∂_k g","∂_i ∂_j g_kl"],"answer":1,"explanation":"Γ^k_ij = (1/2)g^kl(∂_i g_jl + ∂_j g_il - ∂_l g_ij)，完全由度量及其一阶导数决定。","difficulty":"easy","chapter":"ch4"},{"q":"平行移动保持什么量不变（对于Levi-Civita联络）？","options":["仅向量的长度","向量的长度和夹角","仅向量的方向","向量的坐标分量"],"answer":1,"explanation":"Levi-Civita联络的度量相容性保证平行移动是等距同构，保持向量长度和两向量夹角。","difficulty":"easy","chapter":"ch4"},{"q":"挠率张量T(X,Y)的定义是什么？","options":["∇_X Y + ∇_Y X","∇_X Y - ∇_Y X - [X,Y]","∇_X Y - ∇_Y X","∇_X Y + ∇_Y X + [X,Y]"],"answer":1,"explanation":"挠率张量定义为T(X,Y)=∇_X Y - ∇_Y X - [X,Y]。Levi-Civita联络的挠率恒为零。","difficulty":"medium","chapter":"ch4"},{"q":"协变导数∇_X对函数f的作用是什么？","options":["∇_X f = 0","∇_X f = Xf（方向导数）","∇_X f = f·X","∇_X f = df"],"answer":1,"explanation":"对函数（标量场），协变导数退化为普通方向导数：∇_X f = Xf = df(X)。","difficulty":"medium","chapter":"ch4"},{"q":"Foucault摆的摆动平面旋转与什么几何概念相关？","options":["测地线","平行移动","曲率","指数映射"],"answer":1,"explanation":"Foucault摆的摆动平面旋转是平行移动的物理体现：地球自转使摆沿球面平行移动，产生和乐旋转。","difficulty":"medium","chapter":"ch4"},{"q":"Berger分类定理中，不可约非对称黎曼流形的和乐群有几种？","options":["5种","7种","9种","无穷多种"],"answer":1,"explanation":"Berger分类给出了7种可能：SO(n), U(n), SU(n), Sp(n)·Sp(1), Sp(n), G₂, Spin(7)。","difficulty":"hard","chapter":"ch4"},{"q":"Killing向量场满足什么方程？","options":["∇_i X_j = 0","∇_i X_j + ∇_j X_i = 0","∇_i X_j - ∇_j X_i = 0","X_i X_j = 0"],"answer":1,"explanation":"Killing向量场满足Killing方程：∇_i X_j + ∇_j X_i = 0，生成流形的等距变换。","difficulty":"medium","chapter":"ch4"},{"q":"de Rham分解定理与什么概念相关？","options":["曲率张量","和乐群的可约性","测地线","指数映射"],"answer":1,"explanation":"de Rham分解定理：若和乐群可约，则流形局部等距于黎曼乘积。和乐群的可约性对应流形的分解。","difficulty":"hard","chapter":"ch4"},{"q":"在欧氏空间Rⁿ中，平行移动与路径的关系是什么？","options":["与路径有关","与路径无关","仅在闭曲线上有关","仅在测地线上有关"],"answer":1,"explanation":"欧氏空间曲率为零，平行移动与路径无关（和乐群平凡），这是平坦空间的特性。","difficulty":"easy","chapter":"ch4"},{"q":"测地线方程在局部坐标下是什么形式？","options":["dx^k/dt = 0","d²x^k/dt² + Γ^k_ij dx^i/dt dx^j/dt = 0","dx^k/dt + Γ^k_ij x^i x^j = 0","d²x^k/dt² = 0"],"answer":1,"explanation":"测地线方程为d²x^k/dt² + Γ^k_ij (dx^i/dt)(dx^j/dt) = 0，是二阶非线性ODE。","difficulty":"easy","chapter":"ch5"},{"q":"指数映射exp_p的定义是什么？","options":["exp_p(v) = p + v","exp_p(v) = γ_v(1)，其中γ_v是测地线","exp_p(v) = p·v","exp_p(v) = ∇_v p"],"answer":1,"explanation":"exp_p(v) = γ_v(1)，即从p以速度v出发的测地线在t=1时刻到达的点。","difficulty":"easy","chapter":"ch5"},{"q":"Hopf-Rinow定理中，以下哪项不是完备性的等价条件？","options":["作为度量空间完备","任意两点可由最短测地线连接","截面曲率有界","有界闭集紧致"],"answer":2,"explanation":"Hopf-Rinow定理等价条件：(1)度量完备；(2)测地完备；(3)两点可由最短测地线连接；(4)有界闭集紧致。曲率有界不在其中。","difficulty":"medium","chapter":"ch5"},{"q":"球面S²上，北极的割迹是什么？","options":["赤道","整个球面","南极（单点）","所有经线"],"answer":2,"explanation":"球面上任意点p的割迹是对径点{-p}。从p出发沿大圆走，在到达-p之前是最短的。","difficulty":"medium","chapter":"ch5"},{"q":"Gauss引理的内容是什么？","options":["测地线总是最短的","exp_p保持径向和切向正交性","所有测地线最终相交","距离函数是光滑的"],"answer":1,"explanation":"Gauss引理：指数映射的微分保持径向与切向正交性，这是测地线极坐标表示的基础。","difficulty":"medium","chapter":"ch5"},{"q":"能量泛函E(γ)和长度泛函L(γ)的关系是什么？","options":["E = L","E = L²/2 (对弧长参数)","E = √L","E = 1/L"],"answer":1,"explanation":"对弧长参数化曲线，L(γ) = ∫√(g(γ',γ'))dt，E(γ) = (1/2)∫g(γ',γ')dt。由Cauchy-Schwarz，L² ≤ 2E(b-a)。","difficulty":"medium","chapter":"ch5"},{"q":"以下哪个流形是完备的？","options":["R²去掉原点","单位开圆盘","紧致无边流形","上半空间去掉边界"],"answer":2,"explanation":"紧致无边黎曼流形自动完备。R²去掉原点不完备（Cauchy列不收敛），开圆盘和上半空间去边界也不完备。","difficulty":"easy","chapter":"ch5"},{"q":"割点与共轭点的关系是什么？","options":["割点总是在共轭点之后","割点总是在共轭点之前或同时","二者无关","割点就是共轭点"],"answer":1,"explanation":"第一个割点要么是共轭点，要么存在另一条等长测地线。割点出现在共轭点之前或与之同时。","difficulty":"hard","chapter":"ch5"},{"q":"第一变分公式δL(γ)[V] = 0给出什么条件？","options":["γ是直线","γ是测地线","γ是最短路径","γ是闭曲线"],"answer":1,"explanation":"第一变分公式δL(γ)[V] = -∫⟨∇_γ'γ', V⟩ dt = 0对所有V成立，等价于∇_γ'γ'=0，即γ是测地线。","difficulty":"medium","chapter":"ch5"},{"q":"在法坐标下，原点处的度量有什么性质？","options":["g_ij = δ_ij, ∂_k g_ij = 0","g_ij = 0","g_ij = -δ_ij","g_ij = δ_ij但∂_k g_ij ≠ 0"],"answer":0,"explanation":"在法坐标下，原点处g_ij(0)=δ_ij且∂_k g_ij(0)=0，因此Christoffel符号在原点为零。","difficulty":"hard","chapter":"ch5"},{"q":"黎曼曲率张量R(X,Y)Z的定义是什么？","options":["∇_X ∇_Y Z","∇_X∇_Y Z - ∇_Y∇_X Z","∇_X∇_Y Z - ∇_Y∇_X Z - ∇_[X,Y]Z","∇_X Y - ∇_Y X"],"answer":2,"explanation":"R(X,Y)Z = ∇_X∇_Y Z - ∇_Y∇_X Z - ∇_[X,Y]Z。交换子项∇_[X,Y]Z确保曲率张量是张量（C^∞-多线性）。","difficulty":"easy","chapter":"ch6"},{"q":"截面曲率K(σ)的公式是什么？","options":["K = ⟨R(u,v)u,v⟩","K = ⟨R(u,v)v,u⟩/(|u|²|v|²-⟨u,v⟩²)","K = R_ijkl","K = tr(R)"],"answer":1,"explanation":"K(σ) = ⟨R(u,v)v,u⟩/(|u|²|v|²-⟨u,v⟩²)，不依赖于σ的基{u,v}的选取。","difficulty":"easy","chapter":"ch6"},{"q":"Ricci曲率是如何定义的？","options":["曲率张量的所有分量之和","R_ij = R^k_ikj（缩并）","R = g^ij R_ij","R_ijkl的平方和"],"answer":1,"explanation":"Ricci曲率R_ij = R^k_ikj，是曲率张量在第一和第三指标的缩并得到的对称(0,2)-张量。","difficulty":"easy","chapter":"ch6"},{"q":"第二Bianchi恒等式缩并后得到什么？","options":["R = 0","∇^j R_ij = (1/2)∇_i S","∇_i R = 0","R_ijkl = 0"],"answer":1,"explanation":"缩并第二Bianchi恒等式得∇^j R_ij = (1/2)∇_i S，等价于Einstein张量G_ij满足∇^j G_ij = 0。","difficulty":"medium","chapter":"ch6"},{"q":"Weyl张量W在什么变换下是不变量？","options":["等距变换","共形变换","微分同胚","平行移动"],"answer":1,"explanation":"Weyl张量是共形不变量：在共形变换g'=e^(2f)g下，W'=e^(2f)W。W=0是度量共形平坦的充要条件（n≥4）。","difficulty":"medium","chapter":"ch6"},{"q":"Einstein流形满足什么条件？","options":["R_ijkl = 0","R_ij = λg_ij","R = 0","K = 常数"],"answer":1,"explanation":"Einstein流形满足Ricci曲率与度量成比例：Ric = λg。真空Einstein场方程Ric=0（λ=0）是其特例。","difficulty":"medium","chapter":"ch6"},{"q":"Ricci恒等式[∇_i,∇_j]X^k等于什么？","options":["0","R^k_lij X^l","R_ij X^k","∂_i X^k - ∂_j X^k"],"answer":1,"explanation":"Ricci恒等式：∇_i∇_j X^k - ∇_j∇_i X^k = R^k_lij X^l。协变导数交换子由曲率张量给出。","difficulty":"medium","chapter":"ch6"},{"q":"Bonnet-Myers定理的结论是什么？","options":["流形是平坦的","Ric≥(n-1)/R²·g时，直径≤πR且π₁有限","流形一定同胚于球面","截面曲率恒为常数"],"answer":1,"explanation":"Bonnet-Myers定理：若Ric≥(n-1)/R²·g，则diam(M)≤πR且π₁(M)有限。","difficulty":"medium","chapter":"ch6"},{"q":"Schur引理的内容是什么？","options":["截面曲率总是常数","若截面曲率仅依赖于点而不依赖于方向（n≥3），则曲率是常数","所有流形都是常曲率的","截面曲率与Ricci曲率相等"],"answer":1,"explanation":"Schur引理：若连通流形(n≥3)上每点截面曲率在所有方向都相同，则截面曲率在整个流形上是常数。","difficulty":"hard","chapter":"ch6"},{"q":"Bochner公式中，(1/2)Δ|∇f|²等于什么？","options":["|∇f|²","|∇²f|² + ⟨∇f,∇Δf⟩ + Ric(∇f,∇f)","Δf","0"],"answer":1,"explanation":"Bochner公式：(1/2)Δ|∇f|² = |∇²f|² + ⟨∇f,∇Δf⟩ + Ric(∇f,∇f)，是Bochner技巧的核心。","difficulty":"hard","chapter":"ch6"},{"q":"第二基本形式II(X,Y)的值在哪个空间中？","options":["切空间","法空间","整个外围空间","余切空间"],"answer":1,"explanation":"II(X,Y) = (∇^N_X Y)^⊥ 是N中协变导数在法空间上的投影，取值于法丛。","difficulty":"easy","chapter":"ch7"},{"q":"Gauss公式将N中联络分解为什么？","options":["∇^N = ∇^M","∇^N_X Y = ∇^M_X Y + II(X,Y)","∇^N = ∇^M + R","∇^N = R + II"],"answer":1,"explanation":"Gauss公式：∇^N_X Y = ∇^M_X Y + II(X,Y)，将N中联络分解为切向分量（M中联络）和法向分量（第二基本形式）。","difficulty":"medium","chapter":"ch7"},{"q":"Gauss方程将什么量联系起来？","options":["仅第一基本形式","子流形曲率、外围曲率和第二基本形式","仅第二基本形式","仅外围曲率"],"answer":1,"explanation":"Gauss方程：R^M = R^N + II∧II，将子流形内蕴曲率与外围空间曲率和第二基本形式联系起来。","difficulty":"medium","chapter":"ch7"},{"q":"极小曲面满足什么条件？","options":["Gauss曲率为零","平均曲率H=0","第二基本形式为零","法曲率为零"],"answer":1,"explanation":"极小曲面是面积泛函的临界点，满足平均曲率H=0。δArea = -∫⟨H,V⟩ dV = 0。","difficulty":"easy","chapter":"ch7"},{"q":"Alexandrov定理关于CMC曲面的结论是什么？","options":["存在无穷多紧致CMC曲面","R³中唯一紧致无边CMC曲面是球面","所有CMC曲面都是极小曲面","CMC曲面必为平坦"],"answer":1,"explanation":"Alexandrov定理：R³中唯一紧致无边常平均曲率（CMC）曲面是球面。这是刚性定理。","difficulty":"medium","chapter":"ch7"},{"q":"Codazzi方程表达了什么对称性？","options":["度量张量的对称性","第二基本形式协变导数的对称性","曲率张量的对称性","联络的对称性"],"answer":1,"explanation":"Codazzi方程：(∇_X II)(Y,Z) = (∇_Y II)(X,Z)，即第二基本形式协变导数的对称性。","difficulty":"medium","chapter":"ch7"},{"q":"全测地子流形满足什么条件？","options":["H=0","II=0（第二基本形式恒为零）","K=0","R=0"],"answer":1,"explanation":"全测地子流形第二基本形式恒为零（II=0），意味着子流形中测地线也是外围空间中的测地线。","difficulty":"medium","chapter":"ch7"},{"q":"R³中曲面的Gauss曲率通过Gauss方程如何表达？","options":["K = H","K = (LN-M²)/(EG-F²)","K = L+N","K = E+G"],"answer":1,"explanation":"Gauss绝妙定理：K = det(II)/det(I) = (LN-M²)/(EG-F²)，仅依赖于第一基本形式。","difficulty":"medium","chapter":"ch7"},{"q":"Sⁿ中极小子流形满足什么方程？","options":["Δx = 0","Δx = -nx","Δx = nx","Δx = x"],"answer":1,"explanation":"Sⁿ中极小子流形满足Δx = -nx（x是位置向量），这是Simons研究极小子流形刚性定理的出发点。","difficulty":"hard","chapter":"ch7"},{"q":"Gauss-Codazzi方程在子流形理论中的角色是什么？","options":["仅用于计算","子流形存在性的可积性条件","没有实际用途","仅用于二维曲面"],"answer":1,"explanation":"Gauss-Codazzi方程是子流形存在性的可积性条件：给定满足这些方程的度量和第二基本形式，存在局部浸入实现它们。","difficulty":"hard","chapter":"ch7"},{"q":"局部Gauss-Bonnet定理中，测地三角形满足什么关系？","options":["∫K dA = π","∫K dA = α₁+α₂+α₃ - π","∫K dA = 0","∫K dA = 2π"],"answer":1,"explanation":"对于测地三角形（边界κ_g=0），∫_Ω K dA = α₁+α₂+α₃ - π。","difficulty":"easy","chapter":"ch8"},{"q":"全局Gauss-Bonnet定理：∫_M K dA等于什么？","options":["4π","2πχ(M)","0","πχ(M)"],"answer":1,"explanation":"全局Gauss-Bonnet定理：∫_M K dA = 2πχ(M)。对于闭定向二维流形。","difficulty":"easy","chapter":"ch8"},{"q":"亏格为g的紧致定向曲面的Euler示性数是多少？","options":["g","2g","2-2g","g-1"],"answer":2,"explanation":"χ(M) = 2 - 2g。球面g=0, χ=2；环面g=1, χ=0；双环面g=2, χ=-2。","difficulty":"easy","chapter":"ch8"},{"q":"环面T²的总Gauss曲率是多少？","options":["4π","2π","0","-4π"],"answer":2,"explanation":"环面χ=0，∫K dA = 2π×0 = 0。外侧正曲率与内侧负曲率恰好抵消。","difficulty":"easy","chapter":"ch8"},{"q":"Chern-Gauss-Bonnet定理适用于什么维数的流形？","options":["任意维数","仅二维","偶维","奇维"],"answer":2,"explanation":"Chern-Gauss-Bonnet定理适用于紧致可定向偶维黎曼流形：∫_M Pf(Ω) = (2π)^n χ(M)。","difficulty":"medium","chapter":"ch8"},{"q":"Euler示性数χ通过三角剖分如何计算？","options":["χ = V + E + F","χ = V - E + F","χ = V + E - F","χ = E - V - F"],"answer":1,"explanation":"χ = V - E + F（顶点数-边数+面数），与剖分方式无关。","difficulty":"easy","chapter":"ch8"},{"q":"测地曲率κ_g度量什么？","options":["曲线在空间中的弯曲","曲线在曲面内偏离测地线的程度","曲面的Gauss曲率","曲线的挠率"],"answer":1,"explanation":"测地曲率κ_g度量曲线在曲面内偏离测地线的程度。测地线的κ_g=0。","difficulty":"medium","chapter":"ch8"},{"q":"亏格g=2的闭曲面总Gauss曲率是多少？","options":["4π","2π","0","-4π"],"answer":3,"explanation":"χ=2-2×2=-2，∫K dA = 2π×(-2) = -4π。负总曲率是亏格≥2曲面的特征。","difficulty":"medium","chapter":"ch8"},{"q":"二维Gauss-Bonnet定理中，带边曲面的公式是什么？","options":["∫K dA = 2πχ(M)","∫K dA + ∫κ_g ds = 2πχ(M)","∫κ_g ds = 2πχ(M)","∫K dA = 0"],"answer":1,"explanation":"带边曲面：∫_M K dA + ∫_∂M κ_g ds = 2πχ(M)。边界贡献∫κ_g ds是必须的。","difficulty":"medium","chapter":"ch8"},{"q":"Chern-Gauss-Bonnet定理中，Pfaffian Pf(Ω)在二维退化为什么？","options":["K dA","K/(2π) dA","K dA/(4π)","R dA"],"answer":1,"explanation":"二维时Pf(Ω) = K/(2π)·dA，∫_M K/(2π) dA = χ(M)，即∫K dA = 2πχ(M)。","difficulty":"hard","chapter":"ch8"},{"q":"Jacobi方程是什么？","options":["J'' = 0","∇_γ'∇_γ' J + R(J,γ')γ' = 0","∇_γ' J = 0","J' + R J = 0"],"answer":1,"explanation":"Jacobi方程：∇_γ'∇_γ' J + R(J,γ')γ' = 0，描述沿测地线的无穷小变分。","difficulty":"easy","chapter":"ch9"},{"q":"球面Sⁿ(1)上法Jacobi场的方程是什么？","options":["J'' = 0","J'' + J = 0","J'' - J = 0","J'' + 2J = 0"],"answer":1,"explanation":"Sⁿ(1)上R(J,γ')γ' = J，法Jacobi方程简化为J''+J=0，解为三角振荡。","difficulty":"medium","chapter":"ch9"},{"q":"共轭点的定义是什么？","options":["测地线长度最小的点","存在非零Jacobi场在两端为零的点","测地线最长的点","割迹上的点"],"answer":1,"explanation":"q=γ(b)是p=γ(a)的共轭点，如果存在非零Jacobi场J满足J(a)=J(b)=0。","difficulty":"easy","chapter":"ch9"},{"q":"欧氏空间Rⁿ中有共轭点吗？","options":["有，且很多","没有","仅在原点上","仅在无穷远处"],"answer":1,"explanation":"Rⁿ中曲率为零，Jacobi场J(t)=J(0)+tJ'(0)只在t=0时为零，不存在共轭点。","difficulty":"easy","chapter":"ch9"},{"q":"第二变分公式δ²E(V,V)的表达式是什么？","options":["∫|V|² dt","∫(|∇V|² - ⟨R(V,γ')γ',V⟩) dt","∫⟨V,V⟩ dt","∫|∇V|² dt"],"answer":1,"explanation":"δ²E(V,V) = ∫(|∇_γ'V|² - ⟨R(V,γ')γ',V⟩) dt。曲率项使第二变分可能为负。","difficulty":"medium","chapter":"ch9"},{"q":"Morse指标定理给出了什么关系？","options":["Morse指标 = 流形维数","Morse指标 = 共轭点个数（计重数）","Morse指标 = 曲率","Morse指标 = 长度"],"answer":1,"explanation":"Morse指标定理：能量泛函在测地线上的Morse指标等于沿测地线的共轭点个数（计重数）。","difficulty":"medium","chapter":"ch9"},{"q":"双曲空间Hⁿ(-1)上法Jacobi场的解是什么形式？","options":["三角振荡","线性增长","指数增长（双曲函数）","常数"],"answer":2,"explanation":"Hⁿ(-1)上J''-J=0，解为J(t)=sinh(t)·A+cosh(t)·B，指数增长。","difficulty":"medium","chapter":"ch9"},{"q":"共轭点与割点的关系是什么？","options":["它们完全相同","割点总是在共轭点之后","第一个割点不晚于第一个共轭点","二者无关"],"answer":2,"explanation":"第一个割点要么是共轭点，要么出现在共轭点之前（有另一条等长测地线）。","difficulty":"hard","chapter":"ch9"},{"q":"Lyusternik-Fet定理的结论是什么？","options":["任何流形上都有测地线","任何紧致流形上存在闭测地线","测地线总是最短的","测地线是唯一的"],"answer":1,"explanation":"Lyusternik-Fet定理：任何紧致流形上存在闭测地线。这是Morse理论的关键应用。","difficulty":"hard","chapter":"ch9"},{"q":"Jacobi场沿测地线γ的维数是多少？","options":["n","2n","n(n+1)/2","n²"],"answer":1,"explanation":"Jacobi场由初始位置J(0)（n维）和初始速度J'(0)（n维）唯一确定，总维数为2n。","difficulty":"medium","chapter":"ch9"},{"q":"Rauch比较定理比较的是什么？","options":["两个流形的体积","两个流形中Jacobi场的模长","两个流形的直径","两个流形的曲率"],"answer":1,"explanation":"Rauch定理：若K_M ≥ K_M~，则沿等长测地线相同初始条件的Jacobi场满足|J(t)| ≤ |J~(t)|。","difficulty":"easy","chapter":"ch10"},{"q":"Bishop-Gromov体积比较定理的结论是什么？","options":["Vol(B(p,r)) ≥ V_c(r)","Vol(B(p,r)) ≤ V_c(r)","Vol(B(p,r)) = V_c(r)","Vol(B(p,r))与V_c(r)无关"],"answer":1,"explanation":"若Ric≥(n-1)c·g，则Vol(B(p,r)) ≤ V_c(r)，且比值Vol(B(p,r))/V_c(r)单调非增。","difficulty":"easy","chapter":"ch10"},{"q":"Toponogov定理比较的是什么？","options":["两个流形的曲率","测地三角形的边长和角度","两个流形的体积","测地线的长度"],"answer":1,"explanation":"Toponogov定理：若K≥c，则测地三角形各角不小于常曲率c空间中同边长三角形的对应角。","difficulty":"medium","chapter":"ch10"},{"q":"Bonnet-Myers定理中，若Ric≥(n-1)/R²·g，直径的上界是多少？","options":["R","πR","2πR","πR/2"],"answer":1,"explanation":"Bonnet-Myers定理：diam(M) ≤ πR。球面Sⁿ(R)达到此上界，是刚性情形。","difficulty":"easy","chapter":"ch10"},{"q":"Gromov紧致性定理要求哪些条件？","options":["仅曲率有界","截面曲率有界、直径有界、体积有下界","仅直径有界","仅体积有下界"],"answer":1,"explanation":"Gromov紧致性定理：|K|≤1, diam≤D, vol≥v>0的n维流形集合在GH拓扑下紧致。","difficulty":"medium","chapter":"ch10"},{"q":"Rauch定理中，正曲率对Jacobi场有什么影响？","options":["使Jacobi场增长更快","使Jacobi场增长变慢（或振荡）","无影响","使Jacobi场消失"],"answer":1,"explanation":"正曲率使Jacobi场增长变慢或振荡，负曲率使Jacobi场指数增长。曲率像'弹簧'。","difficulty":"medium","chapter":"ch10"},{"q":"Gromov-Hausdorff距离度量什么？","options":["两个黎曼流形的曲率差异","两个度量空间之间的'形状差异'","两个流形的体积差异","两个流形的直径差异"],"answer":1,"explanation":"d_GH(X,Y)度量两个紧致度量空间之间的形状差异，定义为等距嵌入到同一空间后Hausdorff距离的下确界。","difficulty":"medium","chapter":"ch10"},{"q":"Cheeger-Gromoll分裂定理的条件和结论是什么？","options":["Ric≥0且存在直线→M=R×N","Ric≤0→M是紧致的","K≥0→M是球面","Ric=0→M是平坦的"],"answer":0,"explanation":"Cheeger-Gromoll分裂定理：若完备非紧致流形Ric≥0且包含一条直线，则等距于乘积R×N。","difficulty":"hard","chapter":"ch10"},{"q":"Cartan-Hadamard定理适用于什么曲率条件？","options":["截面曲率≥0","截面曲率≤0","Ricci曲率≥0","标量曲率≤0"],"answer":1,"explanation":"Cartan-Hadamard定理：若完备单连通流形截面曲率≤0，则微分同胚于Rⁿ。","difficulty":"medium","chapter":"ch10"},{"q":"Perelman证明Poincaré猜想时使用了什么工具？","options":["仅Gauss-Bonnet定理","Ricci流和Gromov-Hausdorff收敛","仅Toponogov定理","仅Rauch定理"],"answer":1,"explanation":"Perelman使用Ricci流（带手术的）和Gromov-Hausdorff收敛分析奇点形成，证明了Poincaré猜想和Thurston几何化猜想。","difficulty":"hard","chapter":"ch10"}]},"nodePrefix":"r"},{"id":"topo","name":"代数拓扑","en":"Algebraic Topology","shortName":"拓扑","color":"#dc2626","data":{"chapters":[{"id":"ch1","title":"基本群与覆叠空间","en":"Fundamental Group and Covering Spaces","desc":"引入同伦、基本群、覆叠空间等核心概念，建立代数拓扑的基本语言。"},{"id":"ch2","title":"同调论","en":"Homology","desc":"通过单纯形、链复形和正合序列研究空间的同调不变量，是可计算性最强的代数拓扑工具。"},{"id":"ch3","title":"上同调论","en":"Cohomology","desc":"在同调的对偶视角下引入上链复形、Cup积和上同调环，揭示更丰富的代数结构。"},{"id":"ch4","title":"同伦群","en":"Homotopy Groups","desc":"推广基本群到高维，引入高阶同伦群、纤维化以及Whitehead和Hurewicz定理。"}],"nodes":[{"id":"t1","label":"同伦与同伦等价","chapter":"ch1","layer":0,"desc":"连续映射之间的连续变形关系，是代数拓扑中最基本的等价概念。","content":"设 X, Y 为拓扑空间，f, g: X→Y 为连续映射。若存在连续映射 H: X×[0,1]→Y 使得 H(x,0)=f(x) 且 H(x,1)=g(x)，则称 f 与 g 同伦，记作 f ≃ g。空间 X 与 Y 同伦等价是指存在映射 f: X→Y 和 g: Y→X 使得 g∘f ≃ id_X 且 f∘g ≃ id_Y。同伦等价比同胚更弱，允许'压缩'维度，因此可缩空间（如 R^n）同伦等价于点。同伦等价保持基本群、同调群等所有代数拓扑不变量，是代数拓扑分类空间的基本等价关系。","understanding":"同伦可以想象为橡皮泥变形：如果两个映射可以通过连续变形互相转换，它们就是同伦的。同伦等价更进一步：两个空间如果能通过'捏扁'或'拉伸'（不撕裂）互相转化，就视为拓扑上'一样'。比如实心球可以捏成一点，所以它同伦等价于点；但圆圈不能捏成一点（因为中间有个洞），所以它与点不同伦等价。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><defs><marker id=\"ar1\" markerWidth=\"6\" markerHeight=\"6\" refX=\"5\" refY=\"3\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#333\"/></marker></defs><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"60\" cy=\"70\" r=\"25\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.5\"/><circle cx=\"140\" cy=\"70\" r=\"25\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.5\"/><path d=\"M60,95 C60,120 140,120 140,95\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/><line x1=\"90\" y1=\"70\" x2=\"110\" y2=\"70\" stroke=\"#333\" stroke-width=\"2\" marker-end=\"url(#ar1)\"/><text x=\"55\" y=\"60\" font-size=\"10\" fill=\"#2563eb\">f</text><text x=\"150\" y=\"60\" font-size=\"10\" fill=\"#2563eb\">g</text><text x=\"75\" y=\"110\" font-size=\"10\" fill=\"#dc2626\">H(t)</text><text x=\"60\" y=\"155\" font-size=\"12\" fill=\"#333\" font-weight=\"bold\">同伦 H: X×I→Y</text><text x=\"45\" y=\"175\" font-size=\"10\" fill=\"#666\">H(x,0)=f, H(x,1)=g</text></svg>","examples":[{"title":"R^n 的可缩性","content":"恒等映射 id: R^n→R^n 与常值映射 c₀(x)=0 同伦，同伦为 H(x,t)=(1-t)x。因此 R^n 同伦等价于点。"},{"title":"S^1 与 R²\\{0}","content":"S^1 与穿孔平面 R²\\{0} 同伦等价：径向投影 r(x)=x/|x| 与包含映射 i: S^1→R²\\{0} 互为同伦逆。"},{"title":"Möbius 带与 S^1","content":"Möbius 带沿中心线形变收缩到 S^1，两者同伦等价，但不同胚（Möbius 带是带边流形）。"}],"theorems":[{"name":"同伦是等价关系","statement":"连续映射间的同伦关系是等价关系（自反、对称、传递）。","proof":"自反性取H(x,t)=f(x)；对称性利用H(x,1-t)逆转同伦；传递性将两个同伦各加速一倍拼接。核心是利用[0,1]区间的重参数化，将两段同伦压缩到[0,1/2]和[1/2,1]中连续衔接。"},{"name":"同伦等价保持连通性","statement":"若 X ≃ Y，则 X 与 Y 有相同的连通分支数。","proof":"同伦等价映射f:X→Y诱导连通分支之间的双射。每个连通分支映射到连通分支，同伦逆g保证映射是单射和满射。特别地，连通空间的同伦等价像仍是连通的，因此连通性在同伦等价下保持不变。"}],"applications":"同伦等价是代数拓扑分类空间的基本工具。在机器人路径规划中，判断两个构型空间是否同伦等价可以简化运动规划问题。在数据分析中，持久同调利用同伦等价来识别不同尺度下的拓扑特征。","refs":[{"book":"Hatcher","ch":"Ch.0","sec":"§0.1"},{"book":"Munkres","ch":"Ch.9","sec":"§51"}]},{"id":"t2","label":"基本群的定义","chapter":"ch1","layer":1,"desc":"以基点为起终点的环路同伦类构成的群，是代数拓扑的第一个不变量。","content":"设 X 为拓扑空间，x₀∈X 为基点。X 中以 x₀ 为基点的环路是连续映射 γ: [0,1]→X 满足 γ(0)=γ(1)=x₀。两条环路 γ, η 的乘积定义为 (γ·η)(t) = γ(2t) (t≤1/2) 或 η(2t-1) (t≥1/2)。两条环路同伦若存在保持基点不动的同伦。基本群 π₁(X,x₀) 是所有环路同伦类的集合，群运算为环路乘积的诱导。单位元为常值环路，逆元为环路反向。若 X 道路连通，则不同基点对应的基本群同构。","understanding":"想象你在一个空间里散步，从起点出发必须回到起点。基本群记录的是所有'不能连续变形为彼此'的散步路线。在球面上，任何环路都可以缩成一点，所以基本群是平凡的；在圆环上，顺时针绕一圈和逆时针绕一圈是本质上不同的路线，它们构成无限循环群 Z。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"100\" cy=\"90\" r=\"60\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"100\" cy=\"90\" r=\"4\" fill=\"#dc2626\"/><text x=\"100\" y=\"82\" font-size=\"10\" fill=\"#dc2626\" text-anchor=\"middle\">x₀</text><path d=\"M100,90 C100,40 150,50 140,90 C130,130 100,120 100,90\" fill=\"none\" stroke=\"#059669\" stroke-width=\"2.5\"/><path d=\"M100,90 C100,50 60,55 70,90 C75,110 100,105 100,90\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"2.5\"/><text x=\"55\" y=\"70\" font-size=\"9\" fill=\"#059669\">γ</text><text x=\"130\" y=\"60\" font-size=\"9\" fill=\"#d97706\">η</text><text x=\"100\" y=\"175\" font-size=\"12\" fill=\"#333\" font-weight=\"bold\">π₁(X,x₀)</text><text x=\"100\" y=\"192\" font-size=\"10\" fill=\"#666\" text-anchor=\"middle\">环路同伦类</text></svg>","examples":[{"title":"S^1 的基本群","content":"π₁(S^1) ≅ Z。每个同伦类由绕数（整数）唯一确定，正向绕一圈对应1，反向对应-1。"},{"title":"S^n (n≥2) 的基本群","content":"π₁(S^n) ≅ {e}（平凡群）。高维球面上任何环路都可连续缩为一点。"},{"title":"环面 T^2 的基本群","content":"π₁(T^2) ≅ Z×Z，由赤道方向和经线方向的两个独立环路生成。"}],"theorems":[{"name":"基本群函子性","statement":"连续映射 f: X→Y 诱导群同态 f_*: π₁(X,x₀)→π₁(Y,f(x₀))，且 (f∘g)_* = f_*∘g_*。","proof":"定义f_*([γ])=[f∘γ]。验证群同态：(f_*(α·β))(t)在t≤1/2为f(α(2t))，在t≥1/2为f(β(2t-1))，恰好等于(f_*α)·(f_*β)。复合性(f∘g)_*=f_*∘g_*由定义直接推出。这表明π₁是Top到Grp的函子。"},{"name":"同伦不变性","statement":"若 f ≃ g rel x₀，则 f_* = g_*。特别地，同伦等价的空间有同构的基本群。","proof":"设f≃g rel x₀的同伦为H，则对任意环路γ，H(γ(s),t)给出f∘γ和g∘γ之间的同伦。故[f∘γ]=[g∘γ]，即f_*=g_*。同伦等价空间X≃Y时，f_*∘g_*=id和g_*∘f_*=id保证f_*是同构。"}],"applications":"基本群可用于证明Brouwer不动点定理（二维情形）、区分不同拓扑空间（如证明R²与R³不同胚），在扭结理论中区分不同扭结类型。在物理学中，Aharonov-Bohm效应的拓扑解释依赖于穿孔平面的非平凡基本群。","refs":[{"book":"Hatcher","ch":"Ch.1","sec":"§1.1"},{"book":"Munkres","ch":"Ch.9","sec":"§52"}]},{"id":"t3","label":"基本群的计算方法","chapter":"ch1","layer":2,"desc":"利用形变收缩、乘积空间性质和群论工具计算具体空间的基本群。","content":"计算基本群的基本策略：(1) 形变收缩法：X 形变收缩到子空间 A，则 π₁(X) ≅ π₁(A)；(2) 乘积公式：π₁(X×Y) ≅ π₁(X)×π₁(Y)；(3) Seifert-van Kampen 定理：将空间分解为两个开集，利用它们的并集和交集的基本群通过自由积与融合关系计算；(4) 群论技巧：计算基本群后，通常需要识别所得群（自由群、自由积、融合积等）。基本群的计算本质上是把拓扑问题转化为代数问题，利用已知空间的基本群作为'原子'。","understanding":"计算基本群就像解谜：你把复杂空间拆成简单部件（如圆、球），每个部件的基本群你已知，然后通过组合规则（如van Kampen定理）拼出整体的基本群。就像乐高积木，你知道每块积木是什么，然后根据搭建方式确定整体结构。例如，8字形空间可以看作两个圆粘在一起，其基本群是Z*Z（两个生成元的自由群）。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"80\" cy=\"60\" r=\"30\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"140\" cy=\"60\" r=\"30\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/><circle cx=\"110\" cy=\"60\" r=\"5\" fill=\"#7c3aed\"/><circle cx=\"80\" cy=\"120\" r=\"30\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"140\" cy=\"120\" r=\"30\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/><line x1=\"95\" y1=\"60\" x2=\"125\" y2=\"60\" stroke=\"#7c3aed\" stroke-width=\"2\" stroke-dasharray=\"4,2\"/><text x=\"60\" y=\"160\" font-size=\"10\" fill=\"#2563eb\">A</text><text x=\"145\" y=\"160\" font-size=\"10\" fill=\"#dc2626\">B</text><text x=\"96\" y=\"155\" font-size=\"10\" fill=\"#7c3aed\">A∩B</text><text x=\"100\" y=\"188\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">Van Kampen 分解</text></svg>","examples":[{"title":"图的基本群","content":"有限连通图 G 的基本群是秩为 1-χ(G) 的自由群，其中 χ(G)=V-E 为欧拉示性数。"},{"title":"环面 T^2","content":"将正方形对边粘合，用 van Kampen 定理得 π₁(T^2) ≅ ⟨a,b|aba⁻¹b⁻¹=1⟩ ≅ Z×Z。"},{"title":"Klein 瓶","content":"π₁(K) ≅ ⟨a,b|aba⁻¹b=1⟩，这是非交换群，表明 Klein 瓶的基本群与环面不同。"}],"theorems":[{"name":"Seifert-van Kampen 定理","statement":"若 X = U∪V 且 U∩V 道路连通，则 π₁(X) ≅ π₁(U)*π₁(V)/N，其中 N 由 π₁(U∩V) 中元素在包含映射下的像生成。","proof":"将X中环路分解为交替落在U和V中的片段，每段通过U∩V中的道路修正。群论上，π₁(U)和π₁(V)的生成元自由生成自由积，π₁(U∩V)在两个包含映射下的像的差异提供融合关系N，商掉N即得π₁(X)。核心是推出图表的万有性质。"},{"name":"乘积公式","statement":"π₁(X×Y, (x₀,y₀)) ≅ π₁(X,x₀) × π₁(Y,y₀)。","proof":"投影映射诱导同态p_*:π₁(X×Y)→π₁(X)×π₁(Y)，由p_*([γ])=([p_X∘γ],[p_Y∘γ])定义。逆映射：对([α],[β])构造γ(t)=(α(t),β(t))，即([α],[β])↦[α×β]。验证两者互为逆映射，利用乘积拓扑的万有性质。"}],"applications":"基本群计算在扭结理论中用于区分扭结（扭结补空间的基本群称为扭结群），在三维流形拓扑中用于分类Seifert纤维空间，在代数几何中用于计算代数曲线的拓扑类型。","refs":[{"book":"Hatcher","ch":"Ch.1","sec":"§1.2"},{"book":"Hatcher","ch":"Ch.1","sec":"§1.3"}]},{"id":"t4","label":"覆叠空间","chapter":"ch1","layer":1,"desc":"局部同胚于底空间且具有离散纤维的覆盖映射，是研究基本群的核心工具。","content":"覆叠空间 p: X̃→X 是满足局部平凡化条件的连续满射：对每个 x∈X，存在邻域 U 使得 p⁻¹(U) 同胚于 U×F（F 为离散空间）。覆叠空间的纤维 p⁻¹(x) 的基数称为覆叠次数。覆叠空间最重要的性质是道路提升定理：X 中任一道路可唯一提升到 X̃ 中（给定起点）；以及同伦提升定理：道路的同伦也可提升。覆叠空间与基本群通过 Galois 对应紧密关联：X̃ 的覆叠变换群 Γ 满足 π₁(X)/p_*π₁(X̃) ≅ Γ。","understanding":"覆叠空间就像多层停车场：每一层看起来和底层（底空间）局部一样，但总共有好几层。螺旋线是圆周的覆叠空间——螺旋线局部看起来像直线，圆周局部看起来也像直线，但螺旋线绕一圈不会回到原点，而是到了'上一层'。实数线 R 是圆周 S^1 的'万有覆叠'——它无限层，每层对应一个整数。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><path d=\"M30,30 Q100,10 170,30\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><path d=\"M30,60 Q100,40 170,60\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><path d=\"M30,90 Q100,70 170,90\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><path d=\"M30,120 Q100,100 170,120\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"100\" cy=\"165\" r=\"30\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.5\"/><line x1=\"85\" y1=\"30\" x2=\"85\" y2=\"165\" stroke=\"#333\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><line x1=\"115\" y1=\"30\" x2=\"115\" y2=\"165\" stroke=\"#333\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><text x=\"100\" y=\"185\" font-size=\"12\" fill=\"#333\" font-weight=\"bold\">p: X̃→X</text><text x=\"30\" y=\"20\" font-size=\"9\" fill=\"#059669\">覆盖空间 X̃</text><text x=\"70\" y=\"160\" font-size=\"9\" fill=\"#dc2626\">底空间 X</text></svg>","examples":[{"title":"R→S^1 (万有覆叠)","content":"p(t)=e^{2πit} 是万有覆叠映射，纤维为 Z，覆叠变换群为 Z（平移）。"},{"title":"S^n→RP^n (二重覆叠)","content":"对径映射 p(x)=[x] 是 S^n 到实射影空间 RP^n 的二重覆叠，覆叠变换群为 Z/2。"},{"title":"S^1→S^1 (n重覆叠)","content":"p(z)=z^n 是 n 重覆叠，纤维为 n 个点，诱导同态 p_* 将 π₁(S^1)≅Z 映射到 nZ。"}],"theorems":[{"name":"道路提升定理","statement":"对覆叠 p: X̃→X，X 中起点为 x₀ 的道路 γ 可唯一提升到 X̃ 中以任意 x̃₀∈p⁻¹(x₀) 为起点的道路 γ̃。","proof":"将[0,1]用Lebesgue数分解为有限个小区间[t_i,t_{i+1}]，使每个γ([t_i,t_{i+1}])落在平凡化邻域U内。在每段上利用局部同胚p⁻¹(U)≅U×F构造提升，由唯一性保证在相邻区间端点处衔接。核心是覆叠空间的局部乘积结构。"},{"name":"同伦提升定理","statement":"覆叠空间具有同伦提升性质：底空间中的道路同伦可提升到覆叠空间。","proof":"将同伦H:I×I→X用Lebesgue数分解为小方格，每个方格内H的像落在平凡化邻域中。在每个方格内利用局部乘积结构提升，确保沿方格边界的连续性。由下到上、左到右逐格构造完整的提升同伦。核心是紧致性保证有限分解。"}],"applications":"覆叠空间在物理学中用于描述自旋（SU(2)→SO(3)的二重覆叠），在晶体学中描述晶格结构，在复杂分析中用于定义黎曼面上的多值函数（如平方根）。","refs":[{"book":"Hatcher","ch":"Ch.1","sec":"§1.3"},{"book":"Munkres","ch":"Ch.9","sec":"§53"}]},{"id":"t5","label":"覆叠空间的分类","chapter":"ch1","layer":2,"desc":"覆叠空间与基本群的子群之间存在一一对应，这是Galois理论在拓扑中的体现。","content":"覆叠空间的分类定理是代数拓扑最重要的结构定理之一。设 X 是道路连通、局部道路连通且半局部单连通的空间（'好空间'）。则 X 的（连通）覆叠空间之间的等价类与 π₁(X) 的子群的共轭类一一对应：给定覆叠 p: X̃→X 和基点 x̃₀，对应子群为 p_*(π₁(X̃,x̃₀)) ⊂ π₁(X,p(x̃₀))。正规子群对应于正规覆叠（Galois覆叠），此时覆叠变换群同构于商群。对应万有覆叠的子群是平凡子群，万有覆叠是单连通的。","understanding":"覆叠空间的分类就像给基本群做'子群图鉴'：基本群的每个子群都对应一种覆叠方式。万有覆叠（单连通覆叠）对应平凡子群，它覆盖了所有其他覆叠空间。正规子群对应最'对称'的覆叠——覆叠变换群可以自由地作用在纤维上。这种对应关系体现了代数（群）和几何（覆叠空间）之间的深刻联系，类似于Galois理论中域扩张与子群之间的对应。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"40\" y=\"10\" width=\"120\" height=\"30\" rx=\"5\" fill=\"#e8f0fe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"100\" y=\"30\" font-size=\"10\" fill=\"#2563eb\" text-anchor=\"middle\">万有覆叠 X̃_univ</text><rect x=\"40\" y=\"60\" width=\"120\" height=\"30\" rx=\"5\" fill=\"#fef3c7\" stroke=\"#d97706\" stroke-width=\"1.5\"/><text x=\"100\" y=\"80\" font-size=\"10\" fill=\"#d97706\" text-anchor=\"middle\">中间覆叠 X̃₁</text><rect x=\"40\" y=\"110\" width=\"120\" height=\"30\" rx=\"5\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"100\" y=\"130\" font-size=\"10\" fill=\"#dc2626\" text-anchor=\"middle\">中间覆叠 X̃₂</text><rect x=\"40\" y=\"160\" width=\"120\" height=\"30\" rx=\"5\" fill=\"#e0f2fe\" stroke=\"#0d9488\" stroke-width=\"1.5\"/><text x=\"100\" y=\"180\" font-size=\"10\" fill=\"#0d9488\" text-anchor=\"middle\">底空间 X</text><line x1=\"100\" y1=\"40\" x2=\"100\" y2=\"60\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"90\" x2=\"100\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"140\" x2=\"100\" y2=\"160\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"165\" y=\"95\" font-size=\"9\" fill=\"#333\">←→ Galois对应</text></svg>","examples":[{"title":"S^1 的覆叠分类","content":"π₁(S^1)≅Z 的子群为 nZ。每个 n 对应一个 n 重覆叠 z↦z^n，万有覆叠为 R→S^1。"},{"title":"环面 T^2 的覆叠","content":"π₁(T^2)≅Z×Z 的子群格对应各种覆叠环面，万有覆叠为 R^2→T^2。"},{"title":"8字形的覆叠","content":"π₁(S^1∨S^1)≅F₂（自由群），其子群结构极其丰富，对应各种图作为覆叠空间。"}],"theorems":[{"name":"覆叠空间分类定理","statement":"设 X 满足适当条件，连通覆叠空间 p: X̃→X 的等价类与 π₁(X,x₀) 的子群的共轭类一一对应。","proof":"给定子群H⊂π₁(X)，取万有覆叠X̃_univ，定义等价关系x̃₁~x̃₂当且仅当p(x̃₁)=p(x̃₂)且连接道路在H中。商空间X̃_univ/~即为对应H的覆叠。反之，给定覆叠，取其p_*(π₁(X̃))。共轭类对应体现基点选择的不确定性。"},{"name":"万有覆叠的存在性","statement":"X 为半局部单连通 ⇔ X 存在万有覆叠。万有覆叠是单连通的覆叠空间。","proof":"构造：取X中以x₀为起点的道路同伦类集合，赋以由开集UV_α={[γ·η]:η是V_α中道路}生成的拓扑。投影映射取终点：p([γ])=γ(1)。半局部单连通性保证此拓扑使p成为覆叠映射。该空间单连通因为任何环路可收缩到基点。"}],"applications":"覆叠空间分类在代数几何中用于研究黎曼面的模空间，在表示论中研究基本群的线性表示，在Galois理论中为Grothendieck的远阿贝尔几何提供动机。","refs":[{"book":"Hatcher","ch":"Ch.1","sec":"§1.3"},{"book":"Munkres","ch":"Ch.13","sec":"§82"}]},{"id":"t6","label":"Van Kampen定理","chapter":"ch1","layer":2,"desc":"将空间分解为两个开集，利用其基本群通过自由积和融合关系计算整体的基本群。","content":"Seifert-van Kampen 定理是计算基本群最强大的工具。设 X = U∪V，其中 U, V 为开集，且 U∩V 道路连通。则基本群有推出图表：π₁(U∩V) → π₁(U) 和 π₁(U∩V) → π₁(V) 诱导同态，而 π₁(X) 是 π₁(U) 和 π₁(V) 的自由积关于 π₁(U∩V) 中元素在两个包含映射下像的关系的商。定理的核心思想是：X 中的环路可以分解为交替在 U 和 V 中的环路片段，而重合部分（U∩V 中的环路）提供融合关系。","understanding":"Van Kampen 定理就像拼图游戏：如果你知道每个拼图块（U 和 V）的基本群，以及它们重叠部分（U∩V）的基本群，你就可以通过'自由积后商掉重叠部分'来计算整个拼图的基本群。这个定理的精妙之处在于：它把拓扑问题（计算空间的基本群）完全转化为代数问题（计算群的自由积和商群），使得我们可以用纯代数方法处理拓扑问题。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><ellipse cx=\"75\" cy=\"80\" rx=\"55\" ry=\"45\" fill=\"#dbeafe\" fill-opacity=\"0.5\" stroke=\"#2563eb\" stroke-width=\"2\"/><ellipse cx=\"125\" cy=\"80\" rx=\"55\" ry=\"45\" fill=\"#fce7f3\" fill-opacity=\"0.5\" stroke=\"#dc2626\" stroke-width=\"2\"/><text x=\"55\" y=\"50\" font-size=\"11\" fill=\"#2563eb\" font-weight=\"bold\">U</text><text x=\"145\" y=\"50\" font-size=\"11\" fill=\"#dc2626\" font-weight=\"bold\">V</text><text x=\"90\" y=\"95\" font-size=\"10\" fill=\"#7c3aed\" font-weight=\"bold\">U∩V</text><text x=\"100\" y=\"140\" font-size=\"10\" fill=\"#333\">π₁(X) ≅</text><text x=\"100\" y=\"155\" font-size=\"10\" fill=\"#333\">π₁(U)*π₁(V)/N</text><text x=\"100\" y=\"180\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">Seifert-van Kampen</text></svg>","examples":[{"title":"楔和 S^1∨S^1","content":"取 U, V 为两个圆分别的开邻域，U∩V 可缩，故 π₁(S^1∨S^1) ≅ Z*Z ≅ F₂。"},{"title":"环面 T^2","content":"将环面沿子午线和赤道切开，U∩V 为环带，得 π₁(T^2) ≅ ⟨a,b|aba⁻¹b⁻¹⟩ ≅ Z×Z。"},{"title":"曲面基本群","content":"亏格 g 的可定向闭曲面 Σ_g 的基本群为 ⟨a₁,b₁,…,a_g,b_g|∏[a_i,b_i]=1⟩。"}],"theorems":[{"name":"Seifert-van Kampen定理","statement":"若 X=U∪V 且 U∩V 道路连通，则 π₁(X) ≅ π₁(U) *_{π₁(U∩V)} π₁(V)（融合自由积）。","proof":"包含映射诱导同态i_*:π₁(U∩V)→π₁(U)和j_*:π₁(U∩V)→π₁(V)。融合自由积由π₁(U)和π₁(V)的生成元生成，关系为i_*(γ)=j_*(γ)对所有γ∈π₁(U∩V)。正合性推出图表是推出图表，万有性质唯一确定π₁(X)。"},{"name":"推广形式","statement":"可推广到多个开集的覆盖，使用群胚或范畴论语言更简洁地表述。","proof":"对多个开集覆盖{U_α}，考虑基本群胚Π(X)作为所有道路同伦类的范畴。Π(X)同构于Π(U_α)沿Π(U_α∩U_β)的2-余极限。范畴论表述避免了基点选择问题，且自然处理多个开集的重叠关系，是Grothendieck的galois理论在拓扑中的体现。"}],"applications":"van Kampen 定理广泛应用于计算图、曲面、扭结补空间、CW复形的基本群。在低维拓扑中，用于分类曲面和三维流形；在扭结理论中，Wirtinger 表示法利用 van Kampen 定理计算扭结群。","refs":[{"book":"Hatcher","ch":"Ch.1","sec":"§1.2"},{"book":"Munkres","ch":"Ch.9","sec":"§59"}]},{"id":"t7","label":"基本群的应用","chapter":"ch1","layer":3,"desc":"利用基本群的不变性证明拓扑学中的重要定理，如Brouwer不动点定理和Borsuk-Ulam定理。","content":"基本群最经典的应用包括：(1) Brouwer 不动点定理（二维）：若 f: D²→D² 连续，则存在不动点。证明：假设无不动点，构造收缩映射 r: D²→S^1，诱导恒等映射在基本群上，但 π₁(D²)={e} 而 π₁(S^1)≅Z，矛盾。(2) 代数基本定理：任何非常数复系数多项式在 C 中有根。证明：假设无根，构造从 S^1 到 S^1 的映射，比较绕数。(3) Borsuk-Ulam 定理（二维）：对连续映射 f: S²→R²，存在对径点 x,-x 使得 f(x)=f(-x)。","understanding":"基本群就像一个'拓扑指纹'：如果两个空间的基本群不同，它们就不可能同胚（甚至不可能同伦等价）。这给了我们证明两个空间不同的有力工具。Brouwer 不动点定理的证明特别优雅：如果圆盘到自身没有不动点，你可以把每个点沿射线推到边界上，从而把圆盘收缩到圆周——但基本群告诉我们这是不可能的。拓扑学通过这种代数方法'看到'了几何中看不见的障碍。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"100\" cy=\"90\" r=\"55\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.5\"/><circle cx=\"100\" cy=\"90\" r=\"55\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1.5\" stroke-dasharray=\"5,3\"/><circle cx=\"100\" cy=\"90\" r=\"3\" fill=\"#dc2626\"/><text x=\"100\" y=\"80\" font-size=\"10\" fill=\"#dc2626\" text-anchor=\"middle\">x₀=f(x₀)</text><line x1=\"130\" y1=\"60\" x2=\"100\" y2=\"90\" stroke=\"#333\" stroke-width=\"1\" stroke-dasharray=\"3,2\"/><text x=\"135\" y=\"55\" font-size=\"9\" fill=\"#333\">x</text><text x=\"100\" y=\"170\" font-size=\"12\" fill=\"#333\" font-weight=\"bold\">Brouwer不动点定理</text><text x=\"100\" y=\"188\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">f: D²→D² 必有不动点</text></svg>","examples":[{"title":"代数基本定理","content":"设 p(z) 无根，定义 f_r: S^1→S^1 为 f_r(z)=p(rz)/|p(rz)|。r→0 时绕数为0，r→∞ 时绕数为 deg(p)，矛盾。"},{"title":"毛球定理","content":"S² 上不存在处处非零的连续切向量场。证明依赖于基本群和同伦的论证。"},{"title":"R² 与 R³ 不同胚","content":"若同胚，去掉一点后基本群分别为 Z 和 {e}，矛盾。推广：R^m ≅ R^n 当且仅当 m=n。"}],"theorems":[{"name":"Brouwer不动点定理","statement":"连续映射 f: D^n→D^n 必有不动点。二维情形可用基本群证明。","proof":"假设f无不动点，定义r(x)为从f(x)到x的射线与S^{n-1}的交点。r是收缩映射且r∘i=id_{S^{n-1}}。作用在π₁上得id_Z=r_*∘i_*:Z→{e}→Z，矛盾。高维情形用同调群类似论证：r_*在H_{n-1}上诱导恒等映射，但H_{n-1}(D^n)=0。"},{"name":"Borsuk-Ulam定理","statement":"对连续映射 f: S^n→R^n，存在 x∈S^n 使得 f(x)=f(-x)。","proof":"假设f(x)≠f(-x)恒成立，定义g(x)=(f(x)-f(-x))/|f(x)-f(-x)|:S^n→S^{n-1}。g是奇映射：g(-x)=-g(x)。考虑S^n到RP^n的二重覆叠，奇映射诱导RP^n→RP^{n-1}的映射，矛盾于同调群结构。核心是奇映射不能保持拓扑不变量。"}],"applications":"不动点定理在经济学（Nash均衡存在性）、计算机科学（程序语义学中的域理论）、博弈论中都有重要应用。基本群方法也用于机器人运动规划中的构型空间分析。","refs":[{"book":"Hatcher","ch":"Ch.1","sec":"§1.1"},{"book":"Munkres","ch":"Ch.9","sec":"§55"}]},{"id":"t8","label":"形变收缩与同伦型","chapter":"ch1","layer":1,"desc":"形变收缩是构造同伦等价的最常用方法，允许将空间连续压缩到其子空间上。","content":"形变收缩是比同伦等价更强的概念。设 A⊂X 为子空间，包含映射为 i: A↪X。若存在连续映射 r: X→A 使得 r∘i = id_A 且 i∘r ≃ id_X（同伦过程中保持 A 中的点不动），则称 A 是 X 的强形变收缩核。若同伦不要求保持 A 中点不动，则为弱形变收缩。若同伦过程中所有点沿特定路线移动，则为形变收缩。形变收缩是构造同伦等价的最直接方法，也是计算基本群的第一步：找到形变收缩核，将其基本群作为原空间的基本群。","understanding":"形变收缩就像把橡皮泥捏成更简单的形状：你可以把实心圆盘连续地捏成它的圆心，把圆柱体捏成它的底面圆周，把Möbius带捏成它的中心线。关键是不能撕裂——拓扑变形必须是连续的。形变收缩是代数拓扑中的'简化'操作：在计算基本群之前，先把空间简化到最简形式。注意形变收缩是可逆的（在同伦意义上），但逆过程（膨胀）不是形变收缩。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"160\" cy=\"100\" r=\"40\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"100\" cy=\"100\" r=\"40\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"2\" opacity=\"0.6\"/><circle cx=\"60\" cy=\"100\" r=\"40\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"2\" opacity=\"0.3\"/><circle cx=\"60\" cy=\"100\" r=\"5\" fill=\"#dc2626\"/><line x1=\"160\" y1=\"100\" x2=\"100\" y2=\"100\" stroke=\"#d97706\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/><line x1=\"100\" y1=\"100\" x2=\"65\" y2=\"100\" stroke=\"#d97706\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/><text x=\"60\" y=\"88\" font-size=\"10\" fill=\"#dc2626\" text-anchor=\"middle\">A</text><text x=\"100\" y=\"170\" font-size=\"12\" fill=\"#333\" font-weight=\"bold\">形变收缩 X↘A</text><text x=\"100\" y=\"188\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">圆盘→点 是形变收缩</text></svg>","examples":[{"title":"穿孔平面的形变收缩","content":"R²\\{0} 形变收缩到 S^1：径向投影 r(x)=x/|x| 是强形变收缩，故 π₁(R²\\{0})≅Z。"},{"title":"Möbius 带的形变收缩","content":"Möbius 带形变收缩到其中心圆周 S^1，故 π₁(Möbius)≅Z。"},{"title":"ℝ^n 的形变收缩","content":"ℝ^n 形变收缩到原点：H(x,t)=(1-t)x。故 ℝ^n 同伦等价于点，是可缩空间。"}],"theorems":[{"name":"形变收缩诱导同伦等价","statement":"若 A 是 X 的形变收缩核，则包含映射 i: A→X 是同伦等价，故 π₁(A)≅π₁(X)。","proof":"包含映射i:A→X和收缩映射r:X→A满足r∘i=id_A且i∘r≃id_X。故i和r互为同伦逆，i是同伦等价。作用于基本群得i_*:π₁(A)→π₁(X)是同构，r_*是其逆。这使计算基本群时可将空间简化到形变收缩核。"},{"name":"CW复形的形变收缩","statement":"CW 复形中，子复形若是形变收缩核，则可通过逐细胞收缩构造形变收缩。","proof":"对每个n维胞腔，沿径向将胞腔内部形变收缩到边界S^{n-1}。归纳地从高维到低维逐细胞收缩：先收缩最高维胞腔，保持已收缩部分不动。由于CW复形具有闭包有限性，归纳过程在有限步内完成，得到整体形变收缩。"}],"applications":"形变收缩是计算基本群和同调群的第一步简化操作。在数据拓扑分析中，持久同调利用不同半径下的形变收缩来捕捉数据中的多尺度拓扑特征。在机器人学中，构型空间的形变收缩用于简化运动规划。","refs":[{"book":"Hatcher","ch":"Ch.0","sec":"§0.2"},{"book":"Munkres","ch":"Ch.9","sec":"§58"}]},{"id":"t9","label":"单纯形与单纯复形","chapter":"ch2","layer":0,"desc":"单纯形是三角形到高维的推广，单纯复形是将空间剖分为单纯形的组合结构。","content":"n 维标准单纯形 Δ^n 是 R^{n+1} 中满足 ∑x_i=1, x_i≥0 的点的凸包。0维单纯形是点，1维是线段，2维是三角形，3维是四面体。单纯形的面是其低维子单纯形。单纯复形 K 是一组单纯形的集合，满足：(1) 若 σ∈K，则 σ 的所有面也属于 K；(2) 两个单纯形相交只能是公共面。单纯复形将空间离散化为组合对象，使得同调群可以通过纯代数方法计算（即线性代数）。三角剖分是将拓扑空间表示为单纯复形的同胚像。","understanding":"单纯形就是把'三角形'概念推广到任意维度：0维是点，1维是线段，2维是三角形，3维是四面体，4维及以上是它们的'高维表亲'。单纯复形就是用这些'三角形家族'来拼出任何形状——就像用三角形拼出恐龙模型一样。关键是每两个三角形要么不相交，要么共享一个完整的边或顶点，不能只是部分重叠。这种规则性使得我们可以用计算机处理拓扑问题。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"173\" cy=\"145\" r=\"4\" fill=\"#2563eb\"/><text x=\"173\" y=\"140\" font-size=\"8\" fill=\"#2563eb\">Δ⁰</text><line x1=\"20\" y1=\"145\" x2=\"130\" y2=\"145\" stroke=\"#dc2626\" stroke-width=\"3\"/><circle cx=\"20\" cy=\"145\" r=\"3\" fill=\"#dc2626\"/><circle cx=\"130\" cy=\"145\" r=\"3\" fill=\"#dc2626\"/><text x=\"70\" y=\"137\" font-size=\"8\" fill=\"#dc2626\">Δ¹</text><polygon points=\"60,170 120,170 90,120\" fill=\"none\" stroke=\"#059669\" stroke-width=\"2\"/><text x=\"80\" y=\"112\" font-size=\"8\" fill=\"#059669\">Δ²</text><polygon points=\"20,80 80,50 140,80 80,110\" fill=\"#dbeafe\" fill-opacity=\"0.3\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/><text x=\"70\" y=\"45\" font-size=\"8\" fill=\"#7c3aed\">Δ³</text><text x=\"100\" y=\"192\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">单纯形 0~3维</text></svg>","examples":[{"title":"圆周 S^1 的三角剖分","content":"S^1 可剖分为3条边和3个顶点（三角形边界），是最简单的三角剖分。"},{"title":"环面 T^2 的三角剖分","content":"T^2 至少需要14个三角形（7个顶点，21条边）的三角剖分，最小剖分对应其同调群。"},{"title":"射影平面 RP^2 的三角剖分","content":"RP^2 的最小三角剖分需要10个顶点，27条边，18个面，其同调群包含扭转。"}],"theorems":[{"name":"单纯逼近定理","statement":"任何连续映射 f: K→L 可被单纯映射逼近（在重心重分后）。","proof":"取L的开星形覆盖，K的紧致性保证存在Lebesgue数。将K充分重心重分，使每个单纯形的像落在L的某个开星形内。定义单纯逼近g将每个顶点映射到其像所在开星形的顶点。g与f同伦，且g是单纯映射。核心是开星形覆盖的Lebesgue数论证。"},{"name":"三角剖分存在性","statement":"光滑流形总是可三角剖分的；但存在不可三角剖分的拓扑流形。","proof":"光滑流形可嵌入R^N（Whitney嵌入定理），在R^N中取足够细的立方剖分，再将每个立方体细分为单纯形。光滑性保证剖分足够细时与流形同胚。Cairns和Whitehead证明光滑流形可三角剖分。但存在不可三角剖分的拓扑流形，如Freedman的E8流形。"}],"applications":"单纯复形是计算拓扑学的基础：有限元方法使用单纯形剖分求解偏微分方程，计算机图形学使用三角网格表示曲面，拓扑数据分析使用Vietoris-Rips和Cech复形捕捉数据的拓扑结构。","refs":[{"book":"Hatcher","ch":"Ch.2","sec":"§2.1"},{"book":"Munkres","ch":"Ch.1","sec":"§2"}]},{"id":"t10","label":"单纯同调群","chapter":"ch2","layer":1,"desc":"通过单纯复形的链复形定义同调群，是代数拓扑中最可计算的不变量。","content":"设 K 为单纯复形。n 维链群 C_n(K) 是以 K 的 n 维定向单纯形为基的自由阿贝尔群。边界算子 ∂_n: C_n(K)→C_{n-1}(K) 定义为 ∂_n[v_0,…,v_n] = ∑_{i=0}^n (-1)^i [v_0,…,v̂_i,…,v_n]，其中 v̂_i 表示去掉该顶点。关键性质：∂_{n-1}∘∂_n = 0，即边界没有边界。由此定义 n 维闭链群 Z_n = ker ∂_n，n 维边缘链群 B_n = im ∂_{n+1}。第 n 个单纯同调群为 H_n(K) = Z_n/B_n。同调群衡量'闭链但不是边缘'的链，即空间中的'洞'。","understanding":"同调群的直观理解：想象空间中有一个'洞'。在洞周围绕一圈是一个闭链（没有边界），但它不是任何曲面的边界（因为它包住了洞）。同调群就是记录所有这种'包住洞的闭链'，但把'可以填满的闭链'视为零。所以同调群的大小告诉你空间中有多少个独立的不同维度的洞：H_0 数连通分支，H_1 数一维洞（环），H_2 数二维洞（空腔），以此类推。边界算子的核心恒等式 ∂²=0 保证了'洞的边界没有洞'。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"5\" y=\"20\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"30\" y=\"39\" font-size=\"9\" fill=\"#2563eb\" text-anchor=\"middle\">C₂</text><rect x=\"75\" y=\"20\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"100\" y=\"39\" font-size=\"9\" fill=\"#dc2626\" text-anchor=\"middle\">C₁</text><rect x=\"145\" y=\"20\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#fef3c7\" stroke=\"#d97706\" stroke-width=\"1.5\"/><text x=\"170\" y=\"39\" font-size=\"9\" fill=\"#d97706\" text-anchor=\"middle\">C₀</text><line x1=\"58\" y1=\"35\" x2=\"73\" y2=\"35\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"65\" y=\"32\" font-size=\"8\" fill=\"#333\">∂₂</text><line x1=\"128\" y1=\"35\" x2=\"143\" y2=\"35\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"135\" y=\"32\" font-size=\"8\" fill=\"#333\">∂₁</text><text x=\"100\" y=\"65\" font-size=\"9\" fill=\"#dc2626\">∂₁∘∂₂ = 0</text><text x=\"100\" y=\"85\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">链复形</text><text x=\"100\" y=\"100\" font-size=\"10\" fill=\"#333\">H_n = ker ∂_n / im ∂_{n+1}</text><circle cx=\"100\" cy=\"145\" r=\"35\" fill=\"none\" stroke=\"#7c3aed\" stroke-width=\"2.5\"/><circle cx=\"100\" cy=\"145\" r=\"15\" fill=\"none\" stroke=\"#7c3aed\" stroke-width=\"1.5\" stroke-dasharray=\"4,2\"/><text x=\"100\" y=\"155\" font-size=\"10\" fill=\"#7c3aed\" text-anchor=\"middle\">H₁=Z</text><text x=\"100\" y=\"192\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">环面的洞 → H₁=Z²</text></svg>","examples":[{"title":"球面 S^2","content":"H_0(S^2)≅Z, H_1(S^2)=0, H_2(S^2)≅Z。一个二维洞（空腔），没有一维洞。"},{"title":"环面 T^2","content":"H_0(T^2)≅Z, H_1(T^2)≅Z², H_2(T^2)≅Z。两个独立的一维洞（赤道和经线），一个二维洞。"},{"title":"射影平面 RP^2","content":"H_0(RP^2)≅Z, H_1(RP^2)≅Z/2, H_2(RP^2)=0。存在扭转：非平凡的一维闭链绕两圈才成为边缘。"}],"theorems":[{"name":"∂²=0 定理","statement":"对任意 n，∂_n∘∂_{n+1}=0，因此 im ∂_{n+1} ⊂ ker ∂_n，同调群良定义。","proof":"直接计算：∂_{n-1}∂_n[v₀,...,v_n]=∑_{j<i}(-1)^{i+j}[...,v̂_j,...,v̂_i,...]+∑_{j>i}(-1)^{i+j-1}[...,v̂_i,...,v̂_j,...]。两项中每对面出现两次，符号相反，恰好相消。这是同调代数的核心恒等式，保证了'边界没有边界'。"},{"name":"同调的不变性","statement":"同胚的空间具有同构的单纯同调群；更一般地，同伦等价的空间有同构的同调群。","proof":"同胚直接诱导单纯复形间的同构，进而诱导链复形同构，故同调群同构。同伦不变性更深刻：需构造链同伦。对单纯映射f,g，构造棱柱算子P满足∂P+P∂=g_#-f_#，将单纯形×I剖分为单纯形之和。于是f_#和g_#链同伦，诱导相同同调。"}],"applications":"同调群在计算拓扑学中广泛应用：持久同调用于数据分析、图像识别、传感器网络覆盖分析；在计算生物学中预测蛋白质结构；在材料科学中分析多孔介质的拓扑结构。","refs":[{"book":"Hatcher","ch":"Ch.2","sec":"§2.1"},{"book":"Munkres","ch":"Ch.1","sec":"§5"}]},{"id":"t11","label":"奇异同调","chapter":"ch2","layer":1,"desc":"奇异同调通过连续映射定义同调，具有函子性和同伦不变性等优良性质。","content":"奇异同调是单纯同调的推广，不需要三角剖分即可定义。奇异 n 维单纯形是连续映射 σ: Δ^n→X。奇异链群 C_n(X) 是奇异单纯形生成的自由阿贝尔群，边界算子定义方式与单纯同调类似。奇异同调群 H_n(X) = ker ∂_n / im ∂_{n+1}。奇异同调的核心优势：(1) 函子性：连续映射 f: X→Y 诱导同态 f_*: H_n(X)→H_n(Y)；(2) 同伦不变性：同伦映射诱导相同同调同态；(3) 切除定理：适当条件下可切除子空间。这些性质使奇异同调成为代数拓扑中最强大的同调理论。","understanding":"奇异同调是单纯同调的'升级版'。单纯同调需要把空间切成三角形，但奇异同调直接使用连续映射来探测空间——任何连续映射从一个标准三角形到你的空间都能'采样'拓扑信息。'奇异'这个词指的是这些映射不需要是嵌入，可以有折叠和自交。这种灵活性使得奇异同调具有很好的理论性质（函子性、同伦不变性），但也使其链群通常无限维，实际计算时仍需转化为单纯同调或其他可计算形式。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><polygon points=\"30,30 80,20 90,60\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"60\" y=\"30\" font-size=\"9\" fill=\"#2563eb\">Δ²</text><path d=\"M120,100 C130,80 160,70 170,90 C180,110 150,120 140,100 Z\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/><text x=\"155\" y=\"80\" font-size=\"9\" fill=\"#dc2626\">σ(Δ²)</text><line x1=\"92\" y1=\"55\" x2=\"128\" y2=\"88\" stroke=\"#333\" stroke-width=\"1.5\" marker-end=\"url(#ar2)\"/><text x=\"110\" y=\"65\" font-size=\"8\" fill=\"#333\">σ</text><defs><marker id=\"ar2\" markerWidth=\"6\" markerHeight=\"6\" refX=\"5\" refY=\"3\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#333\"/></marker></defs><text x=\"100\" y=\"155\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">奇异同调</text><text x=\"100\" y=\"172\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">σ: Δⁿ→X 连续</text><text x=\"100\" y=\"188\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">函子性 + 同伦不变性</text></svg>","examples":[{"title":"可缩空间的同调","content":"若 X 可缩，则 H_0(X)≅Z 且 H_n(X)=0 (n>0)。奇异同调完美捕捉可缩性。"},{"title":"S^n 的同调","content":"H_0(S^n)≅Z, H_n(S^n)≅Z, 其他 H_k(S^n)=0。同调群体现了球面的'n维洞'。"},{"title":"同伦等价保持同调","content":"若 X≃Y，则 H_n(X)≅H_n(Y) ∀n。因此同调是比同胚更弱的拓扑不变量。"}],"theorems":[{"name":"同伦不变性定理","statement":"若 f≃g: X→Y，则 f_*=g_*: H_n(X)→H_n(Y)。特别地，同伦等价空间有同构同调群。","proof":"构造棱柱算子P:C_n(X)→C_{n+1}(Y)：对奇异单纯形σ:Δ^n→X，将棱柱Δ^n×I的标准三角剖分中每个(n+1)维单纯形通过f∘σ或g∘σ映射到Y。验证∂P+P∂=g_#-f_#，故f_#和g_#是链同伦的，诱导相同同调同态。核心是棱柱的三角剖分构造。"},{"name":"切除定理","statement":"若 Z⊂A⊂X 且 Z̄⊂Int(A)，则包含映射 (X\\Z, A\\Z)→(X,A) 诱导同调同构。","proof":"将X中的奇异链通过重心重分细分为小单纯形，使其像要么落在A中，要么落在X\\Z中。由条件Z̄⊂Int(A)，重分足够细时，每个单纯形若与Z相交，则其像必完全落在A中。故X中的链可分解为A和X\\Z中链的和，核心是重心重分将链'推入'A或X\\Z。"}],"applications":"奇异同调为同调论提供了坚实的理论基础，其公理化方法（Eilenberg-Steenrod公理）统一了各种同调理论。在微分拓扑中，de Rham同调与奇异同调的同构（de Rham定理）连接了分析与拓扑。","refs":[{"book":"Hatcher","ch":"Ch.2","sec":"§2.1"},{"book":"Munkres","ch":"Ch.4","sec":"§29"}]},{"id":"t12","label":"正合序列与切除","chapter":"ch2","layer":2,"desc":"正合序列是代数拓扑中的核心计算工具，特别是空间对的长正合序列。","content":"正合序列是群同态序列 ...→A→B→C→... 满足每个同态的像等于下一个同态的核。空间对 (X,A) 诱导同调长正合序列：...→H_n(A)→H_n(X)→H_n(X,A)→H_{n-1}(A)→...。连接同态 ∂: H_n(X,A)→H_{n-1}(A) 取相对闭链的边界。切除定理：若 Z⊂A⊂X 且闭包 Z̄⊂Int(A)，则 H_n(X\\Z, A\\Z)≅H_n(X,A)。正合序列和切除定理是计算同调群的两大支柱：正合序列连接不同空间的同调，切除定理允许'切除'不重要的部分。","understanding":"正合序列就像'同调记账'：它精确记录了空间、子空间和商空间之间的同调群如何相互关联。关键原则是'进多少出多少'——每个群中进入的映射的像，恰好等于出去的映射的核。切除定理则告诉你：在计算相对同调时，你可以把子空间内部'挖掉'而不改变同调。这就像做手术：只要切得干净（闭包在内部），拓扑结构不变。这两者结合，使得从简单空间计算复杂空间的同调成为可能。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"5\" y=\"55\" width=\"40\" height=\"20\" rx=\"3\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1\"/><text x=\"25\" y=\"69\" font-size=\"7\" fill=\"#2563eb\" text-anchor=\"middle\">Hn(A)</text><rect x=\"55\" y=\"55\" width=\"40\" height=\"20\" rx=\"3\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1\"/><text x=\"75\" y=\"69\" font-size=\"7\" fill=\"#dc2626\" text-anchor=\"middle\">Hn(X)</text><rect x=\"105\" y=\"55\" width=\"40\" height=\"20\" rx=\"3\" fill=\"#fef3c7\" stroke=\"#d97706\" stroke-width=\"1\"/><text x=\"125\" y=\"69\" font-size=\"7\" fill=\"#d97706\" text-anchor=\"middle\">Hn(X,A)</text><rect x=\"155\" y=\"55\" width=\"40\" height=\"20\" rx=\"3\" fill=\"#e0f2fe\" stroke=\"#0d9488\" stroke-width=\"1\"/><text x=\"175\" y=\"69\" font-size=\"7\" fill=\"#0d9488\" text-anchor=\"middle\">Hn₋₁(A)</text><line x1=\"46\" y1=\"65\" x2=\"53\" y2=\"65\" stroke=\"#333\" stroke-width=\"1\"/><line x1=\"96\" y1=\"65\" x2=\"103\" y2=\"65\" stroke=\"#333\" stroke-width=\"1\"/><line x1=\"146\" y1=\"65\" x2=\"153\" y2=\"65\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"100\" y=\"40\" font-size=\"9\" fill=\"#333\" font-weight=\"bold\">长正合序列</text><text x=\"100\" y=\"100\" font-size=\"10\" fill=\"#333\">im = ker (正合性)</text><text x=\"100\" y=\"120\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">切除定理</text><rect x=\"30\" y=\"140\" width=\"70\" height=\"40\" rx=\"2\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><rect x=\"90\" y=\"140\" width=\"70\" height=\"40\" rx=\"2\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"65\" y=\"165\" font-size=\"9\" fill=\"#dc2626\" text-anchor=\"middle\">A</text><text x=\"125\" y=\"165\" font-size=\"9\" fill=\"#2563eb\" text-anchor=\"middle\">XA</text><text x=\"100\" y=\"195\" font-size=\"8\" fill=\"#333\">Z̄⊂Int(A) ⇒ H(XZ,AZ)≅H(X,A)</text></svg>","examples":[{"title":"球面同调的计算","content":"利用 (D^n, S^{n-1}) 的长正合序列和切除定理，推出 H_k(S^n) ≅ Z (k=0,n) 或 0 (其他)。"},{"title":"Mayer-Vietoris序列","content":"由正合序列和切除定理导出，将空间分解为两个开集计算同调，是van Kampen定理的同调版本。"},{"title":"相对同调的计算","content":"利用 (X,A) 的长正合序列，从 H_n(A) 和 H_n(X) 可推出 H_n(X,A) 的部分信息。"}],"theorems":[{"name":"空间对长正合序列","statement":"对空间对 (X,A)，存在长正合序列 ...→H_n(A)→H_n(X)→H_n(X,A)→H_{n-1}(A)→...。","proof":"由短正合序列0→C_n(A)→C_n(X)→C_n(X,A)→0诱导同调长正合序列（蛇形引理）。连接同态∂:H_n(X,A)→H_{n-1}(A)定义为：取相对闭链的代表c∈C_n(X)，其边界∂c∈C_{n-1}(A)是A中的闭链，∂([c])=[∂c]。正合性验证依赖图追踪法。"},{"name":"切除定理(Eilenberg-Steenrod)","statement":"若 Z̄⊂Int(A)，则包含映射 (X\\Z, A\\Z)→(X,A) 诱导同调同构。","proof":"取U=X\\Z，则Ū⊂Int(A)的补集条件等价于Z̄⊂Int(A)。U和A的内部覆盖X。用重心重分将奇异链细分为落在U或A中的小链。证明C_n^{U+A}(X)的包含映射是链同伦等价，从而是拟同构。这是Eilenberg-Steenrod公理体系的切除公理。"}],"applications":"正合序列方法广泛用于同调代数和代数拓扑。在代数几何中，层上同调的长正合序列是核心工具；在微分拓扑中，用于计算流形的同调群；在K理论中，正合序列是基本计算工具。","refs":[{"book":"Hatcher","ch":"Ch.2","sec":"§2.1"},{"book":"Munkres","ch":"Ch.4","sec":"§32"}]},{"id":"t13","label":"Mayer-Vietoris序列","chapter":"ch2","layer":2,"desc":"同调版本的空间分解定理，通过两个开子集的同调群计算整个空间的同调群。","content":"Mayer-Vietoris 序列是同调论中与 van Kampen 定理地位相当的核心工具。设 X = U∪V，其中 U, V 为开集（或使内部覆盖 X 的子空间）。则存在长正合序列：...→H_n(U∩V)→H_n(U)⊕H_n(V)→H_n(X)→H_{n-1}(U∩V)→...。其中第一个映射为 (i_*, j_*)，i: U∩V→U, j: U∩V→V；第二个映射为 (k_*-l_*)，k: U→X, l: V→X。连接同态 ∂: H_n(X)→H_{n-1}(U∩V) 由'重心重分'构造。M-V序列是正合序列和切除定理的直接推论，但使用起来更加直接便利。","understanding":"Mayer-Vietoris 序列是'分而治之'策略的完美体现：把复杂空间切成两块 U 和 V，你知道每块以及它们重叠部分的同调，就能通过长正合序列推断整体的同调。这就像侦探破案：知道两个嫌疑人的各自信息以及他们的交集，就能推断整个案件。M-V 序列的魔法在于正合性：它精确限定了哪些组合是可能的，使得你从部分信息就能唯一确定整体结构。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><ellipse cx=\"75\" cy=\"55\" rx=\"50\" ry=\"35\" fill=\"#dbeafe\" fill-opacity=\"0.5\" stroke=\"#2563eb\" stroke-width=\"2\"/><ellipse cx=\"125\" cy=\"55\" rx=\"50\" ry=\"35\" fill=\"#fce7f3\" fill-opacity=\"0.5\" stroke=\"#dc2626\" stroke-width=\"2\"/><text x=\"50\" y=\"45\" font-size=\"10\" fill=\"#2563eb\" font-weight=\"bold\">U</text><text x=\"145\" y=\"45\" font-size=\"10\" fill=\"#dc2626\" font-weight=\"bold\">V</text><text x=\"92\" y=\"70\" font-size=\"9\" fill=\"#7c3aed\">U∩V</text><text x=\"100\" y=\"105\" font-size=\"9\" fill=\"#333\">...→Hn(U∩V)→Hn(U)⊕Hn(V)→</text><text x=\"100\" y=\"120\" font-size=\"9\" fill=\"#333\">Hn(X)→Hn₋₁(U∩V)→...</text><text x=\"100\" y=\"145\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">Mayer-Vietoris 序列</text><text x=\"100\" y=\"165\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">X = U ∪ V</text><text x=\"100\" y=\"180\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">分而治之计算同调</text></svg>","examples":[{"title":"球面 S^n 的同调","content":"将 S^n 分解为两个半球 D^n_+ 和 D^n_-，交为 S^{n-1}。M-V序列给出 H_k(S^n) 的递推计算。"},{"title":"环面 T^2 的同调","content":"用 M-V 序列分解环面为两个圆柱，交为两个圆周，得到 H_1(T^2)≅Z², H_2(T^2)≅Z。"},{"title":"Klein 瓶的同调","content":"M-V 序列给出 H_1(K)≅Z⊕Z/2, H_2(K)=0，与环面在 H_1 中有扭转分量不同。"}],"theorems":[{"name":"Mayer-Vietoris 定理","statement":"若 X = Int(U)∪Int(V)，则存在长正合序列连接 H_n(U∩V), H_n(U)⊕H_n(V), H_n(X)。","proof":"考虑短正合序列0→C_n(U∩V)→C_n(U)⊕C_n(V)→C_n^{U+V}(X)→0，其中C_n^{U+V}由像落在U或V中的链生成。由切除定理，H_n^{U+V}(X)≅H_n(X)。诱导长正合序列即Mayer-Vietoris序列。连接同态由重心重分构造：X中闭链分解为U和V中链的和。"},{"name":"诱导长正合序列","statement":"M-V 序列关于包含映射自然，且可通过上述图表直接构造，是正合序列和切除的推论。","proof":"连接同态∂:H_n(X)→H_{n-1}(U∩V)由重分构造：取X中闭链z，重分为u+v（u在U中，v在V中），则∂z=∂u=-∂v落在U∩V中。∂([z])=[∂u]∈H_{n-1}(U∩V)。自然性来自链映射的交换性：若f:X→Y保持覆盖，则诱导M-V序列间的映射交换。"}],"applications":"Mayer-Vietoris 序列广泛应用于计算流形、CW复形和代数簇的同调。在微分拓扑中，用于计算流形连通和（connected sum）的同调；在扭结理论中，用于计算扭结补空间的同调群。","refs":[{"book":"Hatcher","ch":"Ch.2","sec":"§2.2"},{"book":"Munkres","ch":"Ch.4","sec":"§33"}]},{"id":"t14","label":"CW复形的同调","chapter":"ch2","layer":2,"desc":"CW复形是现代代数拓扑的标准工作空间，其同调可通过胞腔结构高效计算。","content":"CW 复形由逐次粘贴胞腔构造：从离散点集 X⁰ 开始，通过粘贴映射 φ_α: S^{n-1}→X^{n-1} 将 n 维盘 D^n_α 粘贴上去得到 n 维骨架 X^n。CW 复形是代数拓扑的'标准工作空间'，兼具计算便利性和理论充分性。CW 复形的同调可通过胞腔链复形计算：C_n^{CW}(X) = H_n(X^n, X^{n-1})，这是自由阿贝尔群，秩等于 n 维胞腔数。边界算子由粘贴映射的度数确定。由此得到的胞腔同调与奇异同调同构。CW 复形涵盖几乎所有常见的拓扑空间。","understanding":"CW 复形就是'用乐高积木搭空间'：从一些点（0维积木）开始，粘上一些线段（1维积木），再粘上一些圆盘（2维积木），依此类推。'C'代表闭包有限（closure-finite），'W'代表弱拓扑（weak topology）。关键优势是：同调群的计算只需要知道每一维有多少块积木，以及它们是如何粘上去的——不需要处理无穷维的奇异链群。几乎所有你关心的空间（流形、代数簇、分类空间）都是CW复形。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"50\" cy=\"145\" r=\"4\" fill=\"#2563eb\"/><text x=\"50\" y=\"165\" font-size=\"8\" fill=\"#2563eb\" text-anchor=\"middle\">X⁰(点)</text><circle cx=\"100\" cy=\"145\" r=\"4\" fill=\"#2563eb\"/><circle cx=\"150\" cy=\"145\" r=\"4\" fill=\"#2563eb\"/><line x1=\"50\" y1=\"141\" x2=\"100\" y2=\"141\" stroke=\"#dc2626\" stroke-width=\"2\"/><text x=\"75\" y=\"135\" font-size=\"8\" fill=\"#dc2626\">X¹(边)</text><line x1=\"100\" y1=\"141\" x2=\"150\" y2=\"141\" stroke=\"#dc2626\" stroke-width=\"2\"/><ellipse cx=\"100\" cy=\"80\" rx=\"60\" ry=\"30\" fill=\"none\" stroke=\"#059669\" stroke-width=\"2\"/><text x=\"100\" y=\"72\" font-size=\"8\" fill=\"#059669\">X²(面)</text><text x=\"100\" y=\"188\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">CW复形骨架构造</text></svg>","examples":[{"title":"S^n 的 CW 结构","content":"S^n 有一个 0 维胞腔和一个 n 维胞腔（e⁰∪e^n），边界映射平凡，同调易于计算。"},{"title":"RP^n 的 CW 结构","content":"RP^n 的每一维 k 各有一个胞腔 (k=0,…,n)，边界映射的度数交替为 0 和 2，产生 Z/2 扭转。"},{"title":"CP^n 的 CW 结构","content":"CP^n 只有偶数维胞腔：e⁰∪e²∪e⁴∪…∪e^{2n}，所有边界映射平凡，同调群为 Z 在偶数维。"}],"theorems":[{"name":"胞腔同调定理","statement":"CW 复形 X 的胞腔同调 H_n^{CW}(X) 与奇异同调 H_n(X) 自然同构。","proof":"利用(X^n,X^{n-1})的相对同调：H_k(X^n,X^{n-1})在k≠n时为零，在k=n时是自由阿贝尔群，秩等于n维胞腔数。通过长正合序列和归纳法，证明H_n(X^n)≅H_n^{CW}的第n个同调。取极限X=colim X^n，利用紧致性论证H_n(X)≅H_n(X^n)对充分大n成立。"},{"name":"CW 逼近定理","statement":"任何拓扑空间都存在弱同伦等价的 CW 复形（CW 逼近）。","proof":"归纳构造：对每个同伦群生成元，粘贴相应维数胞腔消除多余信息；再粘贴高维胞腔填充缺失信息（如球面间的映射）。取极限CW复形。证明该CW复形与X有弱同伦等价关系：由构造，诱导所有同伦群的同构。在同伦范畴中，CW逼近是唯一的。"}],"applications":"CW 复形是近代代数拓扑的标准框架：在稳定同伦论中，谱的同伦群通过 CW 谱计算；在几何群论中，群的分类空间是 CW 复形；在代数几何中，代数簇的拓扑通过 CW 分解研究。","refs":[{"book":"Hatcher","ch":"Ch.0","sec":"§0.3"},{"book":"Hatcher","ch":"Ch.2","sec":"§2.2"}]},{"id":"t15","label":"胞腔同调","chapter":"ch2","layer":3,"desc":"利用CW复形的胞腔结构直接计算同调群，是最实用的同调计算方法。","content":"胞腔同调是 CW 复形同调论的计算核心。CW 复形 X 的胞腔链复形定义为 C_n^{CW} = H_n(X^n, X^{n-1})，这是以 n 维胞腔为基的自由阿贝尔群。边界算子 d_n: C_n^{CW}→C_{n-1}^{CW} 由粘贴映射 φ_α: S^{n-1}→X^{n-1} 的度数矩阵给出：d_n(e_α^n) = Σ_β d_{αβ} e_β^{n-1}，其中 d_{αβ} 是合成映射 S_α^{n-1}→X^{n-1}→X^{n-1}/(X^{n-1}\\e_β^{n-1})≅S^{n-1} 的度数。胞腔同调的计算优势在于链群是有限生成的（当 CW 复形有限时），且边界算子可通过几何论证（度数）确定。","understanding":"胞腔同调将同调计算简化为'数数+算度数'。对每个维度，你只需要知道有多少个胞腔（它们生成链群），以及每个 n 维胞腔的边界由哪些 (n-1) 维胞腔组成（各绕了多少圈）。这就像用地图找路：你知道每个区域（胞腔）和它们的边界关系，就能算出整个地形的拓扑特征。胞腔同调特别适合计算射影空间、透镜空间、Grassmann流形等经典空间的同调。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"5\" y=\"60\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"30\" y=\"79\" font-size=\"9\" fill=\"#2563eb\" text-anchor=\"middle\">C₂^{CW}</text><rect x=\"75\" y=\"60\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"100\" y=\"79\" font-size=\"9\" fill=\"#dc2626\" text-anchor=\"middle\">C₁^{CW}</text><rect x=\"145\" y=\"60\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#fef3c7\" stroke=\"#d97706\" stroke-width=\"1.5\"/><text x=\"170\" y=\"79\" font-size=\"9\" fill=\"#d97706\" text-anchor=\"middle\">C₀^{CW}</text><line x1=\"58\" y1=\"75\" x2=\"73\" y2=\"75\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"65\" y=\"72\" font-size=\"8\" fill=\"#333\">d₂</text><line x1=\"128\" y1=\"75\" x2=\"143\" y2=\"75\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"135\" y=\"72\" font-size=\"8\" fill=\"#333\">d₁</text><text x=\"100\" y=\"110\" font-size=\"10\" fill=\"#333\">d_{αβ} = deg(φαβ)</text><text x=\"100\" y=\"130\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">胞腔链复形</text><text x=\"100\" y=\"150\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">每个胞腔贡献一个生成元</text><text x=\"100\" y=\"168\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">边界由粘贴映射度数决定</text></svg>","examples":[{"title":"RP^2 的胞腔同调","content":"RP^2 有胞腔 e⁰, e¹, e²。d₂(e²)=2e¹（粘贴映射度数为2），故 H₁(RP^2)≅Z/2, H₂=0。"},{"title":"CP^n 的胞腔同调","content":"CP^n 只有偶数维胞腔，所有边界算子为0，故 H_{2k}(CP^n)≅Z (k=0,…,n)，奇维同调为0。"},{"title":"透镜空间 L(p,q)","content":"L(p,q) 有 e⁰, e¹, e², e³。d₂(e²)=pe¹, d₃(e³)=0，故 H₁(L)≅Z/p, H₂=0, H₃≅Z。"}],"theorems":[{"name":"胞腔同调与奇异同调同构","statement":"H_n^{CW}(X) ≅ H_n(X)，即胞腔同调与奇异同调自然同构。","proof":"利用(X^n,X^{n-1})的相对同调计算和长正合序列的归纳论证。关键事实：H_k(X^n,X^{n-1})在k≠n时为零，在k=n时秩等于n维胞腔数。通过反复使用长正合序列，逐维证明H_n(X^n)≅H_n^{CW}的第n个同调。取正向极限得H_n(X)≅H_n^{CW}(X)。"},{"name":"胞腔边界公式","statement":"d_n(e_α^n) = Σ_β deg(φ_{αβ}) e_β^{n-1}，其中度数由粘贴映射诱导。","proof":"边界算子d_n由合成映射给出：对每个n维胞腔e_α^n，考虑粘贴映射φ_α:S^{n
