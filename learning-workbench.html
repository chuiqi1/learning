-1}→X^{n-1}，然后收缩X^{n-1}除e_β^{n-1}外的所有胞腔到一点，得到映射S^{n-1}→S^{n-1}。该映射的度数deg(φ_{αβ})即为d_n(e_α^n)中e_β^{n-1}的系数。此为胞腔同调的计算核心。"}],"applications":"胞腔同调是计算拓扑空间同调群的标准方法，广泛应用于低维拓扑、扭结理论、代数几何。在计算拓扑学中，胞腔分解用于高效计算持久同调的数据结构。","refs":[{"book":"Hatcher","ch":"Ch.2","sec":"§2.2"},{"book":"Munkres","ch":"Ch.4","sec":"§38"}]},{"id":"t16","label":"同调的计算与应用","chapter":"ch2","layer":3,"desc":"综合运用多种工具计算经典空间的同调群，并利用同调解决拓扑和几何问题。","content":"同调群计算的通用策略：(1) 三角剖分或CW分解，利用单纯同调或胞腔同调；(2) Mayer-Vietoris 序列分解空间；(3) 长正合序列联系相对同调；(4) Künneth 公式计算乘积空间同调。经典结果：可定向闭曲面 Σ_g 的同调为 H_0≅Z, H_1≅Z^{2g}, H_2≅Z；RP^n 的同调根据 n 的奇偶性有不同扭转模式；CP^n 的同调为 Z 在偶数维。同调的应用包括：Brouwer不动点定理的高维推广、向量场的奇点指标定理、Lefschetz不动点定理、映射度理论。","understanding":"同调群是你的'拓扑显微镜'：H_0 数连通分支，H_1 数环状洞，H_2 数空腔，H_n 数 n 维空洞。计算同调就像给空间做'X光透视'——你不需要完全重建空间，只需知道它在每一维有多少个独立的洞。同调群的美妙之处在于它是可计算的：通过线性代数（矩阵行简化）就能算出任何有限单纯复形或CW复形的同调群。这是代数拓扑区别于其他数学分支的独特优势。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><text x=\"100\" y=\"25\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\" text-anchor=\"middle\">经典空间同调表</text><line x1=\"20\" y1=\"35\" x2=\"180\" y2=\"35\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"40\" y=\"52\" font-size=\"8\" fill=\"#2563eb\">S^n</text><text x=\"100\" y=\"52\" font-size=\"8\" fill=\"#333\">H₀=Z, Hn=Z, 其他=0</text><text x=\"40\" y=\"68\" font-size=\"8\" fill=\"#dc2626\">T²</text><text x=\"100\" y=\"68\" font-size=\"8\" fill=\"#333\">H₀=Z, H₁=Z², H₂=Z</text><text x=\"40\" y=\"84\" font-size=\"8\" fill=\"#059669\">RP²</text><text x=\"100\" y=\"84\" font-size=\"8\" fill=\"#333\">H₀=Z, H₁=Z/2, H₂=0</text><text x=\"40\" y=\"100\" font-size=\"8\" fill=\"#7c3aed\">CP^n</text><text x=\"100\" y=\"100\" font-size=\"8\" fill=\"#333\">H_{2k}=Z, H_{odd}=0</text><text x=\"40\" y=\"116\" font-size=\"8\" fill=\"#d97706\">Σ_g</text><text x=\"100\" y=\"116\" font-size=\"8\" fill=\"#333\">H₀=Z, H₁=Z^{2g}, H₂=Z</text><text x=\"100\" y=\"145\" font-size=\"10\" fill=\"#dc2626\" font-weight=\"bold\">应用</text><text x=\"100\" y=\"162\" font-size=\"8\" fill=\"#333\">Brouwer不动点 · Lefschetz定理</text><text x=\"100\" y=\"178\" font-size=\"8\" fill=\"#333\">向量场奇点 · 映射度</text></svg>","examples":[{"title":"Lefschetz 不动点定理","content":"若 f: X→X 的 Lefschetz 数 L(f)=Σ(-1)^n tr(f_*:H_n(X)→H_n(X)) 非零，则 f 有不动点。推广了 Brouwer 定理。"},{"title":"Borsuk-Ulam 定理","content":"利用同调证明：对连续映射 f: S^n→R^n，存在对径点 x,-x 使得 f(x)=f(-x)。"},{"title":"向量场指标","content":"紧流形上孤立奇点向量场的指标和等于 Euler 示性数 χ(X)=Σ(-1)^n rank H_n(X)。"}],"theorems":[{"name":"Lefschetz 不动点定理","statement":"若 L(f)≠0，则 f 有不动点。特别地，可缩空间上的连续自映射必有不动点。","proof":"L(f)=Σ(-1)^n tr(f_*:H_n(X;Q)→H_n(X;Q))。若f无不动点，则存在开覆盖使f(U)∩U=∅，利用同调的交理论和Lefschetz数的局部化公式证明L(f)=0。可缩空间上H_0=Q, H_n=0(n>0)，故L(f)=tr(f_*:H_0→H_0)=1≠0，必有不动点。这是Brouwer定理的深远推广。"},{"name":"Hopf 指标定理","statement":"紧流形上向量场奇点指标和等于 Euler 示性数，与向量场选择无关。","proof":"χ(M)=Σ(-1)^n rank H_n(M)。将向量场视为M→TM的截面，在奇点处取局部指标。构造M到自身的小扰动映射，其不动点恰好对应向量场的奇点。利用Lefschetz不动点定理：L(id)=χ(M)。每个奇点指标等于该处Lefschetz局部指标，求和得χ(M)。"}],"applications":"同调论在数据科学中通过持久同调（persistent homology）分析高维数据的拓扑结构；在计算机视觉中用于形状识别和匹配；在计算生物学中分析分子结构；在机器人学中分析构型空间。","refs":[{"book":"Hatcher","ch":"Ch.2","sec":"§2.2"},{"book":"Hatcher","ch":"Ch.2","sec":"§2.C"}]},{"id":"t17","label":"上同调群的定义","chapter":"ch3","layer":1,"desc":"上同调是同调的对偶概念，通过链群到系数群的所有同态定义上链和上边缘算子。","content":"上同调群是同调群的对偶构造。给定链复形 (C_n, ∂_n) 和系数群 G，定义上链群 C^n = Hom(C_n, G)（所有群同态 φ: C_n→G）。上边缘算子 δ^n: C^n→C^{n+1} 由 (δ^nφ)(c) = φ(∂_{n+1}c) 定义。类似地，δ^{n+1}∘δ^n=0，因此可定义上闭链群 Z^n = ker δ^n 和上边缘链群 B^n = im δ^{n-1}。第 n 个上同调群为 H^n(X;G) = Z^n/B^n。上同调的核心优势在于其丰富的代数结构：上同调类可相乘（Cup积），使 H^*(X;R) 成为分次环。","understanding":"上同调把同调'翻转'过来。同调追问'什么几何对象存在'（链），上同调追问'什么函数可以定义在这些几何对象上'（上链）。如果用水的流动来比喻：同调研究水流的不可能路径（被洞阻挡），上同调研究水流的可能方向（梯度场的存在性）。上同调的优势在于它有自然的乘法结构（Cup积），这在同调中是没有的——这使得上同调不仅是一个群，还是一个环，包含更多信息。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"5\" y=\"20\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"30\" y=\"39\" font-size=\"9\" fill=\"#dc2626\" text-anchor=\"middle\">C²</text><rect x=\"75\" y=\"20\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#fef3c7\" stroke=\"#d97706\" stroke-width=\"1.5\"/><text x=\"100\" y=\"39\" font-size=\"9\" fill=\"#d97706\" text-anchor=\"middle\">C¹</text><rect x=\"145\" y=\"20\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"170\" y=\"39\" font-size=\"9\" fill=\"#2563eb\" text-anchor=\"middle\">C⁰</text><line x1=\"58\" y1=\"35\" x2=\"73\" y2=\"35\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"65\" y=\"32\" font-size=\"8\" fill=\"#333\">δ¹</text><line x1=\"128\" y1=\"35\" x2=\"143\" y2=\"35\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"135\" y=\"32\" font-size=\"8\" fill=\"#333\">δ⁰</text><text x=\"100\" y=\"65\" font-size=\"9\" fill=\"#dc2626\">δ²∘δ¹=0</text><text x=\"100\" y=\"85\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">上链复形</text><text x=\"100\" y=\"100\" font-size=\"10\" fill=\"#333\">H^n = ker δ^n / im δ^{n-1}</text><text x=\"100\" y=\"125\" font-size=\"10\" fill=\"#7c3aed\" font-weight=\"bold\">C^n = Hom(C_n, G)</text><text x=\"100\" y=\"145\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">上同调 = 同调的对偶</text><text x=\"100\" y=\"162\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">Cup积 → 环结构</text></svg>","examples":[{"title":"S^n 的上同调","content":"H^0(S^n;Z)≅Z, H^n(S^n;Z)≅Z, 其他 H^k=0。与同调同构，但上同调有环结构。"},{"title":"T^2 的上同调","content":"H^0≅Z, H^1≅Z², H^2≅Z。Cup积 α∪β 生成 H^2，其中 α,β 为 H^1 的生成元。"},{"title":"RP^n 的上同调(Z/2)","content":"H^*(RP^n;Z/2) ≅ Z/2[α]/(α^{n+1})，其中 |α|=1。这是截断多项式环。"}],"theorems":[{"name":"上同调函子性","statement":"上同调是反变函子：连续映射 f: X→Y 诱导同态 f^*: H^n(Y)→H^n(X)。","proof":"定义上链映射f^#:C^n(Y)→C^n(X)，φ↦φ∘f_#（前复合）。验证δ∘f^#=f^#∘δ：因(δf^#φ)(c)=f^#φ(∂c)=φ(f_#∂c)=φ(∂f_#c)=δφ(f_#c)=f^#(δφ)(c)。故f^#诱导上同调同态f^*。反变性：(g∘f)^*=f^*∘g^*，因为上链层面上前复合逆转顺序。"},{"name":"上同调与同调的关系","statement":"由万有系数定理，上同调可由同调群和 Ext 群确定，但上同调的环结构包含额外信息。","proof":"万有系数定理给出H^n(X;G)≅Hom(H_n(X),G)⊕Ext(H_{n-1}(X),G)。同调测度'洞'的存在性（几何信息），上同调测度'函数'的存在性（对偶信息）。上同调的核心优势在于Cup积赋予的环结构：H^*(X)是分次环，而H_*(X)只是分次群。此环结构能区分同调同构但非同伦等价的空间。"}],"applications":"上同调在微分几何中通过 de Rham 上同调与微分形式关联；在代数几何中，层上同调是核心工具；在物理学中，上同调用于描述规范场和拓扑量子场论。","refs":[{"book":"Hatcher","ch":"Ch.3","sec":"§3.1"},{"book":"Munkres","ch":"Ch.5","sec":"§42"}]},{"id":"t18","label":"Cup积与上同调环","chapter":"ch3","layer":2,"desc":"Cup积赋予上同调以分次环结构，是上同调区别于同调的核心代数特征。","content":"Cup 积 ⌣: H^p(X;R)×H^q(X;R)→H^{p+q}(X;R) 是上同调最重要的额外结构。在上链层面，对 φ∈C^p, ψ∈C^q，定义 (φ⌣ψ)(σ: Δ^{p+q}→X) = φ(σ|_{[v₀,…,v_p]})·ψ(σ|_{[v_p,…,v_{p+q}]})。此定义诱导上同调层面的双线性乘法，使 H^*(X;R) = ⊕_{n≥0} H^n(X;R) 成为分次交换环：α⌣β = (-1)^{pq} β⌣α。Cup 积的几何意义：上同调类代表'子流形的交'（通过 Poincaré 对偶）。Cup 积长度（上同调类幂零的阶数）给出空间的拓扑信息。","understanding":"Cup 积就像给上同调类一个'乘法'：两个上同调类相乘得到更高维的上同调类。在几何上，通过 Poincaré 对偶，Cup 积对应子流形的交（两个子流形相交得到更低维的子流形，对偶后得到更高维的上同调类）。Cup 积的威力在于能区分同调同构但上同调环不同的空间——例如 CP^2 和 S^2∨S^4 同调同构但上同调环不同（前者有非平凡 Cup 积，后者没有）。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"20\" y=\"40\" width=\"60\" height=\"30\" rx=\"5\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"50\" y=\"59\" font-size=\"10\" fill=\"#2563eb\" text-anchor=\"middle\">H^p(X)</text><rect x=\"120\" y=\"40\" width=\"60\" height=\"30\" rx=\"5\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"150\" y=\"59\" font-size=\"10\" fill=\"#dc2626\" text-anchor=\"middle\">H^q(X)</text><rect x=\"60\" y=\"110\" width=\"80\" height=\"30\" rx=\"5\" fill=\"#e8f0fe\" stroke=\"#7c3aed\" stroke-width=\"2\"/><text x=\"100\" y=\"129\" font-size=\"10\" fill=\"#7c3aed\" text-anchor=\"middle\">H^{p+q}(X)</text><line x1=\"80\" y1=\"70\" x2=\"85\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"120\" y1=\"70\" x2=\"115\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"100\" y=\"95\" font-size=\"11\" fill=\"#7c3aed\" font-weight=\"bold\">⌣</text><text x=\"100\" y=\"160\" font-size=\"9\" fill=\"#333\">α⌣β = (-1)^{pq} β⌣α</text><text x=\"100\" y=\"178\" font-size=\"10\" fill=\"#333\" font-weight=\"bold\">分次交换环</text></svg>","examples":[{"title":"CP^n 的上同调环","content":"H^*(CP^n;Z) ≅ Z[α]/(α^{n+1})，其中 |α|=2。Cup 积 α^k 生成 H^{2k}，α^{n+1}=0。"},{"title":"S^p×S^q 的上同调环","content":"H^*(S^p×S^q;Z) ≅ Z[α,β]/(α²,β²)，其中 |α|=p, |β|=q。α⌣β 生成 H^{p+q}。"},{"title":"区分 CP^2 与 S^2∨S^4","content":"两者同调同构，但 CP^2 中 α⌣α=β（生成 H^4），而 S^2∨S^4 中所有 Cup 积为零。"}],"theorems":[{"name":"Cup积的分次交换性","statement":"α⌣β = (-1)^{pq} β⌣α，因此上同调环是分次交换的。","proof":"在上链层面，(φ⌣ψ)(σ)=φ(σ|_[v₀,...,v_p])·ψ(σ|_[v_p,...,v_{p+q}])。交换顺序需将顶点排列从(v₀,...,v_p,v_p,...,v_{p+q})变为(v₀,...,v_q,v_q,...,v_{p+q})，这相当于一个(p+q+1)阶置换，符号为(-1)^{pq}。由于上链复形是单纯形的前面限制，此符号传递到上同调层面。"},{"name":"Cup积的自然性","statement":"连续映射 f: X→Y 诱导环同态 f^*: H^*(Y)→H^*(X)，即 f^*(α⌣β)=f^*(α)⌣f^*(β)。","proof":"在上链层面：f^#(φ⌣ψ)(σ)=(φ⌣ψ)(f∘σ)=φ(f∘σ|_前)·ψ(f∘σ|_后)。而(f^#φ⌣f^#ψ)(σ)=f^#φ(σ|_前)·f^#ψ(σ|_后)=φ(f∘σ|_前)·ψ(f∘σ|_后)。两者相等，故f^#(φ⌣ψ)=f^#φ⌣f^#ψ。传递到上同调层面即f^*是环同态。"}],"applications":"Cup 积用于区分同调同构但非同伦等价的空间，在代数拓扑中是不可或缺的精细不变量。在扭结理论中，上同调环用于区分扭结；在辛几何中，量子上同调环是重要研究对象。","refs":[{"book":"Hatcher","ch":"Ch.3","sec":"§3.2"},{"book":"Munkres","ch":"Ch.5","sec":"§47"}]},{"id":"t19","label":"万有系数定理","chapter":"ch3","layer":3,"desc":"建立同调群与上同调群（及不同系数群）之间的代数关系，是系数变更的核心工具。","content":"万有系数定理（UCT）描述了同调和上同调群随系数群变化的关系。对于同调，有分裂短正合序列：0→H_n(X)⊗G→H_n(X;G)→Tor(H_{n-1}(X), G)→0。对于上同调：0→Ext(H_{n-1}(X), G)→H^n(X;G)→Hom(H_n(X), G)→0。这些序列虽非自然分裂，但给出了同调/上同调群与系数群的关系。关键含义：已知 Z 系数同调，可计算任意系数同调/上同调。Tor 捕捉扭转，Ext 捕捉扩张。UCT 揭示了代数拓扑与同调代数的深度联系。","understanding":"万有系数定理告诉你：如果你知道一个空间的 Z 系数同调，你就能算出任何其他系数群（如 Z/2, Q, R）的同调和上同调。这就像你知道一个外国人说什么语言（Z 系数同调），你就可以通过翻译（⊗和Tor/Ext操作）知道他在其他语言中怎么说。Tor 出现是因为扭转（torsion）在与某些群做张量积时会消失或变化；Ext 出现是因为上同调作为Hom函子，不是正合的，需要 Ext 来修正。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"15\" y=\"30\" width=\"70\" height=\"30\" rx=\"4\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"50\" y=\"49\" font-size=\"9\" fill=\"#2563eb\" text-anchor=\"middle\">H_*(X;Z)</text><rect x=\"115\" y=\"30\" width=\"70\" height=\"30\" rx=\"4\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"150\" y=\"49\" font-size=\"9\" fill=\"#dc2626\" text-anchor=\"middle\">H_*(X;G)</text><line x1=\"85\" y1=\"45\" x2=\"115\" y2=\"45\" stroke=\"#333\" stroke-width=\"2\"/><text x=\"100\" y=\"42\" font-size=\"10\" fill=\"#333\">UCT</text><text x=\"100\" y=\"80\" font-size=\"9\" fill=\"#333\">0→Hn⊗G→Hn(X;G)→Tor(Hn₋₁,G)→0</text><text x=\"100\" y=\"100\" font-size=\"9\" fill=\"#333\">0→Ext(Hn₋₁,G)→H^n(X;G)→Hom(Hn,G)→0</text><text x=\"100\" y=\"130\" font-size=\"10\" fill=\"#7c3aed\" font-weight=\"bold\">关键函子</text><text x=\"50\" y=\"150\" font-size=\"9\" fill=\"#dc2626\">⊗: 张量积</text><text x=\"50\" y=\"165\" font-size=\"9\" fill=\"#dc2626\">Tor: 扭转</text><text x=\"130\" y=\"150\" font-size=\"9\" fill=\"#2563eb\">Hom: 同态</text><text x=\"130\" y=\"165\" font-size=\"9\" fill=\"#2563eb\">Ext: 扩张</text></svg>","examples":[{"title":"RP^2 的 Z/2 系数同调","content":"已知 H_*(RP^2;Z) = (Z, Z/2, 0)，UCT 给出 H_1(RP^2;Z/2)≅Z/2, H_2(RP^2;Z/2)≅Z/2。"},{"title":"有理系数同调","content":"H_n(X;Q) ≅ H_n(X;Z)⊗Q，即有理同调只保留自由部分，消除所有扭转。"},{"title":"上同调与同调的区别","content":"对于 RP^2，H^1(RP^2;Z)=0 但 H_1(RP^2;Z)=Z/2。Ext(Z/2,Z)=Z/2 出现在上同调中。"}],"theorems":[{"name":"同调万有系数定理","statement":"存在分裂短正合序列 0→H_n(X)⊗G→H_n(X;G)→Tor(H_{n-1}(X),G)→0。","proof":"取Z系数的自由链复形C_*。张量积G得C_*⊗G。由于自由阿贝尔群的子群仍自由，C_n的子群是自由的，故序列分裂（但非自然）。由同调代数：H_n(C_*⊗G)由H_n⊗G和Tor(H_{n-1},G)决定。Tor测量张量积的导出函子，捕捉扭转信息在张量积中的行为。"},{"name":"上同调万有系数定理","statement":"存在分裂短正合序列 0→Ext(H_{n-1}(X),G)→H^n(X;G)→Hom(H_n(X),G)→0。","proof":"对自由链复形C_*应用Hom(-,G)得上链复形C^*。上同调H^n(C^*)由Hom(H_n,G)和Ext(H_{n-1},G)决定。Hom(H_n,G)是自由部分的对偶，Ext(H_{n-1},G)是扭转部分的贡献。Ext测量Hom的左导出函子，反映H_{n-1}中扭转元素到G的扩张。序列分裂但非自然。"}],"applications":"万有系数定理是系数变更的标准工具。在代数拓扑中，Z/p 系数同调常用于计算扭转和同伦群；在代数几何中，l-adic 上同调利用不同系数研究簇的拓扑；在数论中，Galois 上同调的系数变更至关重要。","refs":[{"book":"Hatcher","ch":"Ch.3","sec":"§3.A"},{"book":"Munkres","ch":"Ch.5","sec":"§47"}]},{"id":"t20","label":"Kunneth公式","chapter":"ch3","layer":3,"desc":"计算乘积空间同调/上同调的标准公式，将乘积空间的拓扑信息分解为因子的拓扑信息。","content":"Künneth 公式描述乘积空间 X×Y 的同调与上同调。对于同调，有分裂短正合序列：0→⊕_{i+j=n} H_i(X)⊗H_j(Y)→H_n(X×Y)→⊕_{i+j=n-1} Tor(H_i(X), H_j(Y))→0。对于上同调，当系数为域时有同构 H^n(X×Y) ≅ ⊕_{i+j=n} H^i(X)⊗H^j(Y)。更一般地，有上同调层面的 Künneth 短正合序列。Künneth 公式体现了代数拓扑中'乘积空间的可分解性'，是 Eilenberg-Zilber 定理的代数推论。在域系数下，上同调环满足 H^*(X×Y) ≅ H^*(X)⊗H^*(Y)（分次张量积）。","understanding":"Künneth 公式告诉你如何从两个空间的同调/上同调'拼出'它们乘积空间的同调/上同调。这就像知道两个独立拼图各自的结构，就能推断把它们并排放置时的整体结构。公式的核心是：乘积空间的 n 维同调由所有 i+j=n 维的因子同调张量积组成，再加上 Tor 修正项。在好的系数（如域）下，Tor 项消失，公式变得特别简单——乘积空间的上同调就是因子空间上同调的张量积。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"10\" y=\"40\" width=\"50\" height=\"40\" rx=\"3\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"35\" y=\"64\" font-size=\"9\" fill=\"#2563eb\" text-anchor=\"middle\">X</text><rect x=\"140\" y=\"40\" width=\"50\" height=\"40\" rx=\"3\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"165\" y=\"64\" font-size=\"9\" fill=\"#dc2626\" text-anchor=\"middle\">Y</text><text x=\"100\" y=\"55\" font-size=\"14\" fill=\"#333\">×</text><rect x=\"50\" y=\"110\" width=\"100\" height=\"40\" rx=\"3\" fill=\"#e8f0fe\" stroke=\"#7c3aed\" stroke-width=\"2\"/><text x=\"100\" y=\"134\" font-size=\"10\" fill=\"#7c3aed\" text-anchor=\"middle\">X × Y</text><line x1=\"50\" y1=\"80\" x2=\"70\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"150\" y1=\"80\" x2=\"130\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"100\" y=\"170\" font-size=\"9\" fill=\"#333\">H_n(X×Y) ≅ ⊕_{i+j=n} H_i⊗H_j</text><text x=\"100\" y=\"185\" font-size=\"9\" fill=\"#333\">⊕ ⊕ Tor(H_i, H_j)</text></svg>","examples":[{"title":"环面 T^2=S^1×S^1","content":"Künneth: H_0(T^2)≅Z, H_1(T^2)≅Z², H_2(T^2)≅Z。每个 S^1 贡献一个 H_1 生成元。"},{"title":"S^p×S^q 的上同调环","content":"H^*(S^p×S^q;Z)≅Z[α,β]/(α²,β²) 其中 |α|=p, |β|=q。Künneth + Cup 积结构。"},{"title":"RP^2×S^1 的同调","content":"Künneth 给出 H_1≅Z⊕Z/2, H_2≅Z/2, H_3≅Z/2。Tor(Z/2,Z)=Z/2 提供修正。"}],"theorems":[{"name":"同调 Künneth 定理","statement":"存在分裂短正合序列连接 H_n(X×Y) 与 ⊕_{i+j=n} H_i(X)⊗H_j(Y) 和 Tor 项。","proof":"由Eilenberg-Zilber定理，C_*(X×Y)链同伦等价于C_*(X)⊗C_*(Y)（分次张量积）。对两个链复形的张量积应用代数Künneth公式：H_n(C⊗D)由⊕_{i+j=n}H_i(C)⊗H_j(D)和⊕_{i+j=n-1}Tor(H_i(C),H_j(D))决定。序列分裂但非自然。核心是Eilenberg-Zilber的acyclic model论证。"},{"name":"上同调 Künneth 定理","statement":"对域系数，H^n(X×Y) ≅ ⊕_{i+j=n} H^i(X)⊗H^j(Y)，且上同调环分次张量积。","proof":"对域系数，Tor和Ext项消失，同调Künneth公式给出同构。上同调版本由同调Künneth和对偶得到。环结构：H^*(X×Y)≅H^*(X)⊗H^*(Y)作为分次代数，Cup积满足(α⊗β)⌣(γ⊗δ)=(-1)^{|β||γ|}(α⌣γ)⊗(β⌣δ)。这体现了因子空间上同调信息的独立性与交互规则。"}],"applications":"Künneth 公式用于计算复杂乘积空间的同调/上同调，在代数拓扑、代数几何和数学物理中广泛应用。在弦理论中，紧化空间的拓扑通过 Künneth 公式分析。","refs":[{"book":"Hatcher","ch":"Ch.3","sec":"§3.B"},{"book":"Munkres","ch":"Ch.5","sec":"§48"}]},{"id":"t21","label":"Poincare对偶","chapter":"ch3","layer":3,"desc":"紧致可定向流形上同调与同调之间的对偶关系，是流形拓扑学最深刻的定理之一。","content":"Poincaré 对偶定理：设 M 为紧致可定向 n 维流形（可带边），则存在同构 H^k(M;G) ≅ H_{n-k}(M;G)（以及 H^k(M,∂M;G) ≅ H_{n-k}(M;G)）。对偶同构由与基本类 [M]∈H_n(M;G) 的 Cap 积给出：D(α) = α⌢[M]。在不可定向流形上，Z/2 系数下仍有对偶。Poincaré 对偶的几何解释：每个 k 维上同调类对应一个 (n-k) 维子流形（其对偶），反之亦然。Cup 积在此对应下变为子流形的交。这是代数拓扑与几何拓扑最深层的联系之一。","understanding":"Poincaré 对偶揭示了流形的一个惊人对称性：k 维上同调与 (n-k) 维同调之间有一一对应。在三维空间中，这意味着：0维同调（连通分支）↔ 3维上同调，1维同调（环）↔ 2维上同调，2维同调（空腔）↔ 1维上同调，3维同调↔ 0维上同调。这就像镜子反射：流形的拓扑结构在维度上对称。更美妙的是，Cup 积在对偶下变成了几何交——两个上同调类的 Cup 积对应它们对偶子流形的交。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><text x=\"100\" y=\"20\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\" text-anchor=\"middle\">Poincaré 对偶</text><rect x=\"15\" y=\"40\" width=\"60\" height=\"30\" rx=\"4\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"45\" y=\"59\" font-size=\"9\" fill=\"#2563eb\" text-anchor=\"middle\">H^k(M)</text><rect x=\"125\" y=\"40\" width=\"60\" height=\"30\" rx=\"4\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"155\" y=\"59\" font-size=\"9\" fill=\"#dc2626\" text-anchor=\"middle\">H_{n-k}(M)</text><line x1=\"75\" y1=\"55\" x2=\"125\" y2=\"55\" stroke=\"#333\" stroke-width=\"1.5\" stroke-dasharray=\"4,2\"/><text x=\"100\" y=\"52\" font-size=\"13\" fill=\"#7c3aed\">≅</text><text x=\"100\" y=\"85\" font-size=\"9\" fill=\"#333\">D(α) = α⌢[M]</text><text x=\"100\" y=\"105\" font-size=\"10\" fill=\"#333\" font-weight=\"bold\">Cap积实现同构</text><text x=\"100\" y=\"130\" font-size=\"9\" fill=\"#666\">紧致可定向n维流形M</text><text x=\"100\" y=\"148\" font-size=\"9\" fill=\"#666\">H^k(M) ≅ H_{n-k}(M)</text><text x=\"100\" y=\"170\" font-size=\"9\" fill=\"#dc2626\">Cup积 ↔ 子流形交</text></svg>","examples":[{"title":"S^n 的 Poincaré 对偶","content":"H^0(S^n)≅H_n(S^n)≅Z, H^n(S^n)≅H_0(S^n)≅Z，其他对偶平凡。"},{"title":"CP^n 的 Poincaré 对偶","content":"H^{2k}(CP^n)≅H_{2n-2k}(CP^n)≅Z。Cup 积 α^k⌣α^{n-k}=α^n 对应子流形 CP^k 和 CP^{n-k} 的交。"},{"title":"不可定向流形","content":"RP^2 的 Z 系数 Poincaré 对偶不成立（H^0≅Z 但 H_2=0），但 Z/2 系数下 H^k(RP^2;Z/2)≅H_{2-k}(RP^2;Z/2)。"}],"theorems":[{"name":"Poincaré 对偶定理","statement":"设 M 为紧致可定向 n 维流形，则 Cap 积与基本类 D(α)=α⌢[M] 给出同构 H^k(M)≅H_{n-k}(M)。","proof":"取M的对偶胞腔分解：将M三角剖分，对偶剖分中k维胞腔对应(n-k)维胞腔。对偶剖分的胞腔链复形同构于上链复形。利用Mayer-Vietoris序列和归纳法，证明Cap积D:H^k(M)→H_{n-k}(M)是同构。基本类[M]∈H_n(M)的存在性由可定向性保证，且D在局部上同调层面是良定义的。"},{"name":"Lefschetz 对偶","statement":"对紧致可定向带边流形 (M,∂M)，有 H^k(M)≅H_{n-k}(M,∂M) 和 H^k(M,∂M)≅H_{n-k}(M)。","proof":"将Poincaré对偶推广到带边流形。取M的2倍（double）DM=M∪_{∂M}M，对DM应用Poincaré对偶，再利用Mayer-Vietoris序列分解。基本类在H_n(M,∂M)中。Cap积给出H^k(M)≅H_{n-k}(M,∂M)和H^k(M,∂M)≅H_{n-k}(M)。核心是基本类在边界上的行为。"}],"applications":"Poincaré 对偶是代数拓扑和几何拓扑的桥梁。在扭结理论中，Alexander 对偶是其推广；在代数几何中，Serre 对偶和 Grothendieck 对偶是深远推广；在数学物理中，电磁对偶与 Poincaré 对偶有关。","refs":[{"book":"Hatcher","ch":"Ch.3","sec":"§3.3"},{"book":"Munkres","ch":"Ch.5","sec":"§50"}]},{"id":"t22","label":"上同调的应用","chapter":"ch3","layer":4,"desc":"上同调论在代数拓扑、微分拓扑和代数几何中的高级应用，涵盖示性类和 obstruction 理论。","content":"上同调的应用远超同调： (1) 示性类（Stiefel-Whitney 类、Chern 类、Pontryagin 类）是向量丛的上同调不变量，用于分类向量丛和流形；(2) Obstruct 理论利用上同调描述提升和延拓障碍；(3) de Rham 上同调连接微分形式与拓扑，de Rham 定理给出 H^k_{dR}(M)≅H^k(M;R)；(4) 谱序列（Serre 谱序列、Leray 谱序列）是计算纤维空间上同调的强大工具；(5) 在代数几何中，étale 上同调、晶体上同调等是 Weil 猜想的证明工具。上同调丰富的代数结构使其成为跨领域的通用语言。","understanding":"上同调的应用就像一把瑞士军刀，在不同领域有不同用途：在微分几何中，它告诉你流形上是否存在某种几何结构（如复结构、辛结构）；在物理学中，它描述规范场的拓扑类型（如磁单极子）；在代数几何中，它用于计数方程的解。示性类是上同调最成功的应用之一——它们把向量丛的几何信息（曲率）转化为拓扑信息（上同调类），实现了几何与拓扑的完美结合。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"100\" cy=\"100\" r=\"70\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"100\" y=\"22\" font-size=\"10\" fill=\"#333\" font-weight=\"bold\" text-anchor=\"middle\">上同调应用生态</text><text x=\"100\" y=\"55\" font-size=\"9\" fill=\"#dc2626\">示性类</text><text x=\"45\" y=\"100\" font-size=\"9\" fill=\"#059669\">de Rham</text><text x=\"155\" y=\"100\" font-size=\"9\" fill=\"#d97706\">障碍理论</text><text x=\"55\" y=\"145\" font-size=\"9\" fill=\"#7c3aed\">谱序列</text><text x=\"145\" y=\"145\" font-size=\"9\" fill=\"#0d9488\">étale上同调</text><text x=\"100\" y=\"175\" font-size=\"8\" fill=\"#333\">向量丛 · 流形分类 · 物理</text></svg>","examples":[{"title":"Chern 类与复结构","content":"CP^n 的切丛 Chern 类为 c(TCP^n)=(1+α)^{n+1}，其中 α∈H^2(CP^n;Z)。Chern 数决定复流形的配边类。"},{"title":"Stiefel-Whitney 类","content":"RP^n 的全 Stiefel-Whitney 类为 w(RP^n)=(1+α)^{n+1}∈H^*(RP^n;Z/2)，其中 α∈H^1。w_1≠0 表示不可定向。"},{"title":"de Rham 定理","content":"微分形式的外微分 d 满足 d²=0，de Rham 上同调 H^k_{dR}(M)≅H^k(M;R)。微分形式的楔积对应 Cup 积。"}],"theorems":[{"name":"de Rham 定理","statement":"H^k_{dR}(M) ≅ H^k(M;R)（环同构），楔积对应 Cup 积。","proof":"定义映射I:H^k_{dR}(M)→H^k(M;R)，将微分形式ω映射到上链σ↦∫_σ ω。验证I(dω)=δI(ω)（Stokes定理），故I是链映射。利用单位分解和Poincaré引理证明I诱导同构：对M=ℝ^n成立，通过Mayer-Vietoris归纳到一般流形。楔积对应Cup积由Fubini定理保证。"},{"name":"Chern-Weil 理论","statement":"向量丛的曲率形式通过不变多项式产生示性类，且不依赖于联络的选择。","proof":"对向量丛选联络，曲率形式Ω。对Ad-不变多项式P，P(Ω)是闭的de Rham形式（Bianchi恒等式保证dP(Ω)=0）。若选另一联络，其曲率差为恰当形式，故P(Ω)的de Rham类不依赖于联络。通过de Rham定理，此闭形式对应上同调类，即示性类。核心是曲率形式与联络的变分公式。"}],"applications":"示性类用于分类流形和向量丛；在物理学中，量子霍尔效应、拓扑绝缘体、轴子电动力学都由上同调描述；在弦理论中，D膜电荷由K理论（上同调的推广）分类。","refs":[{"book":"Hatcher","ch":"Ch.3","sec":"§3.3"},{"book":"Hatcher","ch":"Ch.4","sec":"§4.2"}]},{"id":"t23","label":"高阶同伦群","chapter":"ch4","layer":2,"desc":"基本群的推广，使用高维球面 S^n 的映射类定义 n 维同伦群 π_n(X)。","content":"n 维同伦群 π_n(X,x₀) 是保基点映射 (S^n, s₀)→(X, x₀) 的同伦类集合。当 n=1 时，π_1 即基本群（非交换）。当 n≥2 时，π_n(X) 是阿贝尔群。群运算定义为：将两个映射在 S^n 的赤道处'拼接'，利用 S^n 的高维连通性证明良定义性和交换性。π_n 比同调群更难计算，但包含更精细的拓扑信息。经典结果：π_n(S^n)≅Z（由恒等映射生成），但 π_k(S^n) 对于 k>n 极其复杂，至今仍是活跃研究方向。","understanding":"高阶同伦群是基本群的'高维表亲'：基本群用 S^1（圆周）探测空间中的一维洞，π_2 用 S^2（球面）探测二维洞，π_3 用 S^3 探测三维洞，等等。一个关键区别是：n≥2 时，π_n 总是交换群（阿贝尔群），而 π_1 可以是非交换的。计算 π_n(S^k) 是拓扑学中最困难的问题之一——例如 π_{n+1}(S^n)≅Z/2 (n≥3)，这个结果就很不平凡。同伦群比同调群更精细（能区分同调相同但不同伦的空间），但代价是计算极其困难。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"100\" cy=\"100\" r=\"45\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"100\" cy=\"100\" r=\"20\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/><circle cx=\"100\" cy=\"100\" r=\"3\" fill=\"#7c3aed\"/><text x=\"100\" y=\"92\" font-size=\"8\" fill=\"#7c3aed\" text-anchor=\"middle\">x₀</text><text x=\"100\" y=\"50\" font-size=\"9\" fill=\"#2563eb\">S^n</text><text x=\"100\" y=\"75\" font-size=\"8\" fill=\"#dc2626\">f</text><text x=\"100\" y=\"160\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">π_n(X,x₀)</text><text x=\"100\" y=\"178\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">f: S^n→X 的同伦类</text><text x=\"100\" y=\"193\" font-size=\"8\" fill=\"#666\" text-anchor=\"middle\">n≥2时交换群</text></svg>","examples":[{"title":"π_n(S^n)≅Z","content":"映射 f: S^n→S^n 的度数 deg(f)∈Z 给出同构 π_n(S^n)≅Z。恒等映射对应1。"},{"title":"π_3(S^2)≅Z","content":"Hopf 纤维化 S^3→S^2 生成 π_3(S^2)。Hopf 不变量1是 π_3(S^2)≅Z 的生成元。"},{"title":"π_{n+1}(S^n)≅Z/2 (n≥3)","content":"Freudenthal 悬挂定理给出此结果。生成元为悬挂映射 Σ: S^{n+1}→S^n 的两倍恒等映射。"}],"theorems":[{"name":"n≥2 时 π_n 是阿贝尔群","statement":"对 n≥2，π_n(X,x₀) 是阿贝尔群。证明利用 S^n 的高维连通性构造交换同伦。","proof":"核心是利用S^n(n≥2)的高维连通性：在S^n中，两个赤道S^{n-1}可以彼此绕过而不相交。构造同伦：将两个映射f,g:S^n→X在赤道处拼接，通过旋转赤道的位置将f·g连续变形为g·f。具体地，在S^n上旋转坐标使赤道位置互换，高维空间提供了足够的自由度实现此旋转。"},{"name":"同伦群的函子性","statement":"连续映射 f: X→Y 诱导同态 f_*: π_n(X)→π_n(Y)，且 (g∘f)_* = g_*∘f_*。","proof":"定义f_*([α])=[f∘α]，其中α:S^n→X。验证群同态：f_*(α·β)=[f∘(α·β)]=[(f∘α)·(f∘β)]=f_*α·f_*β（n≥2时自动保持，因π_n是Abel群）。复合性(f∘g)_*=f_*∘g_*由定义直接推出。这表明π_n是Top_*到AbelGrp的函子（n≥2）。"}],"applications":"同伦群在物理学中用于描述拓扑缺陷（涡旋、磁单极子、Skyrmion），在扭结理论中 π_n(S^2) 用于研究扭结和链环，在代数K理论中同伦群是核心研究对象。","refs":[{"book":"Hatcher","ch":"Ch.4","sec":"§4.1"},{"book":"Munkres","ch":"Ch.9","sec":"§59"}]},{"id":"t24","label":"纤维化与同伦提升","chapter":"ch4","layer":3,"desc":"纤维化是覆叠空间的高维推广，具有同伦提升性质，是计算同伦群的核心工具。","content":"纤维化 p: E→B 是具有同伦提升性质的连续映射：对任意空间 X 和映射 f: X→E，以及同伦 H: X×I→B 满足 H(x,0)=p(f(x))，存在提升同伦 H̃: X×I→E 使得 H̃(x,0)=f(x) 且 p∘H̃=H。纤维 F = p^{-1}(b₀) 是基点上的原像。纤维化诱导同伦群长正合序列：...→π_n(F)→π_n(E)→π_n(B)→π_{n-1}(F)→...。这是计算同伦群最基本的工具。重要例子：Hopf 纤维化 S^1→S^3→S^2, S^3→S^7→S^4, S^7→S^{15}→S^8。","understanding":"纤维化可以想象为一个'投影仪'：总空间 E 是底空间 B 的'多层版本'，每一层（纤维 F）看起来一样。纤维化的关键性质是'同伦提升'——如果你在底空间连续变形一条路径，你可以同步地在总空间中提升这条变形。这保证了纤维化诱导同伦群的长正合序列，使我们可以通过比较 E, B, F 的同伦群来互相计算。Hopf 纤维化 S^3→S^2 是一个经典例子：三维球面可以看作由圆周纤维组成的二维球面上的'丛'。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"60\" y=\"10\" width=\"80\" height=\"30\" rx=\"4\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"100\" y=\"29\" font-size=\"10\" fill=\"#2563eb\" text-anchor=\"middle\">E (总空间)</text><rect x=\"60\" y=\"100\" width=\"80\" height=\"30\" rx=\"4\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"100\" y=\"119\" font-size=\"10\" fill=\"#dc2626\" text-anchor=\"middle\">B (底空间)</text><line x1=\"100\" y1=\"40\" x2=\"100\" y2=\"100\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"110\" y=\"70\" font-size=\"9\" fill=\"#333\">p</text><circle cx=\"100\" cy=\"155\" r=\"20\" fill=\"none\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/><text x=\"100\" y=\"160\" font-size=\"8\" fill=\"#7c3aed\" text-anchor=\"middle\">F</text><text x=\"100\" y=\"182\" font-size=\"9\" fill=\"#333\">F → E → B</text><text x=\"100\" y=\"195\" font-size=\"8\" fill=\"#666\">同伦提升性质</text></svg>","examples":[{"title":"Hopf 纤维化 S^1→S^3→S^2","content":"利用同伦群长正合序列，从 π_n(S^1) 已知，推出 π_n(S^3)≅π_n(S^2) (n≥3)。"},{"title":"道路空间纤维化","content":"对任意空间 X，道路空间 PX→X 是纤维化，纤维为环路空间 ΩX。π_n(ΩX)≅π_{n+1}(X)。"},{"title":"覆叠空间作为纤维化","content":"覆叠空间是离散纤维的纤维化，同伦群长正合序列给出 π_n(X̃)≅π_n(X) (n≥2)。"}],"theorems":[{"name":"纤维化同伦群长正合序列","statement":"对纤维化 F→E→B，存在长正合序列 ...→π_n(F)→π_n(E)→π_n(B)→π_{n-1}(F)→...。","proof":"连接同态∂:π_n(B)→π_{n-1}(F)的构造：将α:S^n→B视为D^n→B（边界映射到基点），利用同伦提升性质将D^n中的映射提升到E，其在S^{n-1}=∂D^n上的限制落在F中。正合性验证：在每步利用提升性质和压缩同伦。核心是纤维化的同伦提升性质产生长正合序列。"},{"name":"同伦提升性质","statement":"纤维化 p: E→B 具有对任意空间 X 的同伦提升性质。","proof":"纤维化定义为具有对任意空间的同伦提升性质的映射（Hurewicz纤维化）。等价地，若p是局部平凡的纤维丛（如覆盖空间），则具有同伦提升性质。证明利用局部平凡化将同伦分解为小段，在每段上使用乘积结构提升。核心是局部乘积结构加上紧致性论证保证全局提升的存在性。"}],"applications":"纤维化是计算同伦群的核心工具，通过谱序列计算同伦群，在代数拓扑、微分拓扑、代数几何中都有应用。在物理学中，纤维丛理论是规范场论的数学基础。","refs":[{"book":"Hatcher","ch":"Ch.4","sec":"§4.2"},{"book":"Munkres","ch":"Ch.9","sec":"§60"}]},{"id":"t25","label":"Whitehead定理","chapter":"ch4","layer":3,"desc":"弱同伦等价与同伦等价之间的桥梁，是CW复形范畴中的核心结构定理。","content":"Whitehead 定理：若 X 和 Y 是连通 CW 复形，f: X→Y 是连续映射，且 f 诱导所有同伦群的同构 f_*: π_n(X)≅π_n(Y)（∀n），则 f 是同伦等价。此定理的深刻之处在于：对于 CW 复形，同伦群的代数信息完全决定了同伦型。一个推论是：任何连通 CW 复形 X 若满足 π_n(X)=0 (∀n)，则 X 可缩。另一个推论：两个 CW 复形之间的弱同伦等价（诱导同伦群同构的映射）一定是同伦等价。CW 复形范畴是 Whitehead 定理成立的'正确范畴'。","understanding":"Whitehead 定理是代数拓扑中少有的'代数能完全决定几何'的定理。它告诉我们：对于 CW 复形（几乎所有常见空间），如果两个空间在所有维度上的同伦群都相同，那么它们就是同伦等价的——即从拓扑角度看是'一样'的。这就像说：如果两个人的所有基因（同伦群）都相同，那么他们就是同一个人（同伦等价）。但要注意，这个定理只在 CW 复形范畴中成立，对一般拓扑空间不成立。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"15\" y=\"50\" width=\"65\" height=\"40\" rx=\"4\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"47\" y=\"74\" font-size=\"9\" fill=\"#2563eb\" text-anchor=\"middle\">X (CW)</text><rect x=\"120\" y=\"50\" width=\"65\" height=\"40\" rx=\"4\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"152\" y=\"74\" font-size=\"9\" fill=\"#dc2626\" text-anchor=\"middle\">Y (CW)</text><line x1=\"80\" y1=\"70\" x2=\"120\" y2=\"70\" stroke=\"#333\" stroke-width=\"2\"/><text x=\"100\" y=\"65\" font-size=\"10\" fill=\"#7c3aed\">f</text><text x=\"100\" y=\"110\" font-size=\"10\" fill=\"#333\" font-weight=\"bold\">π_n(X) ≅ π_n(Y) ∀n</text><text x=\"100\" y=\"130\" font-size=\"10\" fill=\"#333\">⇓</text><text x=\"100\" y=\"150\" font-size=\"11\" fill=\"#dc2626\" font-weight=\"bold\">X ≃ Y (同伦等价)</text><text x=\"100\" y=\"175\" font-size=\"9\" fill=\"#666\">代数完全决定几何</text></svg>","examples":[{"title":"可缩空间的判定","content":"若连通 CW 复形 X 的所有同伦群平凡，则 X 同伦等价于点。这推广了单连通+无同调⇒可缩。"},{"title":"球面间的同伦等价","content":"S^n 和 S^m 若同伦等价，则必须 n=m。因为 π_n(S^n)≅Z 而 π_n(S^m)=0 (n<m)。"},{"title":"CW逼近","content":"任何空间存在弱同伦等价的CW复形，且在同伦范畴中唯一。这保证了CW复形范畴的完备性。"}],"theorems":[{"name":"Whitehead 定理","statement":"CW 复形之间的弱同伦等价（诱导所有同伦群同构的映射）是同伦等价。","proof":"归纳构造同伦逆g:Y→X。对n维骨架Y^n，假设已构造g在Y^{n-1}上并满足f∘g≃id。利用f_*:π_n(X)→π_n(Y)是同构，将Y中n维胞腔的粘贴映射提升到X中，延拓g到Y^n。逐维完成构造。由于CW复形具有弱拓扑，归纳极限给出整体同伦等价。"},{"name":"Whitehead 定理（同调版本）","statement":"若 f: X→Y 是单连通 CW 复形间的映射，且诱导同调同构，则 f 是同伦等价。","proof":"单连通条件下，Hurewicz定理联系同调和同伦群。f诱导同调同构⇒由Hurewicz定理和归纳法，f诱导同伦群同构。具体：第一个非零同调群同构⇒第一个非零同伦群同构→逐维推进。再由Whitehead定理（同伦群版本），f是同伦等价。单连通性保证了归纳的基础步骤成立。"}],"applications":"Whitehead 定理是代数拓扑的基石，用于证明空间的同伦等价性，在稳定同伦论、有理同伦论和代数K理论中频繁使用。它保证了同伦群作为CW复形的不变量的完备性。","refs":[{"book":"Hatcher","ch":"Ch.4","sec":"§4.1"},{"book":"Munkres","ch":"Ch.9","sec":"§61"}]},{"id":"t26","label":"Hurewicz定理","chapter":"ch4","layer":3,"desc":"连接同伦群与同调群的桥梁定理，揭示了低维同调群可由同伦群完全确定。","content":"Hurewicz 定理建立了同伦群与同调群之间的基本联系。设 X 是 (n-1) 连通空间（即 π_k(X)=0 对 k≤n-1），n≥1。则存在自然同态 h: π_n(X)→H_n(X)（Hurewicz 同态），且 (1) 若 n=1，h 诱导同构 π_1(X)_{ab}≅H_1(X)（基本群的交换化）；(2) 若 n≥2，h 是同构。此外，h 在更高维也诱导满射。Hurewicz 定理的推论：第一个非零同伦群与同维同调群同构。这是计算同伦群的重要工具，也揭示了同调是同伦群的'交换化'。","understanding":"Hurewicz 定理告诉我们：同调群是同伦群的'简化版'。具体来说，H_1 就是 π_1 的交换化（把非交换部分'抹平'），而第一个非零的高维同伦群恰好等于同维的同调群。这解释了为什么同调群更容易计算：它们丢失了同伦群中的非交换信息。但 Hurewicz 定理也提供了一个从同调群反向推断同伦群的方法——至少对于最低的非零同伦群。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"10\" y=\"40\" width=\"70\" height=\"35\" rx=\"4\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"45\" y=\"62\" font-size=\"10\" fill=\"#2563eb\" text-anchor=\"middle\">π_n(X)</text><rect x=\"120\" y=\"40\" width=\"70\" height=\"35\" rx=\"4\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"155\" y=\"62\" font-size=\"10\" fill=\"#dc2626\" text-anchor=\"middle\">H_n(X)</text><line x1=\"80\" y1=\"57\" x2=\"120\" y2=\"57\" stroke=\"#333\" stroke-width=\"2\"/><text x=\"100\" y=\"52\" font-size=\"10\" fill=\"#7c3aed\">h</text><text x=\"100\" y=\"95\" font-size=\"9\" fill=\"#333\">n=1: π₁/[π₁,π₁] ≅ H₁</text><text x=\"100\" y=\"112\" font-size=\"9\" fill=\"#333\">n≥2: π_n ≅ H_n</text><text x=\"100\" y=\"130\" font-size=\"9\" fill=\"#333\">(若X为(n-1)连通)</text><text x=\"100\" y=\"155\" font-size=\"10\" fill=\"#dc2626\" font-weight=\"bold\">Hurewicz 同构</text><text x=\"100\" y=\"175\" font-size=\"9\" fill=\"#666\">同伦群 → 同调群</text></svg>","examples":[{"title":"S^n 的 Hurewicz 定理","content":"S^n 是 (n-1) 连通空间，π_n(S^n)≅Z 且 Hurewicz 同态 h: π_n(S^n)→H_n(S^n)≅Z 是同构。"},{"title":"环面 T^2 的 H_1","content":"π_1(T^2)≅Z×Z（交换），故 H_1(T^2)≅π_1(T^2)≅Z×Z。Hurewicz 同态是同构。"},{"title":"8字形 S^1∨S^1","content":"π_1≅F₂（非交换），H_1≅Z²。Hurewicz 定理给出 π_1 的交换化等于 H_1。"}],"theorems":[{"name":"Hurewicz 定理","statement":"若 X 是 (n-1) 连通 (n≥1)，则 Hurewicz 同态 h: π_n(X)→H_n(X) 是同构 (n≥2) 或交换化同构 (n=1)。","proof":"构造h([f])=f_*([S^n])，其中[S^n]是H_n(S^n)的基本类。对(n-1)连通空间，利用相对同伦群和同调群的正合序列，归纳证明H_i(X)=0(i<n)且h是满射。n≥2时，利用同调正合序列和五引理证明h是单射。n=1时，h的核是换位子群[π₁,π₁]。"},{"name":"相对 Hurewicz 定理","statement":"对空间对 (X,A)，若 (X,A) 是 (n-1) 连通，则 π_n(X,A)→H_n(X,A) 有类似结论。","proof":"类似构造相对Hurewicz同态h:π_n(X,A)→H_n(X,A)。(X,A)的(n-1)连通性意味着π_i(X,A)=0(i<n)且A是道路连通的。利用相对同伦群和相对同调群的正合序列，归纳证明H_i(X,A)=0(i<n)且h是满射。n≥2时h是同构。证明框架与绝对情形对应，推广到空间对。"}],"applications":"Hurewicz 定理是连接同伦论和同调论的桥梁，用于从同调群计算最低非零同伦群，在稳定同伦论中用于构造谱的同伦群，在代数K理论中用于计算K群。","refs":[{"book":"Hatcher","ch":"Ch.4","sec":"§4.2"},{"book":"Munkres","ch":"Ch.9","sec":"§62"}]},{"id":"t27","label":"同伦群的计算","chapter":"ch4","layer":4,"desc":"同伦群的计算是代数拓扑的核心难题，涉及谱序列、Postnikov塔和稳定同伦论等高级工具。","content":"同伦群的计算极其困难，即使对球面 S^n 也远未完全解决。主要工具：(1) 纤维化长正合序列：利用 Hopf 纤维化等计算同伦群；(2) Freudenthal 悬挂定理：π_{n+k}(S^n) 对 n 充分大时稳定，稳定同伦群 π_k^S 是重要研究对象；(3) Serre 谱序列：计算纤维化的同调/上同调，进而通过 Hurewicz 定理和模 p 理论推算同伦群；(4) Postnikov 塔：将空间分解为同伦群逐层构建的纤维化序列；(5) 有理同伦论：Quillen 和 Sullivan 的工作将有理同伦群的计算转化为微分分次李代数的问题。","understanding":"计算同伦群是一桩'拓扑学界的奥林匹克竞赛'。即使是最简单的空间——球面 S^2——其同伦群 π_n(S^2) 至今仍未完全算出。稳定同伦群（n 足够大时 π_{n+k}(S^n) 不再依赖 n）相对容易，但仍有大量未解问题。Serre 的诺贝尔奖级别工作（他获得的是菲尔兹奖）利用谱序列证明了 π_n(S^k) 大多是有限群。计算同伦群需要几乎所有的代数拓扑工具：谱序列、同调代数、模理论、甚至代数几何。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><text x=\"100\" y=\"22\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\" text-anchor=\"middle\">同伦群计算工具</text><rect x=\"10\" y=\"40\" width=\"85\" height=\"25\" rx=\"3\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1\"/><text x=\"52\" y=\"57\" font-size=\"8\" fill=\"#2563eb\" text-anchor=\"middle\">纤维化长正合列</text><rect x=\"105\" y=\"40\" width=\"85\" height=\"25\" rx=\"3\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1\"/><text x=\"147\" y=\"57\" font-size=\"8\" fill=\"#dc2626\" text-anchor=\"middle\">谱序列</text><rect x=\"10\" y=\"75\" width=\"85\" height=\"25\" rx=\"3\" fill=\"#fef3c7\" stroke=\"#d97706\" stroke-width=\"1\"/><text x=\"52\" y=\"92\" font-size=\"8\" fill=\"#d97706\" text-anchor=\"middle\">悬挂定理</text><rect x=\"105\" y=\"75\" width=\"85\" height=\"25\" rx=\"3\" fill=\"#e0f2fe\" stroke=\"#0d9488\" stroke-width=\"1\"/><text x=\"147\" y=\"92\" font-size=\"8\" fill=\"#0d9488\" text-anchor=\"middle\">Postnikov塔</text><rect x=\"10\" y=\"110\" width=\"85\" height=\"25\" rx=\"3\" fill=\"#f3e8ff\" stroke=\"#7c3aed\" stroke-width=\"1\"/><text x=\"52\" y=\"127\" font-size=\"8\" fill=\"#7c3aed\" text-anchor=\"middle\">有理同伦论</text><rect x=\"105\" y=\"110\" width=\"85\" height=\"25\" rx=\"3\" fill=\"#fce4ec\" stroke=\"#e91e63\" stroke-width=\"1\"/><text x=\"147\" y=\"127\" font-size=\"8\" fill=\"#e91e63\" text-anchor=\"middle\">模p理论</text><text x=\"100\" y=\"160\" font-size=\"9\" fill=\"#333\">π_{n+k}(S^n) 稳定同伦群</text><text x=\"100\" y=\"178\" font-size=\"9\" fill=\"#dc2626\">至今未完全计算！</text></svg>","examples":[{"title":"π_3(S^2)≅Z","content":"利用 Hopf 纤维化 S^1→S^3→S^2 的长正合序列，π_3(S^3)≅Z 推出 π_3(S^2)≅Z。"},{"title":"π_4(S^2)≅Z/2","content":"利用 π_3(S^2)≅Z 和纤维化 ΩS^2→PS^2→S^2，通过谱序列计算得到。"},{"title":"稳定同伦群 π_1^S","content":"π_{n+1}(S^n)≅Z/2 (n≥3)，稳定同伦群 π_1^S≅Z/2。这是Freudenthal悬挂定理的经典结果。"}],"theorems":[{"name":"Freudenthal 悬挂定理","statement":"悬挂同态 Σ: π_{n+k}(S^n)→π_{n+k+1}(S^{n+1}) 对 k≤n-1 是同构，对 k=n 是满射。","proof":"悬挂同态由悬挂映射诱导：Σ[f]=[Σf]。利用Blakers-Massey定理或同调论证：考虑映射S^n×I→S^{n+1}的像。在稳定范围内（k≤n-1），悬挂映射在球面上诱导同伦群的同构。核心是维数足够高时，映射的像有充分空间规避低维障碍。这定义了稳定同伦群π_k^S=colim π_{n+k}(S^n)。"},{"name":"Serre 有限性定理","statement":"π_{n+k}(S^n) 对 k>0 是有限群（除 π_{4n-1}(S^{2n}) 包含一个 Z 直和项外）。","proof":"利用Serre谱序列计算球面的模p上同调，进而通过模p同伦群和有理同伦论推断。有理同伦群π_*(S^n)⊗Q在n为奇数时只有π_n⊗Q=Q；n为偶数时加上π_{2n-1}⊗Q=Q。其余全为有限群。Serre的突破性工作揭示了球面同伦群几乎全是有限群，例外情形由Hopf不变量解释。"}],"applications":"同伦群计算在数学物理中用于分类拓扑孤子（Skyrmion），在弦理论中 D 膜的分类用到同伦群和 K 理论，在代数几何中球面同伦群与代数 K 理论和模形式有深刻联系。","refs":[{"book":"Hatcher","ch":"Ch.4","sec":"§4.2"},{"book":"Hatcher","ch":"Ch.4","sec":"§4.3"}]}],"edges":[{"source":"t1","target":"t2","label":"前提知识"},{"source":"t2","target":"t3","label":"前提知识"},{"source":"t2","target":"t4","label":"前提知识"},{"source":"t4","target":"t5","label":"前提知识"},{"source":"t2","target":"t6","label":"前提知识"},{"source":"t3","target":"t7","label":"前提知识"},{"source":"t6","target":"t7","label":"前提知识"},{"source":"t1","target":"t8","label":"前提知识"},{"source":"t9","target":"t10","label":"前提知识"},{"source":"t10","target":"t11","label":"前提知识"},{"source":"t11","target":"t12","label":"前提知识"},{"source":"t12","target":"t13","label":"前提知识"},{"source":"t11","target":"t14","label":"前提知识"},{"source":"t14","target":"t15","label":"前提知识"},{"source":"t10","target":"t16","label":"前提知识"},{"source":"t13","target":"t16","label":"前提知识"},{"source":"t10","target":"t17","label":"前提知识"},{"source":"t17","target":"t18","label":"前提知识"},{"source":"t17","target":"t19","label":"前提知识"},{"source":"t10","target":"t20","label":"前提知识"},{"source":"t17","target":"t20","label":"前提知识"},{"source":"t16","target":"t21","label":"前提知识"},{"source":"t18","target":"t22","label":"前提知识"},{"source":"t21","target":"t22","label":"前提知识"},{"source":"t2","target":"t23","label":"前提知识"},{"source":"t23","target":"t24","label":"前提知识"},{"source":"t23","target":"t25","label":"前提知识"},{"source":"t10","target":"t26","label":"前提知识"},{"source":"t23","target":"t26","label":"前提知识"},{"source":"t25","target":"t27","label":"前提知识"},{"source":"t26","target":"t27","label":"前提知识"}],"quizzes":[{"q":"两个映射 f,g: X→Y 同伦的定义是什么？","options":["存在连续映射 H: X×[0,1]→Y 使得 H(x,0)=f(x), H(x,1)=g(x)","f 和 g 的像相同","f 和 g 是同胚","f 和 g 有相同的定义域"],"answer":0,"explanation":"同伦的定义是通过连续映射 H: X×[0,1]→Y 连接两个映射，H(x,0)=f(x) 且 H(x,1)=g(x)。","difficulty":"easy","chapter":"ch1"},{"q":"S^1 的基本群 π₁(S^1) 同构于什么？","options":["Z","Z/2","平凡群","Z×Z"],"answer":0,"explanation":"π₁(S^1)≅Z，每个同伦类由绕数（整数）唯一确定。","difficulty":"easy","chapter":"ch1"},{"q":"下列哪个空间是可缩的？","options":["R^n","S^1","S^2","T^2"],"answer":0,"explanation":"R^n 可形变收缩到原点，同伦等价于点，故可缩。S^1, S^2, T^2 有非平凡同调群，不可缩。","difficulty":"easy","chapter":"ch1"},{"q":"覆叠空间 p: X̃→X 的纤维 p^{-1}(x) 是什么？","options":["离散空间","连通空间","紧致空间","可缩空间"],"answer":0,"explanation":"覆叠空间的纤维是离散空间，这是覆叠映射的定义要求。","difficulty":"easy","chapter":"ch1"},{"q":"Seifert-van Kampen 定理主要用于计算什么？","options":["基本群","同调群","同伦群","上同调环"],"answer":0,"explanation":"van Kampen 定理是计算基本群的核心工具，通过分解空间为开集利用自由积计算。","difficulty":"medium","chapter":"ch1"},{"q":"万有覆叠空间的基本群是什么？","options":["平凡群","Z","自由群","Z/2"],"answer":0,"explanation":"万有覆叠是单连通的覆叠空间，其基本群为平凡群。","difficulty":"medium","chapter":"ch1"},{"q":"Brouwer 不动点定理（二维）的基本群证明中，关键矛盾是什么？","options":["收缩映射 r: D²→S^1 诱导恒等映射在基本群上，但 π₁(D²)={e} 而 π₁(S^1)≅Z","D² 和 S^1 的基本群相同","基本群是函子","S^1 不可缩"],"answer":0,"explanation":"假设无不动点可构造收缩映射，导致基本群层面的矛盾：{e}→Z 不能是满射。","difficulty":"medium","chapter":"ch1"},{"q":"形变收缩与同伦等价的关系是什么？","options":["形变收缩比同伦等价更强，形变收缩一定是同伦等价","两者完全相同","同伦等价比形变收缩更强","两者没有关系"],"answer":0,"explanation":"形变收缩是特殊的同伦等价，要求收缩映射在子空间上是恒等映射且同伦保持子空间点不动。","difficulty":"medium","chapter":"ch1"},{"q":"在覆叠空间分类中，π₁(X) 的平凡子群对应什么覆叠？","options":["万有覆叠","平凡覆叠","正则覆叠","没有覆叠"],"answer":0,"explanation":"Galois对应中，π₁(X)的平凡子群对应万有覆叠（单连通覆叠空间）。","difficulty":"hard","chapter":"ch1"},{"q":"设 X 道路连通，不同基点对应的基本群有何关系？","options":["同构（但同构不自然）","完全相同","完全不同","互不相关"],"answer":0,"explanation":"不同基点的基本群同构，但同构依赖于连接两基点的道路选择，不是自然的。","difficulty":"hard","chapter":"ch1"},{"q":"n维标准单纯形 Δ^n 有多少个顶点？","options":["n+1","n","2n","n²"],"answer":0,"explanation":"Δ^n 是 R^{n+1} 中 n+1 个点的凸包，有 n+1 个顶点。","difficulty":"easy","chapter":"ch2"},{"q":"单纯同调中边界算子 ∂ 满足什么关键性质？","options":["∂∘∂ = 0","∂∘∂ = id","∂ = 0","∂∘∂ = ∂"],"answer":0,"explanation":"∂_{n-1}∘∂_n = 0 是链复形的核心性质，保证了同调群的良定义性。","difficulty":"easy","chapter":"ch2"},{"q":"S^2 的同调群 H_1(S^2) 是什么？","options":["0","Z","Z/2","Z²"],"answer":0,"explanation":"球面 S^2 没有一维洞，H_1(S^2)=0。H_0≅Z, H_2≅Z。","difficulty":"easy","chapter":"ch2"},{"q":"奇异同调相比单纯同调的主要优势是什么？","options":["函子性和同伦不变性自然成立","计算更简单","链群总是有限生成","不需要连续映射"],"answer":0,"explanation":"奇异同调具有自然的函子性和同伦不变性，这些性质在单纯同调中需要额外证明。","difficulty":"medium","chapter":"ch2"},{"q":"Mayer-Vietoris 序列连接哪些同调群？","options":["H_n(U∩V), H_n(U)⊕H_n(V), H_n(X)","H_n(X), H_n(A), H_n(X,A)","π_n(F), π_n(E), π_n(B)","H^n(X), H_n(X), H_{n-1}(X)"],"answer":0,"explanation":"Mayer-Vietoris 序列连接 H_n(U∩V), H_n(U)⊕H_n(V), H_n(U∪V)。","difficulty":"medium","chapter":"ch2"},{"q":"CW 复形的胞腔同调中，n 维链群 C_n^{CW} 的秩等于什么？","options":["n 维胞腔的个数","n 维同调群的秩","Euler 示性数","基本群的秩"],"answer":0,"explanation":"C_n^{CW}(X) = H_n(X^n, X^{n-1}) 是自由阿贝尔群，秩等于 n 维胞腔数。","difficulty":"medium","chapter":"ch2"},{"q":"切除定理的条件是什么？","options":["Z̄ ⊂ Int(A)","Z 是开集","A 是紧致集","X 是流形"],"answer":0,"explanation":"切除定理要求 Z 的闭包包含在 A 的内部，即 Z̄⊂Int(A)。","difficulty":"medium","chapter":"ch2"},{"q":"RP^2 的同调群 H_1(RP^2;Z) 是什么？","options":["Z/2","Z","0","Z²"],"answer":0,"explanation":"RP^2 的胞腔边界 d_2(e²)=2e¹，故 H_1(RP^2;Z)≅Z/2（扭转）。","difficulty":"hard","chapter":"ch2"},{"q":"Lefschetz 不动点定理中，Lefschetz 数 L(f) 如何定义？","options":["Σ(-1)^n tr(f_*: H_n(X)→H_n(X))","Σ rank H_n(X)","Σ tr(f_*: π_n→π_n)","Σ dim H_n(X)"],"answer":0,"explanation":"L(f) = Σ_{n}(-1)^n tr(f_*: H_n(X;Q)→H_n(X;Q))，是各维同调诱导映射的迹的交错和。","difficulty":"hard","chapter":"ch2"},{"q":"对于可定向闭曲面 Σ_g，其 H_1(Σ_g) 的秩是多少？","options":["2g","g","g+1","1"],"answer":0,"explanation":"亏格 g 的可定向闭曲面 Σ_g 的 H_1≅Z^{2g}，秩为 2g。","difficulty":"hard","chapter":"ch2"},{"q":"上同调群 H^n(X;G) 中的上链群 C^n 定义为什么？","options":["Hom(C_n, G)","C_n ⊗ G","H_n(X;G)","C_n ⊕ G"],"answer":0,"explanation":"C^n = Hom(C_n, G)，即从链群到系数群的所有群同态。","difficulty":"easy","chapter":"ch3"},{"q":"Cup 积 ⌣: H^p×H^q→H^{p+q} 满足什么交换律？","options":["α⌣β = (-1)^{pq} β⌣α","α⌣β = β⌣α","α⌣β = -β⌣α","α⌣β = 0"],"answer":0,"explanation":"Cup 积是分次交换的：α⌣β = (-1)^{pq} β⌣α。","difficulty":"easy","chapter":"ch3"},{"q":"CP^n 的上同调环 H^*(CP^n;Z) 同构于什么？","options":["Z[α]/(α^{n+1})，|α|=2","Z[α]/(α²)，|α|=n","Z×Z","Z/2[α]"],"answer":0,"explanation":"H^*(CP^n;Z) ≅ Z[α]/(α^{n+1})，其中 α 是度为 2 的生成元，α^{n+1}=0。","difficulty":"medium","chapter":"ch3"},{"q":"万有系数定理（同调版本）的短正合序列包含什么？","options":["0→H_n⊗G→H_n(X;G)→Tor(H_{n-1},G)→0","0→H_n→H_n(X;G)→H_{n-1}→0","0→G→H_n(X;G)→H_n→0","0→Tor→H_n(X;G)→H_n⊗G→0"],"answer":0,"explanation":"同调UCT为 0→H_n(X)⊗G→H_n(X;G)→Tor(H_{n-1}(X),G)→0。","difficulty":"medium","chapter":"ch3"},{"q":"Künneth 公式在域系数下，H^n(X×Y) 等于什么？","options":["⊕_{i+j=n} H^i(X)⊗H^j(Y)","H^n(X)⊕H^n(Y)","H^n(X)⊗H^n(Y)","H^n(X)×H^n(Y)"],"answer":0,"explanation":"在域系数下，上同调 Künneth 公式给出 H^n(X×Y) ≅ ⊕_{i+j=n} H^i(X)⊗H^j(Y)。","difficulty":"medium","chapter":"ch3"},{"q":"Poincaré 对偶定理中，n 维紧致可定向流形 M 的 H^k(M) 同构于什么？","options":["H_{n-k}(M)","H_k(M)","H^{n-k}(M)","H_n(M)"],"answer":0,"explanation":"Poincaré 对偶：H^k(M) ≅ H_{n-k}(M)，通过 Cap 积与基本类实现。","difficulty":"medium","chapter":"ch3"},{"q":"Chern 类 c_k(E) 属于哪个上同调群？","options":["H^{2k}(X;Z)","H^k(X;Z)","H^{2k}(X;Z/2)","H^k(X;R)"],"answer":0,"explanation":"Chern 类 c_k(E)∈H^{2k}(X;Z)，是复向量丛的整系数示性类。","difficulty":"hard","chapter":"ch3"},{"q":"de Rham 定理表明什么？","options":["H^k_{dR}(M) ≅ H^k(M;R)","H^k_{dR}(M) ≅ H_k(M;R)","H^k_{dR}(M) ≅ π_k(M)","H^k_{dR}(M) ≅ H^k(M;Z)"],"answer":0,"explanation":"de Rham 定理给出了微分形式上同调与奇异上同调（实系数）的同构，楔积对应 Cup 积。","difficulty":"hard","chapter":"ch3"},{"q":"Ext(H_{n-1}(X), G) 在上同调万有系数定理中出现在哪里？","options":["短正合序列的左端","短正合序列的右端","短正合序列的中间","不出现"],"answer":0,"explanation":"上同调UCT为 0→Ext(H_{n-1}(X),G)→H^n(X;G)→Hom(H_n(X),G)→0，Ext 在左端。","difficulty":"hard","chapter":"ch3"},{"q":"RP^2 的 Z/2 系数上同调环 H^*(RP^2;Z/2) 同构于什么？","options":["Z/2[α]/(α³)，|α|=1","Z/2[α]/(α²)，|α|=2","Z/2⊕Z/2","Z/2"],"answer":0,"explanation":"H^*(RP^2;Z/2) ≅ Z/2[α]/(α³)，其中 α∈H^1(RP^2;Z/2) 是生成元。","difficulty":"hard","chapter":"ch3"},{"q":"n≥2 时，π_n(X) 是什么类型的群？","options":["阿贝尔群（交换群）","非交换群","有限群","自由群"],"answer":0,"explanation":"当 n≥2 时，同伦群 π_n(X) 总是阿贝尔群。这是高维同伦群的基本性质。","difficulty":"easy","chapter":"ch4"},{"q":"π_n(S^n) 同构于什么？","options":["Z","Z/2","平凡群","Z×Z"],"answer":0,"explanation":"π_n(S^n)≅Z，由恒等映射的度数生成。这是同伦群最基本的计算结果。","difficulty":"easy","chapter":"ch4"},{"q":"纤维化 F→E→B 诱导什么序列？","options":["同伦群长正合序列","同调群长正合序列","基本群正合序列","上同调长正合序列"],"answer":0,"explanation":"纤维化诱导同伦群长正合序列 ...→π_n(F)→π_n(E)→π_n(B)→π_{n-1}(F)→...。","difficulty":"medium","chapter":"ch4"},{"q":"Whitehead 定理在什么范畴中成立？","options":["CW 复形范畴","所有拓扑空间范畴","流形范畴","紧致空间范畴"],"answer":0,"explanation":"Whitehead 定理在 CW 复形范畴中成立：弱同伦等价（诱导同伦群同构）⇒ 同伦等价。","difficulty":"medium","chapter":"ch4"},{"q":"Hurewicz 定理中，若 X 是 (n-1) 连通空间 (n≥2)，则 π_n(X) 同构于什么？","options":["H_n(X)","H_{n-1}(X)","H_n(X)⊗Z/2","π_{n-1}(X)"],"answer":0,"explanation":"Hurewicz 定理：若 X 是 (n-1) 连通 (n≥2)，则 Hurewicz 同态 π_n(X)→H_n(X) 是同构。","difficulty":"medium","chapter":"ch4"},{"q":"Hopf 纤维化 S^1→S^3→S^2 给出 π_3(S^2) 同构于什么？","options":["Z","Z/2","0","Z×Z"],"answer":0,"explanation":"由 Hopf 纤维化同伦群长正合序列，π_3(S^3)≅Z 推出 π_3(S^2)≅Z。","difficulty":"medium","chapter":"ch4"},{"q":"Freudenthal 悬挂定理描述了什么？","options":["π_{n+k}(S^n) 对充分大的 n 稳定","π_n(S^n)≅Z","π_n 是阿贝尔群","π_n 与 H_n 的关系"],"answer":0,"explanation":"Freudenthal 定理：悬挂同态 Σ: π_{n+k}(S^n)→π_{n+k+1}(S^{n+1}) 对 n>k+1 是同构。","difficulty":"hard","chapter":"ch4"},{"q":"π_{n+1}(S^n) (n≥3) 同构于什么？","options":["Z/2","Z","0","Z/3"],"answer":0,"explanation":"π_{n+1}(S^n)≅Z/2 (n≥3)，这是稳定同伦群 π_1^S≅Z/2 的经典结果。","difficulty":"hard","chapter":"ch4"},{"q":"Serre 谱序列主要用于计算什么？","options":["纤维化的同调/上同调","基本群","覆叠空间","同伦等价"],"answer":0,"explanation":"Serre 谱序列是计算纤维化 F→E→B 的同调群和上同调群的核心工具。","difficulty":"hard","chapter":"ch4"},{"q":"Hurewicz 定理在 n=1 时给出什么关系？","options":["π₁(X)_{ab} ≅ H₁(X)","π₁(X) ≅ H₁(X)","π₁(X) ≅ H₁(X)⊗Z/2","π₁(X) ≅ H₂(X)"],"answer":0,"explanation":"n=1 时，Hurewicz 同态诱导 π₁(X) 的交换化与 H₁(X) 的同构。","difficulty":"hard","chapter":"ch4"}]},"nodePrefix":"t"}];

<script>
(function() {
  'use strict';

  // ---- State ----
  let activeSubject = 'all';
  let activeChapter = null;
  let activeNode = null;
  let searchTerm = '';
  let quizChapter = null;
  let quizDifficulty = 'all';
  let quizCollapsed = false;
  let sidebarCollapsed = false;
  let layerFilter = 'all';
  let readNodes = loadProgress();

  // ---- Progress ----
  const STORAGE_KEY = 'learning-workbench-progress';

  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(readNodes));
    } catch (e) { /* ignore */ }
  }

  function markRead(nodeId) {
    if (!readNodes[nodeId]) {
      readNodes[nodeId] = Date.now();
      saveProgress();
      updateProgress();
    }
  }

  function updateProgress() {
    const count = Object.keys(readNodes).filter(k => ALL_NODES.some(n => n.id === k)).length;
    document.getElementById('progress-info').textContent = '已读: ' + count + '/' + ALL_NODES.length;
  }

  // ---- Filter nodes by subject ----
  function filterBySubject(nodes) {
    if (activeSubject === 'all') return nodes;
    return nodes.filter(n => n.subject === activeSubject);
  }

  // ---- Filter nodes by chapter ----
  function filterByChapter(nodes) {
    if (!activeChapter) return nodes;
    return nodes.filter(n => {
      const ch = ALL_CHAPTERS.find(c => c.id === n.chapter && c.subject === n.subject);
      return ch && (ch.id + (ch.subject === 'topo' ? '_t' : '') === activeChapter ||
                    ch.id === activeChapter);
    });
  }

  // ---- Chapter color ----
  function getChapterColor(node) {
    const ch = ALL_CHAPTERS.find(c => c.id === node.chapter && c.subject === node.subject);
    if (!ch) return '#94a3b8';
    const key = ch.subject === 'topo' ? ch.id + '_t' : ch.id;
    const idx = ALL_CHAPTERS.findIndex(c => {
      const k = c.subject === 'topo' ? c.id + '_t' : c.id;
      return k === key;
    });
    return CH_COLORS[idx % CH_COLORS.length] || '#94a3b8';
  }

  // ---- Node size ----
  function getNodeSize(node) {
    const layer = node.layer || 2;
    const base = 14 - layer * 1.8;
    return Math.max(5, Math.min(14, base));
  }

  // ---- Graph rendering ----
  const graphArea = document.getElementById('graph-area');
  const svg = d3.select('#graph-svg');
  const width = () => graphArea.clientWidth;
  const height = () => graphArea.clientHeight;

  // Create SVG groups
  const g = svg.append('g');
  const linkGroup = g.append('g').attr('class', 'links');
  const nodeGroup = g.append('g').attr('class', 'nodes');

  // Zoom behavior
  const zoom = d3.zoom()
    .scaleExtent([0.2, 4])
    .on('zoom', (event) => { g.attr('transform', event.transform); });
  svg.call(zoom);

  // Force simulation
  let simulation;

  function initGraph() {
    let nodes = ALL_NODES.map(n => ({ ...n }));
    let links = ALL_EDGES.map(e => ({ ...e }));

    // Filter by layer
    if (layerFilter !== 'all') {
      const [minL, maxL] = layerFilter.split('-').map(Number);
      const filteredIds = new Set(nodes.filter(n => n.layer >= minL && n.layer <= maxL).map(n => n.id));
      nodes = nodes.filter(n => filteredIds.has(n.id));
      links = links.filter(e => filteredIds.has(e.source) && filteredIds.has(e.target));
    }

    // Clear
    linkGroup.selectAll('*').remove();
    nodeGroup.selectAll('*').remove();

    const w = width();
    const h = height();

    simulation = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(80))
      .force('charge', d3.forceManyBody().strength(-300))
      .force('center', d3.forceCenter(w / 2, h / 2))
      .force('collision', d3.forceCollide().radius(d => getNodeSize(d) + 4))
      .force('y', d3.forceY().y(d => {
        // Layer-based y positioning: layer 0 at top, layer 4 at bottom
        const layer = d.layer || 2;
        const topMargin = 80;
        const bottomMargin = 80;
        const layerHeight = (h - topMargin - bottomMargin) / 5;
        return topMargin + layer * layerHeight + layerHeight / 2;
      }).strength(0.5))
      .force('x', d3.forceX(w / 2).strength(0.05));

    // Draw links
    const link = linkGroup.selectAll('line')
      .data(links)
      .join('line')
      .attr('class', 'link')
      .attr('stroke', '#cbd5e1')
      .attr('stroke-opacity', 0.7)
      .attr('stroke-width', 1.5);

    // Draw nodes
    const node = nodeGroup.selectAll('g')
      .data(nodes)
      .join('g')
      .attr('class', 'node')
      .call(d3.drag()
        .on('start', (event, d) => {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          d.fx = d.x;
          d.fy = d.y;
        })
        .on('drag', (event, d) => {
          d.fx = event.x;
          d.fy = event.y;
        })
        .on('end', (event, d) => {
          if (!event.active) simulation.alphaTarget(0);
          d.fx = null;
          d.fy = null;
        })
      );

    node.append('circle')
      .attr('r', d => getNodeSize(d))
      .attr('fill', d => getChapterColor(d))
      .attr('stroke', '#fff')
      .attr('stroke-width', 2)
      .on('click', (event, d) => {
        event.stopPropagation();
        showDetail(d);
      })
      .on('mouseenter', function() {
        d3.select(this).attr('stroke-width', 3);
      })
      .on('mouseleave', function() {
        d3.select(this).attr('stroke-width', 2);
      });

    node.append('text')
      .text(d => d.label.length > 6 ? d.label.substring(0, 6) + '..' : d.label)
      .attr('dy', d => -getNodeSize(d) - 6)
      .attr('font-size', 10)
      .attr('fill', '#1e293b')
      .attr('text-anchor', 'middle');

    simulation.on('tick', () => {
      link
        .attr('x1', d => d.source.x)
        .attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x)
        .attr('y2', d => d.target.y);
      node.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
    });

    // Click on background to close detail
    svg.on('click', () => {
      if (d3.event && d3.event.target === svg.node()) {
        closeDetail();
      }
    });
  }

  // ---- Highlight nodes by chapter ----
  function highlightByChapter(chapterKey) {
    const allCircles = nodeGroup.selectAll('circle');
    const allTexts = nodeGroup.selectAll('text');
    const allLinks = linkGroup.selectAll('line');

    if (!chapterKey) {
      allCircles.classed('dimmed', false).classed('highlighted', false);
      allTexts.classed('dimmed', false).classed('highlighted', false);
      allLinks.classed('dimmed', false).classed('highlighted', false);
      return;
    }

    allCircles.classed('dimmed', true).classed('highlighted', false);
    allTexts.classed('dimmed', true).classed('highlighted', false);
    allLinks.classed('dimmed', true).classed('highlighted', false);

    nodeGroup.selectAll('g').each(function(d) {
      const ch = ALL_CHAPTERS.find(c => c.id === d.chapter && c.subject === d.subject);
      if (!ch) return;
      const key = ch.subject === 'topo' ? ch.id + '_t' : ch.id;
      if (key === chapterKey || ch.id === chapterKey) {
        d3.select(this).select('circle').classed('dimmed', false).classed('highlighted', true);
        d3.select(this).select('text').classed('dimmed', false).classed('highlighted', true);
      }
    });

    // Highlight links between highlighted nodes
    linkGroup.selectAll('line').each(function(d) {
      const sCh = ALL_CHAPTERS.find(c => c.id === d.source.chapter && c.subject === d.source.subject);
      const tCh = ALL_CHAPTERS.find(c => c.id === d.target.chapter && c.subject === d.target.subject);
      if (!sCh || !tCh) return;
      const sKey = sCh.subject === 'topo' ? sCh.id + '_t' : sCh.id;
      const tKey = tCh.subject === 'topo' ? tCh.id + '_t' : tCh.id;
      if ((sKey === chapterKey || sCh.id === chapterKey) &&
          (tKey === chapterKey || tCh.id === chapterKey)) {
        d3.select(this).classed('dimmed', false).classed('highlighted', true);
      }
    });
  }

  // ---- Search ----
  function searchNodes(term) {
    const allCircles = nodeGroup.selectAll('circle');
    const allTexts = nodeGroup.selectAll('text');
    const allLinks = linkGroup.selectAll('line');

    if (!term) {
      allCircles.classed('dimmed', false).classed('searched', false).classed('highlighted', false);
      allTexts.classed('dimmed', false).classed('highlighted', false);
      allLinks.classed('dimmed', false).classed('highlighted', false);
      if (activeChapter) highlightByChapter(activeChapter);
      return [];
    }

    const lower = term.toLowerCase();
    const matched = new Set();

    nodeGroup.selectAll('g').each(function(d) {
      const match = d.label.toLowerCase().includes(lower) ||
                    d.desc.toLowerCase().includes(lower) ||
                    d.content.toLowerCase().includes(lower) ||
                    (d.understanding && d.understanding.toLowerCase().includes(lower));
      if (match) {
        matched.add(d.id);
        d3.select(this).select('circle').classed('dimmed', false).classed('searched', true).classed('highlighted', true);
        d3.select(this).select('text').classed('dimmed', false).classed('highlighted', true);
      } else {
        d3.select(this).select('circle').classed('dimmed', true).classed('searched', false).classed('highlighted', false);
        d3.select(this).select('text').classed('dimmed', true).classed('highlighted', false);
      }
    });

    allLinks.classed('dimmed', true).classed('highlighted', false);
    linkGroup.selectAll('line').each(function(d) {
      if (matched.has(d.source.id) || matched.has(d.target.id)) {
        d3.select(this).classed('dimmed', false).classed('highlighted', true);
      }
    });

    return Array.from(matched);
  }

  // ---- Detail Panel ----
  function showDetail(node) {
    activeNode = node;
    markRead(node.id);

    const panel = document.getElementById('detail-panel');
    const title = document.getElementById('detail-title');
    const body = document.getElementById('detail-body');

    const ch = ALL_CHAPTERS.find(c => c.id === node.chapter && c.subject === node.subject);
    const chName = ch ? ch.title : node.chapter;

    title.textContent = node.label;

    let html = '';

    // Tags
    html += '<div class="section">';
    html += '<span class="tag">' + (node.subject === 'riemann' ? '黎曼几何' : '代数拓扑') + '</span>';
    html += '<span class="tag">' + chName + '</span>';
    html += '<span class="tag">Layer ' + (node.layer || '?') + '</span>';
    if (readNodes[node.id]) {
      html += '<span class="tag" style="background:#dcfce7;color:#16a34a;">已读</span>';
    }
    html += '</div>';

    // SVG chart
    if (node.svg) {
      html += '<div class="section"><div class="section-title">示意图</div>';
      html += '<div class="svg-chart">' + node.svg + '</div></div>';
    }

    // Description
    html += '<div class="section"><div class="section-title">描述</div>';
    html += '<div class="section-content">' + (node.desc || '') + '</div></div>';

    // Content
    html += '<div class="section"><div class="section-title">详细内容</div>';
    html += '<div class="section-content">' + (node.content || '') + '</div></div>';

    // Understanding
    if (node.understanding) {
      html += '<div class="section"><div class="section-title">通俗理解</div>';
      html += '<div class="section-content">' + node.understanding + '</div></div>';
    }

    // Examples
    if (node.examples && node.examples.length > 0) {
      html += '<div class="section"><div class="section-title">例子</div>';
      node.examples.forEach(ex => {
        html += '<div class="example-item"><div class="ex-title">' + ex.title + '</div>';
        html += '<div class="ex-content">' + ex.content + '</div></div>';
      });
      html += '</div>';
    }

    // Theorems
    if (node.theorems && node.theorems.length > 0) {
      html += '<div class="section"><div class="section-title">定理与证明</div>';
      node.theorems.forEach((th, thi) => {
        html += '<div class="theorem-item">';
        html += '<div class="th-name">定理 ' + (thi + 1) + ': ' + th.name + '</div>';
        html += '<div class="th-statement">' + th.statement + '</div>';
        if (th.proof) {
          html += '<div class="th-proof"><span class="th-proof-label">证明概要</span> ' + th.proof + '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
    }

    // Applications
    if (node.applications) {
      html += '<div class="section"><div class="section-title">应用</div>';
      html += '<div class="section-content">' + node.applications + '</div></div>';
    }

    // References
    if (node.refs) {
      html += '<div class="section"><div class="section-title">教材引用</div>';
      const refs = Array.isArray(node.refs) ? node.refs : [node.refs];
      refs.forEach(ref => {
        html += '<span class="ref-item">' + (ref.book || '') + ' ' + (ref.ch || '') + ' ' + (ref.sec || '') + '</span>';
      });
      html += '</div>';
    }

    body.innerHTML = html;
    panel.classList.add('open');
  }

  function closeDetail() {
    activeNode = null;
    document.getElementById('detail-panel').classList.remove('open');
  }

  document.getElementById('detail-close').addEventListener('click', closeDetail);

  // ---- Sidebar ----
  function renderSidebar() {
    const list = document.getElementById('sidebar-list');
    let html = '';

    subjects.forEach(subj => {
      const chapters = ALL_CHAPTERS.filter(c => c.subject === subj.id);
      const nodeCount = ALL_NODES.filter(n => n.subject === subj.id).length;

      html += '<div class="subject-group">';
      html += '<div class="subject-group-title" data-subject="' + subj.id + '">';
      html += '<span class="dot" style="background:' + subj.color + '"></span>';
      html += subj.name + ' <span style="font-size:10px;color:var(--text-muted)">(' + nodeCount + ')</span>';
      html += '</div>';

      chapters.forEach(ch => {
        const key = ch.subject === 'topo' ? ch.id + '_t' : ch.id;
        const chNodes = ALL_NODES.filter(n => n.chapter === ch.id && n.subject === ch.subject);
        const isActive = activeChapter === key;
        const color = CH_COLORS[ALL_CHAPTERS.findIndex(c => {
          const k = c.subject === 'topo' ? c.id + '_t' : c.id;
          return k === key;
        }) % CH_COLORS.length] || '#94a3b8';

        html += '<div class="chapter-item' + (isActive ? ' active' : '') + '" data-chapter="' + key + '">';
        html += '<span class="ch-indicator" style="background:' + color + '"></span>';
        html += ch.title;
        html += '<span class="ch-count">' + chNodes.length + '</span>';
        html += '</div>';
      });

      html += '</div>';
    });

    list.innerHTML = html;

    // Click handlers
    list.querySelectorAll('.chapter-item').forEach(item => {
      item.addEventListener('click', () => {
        const chKey = item.dataset.chapter;
        if (activeChapter === chKey) {
          activeChapter = null;
        } else {
          activeChapter = chKey;
        }
        highlightByChapter(activeChapter);
        renderSidebar();
        renderQuizTabs();
        renderQuiz();
      });
    });

    list.querySelectorAll('.subject-group-title').forEach(title => {
      title.addEventListener('click', () => {
        const subjId = title.dataset.subject;
        document.querySelectorAll('.subject-tab').forEach(t => {
          t.classList.toggle('active', t.dataset.subject === subjId);
        });
        setSubject(subjId);
      });
    });
  }

  // ---- Subject switching ----
  function setSubject(subjId) {
    activeSubject = subjId;
    activeChapter = null;
    searchTerm = '';
    document.getElementById('search-input').value = '';
    document.querySelectorAll('.subject-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.subject === subjId);
    });
    highlightByChapter(null);
    searchNodes('');
    renderSidebar();
    renderQuizTabs();
    renderQuiz();
    closeDetail();
    updateProgress();
  }

  document.querySelectorAll('.subject-tab').forEach(tab => {
    tab.addEventListener('click', () => setSubject(tab.dataset.subject));
  });

  document.getElementById('clear-filter').addEventListener('click', () => {
    activeChapter = null;
    highlightByChapter(null);
    renderSidebar();
  });

  // ---- Search ----
  document.getElementById('search-input').addEventListener('input', (e) => {
    searchTerm = e.target.value.trim();
    const results = searchNodes(searchTerm);
    if (results.length === 1) {
      // Auto-select single result
      const node = ALL_NODES.find(n => n.id === results[0]);
      if (node) showDetail(node);
    }
  });

  // ---- Sidebar toggle ----
  document.getElementById('btn-sidebar').addEventListener('click', () => {
    sidebarCollapsed = !sidebarCollapsed;
    document.getElementById('sidebar').classList.toggle('collapsed', sidebarCollapsed);
    setTimeout(() => {
      simulation.force('center', d3.forceCenter(width() / 2, height() / 2));
      simulation.alpha(0.3).restart();
    }, 300);
  });

  // ---- Quiz ----
  function renderQuizTabs() {
    const tabs = document.getElementById('quiz-tabs');
    let chapters = ALL_CHAPTERS;
    if (activeSubject !== 'all') {
      chapters = chapters.filter(c => c.subject === activeSubject);
    }

    let html = '<button class="quiz-tab' + (!quizChapter ? ' active' : '') + '" data-chapter="">全部</button>';
    chapters.forEach(ch => {
      const key = ch.subject === 'topo' ? ch.id + '_t' : ch.id;
      const isActive = quizChapter === key;
      html += '<button class="quiz-tab' + (isActive ? ' active' : '') + '" data-chapter="' + key + '">' + ch.title + '</button>';
    });
    tabs.innerHTML = html;

    tabs.querySelectorAll('.quiz-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        quizChapter = tab.dataset.chapter || null;
        renderQuizTabs();
        renderQuiz();
      });
    });
  }

  function renderQuiz() {
    const body = document.getElementById('quiz-body');
    let quizzes = ALL_QUIZZES;

    // Filter by subject
    if (activeSubject !== 'all') {
      quizzes = quizzes.filter(q => q.subject === activeSubject);
    }

    // Filter by chapter
    if (quizChapter) {
      quizzes = quizzes.filter(q => {
        const ch = ALL_CHAPTERS.find(c => c.id === q.chapter && c.subject === q.subject);
        if (!ch) return false;
        const key = ch.subject === 'topo' ? ch.id + '_t' : ch.id;
        return key === quizChapter || ch.id === quizChapter;
      });
    }

    // Filter by difficulty
    if (quizDifficulty !== 'all') {
      quizzes = quizzes.filter(q => q.difficulty === quizDifficulty);
    }

    if (quizzes.length === 0) {
      body.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted)">暂无匹配的测验题</div>';
      return;
    }

    let html = '';
    quizzes.forEach((q, idx) => {
      const diffLabel = { easy: '简单', medium: '中等', hard: '困难' }[q.difficulty] || q.difficulty;
      html += '<div class="quiz-question" data-idx="' + idx + '">';
      html += '<span class="q-difficulty ' + q.difficulty + '">' + diffLabel + '</span>';
      html += '<div class="q-text">' + (idx + 1) + '. ' + q.q + '</div>';
      html += '<div class="q-options">';
      q.options.forEach((opt, oi) => {
        html += '<button class="q-option" data-answer="' + oi + '">' + String.fromCharCode(65 + oi) + '. ' + opt + '</button>';
      });
      html += '</div>';
      html += '<div class="q-explanation">' + (q.explanation || '') + '</div>';
      html += '</div>';
    });

    body.innerHTML = html;

    // Click handlers
    body.querySelectorAll('.q-option').forEach(btn => {
      btn.addEventListener('click', () => {
        const question = btn.closest('.quiz-question');
        const idx = parseInt(question.dataset.idx);
        const q = quizzes[idx];
        const selectedAnswer = parseInt(btn.dataset.answer);

        // Prevent re-selection
        if (question.querySelector('.q-option.correct-answer') || question.querySelector('.q-option.wrong-answer')) return;

        // Mark all options
        question.querySelectorAll('.q-option').forEach(opt => {
          const ans = parseInt(opt.dataset.answer);
          if (ans === q.answer) {
            opt.classList.add('correct-answer');
          }
          if (ans === selectedAnswer && ans !== q.answer) {
            opt.classList.add('wrong-answer');
          }
          opt.style.pointerEvents = 'none';
        });

        // Show explanation
        question.querySelector('.q-explanation').classList.add('show');

        // Mark correct/wrong
        if (selectedAnswer === q.answer) {
          question.classList.add('correct');
        } else {
          question.classList.add('wrong');
        }
      });
    });
  }

  document.getElementById('quiz-difficulty').addEventListener('change', (e) => {
    quizDifficulty = e.target.value;
    renderQuiz();
  });

  document.getElementById('quiz-toggle').addEventListener('click', () => {
    quizCollapsed = !quizCollapsed;
    document.getElementById('quiz-panel').classList.toggle('collapsed', quizCollapsed);
    document.getElementById('quiz-toggle').innerHTML = quizCollapsed ? '&#9654; 测验' : '&#9660; 测验';
  });

  // ---- Resize handler ----
  window.addEventListener('resize', () => {
    if (simulation) {
      simulation.force('center', d3.forceCenter(width() / 2, height() / 2));
      simulation.alpha(0.3).restart();
    }
  });

  // ---- Layer filter ----
  document.getElementById('layer-filter').addEventListener('change', (e) => {
    layerFilter = e.target.value;
    initGraph();
    closeDetail();
    updateProgress();
  });

  // ---- Init ----
  function init() {
    initGraph();
    renderSidebar();
    renderQuizTabs();
    renderQuiz();
    updateProgress();
  }

  init();
})();
</script>
</body>
</html>
