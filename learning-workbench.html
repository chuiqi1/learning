2626\">X¹(边)</text><line x1=\"100\" y1=\"141\" x2=\"150\" y2=\"141\" stroke=\"#dc2626\" stroke-width=\"2\"/><ellipse cx=\"100\" cy=\"80\" rx=\"60\" ry=\"30\" fill=\"none\" stroke=\"#059669\" stroke-width=\"2\"/><text x=\"100\" y=\"72\" font-size=\"8\" fill=\"#059669\">X²(面)</text><text x=\"100\" y=\"188\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">CW复形骨架构造</text></svg>","examples":[{"title":"S^n 的 CW 结构","content":"S^n 有一个 0 维胞腔和一个 n 维胞腔（e⁰∪e^n），边界映射平凡，同调易于计算。"},{"title":"RP^n 的 CW 结构","content":"RP^n 的每一维 k 各有一个胞腔 (k=0,…,n)，边界映射的度数交替为 0 和 2，产生 Z/2 扭转。"},{"title":"CP^n 的 CW 结构","content":"CP^n 只有偶数维胞腔：e⁰∪e²∪e⁴∪…∪e^{2n}，所有边界映射平凡，同调群为 Z 在偶数维。"}],"theorems":[{"name":"胞腔同调定理","statement":"CW 复形 X 的胞腔同调 H_n^{CW}(X) 与奇异同调 H_n(X) 自然同构。","proof":"利用(X^n,X^{n-1})的相对同调：H_k(X^n,X^{n-1})在k≠n时为零，在k=n时是自由阿贝尔群，秩等于n维胞腔数。通过长正合序列和归纳法，证明H_n(X^n)≅H_n^{CW}的第n个同调。取极限X=colim X^n，利用紧致性论证H_n(X)≅H_n(X^n)对充分大n成立。"},{"name":"CW 逼近定理","statement":"任何拓扑空间都存在弱同伦等价的 CW 复形（CW 逼近）。","proof":"归纳构造：对每个同伦群生成元，粘贴相应维数胞腔消除多余信息；再粘贴高维胞腔填充缺失信息（如球面间的映射）。取极限CW复形。证明该CW复形与X有弱同伦等价关系：由构造，诱导所有同伦群的同构。在同伦范畴中，CW逼近是唯一的。"}],"applications":"CW 复形是近代代数拓扑的标准框架：在稳定同伦论中，谱的同伦群通过 CW 谱计算；在几何群论中，群的分类空间是 CW 复形；在代数几何中，代数簇的拓扑通过 CW 分解研究。","refs":[{"book":"Hatcher","ch":"Ch.0","sec":"§0.3"},{"book":"Hatcher","ch":"Ch.2","sec":"§2.2"}],"subject":"topo"},{"id":"t15","label":"胞腔同调","chapter":"ch2","layer":3,"desc":"利用CW复形的胞腔结构直接计算同调群，是最实用的同调计算方法。","content":"胞腔同调是 CW 复形同调论的计算核心。CW 复形 X 的胞腔链复形定义为 C_n^{CW} = H_n(X^n, X^{n-1})，这是以 n 维胞腔为基的自由阿贝尔群。边界算子 d_n: C_n^{CW}→C_{n-1}^{CW} 由粘贴映射 φ_α: S^{n-1}→X^{n-1} 的度数矩阵给出：d_n(e_α^n) = Σ_β d_{αβ} e_β^{n-1}，其中 d_{αβ} 是合成映射 S_α^{n-1}→X^{n-1}→X^{n-1}/(X^{n-1}\\e_β^{n-1})≅S^{n-1} 的度数。胞腔同调的计算优势在于链群是有限生成的（当 CW 复形有限时），且边界算子可通过几何论证（度数）确定。","understanding":"胞腔同调将同调计算简化为'数数+算度数'。对每个维度，你只需要知道有多少个胞腔（它们生成链群），以及每个 n 维胞腔的边界由哪些 (n-1) 维胞腔组成（各绕了多少圈）。这就像用地图找路：你知道每个区域（胞腔）和它们的边界关系，就能算出整个地形的拓扑特征。胞腔同调特别适合计算射影空间、透镜空间、Grassmann流形等经典空间的同调。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"5\" y=\"60\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"30\" y=\"79\" font-size=\"9\" fill=\"#2563eb\" text-anchor=\"middle\">C₂^{CW}</text><rect x=\"75\" y=\"60\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"100\" y=\"79\" font-size=\"9\" fill=\"#dc2626\" text-anchor=\"middle\">C₁^{CW}</text><rect x=\"145\" y=\"60\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#fef3c7\" stroke=\"#d97706\" stroke-width=\"1.5\"/><text x=\"170\" y=\"79\" font-size=\"9\" fill=\"#d97706\" text-anchor=\"middle\">C₀^{CW}</text><line x1=\"58\" y1=\"75\" x2=\"73\" y2=\"75\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"65\" y=\"72\" font-size=\"8\" fill=\"#333\">d₂</text><line x1=\"128\" y1=\"75\" x2=\"143\" y2=\"75\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"135\" y=\"72\" font-size=\"8\" fill=\"#333\">d₁</text><text x=\"100\" y=\"110\" font-size=\"10\" fill=\"#333\">d_{αβ} = deg(φαβ)</text><text x=\"100\" y=\"130\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">胞腔链复形</text><text x=\"100\" y=\"150\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">每个胞腔贡献一个生成元</text><text x=\"100\" y=\"168\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">边界由粘贴映射度数决定</text></svg>","examples":[{"title":"RP^2 的胞腔同调","content":"RP^2 有胞腔 e⁰, e¹, e²。d₂(e²)=2e¹（粘贴映射度数为2），故 H₁(RP^2)≅Z/2, H₂=0。"},{"title":"CP^n 的胞腔同调","content":"CP^n 只有偶数维胞腔，所有边界算子为0，故 H_{2k}(CP^n)≅Z (k=0,…,n)，奇维同调为0。"},{"title":"透镜空间 L(p,q)","content":"L(p,q) 有 e⁰, e¹, e², e³。d₂(e²)=pe¹, d₃(e³)=0，故 H₁(L)≅Z/p, H₂=0, H₃≅Z。"}],"theorems":[{"name":"胞腔同调与奇异同调同构","statement":"H_n^{CW}(X) ≅ H_n(X)，即胞腔同调与奇异同调自然同构。","proof":"利用(X^n,X^{n-1})的相对同调计算和长正合序列的归纳论证。关键事实：H_k(X^n,X^{n-1})在k≠n时为零，在k=n时秩等于n维胞腔数。通过反复使用长正合序列，逐维证明H_n(X^n)≅H_n^{CW}的第n个同调。取正向极限得H_n(X)≅H_n^{CW}(X)。"},{"name":"胞腔边界公式","statement":"d_n(e_α^n) = Σ_β deg(φ_{αβ}) e_β^{n-1}，其中度数由粘贴映射诱导。","proof":"边界算子d_n由合成映射给出：对每个n维胞腔e_α^n，考虑粘贴映射φ_α:S^{n-1}→X^{n-1}，然后收缩X^{n-1}除e_β^{n-1}外的所有胞腔到一点，得到映射S^{n-1}→S^{n-1}。该映射的度数deg(φ_{αβ})即为d_n(e_α^n)中e_β^{n-1}的系数。此为胞腔同调的计算核心。"}],"applications":"胞腔同调是计算拓扑空间同调群的标准方法，广泛应用于低维拓扑、扭结理论、代数几何。在计算拓扑学中，胞腔分解用于高效计算持久同调的数据结构。","refs":[{"book":"Hatcher","ch":"Ch.2","sec":"§2.2"},{"book":"Munkres","ch":"Ch.4","sec":"§38"}],"subject":"topo"},{"id":"t16","label":"同调的计算与应用","chapter":"ch2","layer":3,"desc":"综合运用多种工具计算经典空间的同调群，并利用同调解决拓扑和几何问题。","content":"同调群计算的通用策略：(1) 三角剖分或CW分解，利用单纯同调或胞腔同调；(2) Mayer-Vietoris 序列分解空间；(3) 长正合序列联系相对同调；(4) Künneth 公式计算乘积空间同调。经典结果：可定向闭曲面 Σ_g 的同调为 H_0≅Z, H_1≅Z^{2g}, H_2≅Z；RP^n 的同调根据 n 的奇偶性有不同扭转模式；CP^n 的同调为 Z 在偶数维。同调的应用包括：Brouwer不动点定理的高维推广、向量场的奇点指标定理、Lefschetz不动点定理、映射度理论。","understanding":"同调群是你的'拓扑显微镜'：H_0 数连通分支，H_1 数环状洞，H_2 数空腔，H_n 数 n 维空洞。计算同调就像给空间做'X光透视'——你不需要完全重建空间，只需知道它在每一维有多少个独立的洞。同调群的美妙之处在于它是可计算的：通过线性代数（矩阵行简化）就能算出任何有限单纯复形或CW复形的同调群。这是代数拓扑区别于其他数学分支的独特优势。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><text x=\"100\" y=\"25\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\" text-anchor=\"middle\">经典空间同调表</text><line x1=\"20\" y1=\"35\" x2=\"180\" y2=\"35\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"40\" y=\"52\" font-size=\"8\" fill=\"#2563eb\">S^n</text><text x=\"100\" y=\"52\" font-size=\"8\" fill=\"#333\">H₀=Z, Hn=Z, 其他=0</text><text x=\"40\" y=\"68\" font-size=\"8\" fill=\"#dc2626\">T²</text><text x=\"100\" y=\"68\" font-size=\"8\" fill=\"#333\">H₀=Z, H₁=Z², H₂=Z</text><text x=\"40\" y=\"84\" font-size=\"8\" fill=\"#059669\">RP²</text><text x=\"100\" y=\"84\" font-size=\"8\" fill=\"#333\">H₀=Z, H₁=Z/2, H₂=0</text><text x=\"40\" y=\"100\" font-size=\"8\" fill=\"#7c3aed\">CP^n</text><text x=\"100\" y=\"100\" font-size=\"8\" fill=\"#333\">H_{2k}=Z, H_{odd}=0</text><text x=\"40\" y=\"116\" font-size=\"8\" fill=\"#d97706\">Σ_g</text><text x=\"100\" y=\"116\" font-size=\"8\" fill=\"#333\">H₀=Z, H₁=Z^{2g}, H₂=Z</text><text x=\"100\" y=\"145\" font-size=\"10\" fill=\"#dc2626\" font-weight=\"bold\">应用</text><text x=\"100\" y=\"162\" font-size=\"8\" fill=\"#333\">Brouwer不动点 · Lefschetz定理</text><text x=\"100\" y=\"178\" font-size=\"8\" fill=\"#333\">向量场奇点 · 映射度</text></svg>","examples":[{"title":"Lefschetz 不动点定理","content":"若 f: X→X 的 Lefschetz 数 L(f)=Σ(-1)^n tr(f_*:H_n(X)→H_n(X)) 非零，则 f 有不动点。推广了 Brouwer 定理。"},{"title":"Borsuk-Ulam 定理","content":"利用同调证明：对连续映射 f: S^n→R^n，存在对径点 x,-x 使得 f(x)=f(-x)。"},{"title":"向量场指标","content":"紧流形上孤立奇点向量场的指标和等于 Euler 示性数 χ(X)=Σ(-1)^n rank H_n(X)。"}],"theorems":[{"name":"Lefschetz 不动点定理","statement":"若 L(f)≠0，则 f 有不动点。特别地，可缩空间上的连续自映射必有不动点。","proof":"L(f)=Σ(-1)^n tr(f_*:H_n(X;Q)→H_n(X;Q))。若f无不动点，则存在开覆盖使f(U)∩U=∅，利用同调的交理论和Lefschetz数的局部化公式证明L(f)=0。可缩空间上H_0=Q, H_n=0(n>0)，故L(f)=tr(f_*:H_0→H_0)=1≠0，必有不动点。这是Brouwer定理的深远推广。"},{"name":"Hopf 指标定理","statement":"紧流形上向量场奇点指标和等于 Euler 示性数，与向量场选择无关。","proof":"χ(M)=Σ(-1)^n rank H_n(M)。将向量场视为M→TM的截面，在奇点处取局部指标。构造M到自身的小扰动映射，其不动点恰好对应向量场的奇点。利用Lefschetz不动点定理：L(id)=χ(M)。每个奇点指标等于该处Lefschetz局部指标，求和得χ(M)。"}],"applications":"同调论在数据科学中通过持久同调（persistent homology）分析高维数据的拓扑结构；在计算机视觉中用于形状识别和匹配；在计算生物学中分析分子结构；在机器人学中分析构型空间。","refs":[{"book":"Hatcher","ch":"Ch.2","sec":"§2.2"},{"book":"Hatcher","ch":"Ch.2","sec":"§2.C"}],"subject":"topo"},{"id":"t17","label":"上同调群的定义","chapter":"ch3","layer":1,"desc":"上同调是同调的对偶概念，通过链群到系数群的所有同态定义上链和上边缘算子。","content":"上同调群是同调群的对偶构造。给定链复形 (C_n, ∂_n) 和系数群 G，定义上链群 C^n = Hom(C_n, G)（所有群同态 φ: C_n→G）。上边缘算子 δ^n: C^n→C^{n+1} 由 (δ^nφ)(c) = φ(∂_{n+1}c) 定义。类似地，δ^{n+1}∘δ^n=0，因此可定义上闭链群 Z^n = ker δ^n 和上边缘链群 B^n = im δ^{n-1}。第 n 个上同调群为 H^n(X;G) = Z^n/B^n。上同调的核心优势在于其丰富的代数结构：上同调类可相乘（Cup积），使 H^*(X;R) 成为分次环。","understanding":"上同调把同调'翻转'过来。同调追问'什么几何对象存在'（链），上同调追问'什么函数可以定义在这些几何对象上'（上链）。如果用水的流动来比喻：同调研究水流的不可能路径（被洞阻挡），上同调研究水流的可能方向（梯度场的存在性）。上同调的优势在于它有自然的乘法结构（Cup积），这在同调中是没有的——这使得上同调不仅是一个群，还是一个环，包含更多信息。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"5\" y=\"20\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"30\" y=\"39\" font-size=\"9\" fill=\"#dc2626\" text-anchor=\"middle\">C²</text><rect x=\"75\" y=\"20\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#fef3c7\" stroke=\"#d97706\" stroke-width=\"1.5\"/><text x=\"100\" y=\"39\" font-size=\"9\" fill=\"#d97706\" text-anchor=\"middle\">C¹</text><rect x=\"145\" y=\"20\" width=\"50\" height=\"30\" rx=\"3\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"170\" y=\"39\" font-size=\"9\" fill=\"#2563eb\" text-anchor=\"middle\">C⁰</text><line x1=\"58\" y1=\"35\" x2=\"73\" y2=\"35\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"65\" y=\"32\" font-size=\"8\" fill=\"#333\">δ¹</text><line x1=\"128\" y1=\"35\" x2=\"143\" y2=\"35\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"135\" y=\"32\" font-size=\"8\" fill=\"#333\">δ⁰</text><text x=\"100\" y=\"65\" font-size=\"9\" fill=\"#dc2626\">δ²∘δ¹=0</text><text x=\"100\" y=\"85\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">上链复形</text><text x=\"100\" y=\"100\" font-size=\"10\" fill=\"#333\">H^n = ker δ^n / im δ^{n-1}</text><text x=\"100\" y=\"125\" font-size=\"10\" fill=\"#7c3aed\" font-weight=\"bold\">C^n = Hom(C_n, G)</text><text x=\"100\" y=\"145\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">上同调 = 同调的对偶</text><text x=\"100\" y=\"162\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">Cup积 → 环结构</text></svg>","examples":[{"title":"S^n 的上同调","content":"H^0(S^n;Z)≅Z, H^n(S^n;Z)≅Z, 其他 H^k=0。与同调同构，但上同调有环结构。"},{"title":"T^2 的上同调","content":"H^0≅Z, H^1≅Z², H^2≅Z。Cup积 α∪β 生成 H^2，其中 α,β 为 H^1 的生成元。"},{"title":"RP^n 的上同调(Z/2)","content":"H^*(RP^n;Z/2) ≅ Z/2[α]/(α^{n+1})，其中 |α|=1。这是截断多项式环。"}],"theorems":[{"name":"上同调函子性","statement":"上同调是反变函子：连续映射 f: X→Y 诱导同态 f^*: H^n(Y)→H^n(X)。","proof":"定义上链映射f^#:C^n(Y)→C^n(X)，φ↦φ∘f_#（前复合）。验证δ∘f^#=f^#∘δ：因(δf^#φ)(c)=f^#φ(∂c)=φ(f_#∂c)=φ(∂f_#c)=δφ(f_#c)=f^#(δφ)(c)。故f^#诱导上同调同态f^*。反变性：(g∘f)^*=f^*∘g^*，因为上链层面上前复合逆转顺序。"},{"name":"上同调与同调的关系","statement":"由万有系数定理，上同调可由同调群和 Ext 群确定，但上同调的环结构包含额外信息。","proof":"万有系数定理给出H^n(X;G)≅Hom(H_n(X),G)⊕Ext(H_{n-1}(X),G)。同调测度'洞'的存在性（几何信息），上同调测度'函数'的存在性（对偶信息）。上同调的核心优势在于Cup积赋予的环结构：H^*(X)是分次环，而H_*(X)只是分次群。此环结构能区分同调同构但非同伦等价的空间。"}],"applications":"上同调在微分几何中通过 de Rham 上同调与微分形式关联；在代数几何中，层上同调是核心工具；在物理学中，上同调用于描述规范场和拓扑量子场论。","refs":[{"book":"Hatcher","ch":"Ch.3","sec":"§3.1"},{"book":"Munkres","ch":"Ch.5","sec":"§42"}],"subject":"topo"},{"id":"t18","label":"Cup积与上同调环","chapter":"ch3","layer":2,"desc":"Cup积赋予上同调以分次环结构，是上同调区别于同调的核心代数特征。","content":"Cup 积 ⌣: H^p(X;R)×H^q(X;R)→H^{p+q}(X;R) 是上同调最重要的额外结构。在上链层面，对 φ∈C^p, ψ∈C^q，定义 (φ⌣ψ)(σ: Δ^{p+q}→X) = φ(σ|_{[v₀,…,v_p]})·ψ(σ|_{[v_p,…,v_{p+q}]})。此定义诱导上同调层面的双线性乘法，使 H^*(X;R) = ⊕_{n≥0} H^n(X;R) 成为分次交换环：α⌣β = (-1)^{pq} β⌣α。Cup 积的几何意义：上同调类代表'子流形的交'（通过 Poincaré 对偶）。Cup 积长度（上同调类幂零的阶数）给出空间的拓扑信息。","understanding":"Cup 积就像给上同调类一个'乘法'：两个上同调类相乘得到更高维的上同调类。在几何上，通过 Poincaré 对偶，Cup 积对应子流形的交（两个子流形相交得到更低维的子流形，对偶后得到更高维的上同调类）。Cup 积的威力在于能区分同调同构但上同调环不同的空间——例如 CP^2 和 S^2∨S^4 同调同构但上同调环不同（前者有非平凡 Cup 积，后者没有）。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"20\" y=\"40\" width=\"60\" height=\"30\" rx=\"5\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"50\" y=\"59\" font-size=\"10\" fill=\"#2563eb\" text-anchor=\"middle\">H^p(X)</text><rect x=\"120\" y=\"40\" width=\"60\" height=\"30\" rx=\"5\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"150\" y=\"59\" font-size=\"10\" fill=\"#dc2626\" text-anchor=\"middle\">H^q(X)</text><rect x=\"60\" y=\"110\" width=\"80\" height=\"30\" rx=\"5\" fill=\"#e8f0fe\" stroke=\"#7c3aed\" stroke-width=\"2\"/><text x=\"100\" y=\"129\" font-size=\"10\" fill=\"#7c3aed\" text-anchor=\"middle\">H^{p+q}(X)</text><line x1=\"80\" y1=\"70\" x2=\"85\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"120\" y1=\"70\" x2=\"115\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"100\" y=\"95\" font-size=\"11\" fill=\"#7c3aed\" font-weight=\"bold\">⌣</text><text x=\"100\" y=\"160\" font-size=\"9\" fill=\"#333\">α⌣β = (-1)^{pq} β⌣α</text><text x=\"100\" y=\"178\" font-size=\"10\" fill=\"#333\" font-weight=\"bold\">分次交换环</text></svg>","examples":[{"title":"CP^n 的上同调环","content":"H^*(CP^n;Z) ≅ Z[α]/(α^{n+1})，其中 |α|=2。Cup 积 α^k 生成 H^{2k}，α^{n+1}=0。"},{"title":"S^p×S^q 的上同调环","content":"H^*(S^p×S^q;Z) ≅ Z[α,β]/(α²,β²)，其中 |α|=p, |β|=q。α⌣β 生成 H^{p+q}。"},{"title":"区分 CP^2 与 S^2∨S^4","content":"两者同调同构，但 CP^2 中 α⌣α=β（生成 H^4），而 S^2∨S^4 中所有 Cup 积为零。"}],"theorems":[{"name":"Cup积的分次交换性","statement":"α⌣β = (-1)^{pq} β⌣α，因此上同调环是分次交换的。","proof":"在上链层面，(φ⌣ψ)(σ)=φ(σ|_[v₀,...,v_p])·ψ(σ|_[v_p,...,v_{p+q}])。交换顺序需将顶点排列从(v₀,...,v_p,v_p,...,v_{p+q})变为(v₀,...,v_q,v_q,...,v_{p+q})，这相当于一个(p+q+1)阶置换，符号为(-1)^{pq}。由于上链复形是单纯形的前面限制，此符号传递到上同调层面。"},{"name":"Cup积的自然性","statement":"连续映射 f: X→Y 诱导环同态 f^*: H^*(Y)→H^*(X)，即 f^*(α⌣β)=f^*(α)⌣f^*(β)。","proof":"在上链层面：f^#(φ⌣ψ)(σ)=(φ⌣ψ)(f∘σ)=φ(f∘σ|_前)·ψ(f∘σ|_后)。而(f^#φ⌣f^#ψ)(σ)=f^#φ(σ|_前)·f^#ψ(σ|_后)=φ(f∘σ|_前)·ψ(f∘σ|_后)。两者相等，故f^#(φ⌣ψ)=f^#φ⌣f^#ψ。传递到上同调层面即f^*是环同态。"}],"applications":"Cup 积用于区分同调同构但非同伦等价的空间，在代数拓扑中是不可或缺的精细不变量。在扭结理论中，上同调环用于区分扭结；在辛几何中，量子上同调环是重要研究对象。","refs":[{"book":"Hatcher","ch":"Ch.3","sec":"§3.2"},{"book":"Munkres","ch":"Ch.5","sec":"§47"}],"subject":"topo"},{"id":"t19","label":"万有系数定理","chapter":"ch3","layer":3,"desc":"建立同调群与上同调群（及不同系数群）之间的代数关系，是系数变更的核心工具。","content":"万有系数定理（UCT）描述了同调和上同调群随系数群变化的关系。对于同调，有分裂短正合序列：0→H_n(X)⊗G→H_n(X;G)→Tor(H_{n-1}(X), G)→0。对于上同调：0→Ext(H_{n-1}(X), G)→H^n(X;G)→Hom(H_n(X), G)→0。这些序列虽非自然分裂，但给出了同调/上同调群与系数群的关系。关键含义：已知 Z 系数同调，可计算任意系数同调/上同调。Tor 捕捉扭转，Ext 捕捉扩张。UCT 揭示了代数拓扑与同调代数的深度联系。","understanding":"万有系数定理告诉你：如果你知道一个空间的 Z 系数同调，你就能算出任何其他系数群（如 Z/2, Q, R）的同调和上同调。这就像你知道一个外国人说什么语言（Z 系数同调），你就可以通过翻译（⊗和Tor/Ext操作）知道他在其他语言中怎么说。Tor 出现是因为扭转（torsion）在与某些群做张量积时会消失或变化；Ext 出现是因为上同调作为Hom函子，不是正合的，需要 Ext 来修正。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"15\" y=\"30\" width=\"70\" height=\"30\" rx=\"4\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"50\" y=\"49\" font-size=\"9\" fill=\"#2563eb\" text-anchor=\"middle\">H_*(X;Z)</text><rect x=\"115\" y=\"30\" width=\"70\" height=\"30\" rx=\"4\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"150\" y=\"49\" font-size=\"9\" fill=\"#dc2626\" text-anchor=\"middle\">H_*(X;G)</text><line x1=\"85\" y1=\"45\" x2=\"115\" y2=\"45\" stroke=\"#333\" stroke-width=\"2\"/><text x=\"100\" y=\"42\" font-size=\"10\" fill=\"#333\">UCT</text><text x=\"100\" y=\"80\" font-size=\"9\" fill=\"#333\">0→Hn⊗G→Hn(X;G)→Tor(Hn₋₁,G)→0</text><text x=\"100\" y=\"100\" font-size=\"9\" fill=\"#333\">0→Ext(Hn₋₁,G)→H^n(X;G)→Hom(Hn,G)→0</text><text x=\"100\" y=\"130\" font-size=\"10\" fill=\"#7c3aed\" font-weight=\"bold\">关键函子</text><text x=\"50\" y=\"150\" font-size=\"9\" fill=\"#dc2626\">⊗: 张量积</text><text x=\"50\" y=\"165\" font-size=\"9\" fill=\"#dc2626\">Tor: 扭转</text><text x=\"130\" y=\"150\" font-size=\"9\" fill=\"#2563eb\">Hom: 同态</text><text x=\"130\" y=\"165\" font-size=\"9\" fill=\"#2563eb\">Ext: 扩张</text></svg>","examples":[{"title":"RP^2 的 Z/2 系数同调","content":"已知 H_*(RP^2;Z) = (Z, Z/2, 0)，UCT 给出 H_1(RP^2;Z/2)≅Z/2, H_2(RP^2;Z/2)≅Z/2。"},{"title":"有理系数同调","content":"H_n(X;Q) ≅ H_n(X;Z)⊗Q，即有理同调只保留自由部分，消除所有扭转。"},{"title":"上同调与同调的区别","content":"对于 RP^2，H^1(RP^2;Z)=0 但 H_1(RP^2;Z)=Z/2。Ext(Z/2,Z)=Z/2 出现在上同调中。"}],"theorems":[{"name":"同调万有系数定理","statement":"存在分裂短正合序列 0→H_n(X)⊗G→H_n(X;G)→Tor(H_{n-1}(X),G)→0。","proof":"取Z系数的自由链复形C_*。张量积G得C_*⊗G。由于自由阿贝尔群的子群仍自由，C_n的子群是自由的，故序列分裂（但非自然）。由同调代数：H_n(C_*⊗G)由H_n⊗G和Tor(H_{n-1},G)决定。Tor测量张量积的导出函子，捕捉扭转信息在张量积中的行为。"},{"name":"上同调万有系数定理","statement":"存在分裂短正合序列 0→Ext(H_{n-1}(X),G)→H^n(X;G)→Hom(H_n(X),G)→0。","proof":"对自由链复形C_*应用Hom(-,G)得上链复形C^*。上同调H^n(C^*)由Hom(H_n,G)和Ext(H_{n-1},G)决定。Hom(H_n,G)是自由部分的对偶，Ext(H_{n-1},G)是扭转部分的贡献。Ext测量Hom的左导出函子，反映H_{n-1}中扭转元素到G的扩张。序列分裂但非自然。"}],"applications":"万有系数定理是系数变更的标准工具。在代数拓扑中，Z/p 系数同调常用于计算扭转和同伦群；在代数几何中，l-adic 上同调利用不同系数研究簇的拓扑；在数论中，Galois 上同调的系数变更至关重要。","refs":[{"book":"Hatcher","ch":"Ch.3","sec":"§3.A"},{"book":"Munkres","ch":"Ch.5","sec":"§47"}],"subject":"topo"},{"id":"t20","label":"Kunneth公式","chapter":"ch3","layer":3,"desc":"计算乘积空间同调/上同调的标准公式，将乘积空间的拓扑信息分解为因子的拓扑信息。","content":"Künneth 公式描述乘积空间 X×Y 的同调与上同调。对于同调，有分裂短正合序列：0→⊕_{i+j=n} H_i(X)⊗H_j(Y)→H_n(X×Y)→⊕_{i+j=n-1} Tor(H_i(X), H_j(Y))→0。对于上同调，当系数为域时有同构 H^n(X×Y) ≅ ⊕_{i+j=n} H^i(X)⊗H^j(Y)。更一般地，有上同调层面的 Künneth 短正合序列。Künneth 公式体现了代数拓扑中'乘积空间的可分解性'，是 Eilenberg-Zilber 定理的代数推论。在域系数下，上同调环满足 H^*(X×Y) ≅ H^*(X)⊗H^*(Y)（分次张量积）。","understanding":"Künneth 公式告诉你如何从两个空间的同调/上同调'拼出'它们乘积空间的同调/上同调。这就像知道两个独立拼图各自的结构，就能推断把它们并排放置时的整体结构。公式的核心是：乘积空间的 n 维同调由所有 i+j=n 维的因子同调张量积组成，再加上 Tor 修正项。在好的系数（如域）下，Tor 项消失，公式变得特别简单——乘积空间的上同调就是因子空间上同调的张量积。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"10\" y=\"40\" width=\"50\" height=\"40\" rx=\"3\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"35\" y=\"64\" font-size=\"9\" fill=\"#2563eb\" text-anchor=\"middle\">X</text><rect x=\"140\" y=\"40\" width=\"50\" height=\"40\" rx=\"3\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"165\" y=\"64\" font-size=\"9\" fill=\"#dc2626\" text-anchor=\"middle\">Y</text><text x=\"100\" y=\"55\" font-size=\"14\" fill=\"#333\">×</text><rect x=\"50\" y=\"110\" width=\"100\" height=\"40\" rx=\"3\" fill=\"#e8f0fe\" stroke=\"#7c3aed\" stroke-width=\"2\"/><text x=\"100\" y=\"134\" font-size=\"10\" fill=\"#7c3aed\" text-anchor=\"middle\">X × Y</text><line x1=\"50\" y1=\"80\" x2=\"70\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"150\" y1=\"80\" x2=\"130\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"100\" y=\"170\" font-size=\"9\" fill=\"#333\">H_n(X×Y) ≅ ⊕_{i+j=n} H_i⊗H_j</text><text x=\"100\" y=\"185\" font-size=\"9\" fill=\"#333\">⊕ ⊕ Tor(H_i, H_j)</text></svg>","examples":[{"title":"环面 T^2=S^1×S^1","content":"Künneth: H_0(T^2)≅Z, H_1(T^2)≅Z², H_2(T^2)≅Z。每个 S^1 贡献一个 H_1 生成元。"},{"title":"S^p×S^q 的上同调环","content":"H^*(S^p×S^q;Z)≅Z[α,β]/(α²,β²) 其中 |α|=p, |β|=q。Künneth + Cup 积结构。"},{"title":"RP^2×S^1 的同调","content":"Künneth 给出 H_1≅Z⊕Z/2, H_2≅Z/2, H_3≅Z/2。Tor(Z/2,Z)=Z/2 提供修正。"}],"theorems":[{"name":"同调 Künneth 定理","statement":"存在分裂短正合序列连接 H_n(X×Y) 与 ⊕_{i+j=n} H_i(X)⊗H_j(Y) 和 Tor 项。","proof":"由Eilenberg-Zilber定理，C_*(X×Y)链同伦等价于C_*(X)⊗C_*(Y)（分次张量积）。对两个链复形的张量积应用代数Künneth公式：H_n(C⊗D)由⊕_{i+j=n}H_i(C)⊗H_j(D)和⊕_{i+j=n-1}Tor(H_i(C),H_j(D))决定。序列分裂但非自然。核心是Eilenberg-Zilber的acyclic model论证。"},{"name":"上同调 Künneth 定理","statement":"对域系数，H^n(X×Y) ≅ ⊕_{i+j=n} H^i(X)⊗H^j(Y)，且上同调环分次张量积。","proof":"对域系数，Tor和Ext项消失，同调Künneth公式给出同构。上同调版本由同调Künneth和对偶得到。环结构：H^*(X×Y)≅H^*(X)⊗H^*(Y)作为分次代数，Cup积满足(α⊗β)⌣(γ⊗δ)=(-1)^{|β||γ|}(α⌣γ)⊗(β⌣δ)。这体现了因子空间上同调信息的独立性与交互规则。"}],"applications":"Künneth 公式用于计算复杂乘积空间的同调/上同调，在代数拓扑、代数几何和数学物理中广泛应用。在弦理论中，紧化空间的拓扑通过 Künneth 公式分析。","refs":[{"book":"Hatcher","ch":"Ch.3","sec":"§3.B"},{"book":"Munkres","ch":"Ch.5","sec":"§48"}],"subject":"topo"},{"id":"t21","label":"Poincare对偶","chapter":"ch3","layer":3,"desc":"紧致可定向流形上同调与同调之间的对偶关系，是流形拓扑学最深刻的定理之一。","content":"Poincaré 对偶定理：设 M 为紧致可定向 n 维流形（可带边），则存在同构 H^k(M;G) ≅ H_{n-k}(M;G)（以及 H^k(M,∂M;G) ≅ H_{n-k}(M;G)）。对偶同构由与基本类 [M]∈H_n(M;G) 的 Cap 积给出：D(α) = α⌢[M]。在不可定向流形上，Z/2 系数下仍有对偶。Poincaré 对偶的几何解释：每个 k 维上同调类对应一个 (n-k) 维子流形（其对偶），反之亦然。Cup 积在此对应下变为子流形的交。这是代数拓扑与几何拓扑最深层的联系之一。","understanding":"Poincaré 对偶揭示了流形的一个惊人对称性：k 维上同调与 (n-k) 维同调之间有一一对应。在三维空间中，这意味着：0维同调（连通分支）↔ 3维上同调，1维同调（环）↔ 2维上同调，2维同调（空腔）↔ 1维上同调，3维同调↔ 0维上同调。这就像镜子反射：流形的拓扑结构在维度上对称。更美妙的是，Cup 积在对偶下变成了几何交——两个上同调类的 Cup 积对应它们对偶子流形的交。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><text x=\"100\" y=\"20\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\" text-anchor=\"middle\">Poincaré 对偶</text><rect x=\"15\" y=\"40\" width=\"60\" height=\"30\" rx=\"4\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"45\" y=\"59\" font-size=\"9\" fill=\"#2563eb\" text-anchor=\"middle\">H^k(M)</text><rect x=\"125\" y=\"40\" width=\"60\" height=\"30\" rx=\"4\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"155\" y=\"59\" font-size=\"9\" fill=\"#dc2626\" text-anchor=\"middle\">H_{n-k}(M)</text><line x1=\"75\" y1=\"55\" x2=\"125\" y2=\"55\" stroke=\"#333\" stroke-width=\"1.5\" stroke-dasharray=\"4,2\"/><text x=\"100\" y=\"52\" font-size=\"13\" fill=\"#7c3aed\">≅</text><text x=\"100\" y=\"85\" font-size=\"9\" fill=\"#333\">D(α) = α⌢[M]</text><text x=\"100\" y=\"105\" font-size=\"10\" fill=\"#333\" font-weight=\"bold\">Cap积实现同构</text><text x=\"100\" y=\"130\" font-size=\"9\" fill=\"#666\">紧致可定向n维流形M</text><text x=\"100\" y=\"148\" font-size=\"9\" fill=\"#666\">H^k(M) ≅ H_{n-k}(M)</text><text x=\"100\" y=\"170\" font-size=\"9\" fill=\"#dc2626\">Cup积 ↔ 子流形交</text></svg>","examples":[{"title":"S^n 的 Poincaré 对偶","content":"H^0(S^n)≅H_n(S^n)≅Z, H^n(S^n)≅H_0(S^n)≅Z，其他对偶平凡。"},{"title":"CP^n 的 Poincaré 对偶","content":"H^{2k}(CP^n)≅H_{2n-2k}(CP^n)≅Z。Cup 积 α^k⌣α^{n-k}=α^n 对应子流形 CP^k 和 CP^{n-k} 的交。"},{"title":"不可定向流形","content":"RP^2 的 Z 系数 Poincaré 对偶不成立（H^0≅Z 但 H_2=0），但 Z/2 系数下 H^k(RP^2;Z/2)≅H_{2-k}(RP^2;Z/2)。"}],"theorems":[{"name":"Poincaré 对偶定理","statement":"设 M 为紧致可定向 n 维流形，则 Cap 积与基本类 D(α)=α⌢[M] 给出同构 H^k(M)≅H_{n-k}(M)。","proof":"取M的对偶胞腔分解：将M三角剖分，对偶剖分中k维胞腔对应(n-k)维胞腔。对偶剖分的胞腔链复形同构于上链复形。利用Mayer-Vietoris序列和归纳法，证明Cap积D:H^k(M)→H_{n-k}(M)是同构。基本类[M]∈H_n(M)的存在性由可定向性保证，且D在局部上同调层面是良定义的。"},{"name":"Lefschetz 对偶","statement":"对紧致可定向带边流形 (M,∂M)，有 H^k(M)≅H_{n-k}(M,∂M) 和 H^k(M,∂M)≅H_{n-k}(M)。","proof":"将Poincaré对偶推广到带边流形。取M的2倍（double）DM=M∪_{∂M}M，对DM应用Poincaré对偶，再利用Mayer-Vietoris序列分解。基本类在H_n(M,∂M)中。Cap积给出H^k(M)≅H_{n-k}(M,∂M)和H^k(M,∂M)≅H_{n-k}(M)。核心是基本类在边界上的行为。"}],"applications":"Poincaré 对偶是代数拓扑和几何拓扑的桥梁。在扭结理论中，Alexander 对偶是其推广；在代数几何中，Serre 对偶和 Grothendieck 对偶是深远推广；在数学物理中，电磁对偶与 Poincaré 对偶有关。","refs":[{"book":"Hatcher","ch":"Ch.3","sec":"§3.3"},{"book":"Munkres","ch":"Ch.5","sec":"§50"}],"subject":"topo"},{"id":"t22","label":"上同调的应用","chapter":"ch3","layer":4,"desc":"上同调论在代数拓扑、微分拓扑和代数几何中的高级应用，涵盖示性类和 obstruction 理论。","content":"上同调的应用远超同调： (1) 示性类（Stiefel-Whitney 类、Chern 类、Pontryagin 类）是向量丛的上同调不变量，用于分类向量丛和流形；(2) Obstruct 理论利用上同调描述提升和延拓障碍；(3) de Rham 上同调连接微分形式与拓扑，de Rham 定理给出 H^k_{dR}(M)≅H^k(M;R)；(4) 谱序列（Serre 谱序列、Leray 谱序列）是计算纤维空间上同调的强大工具；(5) 在代数几何中，étale 上同调、晶体上同调等是 Weil 猜想的证明工具。上同调丰富的代数结构使其成为跨领域的通用语言。","understanding":"上同调的应用就像一把瑞士军刀，在不同领域有不同用途：在微分几何中，它告诉你流形上是否存在某种几何结构（如复结构、辛结构）；在物理学中，它描述规范场的拓扑类型（如磁单极子）；在代数几何中，它用于计数方程的解。示性类是上同调最成功的应用之一——它们把向量丛的几何信息（曲率）转化为拓扑信息（上同调类），实现了几何与拓扑的完美结合。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"100\" cy=\"100\" r=\"70\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><text x=\"100\" y=\"22\" font-size=\"10\" fill=\"#333\" font-weight=\"bold\" text-anchor=\"middle\">上同调应用生态</text><text x=\"100\" y=\"55\" font-size=\"9\" fill=\"#dc2626\">示性类</text><text x=\"45\" y=\"100\" font-size=\"9\" fill=\"#059669\">de Rham</text><text x=\"155\" y=\"100\" font-size=\"9\" fill=\"#d97706\">障碍理论</text><text x=\"55\" y=\"145\" font-size=\"9\" fill=\"#7c3aed\">谱序列</text><text x=\"145\" y=\"145\" font-size=\"9\" fill=\"#0d9488\">étale上同调</text><text x=\"100\" y=\"175\" font-size=\"8\" fill=\"#333\">向量丛 · 流形分类 · 物理</text></svg>","examples":[{"title":"Chern 类与复结构","content":"CP^n 的切丛 Chern 类为 c(TCP^n)=(1+α)^{n+1}，其中 α∈H^2(CP^n;Z)。Chern 数决定复流形的配边类。"},{"title":"Stiefel-Whitney 类","content":"RP^n 的全 Stiefel-Whitney 类为 w(RP^n)=(1+α)^{n+1}∈H^*(RP^n;Z/2)，其中 α∈H^1。w_1≠0 表示不可定向。"},{"title":"de Rham 定理","content":"微分形式的外微分 d 满足 d²=0，de Rham 上同调 H^k_{dR}(M)≅H^k(M;R)。微分形式的楔积对应 Cup 积。"}],"theorems":[{"name":"de Rham 定理","statement":"H^k_{dR}(M) ≅ H^k(M;R)（环同构），楔积对应 Cup 积。","proof":"定义映射I:H^k_{dR}(M)→H^k(M;R)，将微分形式ω映射到上链σ↦∫_σ ω。验证I(dω)=δI(ω)（Stokes定理），故I是链映射。利用单位分解和Poincaré引理证明I诱导同构：对M=ℝ^n成立，通过Mayer-Vietoris归纳到一般流形。楔积对应Cup积由Fubini定理保证。"},{"name":"Chern-Weil 理论","statement":"向量丛的曲率形式通过不变多项式产生示性类，且不依赖于联络的选择。","proof":"对向量丛选联络，曲率形式Ω。对Ad-不变多项式P，P(Ω)是闭的de Rham形式（Bianchi恒等式保证dP(Ω)=0）。若选另一联络，其曲率差为恰当形式，故P(Ω)的de Rham类不依赖于联络。通过de Rham定理，此闭形式对应上同调类，即示性类。核心是曲率形式与联络的变分公式。"}],"applications":"示性类用于分类流形和向量丛；在物理学中，量子霍尔效应、拓扑绝缘体、轴子电动力学都由上同调描述；在弦理论中，D膜电荷由K理论（上同调的推广）分类。","refs":[{"book":"Hatcher","ch":"Ch.3","sec":"§3.3"},{"book":"Hatcher","ch":"Ch.4","sec":"§4.2"}],"subject":"topo"},{"id":"t23","label":"高阶同伦群","chapter":"ch4","layer":2,"desc":"基本群的推广，使用高维球面 S^n 的映射类定义 n 维同伦群 π_n(X)。","content":"n 维同伦群 π_n(X,x₀) 是保基点映射 (S^n, s₀)→(X, x₀) 的同伦类集合。当 n=1 时，π_1 即基本群（非交换）。当 n≥2 时，π_n(X) 是阿贝尔群。群运算定义为：将两个映射在 S^n 的赤道处'拼接'，利用 S^n 的高维连通性证明良定义性和交换性。π_n 比同调群更难计算，但包含更精细的拓扑信息。经典结果：π_n(S^n)≅Z（由恒等映射生成），但 π_k(S^n) 对于 k>n 极其复杂，至今仍是活跃研究方向。","understanding":"高阶同伦群是基本群的'高维表亲'：基本群用 S^1（圆周）探测空间中的一维洞，π_2 用 S^2（球面）探测二维洞，π_3 用 S^3 探测三维洞，等等。一个关键区别是：n≥2 时，π_n 总是交换群（阿贝尔群），而 π_1 可以是非交换的。计算 π_n(S^k) 是拓扑学中最困难的问题之一——例如 π_{n+1}(S^n)≅Z/2 (n≥3)，这个结果就很不平凡。同伦群比同调群更精细（能区分同调相同但不同伦的空间），但代价是计算极其困难。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><circle cx=\"100\" cy=\"100\" r=\"45\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"100\" cy=\"100\" r=\"20\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/><circle cx=\"100\" cy=\"100\" r=\"3\" fill=\"#7c3aed\"/><text x=\"100\" y=\"92\" font-size=\"8\" fill=\"#7c3aed\" text-anchor=\"middle\">x₀</text><text x=\"100\" y=\"50\" font-size=\"9\" fill=\"#2563eb\">S^n</text><text x=\"100\" y=\"75\" font-size=\"8\" fill=\"#dc2626\">f</text><text x=\"100\" y=\"160\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\">π_n(X,x₀)</text><text x=\"100\" y=\"178\" font-size=\"9\" fill=\"#666\" text-anchor=\"middle\">f: S^n→X 的同伦类</text><text x=\"100\" y=\"193\" font-size=\"8\" fill=\"#666\" text-anchor=\"middle\">n≥2时交换群</text></svg>","examples":[{"title":"π_n(S^n)≅Z","content":"映射 f: S^n→S^n 的度数 deg(f)∈Z 给出同构 π_n(S^n)≅Z。恒等映射对应1。"},{"title":"π_3(S^2)≅Z","content":"Hopf 纤维化 S^3→S^2 生成 π_3(S^2)。Hopf 不变量1是 π_3(S^2)≅Z 的生成元。"},{"title":"π_{n+1}(S^n)≅Z/2 (n≥3)","content":"Freudenthal 悬挂定理给出此结果。生成元为悬挂映射 Σ: S^{n+1}→S^n 的两倍恒等映射。"}],"theorems":[{"name":"n≥2 时 π_n 是阿贝尔群","statement":"对 n≥2，π_n(X,x₀) 是阿贝尔群。证明利用 S^n 的高维连通性构造交换同伦。","proof":"核心是利用S^n(n≥2)的高维连通性：在S^n中，两个赤道S^{n-1}可以彼此绕过而不相交。构造同伦：将两个映射f,g:S^n→X在赤道处拼接，通过旋转赤道的位置将f·g连续变形为g·f。具体地，在S^n上旋转坐标使赤道位置互换，高维空间提供了足够的自由度实现此旋转。"},{"name":"同伦群的函子性","statement":"连续映射 f: X→Y 诱导同态 f_*: π_n(X)→π_n(Y)，且 (g∘f)_* = g_*∘f_*。","proof":"定义f_*([α])=[f∘α]，其中α:S^n→X。验证群同态：f_*(α·β)=[f∘(α·β)]=[(f∘α)·(f∘β)]=f_*α·f_*β（n≥2时自动保持，因π_n是Abel群）。复合性(f∘g)_*=f_*∘g_*由定义直接推出。这表明π_n是Top_*到AbelGrp的函子（n≥2）。"}],"applications":"同伦群在物理学中用于描述拓扑缺陷（涡旋、磁单极子、Skyrmion），在扭结理论中 π_n(S^2) 用于研究扭结和链环，在代数K理论中同伦群是核心研究对象。","refs":[{"book":"Hatcher","ch":"Ch.4","sec":"§4.1"},{"book":"Munkres","ch":"Ch.9","sec":"§59"}],"subject":"topo"},{"id":"t24","label":"纤维化与同伦提升","chapter":"ch4","layer":3,"desc":"纤维化是覆叠空间的高维推广，具有同伦提升性质，是计算同伦群的核心工具。","content":"纤维化 p: E→B 是具有同伦提升性质的连续映射：对任意空间 X 和映射 f: X→E，以及同伦 H: X×I→B 满足 H(x,0)=p(f(x))，存在提升同伦 H̃: X×I→E 使得 H̃(x,0)=f(x) 且 p∘H̃=H。纤维 F = p^{-1}(b₀) 是基点上的原像。纤维化诱导同伦群长正合序列：...→π_n(F)→π_n(E)→π_n(B)→π_{n-1}(F)→...。这是计算同伦群最基本的工具。重要例子：Hopf 纤维化 S^1→S^3→S^2, S^3→S^7→S^4, S^7→S^{15}→S^8。","understanding":"纤维化可以想象为一个'投影仪'：总空间 E 是底空间 B 的'多层版本'，每一层（纤维 F）看起来一样。纤维化的关键性质是'同伦提升'——如果你在底空间连续变形一条路径，你可以同步地在总空间中提升这条变形。这保证了纤维化诱导同伦群的长正合序列，使我们可以通过比较 E, B, F 的同伦群来互相计算。Hopf 纤维化 S^3→S^2 是一个经典例子：三维球面可以看作由圆周纤维组成的二维球面上的'丛'。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"60\" y=\"10\" width=\"80\" height=\"30\" rx=\"4\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"100\" y=\"29\" font-size=\"10\" fill=\"#2563eb\" text-anchor=\"middle\">E (总空间)</text><rect x=\"60\" y=\"100\" width=\"80\" height=\"30\" rx=\"4\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"100\" y=\"119\" font-size=\"10\" fill=\"#dc2626\" text-anchor=\"middle\">B (底空间)</text><line x1=\"100\" y1=\"40\" x2=\"100\" y2=\"100\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"110\" y=\"70\" font-size=\"9\" fill=\"#333\">p</text><circle cx=\"100\" cy=\"155\" r=\"20\" fill=\"none\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/><text x=\"100\" y=\"160\" font-size=\"8\" fill=\"#7c3aed\" text-anchor=\"middle\">F</text><text x=\"100\" y=\"182\" font-size=\"9\" fill=\"#333\">F → E → B</text><text x=\"100\" y=\"195\" font-size=\"8\" fill=\"#666\">同伦提升性质</text></svg>","examples":[{"title":"Hopf 纤维化 S^1→S^3→S^2","content":"利用同伦群长正合序列，从 π_n(S^1) 已知，推出 π_n(S^3)≅π_n(S^2) (n≥3)。"},{"title":"道路空间纤维化","content":"对任意空间 X，道路空间 PX→X 是纤维化，纤维为环路空间 ΩX。π_n(ΩX)≅π_{n+1}(X)。"},{"title":"覆叠空间作为纤维化","content":"覆叠空间是离散纤维的纤维化，同伦群长正合序列给出 π_n(X̃)≅π_n(X) (n≥2)。"}],"theorems":[{"name":"纤维化同伦群长正合序列","statement":"对纤维化 F→E→B，存在长正合序列 ...→π_n(F)→π_n(E)→π_n(B)→π_{n-1}(F)→...。","proof":"连接同态∂:π_n(B)→π_{n-1}(F)的构造：将α:S^n→B视为D^n→B（边界映射到基点），利用同伦提升性质将D^n中的映射提升到E，其在S^{n-1}=∂D^n上的限制落在F中。正合性验证：在每步利用提升性质和压缩同伦。核心是纤维化的同伦提升性质产生长正合序列。"},{"name":"同伦提升性质","statement":"纤维化 p: E→B 具有对任意空间 X 的同伦提升性质。","proof":"纤维化定义为具有对任意空间的同伦提升性质的映射（Hurewicz纤维化）。等价地，若p是局部平凡的纤维丛（如覆盖空间），则具有同伦提升性质。证明利用局部平凡化将同伦分解为小段，在每段上使用乘积结构提升。核心是局部乘积结构加上紧致性论证保证全局提升的存在性。"}],"applications":"纤维化是计算同伦群的核心工具，通过谱序列计算同伦群，在代数拓扑、微分拓扑、代数几何中都有应用。在物理学中，纤维丛理论是规范场论的数学基础。","refs":[{"book":"Hatcher","ch":"Ch.4","sec":"§4.2"},{"book":"Munkres","ch":"Ch.9","sec":"§60"}],"subject":"topo"},{"id":"t25","label":"Whitehead定理","chapter":"ch4","layer":3,"desc":"弱同伦等价与同伦等价之间的桥梁，是CW复形范畴中的核心结构定理。","content":"Whitehead 定理：若 X 和 Y 是连通 CW 复形，f: X→Y 是连续映射，且 f 诱导所有同伦群的同构 f_*: π_n(X)≅π_n(Y)（∀n），则 f 是同伦等价。此定理的深刻之处在于：对于 CW 复形，同伦群的代数信息完全决定了同伦型。一个推论是：任何连通 CW 复形 X 若满足 π_n(X)=0 (∀n)，则 X 可缩。另一个推论：两个 CW 复形之间的弱同伦等价（诱导同伦群同构的映射）一定是同伦等价。CW 复形范畴是 Whitehead 定理成立的'正确范畴'。","understanding":"Whitehead 定理是代数拓扑中少有的'代数能完全决定几何'的定理。它告诉我们：对于 CW 复形（几乎所有常见空间），如果两个空间在所有维度上的同伦群都相同，那么它们就是同伦等价的——即从拓扑角度看是'一样'的。这就像说：如果两个人的所有基因（同伦群）都相同，那么他们就是同一个人（同伦等价）。但要注意，这个定理只在 CW 复形范畴中成立，对一般拓扑空间不成立。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"15\" y=\"50\" width=\"65\" height=\"40\" rx=\"4\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"47\" y=\"74\" font-size=\"9\" fill=\"#2563eb\" text-anchor=\"middle\">X (CW)</text><rect x=\"120\" y=\"50\" width=\"65\" height=\"40\" rx=\"4\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"152\" y=\"74\" font-size=\"9\" fill=\"#dc2626\" text-anchor=\"middle\">Y (CW)</text><line x1=\"80\" y1=\"70\" x2=\"120\" y2=\"70\" stroke=\"#333\" stroke-width=\"2\"/><text x=\"100\" y=\"65\" font-size=\"10\" fill=\"#7c3aed\">f</text><text x=\"100\" y=\"110\" font-size=\"10\" fill=\"#333\" font-weight=\"bold\">π_n(X) ≅ π_n(Y) ∀n</text><text x=\"100\" y=\"130\" font-size=\"10\" fill=\"#333\">⇓</text><text x=\"100\" y=\"150\" font-size=\"11\" fill=\"#dc2626\" font-weight=\"bold\">X ≃ Y (同伦等价)</text><text x=\"100\" y=\"175\" font-size=\"9\" fill=\"#666\">代数完全决定几何</text></svg>","examples":[{"title":"可缩空间的判定","content":"若连通 CW 复形 X 的所有同伦群平凡，则 X 同伦等价于点。这推广了单连通+无同调⇒可缩。"},{"title":"球面间的同伦等价","content":"S^n 和 S^m 若同伦等价，则必须 n=m。因为 π_n(S^n)≅Z 而 π_n(S^m)=0 (n<m)。"},{"title":"CW逼近","content":"任何空间存在弱同伦等价的CW复形，且在同伦范畴中唯一。这保证了CW复形范畴的完备性。"}],"theorems":[{"name":"Whitehead 定理","statement":"CW 复形之间的弱同伦等价（诱导所有同伦群同构的映射）是同伦等价。","proof":"归纳构造同伦逆g:Y→X。对n维骨架Y^n，假设已构造g在Y^{n-1}上并满足f∘g≃id。利用f_*:π_n(X)→π_n(Y)是同构，将Y中n维胞腔的粘贴映射提升到X中，延拓g到Y^n。逐维完成构造。由于CW复形具有弱拓扑，归纳极限给出整体同伦等价。"},{"name":"Whitehead 定理（同调版本）","statement":"若 f: X→Y 是单连通 CW 复形间的映射，且诱导同调同构，则 f 是同伦等价。","proof":"单连通条件下，Hurewicz定理联系同调和同伦群。f诱导同调同构⇒由Hurewicz定理和归纳法，f诱导同伦群同构。具体：第一个非零同调群同构⇒第一个非零同伦群同构→逐维推进。再由Whitehead定理（同伦群版本），f是同伦等价。单连通性保证了归纳的基础步骤成立。"}],"applications":"Whitehead 定理是代数拓扑的基石，用于证明空间的同伦等价性，在稳定同伦论、有理同伦论和代数K理论中频繁使用。它保证了同伦群作为CW复形的不变量的完备性。","refs":[{"book":"Hatcher","ch":"Ch.4","sec":"§4.1"},{"book":"Munkres","ch":"Ch.9","sec":"§61"}],"subject":"topo"},{"id":"t26","label":"Hurewicz定理","chapter":"ch4","layer":3,"desc":"连接同伦群与同调群的桥梁定理，揭示了低维同调群可由同伦群完全确定。","content":"Hurewicz 定理建立了同伦群与同调群之间的基本联系。设 X 是 (n-1) 连通空间（即 π_k(X)=0 对 k≤n-1），n≥1。则存在自然同态 h: π_n(X)→H_n(X)（Hurewicz 同态），且 (1) 若 n=1，h 诱导同构 π_1(X)_{ab}≅H_1(X)（基本群的交换化）；(2) 若 n≥2，h 是同构。此外，h 在更高维也诱导满射。Hurewicz 定理的推论：第一个非零同伦群与同维同调群同构。这是计算同伦群的重要工具，也揭示了同调是同伦群的'交换化'。","understanding":"Hurewicz 定理告诉我们：同调群是同伦群的'简化版'。具体来说，H_1 就是 π_1 的交换化（把非交换部分'抹平'），而第一个非零的高维同伦群恰好等于同维的同调群。这解释了为什么同调群更容易计算：它们丢失了同伦群中的非交换信息。但 Hurewicz 定理也提供了一个从同调群反向推断同伦群的方法——至少对于最低的非零同伦群。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><rect x=\"10\" y=\"40\" width=\"70\" height=\"35\" rx=\"4\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"45\" y=\"62\" font-size=\"10\" fill=\"#2563eb\" text-anchor=\"middle\">π_n(X)</text><rect x=\"120\" y=\"40\" width=\"70\" height=\"35\" rx=\"4\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1.5\"/><text x=\"155\" y=\"62\" font-size=\"10\" fill=\"#dc2626\" text-anchor=\"middle\">H_n(X)</text><line x1=\"80\" y1=\"57\" x2=\"120\" y2=\"57\" stroke=\"#333\" stroke-width=\"2\"/><text x=\"100\" y=\"52\" font-size=\"10\" fill=\"#7c3aed\">h</text><text x=\"100\" y=\"95\" font-size=\"9\" fill=\"#333\">n=1: π₁/[π₁,π₁] ≅ H₁</text><text x=\"100\" y=\"112\" font-size=\"9\" fill=\"#333\">n≥2: π_n ≅ H_n</text><text x=\"100\" y=\"130\" font-size=\"9\" fill=\"#333\">(若X为(n-1)连通)</text><text x=\"100\" y=\"155\" font-size=\"10\" fill=\"#dc2626\" font-weight=\"bold\">Hurewicz 同构</text><text x=\"100\" y=\"175\" font-size=\"9\" fill=\"#666\">同伦群 → 同调群</text></svg>","examples":[{"title":"S^n 的 Hurewicz 定理","content":"S^n 是 (n-1) 连通空间，π_n(S^n)≅Z 且 Hurewicz 同态 h: π_n(S^n)→H_n(S^n)≅Z 是同构。"},{"title":"环面 T^2 的 H_1","content":"π_1(T^2)≅Z×Z（交换），故 H_1(T^2)≅π_1(T^2)≅Z×Z。Hurewicz 同态是同构。"},{"title":"8字形 S^1∨S^1","content":"π_1≅F₂（非交换），H_1≅Z²。Hurewicz 定理给出 π_1 的交换化等于 H_1。"}],"theorems":[{"name":"Hurewicz 定理","statement":"若 X 是 (n-1) 连通 (n≥1)，则 Hurewicz 同态 h: π_n(X)→H_n(X) 是同构 (n≥2) 或交换化同构 (n=1)。","proof":"构造h([f])=f_*([S^n])，其中[S^n]是H_n(S^n)的基本类。对(n-1)连通空间，利用相对同伦群和同调群的正合序列，归纳证明H_i(X)=0(i<n)且h是满射。n≥2时，利用同调正合序列和五引理证明h是单射。n=1时，h的核是换位子群[π₁,π₁]。"},{"name":"相对 Hurewicz 定理","statement":"对空间对 (X,A)，若 (X,A) 是 (n-1) 连通，则 π_n(X,A)→H_n(X,A) 有类似结论。","proof":"类似构造相对Hurewicz同态h:π_n(X,A)→H_n(X,A)。(X,A)的(n-1)连通性意味着π_i(X,A)=0(i<n)且A是道路连通的。利用相对同伦群和相对同调群的正合序列，归纳证明H_i(X,A)=0(i<n)且h是满射。n≥2时h是同构。证明框架与绝对情形对应，推广到空间对。"}],"applications":"Hurewicz 定理是连接同伦论和同调论的桥梁，用于从同调群计算最低非零同伦群，在稳定同伦论中用于构造谱的同伦群，在代数K理论中用于计算K群。","refs":[{"book":"Hatcher","ch":"Ch.4","sec":"§4.2"},{"book":"Munkres","ch":"Ch.9","sec":"§62"}],"subject":"topo"},{"id":"t27","label":"同伦群的计算","chapter":"ch4","layer":4,"desc":"同伦群的计算是代数拓扑的核心难题，涉及谱序列、Postnikov塔和稳定同伦论等高级工具。","content":"同伦群的计算极其困难，即使对球面 S^n 也远未完全解决。主要工具：(1) 纤维化长正合序列：利用 Hopf 纤维化等计算同伦群；(2) Freudenthal 悬挂定理：π_{n+k}(S^n) 对 n 充分大时稳定，稳定同伦群 π_k^S 是重要研究对象；(3) Serre 谱序列：计算纤维化的同调/上同调，进而通过 Hurewicz 定理和模 p 理论推算同伦群；(4) Postnikov 塔：将空间分解为同伦群逐层构建的纤维化序列；(5) 有理同伦论：Quillen 和 Sullivan 的工作将有理同伦群的计算转化为微分分次李代数的问题。","understanding":"计算同伦群是一桩'拓扑学界的奥林匹克竞赛'。即使是最简单的空间——球面 S^2——其同伦群 π_n(S^2) 至今仍未完全算出。稳定同伦群（n 足够大时 π_{n+k}(S^n) 不再依赖 n）相对容易，但仍有大量未解问题。Serre 的诺贝尔奖级别工作（他获得的是菲尔兹奖）利用谱序列证明了 π_n(S^k) 大多是有限群。计算同伦群需要几乎所有的代数拓扑工具：谱序列、同调代数、模理论、甚至代数几何。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#fafafa\"/><text x=\"100\" y=\"22\" font-size=\"11\" fill=\"#333\" font-weight=\"bold\" text-anchor=\"middle\">同伦群计算工具</text><rect x=\"10\" y=\"40\" width=\"85\" height=\"25\" rx=\"3\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1\"/><text x=\"52\" y=\"57\" font-size=\"8\" fill=\"#2563eb\" text-anchor=\"middle\">纤维化长正合列</text><rect x=\"105\" y=\"40\" width=\"85\" height=\"25\" rx=\"3\" fill=\"#fce7f3\" stroke=\"#dc2626\" stroke-width=\"1\"/><text x=\"147\" y=\"57\" font-size=\"8\" fill=\"#dc2626\" text-anchor=\"middle\">谱序列</text><rect x=\"10\" y=\"75\" width=\"85\" height=\"25\" rx=\"3\" fill=\"#fef3c7\" stroke=\"#d97706\" stroke-width=\"1\"/><text x=\"52\" y=\"92\" font-size=\"8\" fill=\"#d97706\" text-anchor=\"middle\">悬挂定理</text><rect x=\"105\" y=\"75\" width=\"85\" height=\"25\" rx=\"3\" fill=\"#e0f2fe\" stroke=\"#0d9488\" stroke-width=\"1\"/><text x=\"147\" y=\"92\" font-size=\"8\" fill=\"#0d9488\" text-anchor=\"middle\">Postnikov塔</text><rect x=\"10\" y=\"110\" width=\"85\" height=\"25\" rx=\"3\" fill=\"#f3e8ff\" stroke=\"#7c3aed\" stroke-width=\"1\"/><text x=\"52\" y=\"127\" font-size=\"8\" fill=\"#7c3aed\" text-anchor=\"middle\">有理同伦论</text><rect x=\"105\" y=\"110\" width=\"85\" height=\"25\" rx=\"3\" fill=\"#fce4ec\" stroke=\"#e91e63\" stroke-width=\"1\"/><text x=\"147\" y=\"127\" font-size=\"8\" fill=\"#e91e63\" text-anchor=\"middle\">模p理论</text><text x=\"100\" y=\"160\" font-size=\"9\" fill=\"#333\">π_{n+k}(S^n) 稳定同伦群</text><text x=\"100\" y=\"178\" font-size=\"9\" fill=\"#dc2626\">至今未完全计算！</text></svg>","examples":[{"title":"π_3(S^2)≅Z","content":"利用 Hopf 纤维化 S^1→S^3→S^2 的长正合序列，π_3(S^3)≅Z 推出 π_3(S^2)≅Z。"},{"title":"π_4(S^2)≅Z/2","content":"利用 π_3(S^2)≅Z 和纤维化 ΩS^2→PS^2→S^2，通过谱序列计算得到。"},{"title":"稳定同伦群 π_1^S","content":"π_{n+1}(S^n)≅Z/2 (n≥3)，稳定同伦群 π_1^S≅Z/2。这是Freudenthal悬挂定理的经典结果。"}],"theorems":[{"name":"Freudenthal 悬挂定理","statement":"悬挂同态 Σ: π_{n+k}(S^n)→π_{n+k+1}(S^{n+1}) 对 k≤n-1 是同构，对 k=n 是满射。","proof":"悬挂同态由悬挂映射诱导：Σ[f]=[Σf]。利用Blakers-Massey定理或同调论证：考虑映射S^n×I→S^{n+1}的像。在稳定范围内（k≤n-1），悬挂映射在球面上诱导同伦群的同构。核心是维数足够高时，映射的像有充分空间规避低维障碍。这定义了稳定同伦群π_k^S=colim π_{n+k}(S^n)。"},{"name":"Serre 有限性定理","statement":"π_{n+k}(S^n) 对 k>0 是有限群（除 π_{4n-1}(S^{2n}) 包含一个 Z 直和项外）。","proof":"利用Serre谱序列计算球面的模p上同调，进而通过模p同伦群和有理同伦论推断。有理同伦群π_*(S^n)⊗Q在n为奇数时只有π_n⊗Q=Q；n为偶数时加上π_{2n-1}⊗Q=Q。其余全为有限群。Serre的突破性工作揭示了球面同伦群几乎全是有限群，例外情形由Hopf不变量解释。"}],"applications":"同伦群计算在数学物理中用于分类拓扑孤子（Skyrmion），在弦理论中 D 膜的分类用到同伦群和 K 理论，在代数几何中球面同伦群与代数 K 理论和模形式有深刻联系。","refs":[{"book":"Hatcher","ch":"Ch.4","sec":"§4.2"},{"book":"Hatcher","ch":"Ch.4","sec":"§4.3"}],"subject":"topo"}];

const ALL_QUIZZES = [{"q":"平面曲线曲率κ(s)的几何意义是什么？","options":["曲线切向量的长度","单位切向量沿曲线的旋转速率","曲线的弧长参数","曲线的挠率"],"answer":1,"explanation":"曲率κ(s) = |γ''(s)|，度量单位切向量沿弧长方向的旋转速率，即曲线偏离直线的程度。","difficulty":"easy","chapter":"ch1","subject":"riemann"},{"q":"二维球面S²的Gauss曲率是多少？","options":["0","1/R","1/R²","2/R²"],"answer":2,"explanation":"半径为R的球面S²，主曲率均为1/R，Gauss曲率K = κ₁κ₂ = 1/R²。","difficulty":"easy","chapter":"ch1","subject":"riemann"},{"q":"Gauss绝妙定理（Theorema Egregium）的核心内容是什么？","options":["曲面总曲率等于4π","Gauss曲率仅依赖于第一基本形式","曲面可嵌入R³","所有曲面都共形平坦"],"answer":1,"explanation":"Gauss证明Gauss曲率K仅由第一基本形式（度量）及其导数决定，是曲面的内蕴不变量，不需要外围空间信息。","difficulty":"medium","chapter":"ch1","subject":"riemann"},{"q":"Frenet-Serret方程中，dN/ds等于什么？","options":["κT","-κT + τB","κN","-τB"],"answer":1,"explanation":"Frenet-Serret方程：dT/ds=κN, dN/ds=-κT+τB, dB/ds=-τN。","difficulty":"medium","chapter":"ch1","subject":"riemann"},{"q":"圆柱面与平面等距，因此它们的Gauss曲率是什么关系？","options":["圆柱面曲率更大","平面曲率更大","两者曲率相等（均为0）","无法比较"],"answer":2,"explanation":"等距映射保持所有内蕴几何量。圆柱面可在不拉伸的情况下展开为平面，故Gauss曲率均为零。","difficulty":"easy","chapter":"ch1","subject":"riemann"},{"q":"环面上哪些区域的Gauss曲率为负？","options":["外侧","内侧","顶部和底部圆周","整个环面"],"answer":1,"explanation":"环面外侧K>0（椭圆点），内侧K<0（双曲点），顶部和底部圆周K=0（抛物点）。","difficulty":"medium","chapter":"ch1","subject":"riemann"},{"q":"闭曲面上Gauss曲率的积分等于什么？","options":["4π","2πχ(M)","0","曲面的面积"],"answer":1,"explanation":"Gauss-Bonnet定理：∫_M K dA = 2πχ(M)，其中χ(M)是Euler示性数。","difficulty":"medium","chapter":"ch1","subject":"riemann"},{"q":"空间曲线的挠率恒为零意味着什么？","options":["曲线是直线","曲线是平面曲线","曲线是球面曲线","曲线是测地线"],"answer":1,"explanation":"挠率τ度量曲线偏离密切平面的程度。τ=0意味着曲线始终在同一平面内，即平面曲线。","difficulty":"easy","chapter":"ch1","subject":"riemann"},{"q":"球面S²的Euler示性数χ(S²)是多少？","options":["0","1","2","4"],"answer":2,"explanation":"球面亏格g=0，χ=2-2g=2。总曲率∫K dA = 2π×2 = 4π。","difficulty":"easy","chapter":"ch1","subject":"riemann"},{"q":"以下哪种曲面Gauss曲率恒为零？","options":["球面","伪球面","可展曲面（如圆柱面、锥面）","环面"],"answer":2,"explanation":"可展曲面可与平面等距（不拉伸地展开），因此内蕴曲率为零。球面K=1/R²>0，伪球面K=-1，环面K有正有负。","difficulty":"hard","chapter":"ch1","subject":"riemann"},{"q":"黎曼度量g_ij必须是哪种矩阵？","options":["对称正定矩阵","对称半正定矩阵","任意对称矩阵","反对称矩阵"],"answer":0,"explanation":"黎曼度量是正定对称双线性型，在每点切空间上定义内积，因此g_ij是对称正定矩阵。","difficulty":"easy","chapter":"ch2","subject":"riemann"},{"q":"黎曼体积形式dV_g在局部坐标下等于什么？","options":["det(g) dx¹∧...∧dxⁿ","√(det g) dx¹∧...∧dxⁿ","tr(g) dx¹∧...∧dxⁿ","g dx¹∧...∧dxⁿ"],"answer":1,"explanation":"dV_g = √(det g) dx¹∧...∧dxⁿ，其中√(det g)是'拉伸因子'，描述坐标映射的面积/体积畸变。","difficulty":"easy","chapter":"ch2","subject":"riemann"},{"q":"等距映射保持以下哪些量？","options":["仅长度","长度和角度","长度、角度和曲率","仅曲率"],"answer":2,"explanation":"等距映射保持度量，因此保持所有内蕴几何量：长度、角度、面积、体积、曲率等。","difficulty":"easy","chapter":"ch2","subject":"riemann"},{"q":"音乐同构（♭和♯）描述了什么？","options":["切空间和余切空间之间的同构","不同流形之间的同构","度量张量的对称性","联络的无挠性"],"answer":0,"explanation":"黎曼度量建立了切空间TM与余切空间T*M之间的自然同构：♭降指标，♯升指标。","difficulty":"medium","chapter":"ch2","subject":"riemann"},{"q":"Myers-Steenrod定理关于等距群的结论是什么？","options":["等距群是无限维的","等距群是有限维Lie群，维数≤n(n+1)/2","等距群总是平凡的","等距群维数等于流形维数"],"answer":1,"explanation":"Myers-Steenrod定理：等距群是Lie变换群，维数≤n(n+1)/2。最大对称空间的等距群维数恰好达到此上界。","difficulty":"medium","chapter":"ch2","subject":"riemann"},{"q":"共形变换h = e^(2f)g保持什么量不变？","options":["长度","面积","角度","曲率"],"answer":2,"explanation":"共形变换保持角度不变（因为分子分母的缩放因子抵消），但长度、面积和曲率一般会改变。","difficulty":"medium","chapter":"ch2","subject":"riemann"},{"q":"拉回度量F*h的定义是什么？","options":["F*h = h","F*h = h(F(x))","(F*h)_p(v,w) = h_F(p)(dF_p(v), dF_p(w))","F*h = F·h"],"answer":2,"explanation":"拉回度量将外围空间N中度量h通过微分dF'拉回'到M上，定义M上的度量。","difficulty":"medium","chapter":"ch2","subject":"riemann"},{"q":"二维黎曼流形上的等温坐标存在性意味着什么？","options":["所有二维流形都是平坦的","所有二维黎曼度量局部共形平坦","二维流形没有曲率","二维流形总是等距于R²"],"answer":1,"explanation":"在二维，总存在局部坐标使度量形式为ds²=e^(2λ)(dx²+dy²)，即局部共形平坦。","difficulty":"hard","chapter":"ch2","subject":"riemann"},{"q":"梯度grad f与微分df的关系是什么？","options":["grad f = df","(grad f)^i = g^ij ∂_j f","grad f = -df","grad f = f·g"],"answer":1,"explanation":"梯度是微分通过度量升指标得到的向量场：(grad f)^i = g^ij ∂_j f。","difficulty":"medium","chapter":"ch2","subject":"riemann"},{"q":"紧致Lie群上总存在双不变度量的原因是什么？","options":["Lie群总是平坦的","通过平均化构造","Lie群维数有限","Lie群总是对称的"],"answer":1,"explanation":"紧致Lie群上可通过在群上对任意左不变度量取平均（积分）来构造不变的双不变度量。","difficulty":"hard","chapter":"ch2","subject":"riemann"},{"q":"欧氏空间Rⁿ的截面曲率是多少？","options":["1","0","-1","依赖于坐标"],"answer":1,"explanation":"欧氏空间是平坦的，Christoffel符号全为零，曲率张量恒为零，因此截面曲率恒为0。","difficulty":"easy","chapter":"ch3","subject":"riemann"},{"q":"球面Sⁿ(R)的截面曲率是多少？","options":["1/R","1/R²","R","R²"],"answer":1,"explanation":"半径为R的球面Sⁿ(R)是常截面曲率空间，K=1/R²。","difficulty":"easy","chapter":"ch3","subject":"riemann"},{"q":"双曲空间Hⁿ的截面曲率是多少？","options":["1","0","-1","不确定"],"answer":2,"explanation":"标准双曲空间Hⁿ的截面曲率恒为-1（可通过缩放改变绝对值，但符号恒为负）。","difficulty":"easy","chapter":"ch3","subject":"riemann"},{"q":"Poincaré圆盘模型中的'直线'对应什么？","options":["欧氏直线段","与边界垂直的圆弧","任意曲线","抛物线"],"answer":1,"explanation":"在Poincaré圆盘模型中，双曲直线是正交于单位圆边界的圆弧（包括直径）。","difficulty":"medium","chapter":"ch3","subject":"riemann"},{"q":"Killing-Hopf定理的内容是什么？","options":["所有流形都有等距群","完备单连通常曲率空间只有三种","曲率决定了拓扑","等距群总是紧致的"],"answer":1,"explanation":"Killing-Hopf定理：完备单连通常曲率黎曼流形等距于球面、欧氏空间或双曲空间（差缩放）。","difficulty":"medium","chapter":"ch3","subject":"riemann"},{"q":"球面S²上三角形的内角和与什么有关？","options":["三角形的边长","三角形的面积（曲率积分）","三角形的位置","三角形的形状"],"answer":1,"explanation":"球面三角形内角和=π+∫K dA=π+面积/R²。面积越大，内角和越大，可达3π。","difficulty":"medium","chapter":"ch3","subject":"riemann"},{"q":"紧致Lie群上双不变度量的截面曲率有什么性质？","options":["恒为负","恒为正","非负","恒为零"],"answer":2,"explanation":"紧致Lie群配备双不变度量，截面曲率K(X,Y)=|[X,Y]|²/4≥0，非负。","difficulty":"hard","chapter":"ch3","subject":"riemann"},{"q":"双曲平面上圆的周长随半径如何增长？","options":["线性增长","多项式增长","指数增长","有界"],"answer":2,"explanation":"双曲平面中半径为r的圆的周长=2π sinh(r)≈πe^r，指数增长，远快于欧氏平面的2πr。","difficulty":"medium","chapter":"ch3","subject":"riemann"},{"q":"球面S³与哪个Lie群微分同胚？","options":["SO(3)","SU(2)","SL(2,R)","U(1)"],"answer":1,"explanation":"S³与SU(2)微分同胚。SU(2)作为Lie群配备双不变度量，等距于单位球面S³。","difficulty":"hard","chapter":"ch3","subject":"riemann"},{"q":"常曲率流形（空间形式）的构造方式是什么？","options":["直接定义度量","模型空间模去离散等距子群","任意黎曼流形","乘积流形"],"answer":1,"explanation":"常曲率流形（空间形式）是模型空间（Sⁿ, Rⁿ, Hⁿ）模去一个作用自由且常态的离散等距子群的商空间。","difficulty":"hard","chapter":"ch3","subject":"riemann"},{"q":"Levi-Civita联络由哪两个条件唯一确定？","options":["无挠性和平坦性","无挠性和度量相容性","度量相容性和平坦性","对称性和正定性"],"answer":1,"explanation":"黎曼几何基本定理：存在唯一的无挠性（T=0）和度量相容性（∇g=0）的联络，即Levi-Civita联络。","difficulty":"easy","chapter":"ch4","subject":"riemann"},{"q":"Christoffel符号Γ^k_ij的表达式是什么？","options":["∂_i g_jk","g^kl(∂_i g_jl + ∂_j g_il - ∂_l g_ij)/2","g_ij ∂_k g","∂_i ∂_j g_kl"],"answer":1,"explanation":"Γ^k_ij = (1/2)g^kl(∂_i g_jl + ∂_j g_il - ∂_l g_ij)，完全由度量及其一阶导数决定。","difficulty":"easy","chapter":"ch4","subject":"riemann"},{"q":"平行移动保持什么量不变（对于Levi-Civita联络）？","options":["仅向量的长度","向量的长度和夹角","仅向量的方向","向量的坐标分量"],"answer":1,"explanation":"Levi-Civita联络的度量相容性保证平行移动是等距同构，保持向量长度和两向量夹角。","difficulty":"easy","chapter":"ch4","subject":"riemann"},{"q":"挠率张量T(X,Y)的定义是什么？","options":["∇_X Y + ∇_Y X","∇_X Y - ∇_Y X - [X,Y]","∇_X Y - ∇_Y X","∇_X Y + ∇_Y X + [X,Y]"],"answer":1,"explanation":"挠率张量定义为T(X,Y)=∇_X Y - ∇_Y X - [X,Y]。Levi-Civita联络的挠率恒为零。","difficulty":"medium","chapter":"ch4","subject":"riemann"},{"q":"协变导数∇_X对函数f的作用是什么？","options":["∇_X f = 0","∇_X f = Xf（方向导数）","∇_X f = f·X","∇_X f = df"],"answer":1,"explanation":"对函数（标量场），协变导数退化为普通方向导数：∇_X f = Xf = df(X)。","difficulty":"medium","chapter":"ch4","subject":"riemann"},{"q":"Foucault摆的摆动平面旋转与什么几何概念相关？","options":["测地线","平行移动","曲率","指数映射"],"answer":1,"explanation":"Foucault摆的摆动平面旋转是平行移动的物理体现：地球自转使摆沿球面平行移动，产生和乐旋转。","difficulty":"medium","chapter":"ch4","subject":"riemann"},{"q":"Berger分类定理中，不可约非对称黎曼流形的和乐群有几种？","options":["5种","7种","9种","无穷多种"],"answer":1,"explanation":"Berger分类给出了7种可能：SO(n), U(n), SU(n), Sp(n)·Sp(1), Sp(n), G₂, Spin(7)。","difficulty":"hard","chapter":"ch4","subject":"riemann"},{"q":"Killing向量场满足什么方程？","options":["∇_i X_j = 0","∇_i X_j + ∇_j X_i = 0","∇_i X_j - ∇_j X_i = 0","X_i X_j = 0"],"answer":1,"explanation":"Killing向量场满足Killing方程：∇_i X_j + ∇_j X_i = 0，生成流形的等距变换。","difficulty":"medium","chapter":"ch4","subject":"riemann"},{"q":"de Rham分解定理与什么概念相关？","options":["曲率张量","和乐群的可约性","测地线","指数映射"],"answer":1,"explanation":"de Rham分解定理：若和乐群可约，则流形局部等距于黎曼乘积。和乐群的可约性对应流形的分解。","difficulty":"hard","chapter":"ch4","subject":"riemann"},{"q":"在欧氏空间Rⁿ中，平行移动与路径的关系是什么？","options":["与路径有关","与路径无关","仅在闭曲线上有关","仅在测地线上有关"],"answer":1,"explanation":"欧氏空间曲率为零，平行移动与路径无关（和乐群平凡），这是平坦空间的特性。","difficulty":"easy","chapter":"ch4","subject":"riemann"},{"q":"测地线方程在局部坐标下是什么形式？","options":["dx^k/dt = 0","d²x^k/dt² + Γ^k_ij dx^i/dt dx^j/dt = 0","dx^k/dt + Γ^k_ij x^i x^j = 0","d²x^k/dt² = 0"],"answer":1,"explanation":"测地线方程为d²x^k/dt² + Γ^k_ij (dx^i/dt)(dx^j/dt) = 0，是二阶非线性ODE。","difficulty":"easy","chapter":"ch5","subject":"riemann"},{"q":"指数映射exp_p的定义是什么？","options":["exp_p(v) = p + v","exp_p(v) = γ_v(1)，其中γ_v是测地线","exp_p(v) = p·v","exp_p(v) = ∇_v p"],"answer":1,"explanation":"exp_p(v) = γ_v(1)，即从p以速度v出发的测地线在t=1时刻到达的点。","difficulty":"easy","chapter":"ch5","subject":"riemann"},{"q":"Hopf-Rinow定理中，以下哪项不是完备性的等价条件？","options":["作为度量空间完备","任意两点可由最短测地线连接","截面曲率有界","有界闭集紧致"],"answer":2,"explanation":"Hopf-Rinow定理等价条件：(1)度量完备；(2)测地完备；(3)两点可由最短测地线连接；(4)有界闭集紧致。曲率有界不在其中。","difficulty":"medium","chapter":"ch5","subject":"riemann"},{"q":"球面S²上，北极的割迹是什么？","options":["赤道","整个球面","南极（单点）","所有经线"],"answer":2,"explanation":"球面上任意点p的割迹是对径点{-p}。从p出发沿大圆走，在到达-p之前是最短的。","difficulty":"medium","chapter":"ch5","subject":"riemann"},{"q":"Gauss引理的内容是什么？","options":["测地线总是最短的","exp_p保持径向和切向正交性","所有测地线最终相交","距离函数是光滑的"],"answer":1,"explanation":"Gauss引理：指数映射的微分保持径向与切向正交性，这是测地线极坐标表示的基础。","difficulty":"medium","chapter":"ch5","subject":"riemann"},{"q":"能量泛函E(γ)和长度泛函L(γ)的关系是什么？","options":["E = L","E = L²/2 (对弧长参数)","E = √L","E = 1/L"],"answer":1,"explanation":"对弧长参数化曲线，L(γ) = ∫√(g(γ',γ'))dt，E(γ) = (1/2)∫g(γ',γ')dt。由Cauchy-Schwarz，L² ≤ 2E(b-a)。","difficulty":"medium","chapter":"ch5","subject":"riemann"},{"q":"以下哪个流形是完备的？","options":["R²去掉原点","单位开圆盘","紧致无边流形","上半空间去掉边界"],"answer":2,"explanation":"紧致无边黎曼流形自动完备。R²去掉原点不完备（Cauchy列不收敛），开圆盘和上半空间去边界也不完备。","difficulty":"easy","chapter":"ch5","subject":"riemann"},{"q":"割点与共轭点的关系是什么？","options":["割点总是在共轭点之后","割点总是在共轭点之前或同时","二者无关","割点就是共轭点"],"answer":1,"explanation":"第一个割点要么是共轭点，要么存在另一条等长测地线。割点出现在共轭点之前或与之同时。","difficulty":"hard","chapter":"ch5","subject":"riemann"},{"q":"第一变分公式δL(γ)[V] = 0给出什么条件？","options":["γ是直线","γ是测地线","γ是最短路径","γ是闭曲线"],"answer":1,"explanation":"第一变分公式δL(γ)[V] = -∫⟨∇_γ'γ', V⟩ dt = 0对所有V成立，等价于∇_γ'γ'=0，即γ是测地线。","difficulty":"medium","chapter":"ch5","subject":"riemann"},{"q":"在法坐标下，原点处的度量有什么性质？","options":["g_ij = δ_ij, ∂_k g_ij = 0","g_ij = 0","g_ij = -δ_ij","g_ij = δ_ij但∂_k g_ij ≠ 0"],"answer":0,"explanation":"在法坐标下，原点处g_ij(0)=δ_ij且∂_k g_ij(0)=0，因此Christoffel符号在原点为零。","difficulty":"hard","chapter":"ch5","subject":"riemann"},{"q":"黎曼曲率张量R(X,Y)Z的定义是什么？","options":["∇_X ∇_Y Z","∇_X∇_Y Z - ∇_Y∇_X Z","∇_X∇_Y Z - ∇_Y∇_X Z - ∇_[X,Y]Z","∇_X Y - ∇_Y X"],"answer":2,"explanation":"R(X,Y)Z = ∇_X∇_Y Z - ∇_Y∇_X Z - ∇_[X,Y]Z。交换子项∇_[X,Y]Z确保曲率张量是张量（C^∞-多线性）。","difficulty":"easy","chapter":"ch6","subject":"riemann"},{"q":"截面曲率K(σ)的公式是什么？","options":["K = ⟨R(u,v)u,v⟩","K = ⟨R(u,v)v,u⟩/(|u|²|v|²-⟨u,v⟩²)","K = R_ijkl","K = tr(R)"],"answer":1,"explanation":"K(σ) = ⟨R(u,v)v,u⟩/(|u|²|v|²-⟨u,v⟩²)，不依赖于σ的基{u,v}的选取。","difficulty":"easy","chapter":"ch6","subject":"riemann"},{"q":"Ricci曲率是如何定义的？","options":["曲率张量的所有分量之和","R_ij = R^k_ikj（缩并）","R = g^ij R_ij","R_ijkl的平方和"],"answer":1,"explanation":"Ricci曲率R_ij = R^k_ikj，是曲率张量在第一和第三指标的缩并得到的对称(0,2)-张量。","difficulty":"easy","chapter":"ch6","subject":"riemann"},{"q":"第二Bianchi恒等式缩并后得到什么？","options":["R = 0","∇^j R_ij = (1/2)∇_i S","∇_i R = 0","R_ijkl = 0"],"answer":1,"explanation":"缩并第二Bianchi恒等式得∇^j R_ij = (1/2)∇_i S，等价于Einstein张量G_ij满足∇^j G_ij = 0。","difficulty":"medium","chapter":"ch6","subject":"riemann"},{"q":"Weyl张量W在什么变换下是不变量？","options":["等距变换","共形变换","微分同胚","平行移动"],"answer":1,"explanation":"Weyl张量是共形不变量：在共形变换g'=e^(2f)g下，W'=e^(2f)W。W=0是度量共形平坦的充要条件（n≥4）。","difficulty":"medium","chapter":"ch6","subject":"riemann"},{"q":"Einstein流形满足什么条件？","options":["R_ijkl = 0","R_ij = λg_ij","R = 0","K = 常数"],"answer":1,"explanation":"Einstein流形满足Ricci曲率与度量成比例：Ric = λg。真空Einstein场方程Ric=0（λ=0）是其特例。","difficulty":"medium","chapter":"ch6","subject":"riemann"},{"q":"Ricci恒等式[∇_i,∇_j]X^k等于什么？","options":["0","R^k_lij X^l","R_ij X^k","∂_i X^k - ∂_j X^k"],"answer":1,"explanation":"Ricci恒等式：∇_i∇_j X^k - ∇_j∇_i X^k = R^k_lij X^l。协变导数交换子由曲率张量给出。","difficulty":"medium","chapter":"ch6","subject":"riemann"},{"q":"Bonnet-Myers定理的结论是什么？","options":["流形是平坦的","Ric≥(n-1)/R²·g时，直径≤πR且π₁有限","流形一定同胚于球面","截面曲率恒为常数"],"answer":1,"explanation":"Bonnet-Myers定理：若Ric≥(n-1)/R²·g，则diam(M)≤πR且π₁(M)有限。","difficulty":"medium","chapter":"ch6","subject":"riemann"},{"q":"Schur引理的内容是什么？","options":["截面曲率总是常数","若截面曲率仅依赖于点而不依赖于方向（n≥3），则曲率是常数","所有流形都是常曲率的","截面曲率与Ricci曲率相等"],"answer":1,"explanation":"Schur引理：若连通流形(n≥3)上每点截面曲率在所有方向都相同，则截面曲率在整个流形上是常数。","difficulty":"hard","chapter":"ch6","subject":"riemann"},{"q":"Bochner公式中，(1/2)Δ|∇f|²等于什么？","options":["|∇f|²","|∇²f|² + ⟨∇f,∇Δf⟩ + Ric(∇f,∇f)","Δf","0"],"answer":1,"explanation":"Bochner公式：(1/2)Δ|∇f|² = |∇²f|² + ⟨∇f,∇Δf⟩ + Ric(∇f,∇f)，是Bochner技巧的核心。","difficulty":"hard","chapter":"ch6","subject":"riemann"},{"q":"第二基本形式II(X,Y)的值在哪个空间中？","options":["切空间","法空间","整个外围空间","余切空间"],"answer":1,"explanation":"II(X,Y) = (∇^N_X Y)^⊥ 是N中协变导数在法空间上的投影，取值于法丛。","difficulty":"easy","chapter":"ch7","subject":"riemann"},{"q":"Gauss公式将N中联络分解为什么？","options":["∇^N = ∇^M","∇^N_X Y = ∇^M_X Y + II(X,Y)","∇^N = ∇^M + R","∇^N = R + II"],"answer":1,"explanation":"Gauss公式：∇^N_X Y = ∇^M_X Y + II(X,Y)，将N中联络分解为切向分量（M中联络）和法向分量（第二基本形式）。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"Gauss方程将什么量联系起来？","options":["仅第一基本形式","子流形曲率、外围曲率和第二基本形式","仅第二基本形式","仅外围曲率"],"answer":1,"explanation":"Gauss方程：R^M = R^N + II∧II，将子流形内蕴曲率与外围空间曲率和第二基本形式联系起来。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"极小曲面满足什么条件？","options":["Gauss曲率为零","平均曲率H=0","第二基本形式为零","法曲率为零"],"answer":1,"explanation":"极小曲面是面积泛函的临界点，满足平均曲率H=0。δArea = -∫⟨H,V⟩ dV = 0。","difficulty":"easy","chapter":"ch7","subject":"riemann"},{"q":"Alexandrov定理关于CMC曲面的结论是什么？","options":["存在无穷多紧致CMC曲面","R³中唯一紧致无边CMC曲面是球面","所有CMC曲面都是极小曲面","CMC曲面必为平坦"],"answer":1,"explanation":"Alexandrov定理：R³中唯一紧致无边常平均曲率（CMC）曲面是球面。这是刚性定理。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"Codazzi方程表达了什么对称性？","options":["度量张量的对称性","第二基本形式协变导数的对称性","曲率张量的对称性","联络的对称性"],"answer":1,"explanation":"Codazzi方程：(∇_X II)(Y,Z) = (∇_Y II)(X,Z)，即第二基本形式协变导数的对称性。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"全测地子流形满足什么条件？","options":["H=0","II=0（第二基本形式恒为零）","K=0","R=0"],"answer":1,"explanation":"全测地子流形第二基本形式恒为零（II=0），意味着子流形中测地线也是外围空间中的测地线。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"R³中曲面的Gauss曲率通过Gauss方程如何表达？","options":["K = H","K = (LN-M²)/(EG-F²)","K = L+N","K = E+G"],"answer":1,"explanation":"Gauss绝妙定理：K = det(II)/det(I) = (LN-M²)/(EG-F²)，仅依赖于第一基本形式。","difficulty":"medium","chapter":"ch7","subject":"riemann"},{"q":"Sⁿ中极小子流形满足什么方程？","options":["Δx = 0","Δx = -nx","Δx = nx","Δx = x"],"answer":1,"explanation":"Sⁿ中极小子流形满足Δx = -nx（x是位置向量），这是Simons研究极小子流形刚性定理的出发点。","difficulty":"hard","chapter":"ch7","subject":"riemann"},{"q":"Gauss-Codazzi方程在子流形理论中的角色是什么？","options":["仅用于计算","子流形存在性的可积性条件","没有实际用途","仅用于二维曲面"],"answer":1,"explanation":"Gauss-Codazzi方程是子流形存在性的可积性条件：给定满足这些方程的度量和第二基本形式，存在局部浸入实现它们。","difficulty":"hard","chapter":"ch7","subject":"riemann"},{"q":"局部Gauss-Bonnet定理中，测地三角形满足什么关系？","options":["∫K dA = π","∫K dA = α₁+α₂+α₃ - π","∫K dA = 0","∫K dA = 2π"],"answer":1,"explanation":"对于测地三角形（边界κ_g=0），∫_Ω K dA = α₁+α₂+α₃ - π。","difficulty":"easy","chapter":"ch8","subject":"riemann"},{"q":"全局Gauss-Bonnet定理：∫_M K dA等于什么？","options":["4π","2πχ(M)","0","πχ(M)"],"answer":1,"explanation":"全局Gauss-Bonnet定理：∫_M K dA = 2πχ(M)。对于闭定向二维流形。","difficulty":"easy","chapter":"ch8","subject":"riemann"},{"q":"亏格为g的紧致定向曲面的Euler示性数是多少？","options":["g","2g","2-2g","g-1"],"answer":2,"explanation":"χ(M) = 2 - 2g。球面g=0, χ=2；环面g=1, χ=0；双环面g=2, χ=-2。","difficulty":"easy","chapter":"ch8","subject":"riemann"},{"q":"环面T²的总Gauss曲率是多少？","options":["4π","2π","0","-4π"],"answer":2,"explanation":"环面χ=0，∫K dA = 2π×0 = 0。外侧正曲率与内侧负曲率恰好抵消。","difficulty":"easy","chapter":"ch8","subject":"riemann"},{"q":"Chern-Gauss-Bonnet定理适用于什么维数的流形？","options":["任意维数","仅二维","偶维","奇维"],"answer":2,"explanation":"Chern-Gauss-Bonnet定理适用于紧致可定向偶维黎曼流形：∫_M Pf(Ω) = (2π)^n χ(M)。","difficulty":"medium","chapter":"ch8","subject":"riemann"},{"q":"Euler示性数χ通过三角剖分如何计算？","options":["χ = V + E + F","χ = V - E + F","χ = V + E - F","χ = E - V - F"],"answer":1,"explanation":"χ = V - E + F（顶点数-边数+面数），与剖分方式无关。","difficulty":"easy","chapter":"ch8","subject":"riemann"},{"q":"测地曲率κ_g度量什么？","options":["曲线在空间中的弯曲","曲线在曲面内偏离测地线的程度","曲面的Gauss曲率","曲线的挠率"],"answer":1,"explanation":"测地曲率κ_g度量曲线在曲面内偏离测地线的程度。测地线的κ_g=0。","difficulty":"medium","chapter":"ch8","subject":"riemann"},{"q":"亏格g=2的闭曲面总Gauss曲率是多少？","options":["4π","2π","0","-4π"],"answer":3,"explanation":"χ=2-2×2=-2，∫K dA = 2π×(-2) = -4π。负总曲率是亏格≥2曲面的特征。","difficulty":"medium","chapter":"ch8","subject":"riemann"},{"q":"二维Gauss-Bonnet定理中，带边曲面的公式是什么？","options":["∫K dA = 2πχ(M)","∫K dA + ∫κ_g ds = 2πχ(M)","∫κ_g ds = 2πχ(M)","∫K dA = 0"],"answer":1,"explanation":"带边曲面：∫_M K dA + ∫_∂M κ_g ds = 2πχ(M)。边界贡献∫κ_g ds是必须的。","difficulty":"medium","chapter":"ch8","subject":"riemann"},{"q":"Chern-Gauss-Bonnet定理中，Pfaffian Pf(Ω)在二维退化为什么？","options":["K dA","K/(2π) dA","K dA/(4π)","R dA"],"answer":1,"explanation":"二维时Pf(Ω) = K/(2π)·dA，∫_M K/(2π) dA = χ(M)，即∫K dA = 2πχ(M)。","difficulty":"hard","chapter":"ch8","subject":"riemann"},{"q":"Jacobi方程是什么？","options":["J'' = 0","∇_γ'∇_γ' J + R(J,γ')γ' = 0","∇_γ' J = 0","J' + R J = 0"],"answer":1,"explanation":"Jacobi方程：∇_γ'∇_γ' J + R(J,γ')γ' = 0，描述沿测地线的无穷小变分。","difficulty":"easy","chapter":"ch9","subject":"riemann"},{"q":"球面Sⁿ(1)上法Jacobi场的方程是什么？","options":["J'' = 0","J'' + J = 0","J'' - J = 0","J'' + 2J = 0"],"answer":1,"explanation":"Sⁿ(1)上R(J,γ')γ' = J，法Jacobi方程简化为J''+J=0，解为三角振荡。","difficulty":"medium","chapter":"ch9","subject":"riemann"},{"q":"共轭点的定义是什么？","options":["测地线长度最小的点","存在非零Jacobi场在两端为零的点","测地线最长的点","割迹上的点"],"answer":1,"explanation":"q=γ(b)是p=γ(a)的共轭点，如果存在非零Jacobi场J满足J(a)=J(b)=0。","difficulty":"easy","chapter":"ch9","subject":"riemann"},{"q":"欧氏空间Rⁿ中有共轭点吗？","options":["有，且很多","没有","仅在原点上","仅在无穷远处"],"answer":1,"explanation":"Rⁿ中曲率为零，Jacobi场J(t)=J(0)+tJ'(0)只在t=0时为零，不存在共轭点。","difficulty":"easy","chapter":"ch9","subject":"riemann"},{"q":"第二变分公式δ²E(V,V)的表达式是什么？","options":["∫|V|² dt","∫(|∇V|² - ⟨R(V,γ')γ',V⟩) dt","∫⟨V,V⟩ dt","∫|∇V|² dt"],"answer":1,"explanation":"δ²E(V,V) = ∫(|∇_γ'V|² - ⟨R(V,γ')γ',V⟩) dt。曲率项使第二变分可能为负。","difficulty":"medium","chapter":"ch9","subject":"riemann"},{"q":"Morse指标定理给出了什么关系？","options":["Morse指标 = 流形维数","Morse指标 = 共轭点个数（计重数）","Morse指标 = 曲率","Morse指标 = 长度"],"answer":1,"explanation":"Morse指标定理：能量泛函在测地线上的Morse指标等于沿测地线的共轭点个数（计重数）。","difficulty":"medium","chapter":"ch9","subject":"riemann"},{"q":"双曲空间Hⁿ(-1)上法Jacobi场的解是什么形式？","options":["三角振荡","线性增长","指数增长（双曲函数）","常数"],"answer":2,"explanation":"Hⁿ(-1)上J''-J=0，解为J(t)=sinh(t)·A+cosh(t)·B，指数增长。","difficulty":"medium","chapter":"ch9","subject":"riemann"},{"q":"共轭点与割点的关系是什么？","options":["它们完全相同","割点总是在共轭点之后","第一个割点不晚于第一个共轭点","二者无关"],"answer":2,"explanation":"第一个割点要么是共轭点，要么出现在共轭点之前（有另一条等长测地线）。","difficulty":"hard","chapter":"ch9","subject":"riemann"},{"q":"Lyusternik-Fet定理的结论是什么？","options":["任何流形上都有测地线","任何紧致流形上存在闭测地线","测地线总是最短的","测地线是唯一的"],"answer":1,"explanation":"Lyusternik-Fet定理：任何紧致流形上存在闭测地线。这是Morse理论的关键应用。","difficulty":"hard","chapter":"ch9","subject":"riemann"},{"q":"Jacobi场沿测地线γ的维数是多少？","options":["n","2n","n(n+1)/2","n²"],"answer":1,"explanation":"Jacobi场由初始位置J(0)（n维）和初始速度J'(0)（n维）唯一确定，总维数为2n。","difficulty":"medium","chapter":"ch9","subject":"riemann"},{"q":"Rauch比较定理比较的是什么？","options":["两个流形的体积","两个流形中Jacobi场的模长","两个流形的直径","两个流形的曲率"],"answer":1,"explanation":"Rauch定理：若K_M ≥ K_M~，则沿等长测地线相同初始条件的Jacobi场满足|J(t)| ≤ |J~(t)|。","difficulty":"easy","chapter":"ch10","subject":"riemann"},{"q":"Bishop-Gromov体积比较定理的结论是什么？","options":["Vol(B(p,r)) ≥ V_c(r)","Vol(B(p,r)) ≤ V_c(r)","Vol(B(p,r)) = V_c(r)","Vol(B(p,r))与V_c(r)无关"],"answer":1,"explanation":"若Ric≥(n-1)c·g，则Vol(B(p,r)) ≤ V_c(r)，且比值Vol(B(p,r))/V_c(r)单调非增。","difficulty":"easy","chapter":"ch10","subject":"riemann"},{"q":"Toponogov定理比较的是什么？","options":["两个流形的曲率","测地三角形的边长和角度","两个流形的体积","测地线的长度"],"answer":1,"explanation":"Toponogov定理：若K≥c，则测地三角形各角不小于常曲率c空间中同边长三角形的对应角。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"Bonnet-Myers定理中，若Ric≥(n-1)/R²·g，直径的上界是多少？","options":["R","πR","2πR","πR/2"],"answer":1,"explanation":"Bonnet-Myers定理：diam(M) ≤ πR。球面Sⁿ(R)达到此上界，是刚性情形。","difficulty":"easy","chapter":"ch10","subject":"riemann"},{"q":"Gromov紧致性定理要求哪些条件？","options":["仅曲率有界","截面曲率有界、直径有界、体积有下界","仅直径有界","仅体积有下界"],"answer":1,"explanation":"Gromov紧致性定理：|K|≤1, diam≤D, vol≥v>0的n维流形集合在GH拓扑下紧致。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"Rauch定理中，正曲率对Jacobi场有什么影响？","options":["使Jacobi场增长更快","使Jacobi场增长变慢（或振荡）","无影响","使Jacobi场消失"],"answer":1,"explanation":"正曲率使Jacobi场增长变慢或振荡，负曲率使Jacobi场指数增长。曲率像'弹簧'。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"Gromov-Hausdorff距离度量什么？","options":["两个黎曼流形的曲率差异","两个度量空间之间的'形状差异'","两个流形的体积差异","两个流形的直径差异"],"answer":1,"explanation":"d_GH(X,Y)度量两个紧致度量空间之间的形状差异，定义为等距嵌入到同一空间后Hausdorff距离的下确界。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"Cheeger-Gromoll分裂定理的条件和结论是什么？","options":["Ric≥0且存在直线→M=R×N","Ric≤0→M是紧致的","K≥0→M是球面","Ric=0→M是平坦的"],"answer":0,"explanation":"Cheeger-Gromoll分裂定理：若完备非紧致流形Ric≥0且包含一条直线，则等距于乘积R×N。","difficulty":"hard","chapter":"ch10","subject":"riemann"},{"q":"Cartan-Hadamard定理适用于什么曲率条件？","options":["截面曲率≥0","截面曲率≤0","Ricci曲率≥0","标量曲率≤0"],"answer":1,"explanation":"Cartan-Hadamard定理：若完备单连通流形截面曲率≤0，则微分同胚于Rⁿ。","difficulty":"medium","chapter":"ch10","subject":"riemann"},{"q":"Perelman证明Poincaré猜想时使用了什么工具？","options":["仅Gauss-Bonnet定理","Ricci流和Gromov-Hausdorff收敛","仅Toponogov定理","仅Rauch定理"],"answer":1,"explanation":"Perelman使用Ricci流（带手术的）和Gromov-Hausdorff收敛分析奇点形成，证明了Poincaré猜想和Thurston几何化猜想。","difficulty":"hard","chapter":"ch10","subject":"riemann"},{"q":"平面曲线曲率κ(s)的几何意义是什么？","options":["曲线切向量的长度","单位切向量沿曲线的旋转速率","曲线的弧长参数","曲线的挠率"],"answer":1,"explanation":"曲率κ(s) = |γ''(s)|，度量单位切向量沿弧长方向的旋转速率，即曲线偏离直线的程度。","difficulty":"easy","chapter":"ch1","subject":"riemann"},{"q":"二维球面S²的Gauss曲率是多少？","options":["0","1/R","1/R²","2/R²"],"answer":2,"explanation":"半径为R的球面S²，主曲率均为1/R，Gauss曲率K = κ₁κ₂ = 1/R²。","difficulty":"easy","chapter":"ch1","subject":"riemann"},{"q":"Gauss绝妙定理（Theorema Egregium）的核心内容是什么？","options":["曲面总曲率等于4π","Gauss曲率仅依赖于第一基本形式","曲面可嵌入R³","所有曲面都共形平坦"],"answer":1,"explanation":"Gauss证明Gauss曲率K仅由第一基本形式（度量）及其导数决定，是曲面的内蕴不变量，不需要外围空间信息。","difficulty":"medium","chapter":"ch1","subject":"riemann"},{"q":"Frenet-Serret方程中，dN/ds等于什么？","options":["κT","-κT + τB","κN","-τB"],"answer":1,"explanation":"Frenet-Serret方程：dT/ds=κN, dN/ds=-κT+τB, dB/ds=-τN。","difficulty":"medium","chapter":"ch1","subject":"riemann"},{"q":"圆柱面与平面等距，因此它们的Gauss曲率是什么关系？","options":["圆柱面曲率更大","平面曲率更大","两者曲率相等（均为0）","无法比较"],"answer":2,"explanation":"等距映射保持所有内蕴几何量。圆柱面可在不拉伸的情况下展开为平面，故Gauss曲率均为零。","difficulty":"easy","chapter":"ch1","subject":"riemann"},{"q":"环面上哪些区域的Gauss曲率为负？","options":["外侧","内侧","顶部和底部圆周","整个环面"],"answer":1,"explanation":"环面外侧K>0（椭圆点），内侧K<0（双曲点），顶部和底部圆周K=0（抛物点）。","difficulty":"medium","chapter":"ch1","subject":"riemann"},{"q":"闭曲面上Gauss曲率的积分等于什么？","options":["4π","2πχ(M)","0","曲面的面积"],"answer":1,"explanation":"Gauss-Bonnet定理：∫_M K dA = 2πχ(M)，其中χ(M)是Euler示性数。","difficulty":"medium","chapter":"ch1","subject":"riemann"},{"q":"空间曲线的挠率恒为零意味着什么？","options":["曲线是直线","曲线是平面曲线","曲线是球面曲线","曲线是测地线"],"answer":1,"explanation":"挠率τ度量曲线偏离密切平面的程度。τ=0意味着曲线始终在同一平面内，即平面曲线。","difficulty":"easy","chapter":"ch1","subject":"riemann"},{"q":"球面S²的Euler示性数χ(S²)是多少？","options":["0","1","2","4"],"answer":2,"explanation":"球面亏格g=0，χ=2-2g=2。总曲率∫K dA = 2π×2 = 4π。","difficulty":"easy","chapter":"ch1","subject":"riemann"},{"q":"以下哪种曲面Gauss曲率恒为零？","options":["球面","伪球面","可展曲面（如圆柱面、锥面）","环面"],"answer":2,"explanation":"可展曲面可与平面等距（不拉伸地展开），因此内蕴曲率为零。球面K=1/R²>0，伪球面K=-1，环面K有正有负。","difficulty":"hard","chapter":"ch1","subject":"riemann"},{"q":"直线的曲率是多少？","options":["0","1","∞","未定义"],"answer":0,"explanation":"直线不弯曲，单位切向量恒定，γ''(s)=0，故曲率恒为零。这也是曲率定义的自然推论：曲率度量偏离直线的程度。","difficulty":"easy","chapter":"ch1","subject":"riemann"},{"q":"曲面上一点处的主曲率κ₁, κ₂是下列哪个量的特征值？","options":["度量张量g_ij","形状算子（Weingarten映射）","Christoffel符号","Gauss映射的微分"],"answer":1,"explanation":"主曲率是形状算子S = -dN（Weingarten映射）的特征值。形状算子是切空间到自身的自伴线性映射，特征值κ₁, κ₂给出法曲率的极值。","difficulty":"easy","chapter":"ch1","subject":"riemann"},{"q":"Euler公式κ_n(θ) = κ₁cos²θ + κ₂sin²θ描述了曲面上一点的什么性质？","options":["Gauss曲率随方向变化","法曲率随切方向的变化","测地曲率随方向变化","平均曲率随方向变化"],"answer":1,"explanation":"Euler公式给出沿与主方向成角θ的切方向的法曲率。法曲率在κ₁和κ₂之间变化，是主曲率的方向加权平均。","difficulty":"medium","chapter":"ch1","subject":"riemann"},{"q":"曲面上一点的平均曲率H的定义是？","options":["H = κ₁κ₂","H = (κ₁ + κ₂)/2","H = κ₁ - κ₂","H = √(κ₁κ₂)"],"answer":1,"explanation":"平均曲率H = (κ₁+κ₂)/2 = (1/2)tr(S)，是形状算子迹的一半。极小曲面满足H=0，即面积泛函的临界点。","difficulty":"easy","chapter":"ch1","subject":"riemann"},{"q":"曲面上一点称为脐点（umbilical point），如果：","options":["K = 0","H = 0","κ₁ = κ₂","K < 0"],"answer":2,"explanation":"脐点处两个主曲率相等（κ₁=κ₂），所有方向的法曲率都相同，形状算子是纯量算子。球面上每点都是脐点；椭球面有4个脐点。","difficulty":"medium","chapter":"ch1","subject":"riemann"},{"q":"Gauss映射N: M → S²将曲面上一点映射到该点的什么？","options":["位置向量","单位法向量","切平面","主方向"],"answer":1,"explanation":"Gauss映射将曲面上的每点映射到该点处的单位法向量（视为S²上的点）。Gauss曲率K = det(dN)是Gauss映射微分的行列式。","difficulty":"medium","chapter":"ch1","subject":"riemann"},{"q":"Meusnier定理断言：曲面上过同一点且有相同切方向的所有曲线，它们的什么量相同？","options":["测地曲率","法曲率","Gauss曲率","挠率"],"answer":1,"explanation":"Meusnier定理：法曲率仅依赖于切方向，不依赖于曲线在曲面内的具体形状。κ_n = κ cosθ，其中κ是曲线曲率，θ是曲线主法向与曲面法向的夹角。","difficulty":"medium","chapter":"ch1","subject":"riemann"},{"q":"对于旋转曲面，经线和纬线总是：","options":["测地线","曲率线（lines of curvature）","渐近曲线","脐点曲线"],"answer":1,"explanation":"旋转曲面的经线和纬线构成正交的曲率线网。沿曲率线，切方向是主方向，法曲率达到极值，且曲率线具有正交性和可积性。","difficulty":"medium","chapter":"ch1","subject":"riemann"},{"q":"平面曲线基本定理：给定光滑函数κ(s)>0，平面曲线由κ(s)确定到差什么？","options":["一个刚体运动（旋转+平移）","一个缩放变换","一个反射","完全确定，无自由度"],"answer":0,"explanation":"给定曲率函数κ(s)，存在唯一（差刚体运动）的平面曲线以κ(s)为曲率。这由求解Frenet方程得到，初始标架的选择对应刚体运动自由度。参考Lee习题1-3。","difficulty":"medium","chapter":"ch1","subject":"riemann"},{"q":"极小曲面（如悬链面、螺旋面）满足什么条件？","options":["H = 0且K = 0","H = 0","K = 0","H = K = 常数"],"answer":1,"explanation":"极小曲面是面积泛函的临界点，满足平均曲率H = 0。这不一定意味着K = 0：例如悬链面H=0但K<0（除个别点外）。极小曲面方程是二阶非线性椭圆型PDE。","difficulty":"medium","chapter":"ch1","subject":"riemann"},{"q":"封闭简单平面曲线的总曲率（∫κ ds）等于多少？","options":["0","2π","π","4π"],"answer":1,"explanation":"对于简单封闭平面曲线，切线旋转的总角度为2π（绕行一周），故∫κ ds = 2π。这是平面曲线版本的Gauss-Bonnet型定理，也是旋转指标定理。","difficulty":"hard","chapter":"ch1","subject":"riemann"},{"q":"R³中曲面的第二基本形式II(X,Y)和形状算子S的关系是？","options":["II(X,Y) = ⟨S(X), Y⟩","II(X,Y) = ⟨X, S(Y)⟩","II(X,Y) = ⟨S(X), Y⟩N","II(X,Y) = ⟨S(X), S(Y)⟩"],"answer":0,"explanation":"标量第二基本形式定义为II(X,Y) = ⟨S(X), Y⟩ = ⟨X, S(Y)⟩（S是自伴算子）。向量值第二基本形式为II(X,Y) = ⟨S(X), Y⟩N。S的特征值即主曲率。","difficulty":"hard","chapter":"ch1","subject":"riemann"},{"q":"黎曼度量g_ij必须是哪种矩阵？","options":["对称正定矩阵","对称半正定矩阵","任意对称矩阵","反对称矩阵"],"answer":0,"explanation":"黎曼度量是正定对称双线性型，在每点切空间上定义内积，因此g_ij是对称正定矩阵。","difficulty":"easy","chapter":"ch2","subject":"riemann"},{"q":"黎曼体积形式dV_g在局部坐标下等于什么？","options":["det(g) dx¹∧...∧dxⁿ","√(det g) dx¹∧...∧dxⁿ","tr(g) dx¹∧...∧dxⁿ","g dx¹∧...∧dxⁿ"],"answer":1,"explanation":"dV_g = √(det g) dx¹∧...∧dxⁿ，其中√(det g)是'拉伸因子'，描述坐标映射的面积/体积畸变。","difficulty":"easy","chapter":"ch2","subject":"riemann"},{"q":"等距映射保持以下哪些量？","options":["仅长度","长度和角度","长度、角度和曲率","仅曲率"],"answer":2,"explanation":"等距映射保持度量，因此保持所有内蕴几何量：长度、角度、面积、体积、曲率等。","difficulty":"easy","chapter":"ch2","subject":"riemann"},{"q":"音乐同构（♭和♯）描述了什么？","options":["切空间和余切空间之间的同构","不同流形之间的同构","度量张量的对称性","联络的无挠性"],"answer":0,"explanation":"黎曼度量建立了切空间TM与余切空间T*M之间的自然同构：♭降指标，♯升指标。","difficulty":"medium","chapter":"ch2","subject":"riemann"},{"q":"Myers-Steenrod定理关于等距群的结论是什么？","options":["等距群是无限维的","等距群是有限维Lie群，维数≤n(n+1)/2","等距群总是平凡的","等距群维数等于流形维数"],"answer":1,"explanation":"Myers-Steenrod定理：等距群是Lie变换群，维数≤n(n+1)/2。最大对称空间的等距群维数恰好达到此上界。","difficulty":"medium","chapter":"ch2","subject":"riemann"},{"q":"共形变换h = e^(2f)g保持什么量不变？","options":["长度","面积","角度","曲率"],"answer":2,"explanation":"共形变换保持角度不变（因为分子分母的缩放因子抵消），但长度、面积和曲率一般会改变。","difficulty":"medium","chapter":"ch2","subject":"riemann"},{"q":"拉回度量F*h的定义是什么？","options":["F*h = h","F*h = h(F(x))","(F*h)_p(v,w) = h_F(p)(dF_p(v), dF_p(w))","F*h = F·h"],"answer":2,"explanation":"拉回度量将外围空间N中度量h通过微分dF'拉回'到M上，定义M上的度量。","difficulty":"medium","chapter":"ch2","subject":"riemann"},{"q":"二维黎曼流形上的等温坐标存在性意味着什么？","options":["所有二维流形都是平坦的","所有二维黎曼度量局部共形平坦","二维流形没有曲率","二维流形总是等距于R²"],"answer":1,"explanation":"在二维，总存在局部坐标使度量形式为ds²=e^(2λ)(dx²+dy²)，即局部共形平坦。","difficulty":"hard","chapter":"ch2","subject":"riemann"},{"q":"梯度grad f与微分df的关系是什么？","options":["grad f = df","(grad f)^i = g^ij ∂_j f","grad f = -df","grad f = f·g"],"answer":1,"explanation":"梯度是微分通过度量升指标得到的向量场：(grad f)^i = g^ij ∂_j f。","difficulty":"medium","chapter":"ch2","subject":"riemann"},{"q":"紧致Lie群上总存在双不变度量的原因是什么？","options":["Lie群总是平坦的","通过平均化构造","Lie群维数有限","Lie群总是对称的"],"answer":1,"explanation":"紧致Lie群上可通过在群上对任意左不变度量取平均（积分）来构造不变的双不变度量。","difficulty":"hard","chapter":"ch2","subject":"riemann"},{"q":"设F: M → N是光滑映射，h是N上的黎曼度量。拉回度量F*h在局部坐标下的分量表达式为？","options":["(F*h)_ij = h_ij ∘ F","(F*h)_ij = (∂F^a/∂x^i)(∂F^b/∂x^j) h_ab ∘ F","(F*h)_ij = h_ij","(F*h)_ij = (∂F^i/∂x^a)(∂F^j/∂x^b) h_ab"],"answer":1,"explanation":"拉回度量分量公式：(F*h)_ij = (∂F^a/∂x^i)(∂F^b/∂x^j) h_ab(F(x))。这是张量变换法则的直接应用，两个Jacobi矩阵的缩并。参考Lee习题2-3。","difficulty":"easy","chapter":"ch2","subject":"riemann"},{"q":"设(M,g)是黎曼流形，f: M → R是光滑函数。函数f的Laplacian定义为Δf = div(grad f)。在局部坐标下，Δf = ?","options":["Δf = ∂_i∂^i f","Δf = (1/√|g|) ∂_i(√|g| g^ij ∂_j f)","Δf = g^ij ∂_i∂_j f","Δf = ∂_i(g^ij ∂_j f)"],"answer":1,"explanation":"Laplace-Beltrami算子：Δf = (1/√|g|) ∂_i(√|g| g^ij ∂_j f)。注意√|g|项来自散度算子在弯曲空间中的修正，这是黎曼几何中Laplace算子的标准形式。","difficulty":"medium","chapter":"ch2","subject":"riemann"},{"q":"设f: (M,g) → (N,h)是等距浸入（即f*h = g），则dim M和dim N满足什么关系？","options":["dim M = dim N","dim M ≤ dim N","dim M ≥ dim N","dim M = dim N - 1"],"answer":1,"explanation":"等距浸入要求f*h = g，即对任意v,w，h(df(v), df(w)) = g(v,w)。由于g正定，df必须是单射，故dim M ≤ dim N。当dim M = dim N时，等距浸入就是等距映射（局部微分同胚）。","difficulty":"medium","chapter":"ch2","subject":"riemann"},{"q":"共形变换h = e^(2f)g下，体积形式如何变化？","options":["不变","乘以e^(2f)","乘以e^(nf)，其中n=dim M","乘以e^(f)"],"answer":2,"explanation":"在共形变换g' = e^(2f)g下，det(g') = e^(2nf)det(g)，故√(det(g')) = e^(nf)√(det(g))。因此体积形式dV_g' = e^(nf) dV_g。","difficulty":"medium","chapter":"ch2","subject":"riemann"},{"q":"设(M,g)是黎曼流形，其上一组局部坐标(x^i)满足g_ij = δ_ij在某点p处成立。以下说法正确的是？","options":["该坐标一定是法坐标","这样的坐标总是存在","该坐标一定是等温坐标","在p处Christoffel符号Γ^k_ij(p)=0"],"answer":1,"explanation":"通过Gram-Schmidt正交化过程，总可以在任意点p处找到一组坐标使g_ij(p)=δ_ij。但注意这只保证度量在p点的值，不保证一阶导数为零（后者需要法坐标）。","difficulty":"medium","chapter":"ch2","subject":"riemann"},{"q":"设(M,g)是n维黎曼流形，一个(0,2)-型张量T称为共形Killing张量，如果它满足什么条件？","options":["∇_i T_jk = 0","∇_i T_jk + ∇_j T_ki + ∇_k T_ij = 0","∇_i T_jk + ∇_j T_ik = λg_ij","T_ij = c·g_ij"],"answer":2,"explanation":"共形Killing张量满足∇_i T_jk + ∇_j T_ik = λg_ij（λ是某函数）。当T = g时，左端为∇_i g_jk + ∇_j g_ik = 0（度量相容性），退化为平凡情形。这是Killing向量场概念的推广。","difficulty":"hard","chapter":"ch2","subject":"riemann"},{"q":"设(X, g_X)和(Y, g_Y)是黎曼流形。乘积流形X×Y上的乘积度量定义为？","options":["g = g_X + g_Y","g = g_X × g_Y","g = π_X^*g_X + π_Y^*g_Y","g = π_X^*g_X · π_Y^*g_Y"],"answer":2,"explanation":"乘积度量定义为g = π_X^*g_X + π_Y^*g_Y，其中π_X, π_Y是投影映射。在乘积坐标(x,y)下，度量矩阵为分块对角形式diag(g_X, g_Y)。","difficulty":"medium","chapter":"ch2","subject":"riemann"},{"q":"设S^n是R^{n+1}中的单位球面，配备从R^{n+1}诱导的度量。该诱导度量的拉回形式是什么？","options":["g_S = i^*g_R，其中i: S^n → R^{n+1}是包含映射","g_S与g_R无关","g_S = g_R","g_S = i_*g_R"],"answer":0,"explanation":"球面S^n作为R^{n+1}的子流形，其黎曼度量由包含映射i: S^n → R^{n+1}从欧氏度量拉回得到：g_S = i^*g_R。这是黎曼子流形度量的标准定义方式。","difficulty":"medium","chapter":"ch2","subject":"riemann"},{"q":"在等温坐标下，二维黎曼度量可写为ds² = e^(2λ)(dx²+dy²)。函数λ和Gauss曲率K的关系是什么？","options":["K = λ","K = -e^(-2λ) Δλ","K = e^(2λ)","K = 0"],"answer":1,"explanation":"在等温坐标下，Gauss曲率由Liouville公式给出：K = -e^(-2λ) Δλ = -e^(-2λ)(∂_x²λ + ∂_y²λ)。这是二维共形平坦性的直接推论，也是研究二维曲率的重要工具。参考Lee习题2-10。","difficulty":"hard","chapter":"ch2","subject":"riemann"},{"q":"设(M,g)是黎曼流形，X是光滑向量场。散度div X在局部坐标下的表达式为？","options":["div X = ∂_i X^i","div X = (1/√|g|) ∂_i(√|g| X^i)","div X = g^ij ∂_i X_j","div X = ∂_i X^i + Γ^i_ij X^j"],"answer":1,"explanation":"散度div X = (1/√|g|) ∂_i(√|g| X^i)。注意选项D也正确（两者等价，因为∂_i√|g|/√|g| = Γ^j_ij），但B是最常用的形式。","difficulty":"hard","chapter":"ch2","subject":"riemann"},{"q":"设f: (M,g) → (M,g)是等距映射。以下哪个量在等距映射下保持不变？","options":["仅度量张量","度量张量和所有曲率张量","仅长度","仅Christoffel符号"],"answer":1,"explanation":"等距映射保持度量张量（f*g = g），因此所有由度量决定的量都保持不变，包括：Christoffel符号、曲率张量、Ricci曲率、标量曲率、截面曲率、体积形式等。这是等距不变性的完整表述。","difficulty":"easy","chapter":"ch2","subject":"riemann"},{"q":"共形变换h = e^(2f)g下，对任意向量场X，|X|_h与|X|_g的关系是？","options":["|X|_h = |X|_g","|X|_h = e^f |X|_g","|X|_h = e^(2f) |X|_g","|X|_h = (1/e^f) |X|_g"],"answer":1,"explanation":"h(X,X) = e^(2f)g(X,X)，故|X|_h = e^f|X|_g。长度缩放因子为e^f。但两向量夹角不变，因为cosθ_h = h(X,Y)/(|X|_h|Y|_h) = e^(2f)g(X,Y)/(e^f|X|_g·e^f|Y|_g) = cosθ_g。","difficulty":"easy","chapter":"ch2","subject":"riemann"},{"q":"欧氏空间Rⁿ的截面曲率是多少？","options":["1","0","-1","依赖于坐标"],"answer":1,"explanation":"欧氏空间是平坦的，Christoffel符号全为零，曲率张量恒为零，因此截面曲率恒为0。","difficulty":"easy","chapter":"ch3","subject":"riemann"},{"q":"球面Sⁿ(R)的截面曲率是多少？","options":["1/R","1/R²","R","R²"],"answer":1,"explanation":"半径为R的球面Sⁿ(R)是常截面曲率空间，K=1/R²。","difficulty":"easy","chapter":"ch3","subject":"riemann"},{"q":"双曲空间Hⁿ的截面曲率是多少？","options":["1","0","-1","不确定"],"answer":2,"explanation":"标准双曲空间Hⁿ的截面曲率恒为-1（可通过缩放改变绝对值，但符号恒为负）。","difficulty":"easy","chapter":"ch3","subject":"riemann"},{"q":"Poincaré圆盘模型中的'直线'对应什么？","options":["欧氏直线段","与边界垂直的圆弧","任意曲线","抛物线"],"answer":1,"explanation":"在Poincaré圆盘模型中，双曲直线是正交于单位圆边界的圆弧（包括直径）。","difficulty":"medium","chapter":"ch3","subject":"riemann"},{"q":"Killing-Hopf定理的内容是什么？","options":["所有流形都有等距群","完备单连通常曲率空间只有三种","曲率决定了拓扑","等距群总是紧致的"],"answer":1,"explanation":"Killing-Hopf定理：完备单连通常曲率黎曼流形等距于球面、欧氏空间或双曲空间（差缩放）。","difficulty":"medium","chapter":"ch3","subject":"riemann"},{"q":"球面S²上三角形的内角和与什么有关？","options":["三角形的边长","三角形的面积（曲率积分）","三角形的位置","三角形的形状"],"answer":1,"explanation":"球面三角形内角和=π+∫K dA=π+面积/R²。面积越大，内角和越大，可达3π。","difficulty":"medium","chapter":"ch3","subject":"riemann"},{"q":"紧致Lie群上双不变度量的截面曲率有什么性质？","options":["恒为负","恒为正","非负","恒为零"],"answer":2,"explanation":"紧致Lie群配备双不变度量，截面曲率K(X,Y)=|[X,Y]|²/4≥0，非负。","difficulty":"hard","chapter":"ch3","subject":"riemann"},{"q":"双曲平面上圆的周长随半径如何增长？","options":["线性增长","多项式增长","指数增长","有界"],"answer":2,"explanation":"双曲平面中半径为r的圆的周长=2π sinh(r)≈πe^r，指数增长，远快于欧氏平面的2πr。","difficulty":"medium","chapter":"ch3","subject":"riemann"},{"q":"球面S³与哪个Lie群微分同胚？","options":["SO(3)","SU(2)","SL(2,R)","U(1)"],"answer":1,"explanation":"S³与SU(2)微分同胚。SU(2)作为Lie群配备双不变度量，等距于单位球面S³。","difficulty":"hard","chapter":"ch3","subject":"riemann"},{"q":"常曲率流形（空间形式）的构造方式是什么？","options":["直接定义度量","模型空间模去离散等距子群","任意黎曼流形","乘积流形"],"answer":1,"explanation":"常曲率流形（空间形式）是模型空间（Sⁿ, Rⁿ, Hⁿ）模去一个作用自由且常态的离散等距子群的商空间。","difficulty":"hard","chapter":"ch3","subject":"riemann"},{"q":"球面Sⁿ(R)的极坐标度量形式是什么？","options":["ds² = dr² + R² sin²(r/R) dΩ²_{n-1}","ds² = dr² + r² dΩ²_{n-1}","ds² = dr² + R² sinh²(r/R) dΩ²_{n-1}","ds² = R²(dr² + sin²r dΩ²_{n-1})"],"answer":0,"explanation":"球面Sⁿ(R)的极坐标度量：ds² = dr² + R² sin²(r/R) dΩ²_{n-1}，其中dΩ²_{n-1}是单位球面S^{n-1}(1)上的标准度量。当n=2时即ds² = dr² + R² sin²(r/R) dθ²。","difficulty":"easy","chapter":"ch3","subject":"riemann"},{"q":"双曲空间Hⁿ的极坐标度量形式是什么？","options":["ds² = dr² + sin²(r) dΩ²","ds² = dr² + r² dΩ²","ds² = dr² + sinh²(r) dΩ²","ds² = dr² + cosh²(r) dΩ²"],"answer":2,"explanation":"双曲空间Hⁿ的极坐标度量：ds² = dr² + sinh²(r) dΩ²_{n-1}。与球面的sin²(r)对比，双曲空间用sinh²(r)，反映其负曲率特性。","difficulty":"easy","chapter":"ch3","subject":"riemann"},{"q":"Poincaré上半平面模型H² = {(x,y) | y>0}的度量是什么？","options":["ds² = (dx²+dy²)/y²","ds² = dx²+dy²","ds² = 4(dx²+dy²)/(1-x²-y²)²","ds² = dx² - dy²"],"answer":0,"explanation":"Poincaré上半平面模型度量：ds² = (dx²+dy²)/y²。在y轴方向，距离随y减小而增大，边界y=0对应于无穷远。此模型等距于Poincaré圆盘模型。","difficulty":"medium","chapter":"ch3","subject":"riemann"},{"q":"球面S²上三角形的面积公式是什么？","options":["A = (α+β+γ-π)R²","A = (π-α-β-γ)R²","A = (α+β+γ)R²","A = (α+β+γ-π)/R²"],"answer":0,"explanation":"球面三角形面积：A = (α+β+γ-π)R²。内角和超出π的“角盈”与面积成正比。这也是Gauss-Bonnet定理在球面三角形上的直接应用。","difficulty":"medium","chapter":"ch3","subject":"riemann"},{"q":"双曲平面上三角形面积公式是什么？","options":["A = (π-α-β-γ)","A = (α+β+γ-π)","A = (π-α-β-γ)R²","A = 0"],"answer":0,"explanation":"双曲平面上标准曲率K=-1的三角形面积：A = π - (α+β+γ)。内角和小于π，“角亏”等于面积。所有双曲三角形面积不超过π。","difficulty":"medium","chapter":"ch3","subject":"riemann"},{"q":"设G是Lie群，配备左不变度量。左不变向量场X,Y的李括号[X,Y]与Levi-Civita联络的关系是？","options":["∇_X Y = [X,Y]","∇_X Y = (1/2)[X,Y]","∇_X Y = 0","∇_X Y = -[X,Y]"],"answer":1,"explanation":"对于左不变向量场X,Y，若度量是双不变的，则∇_X Y = (1/2)[X,Y]。这是从Koszul公式推导的结果，体现了李群几何中联络与李括号的紧密关系。","difficulty":"hard","chapter":"ch3","subject":"riemann"},{"q":"球面Sⁿ上，一条大圆（great circle）是什么？","options":["球面与通过球心的平面的交线","球面上的任意圆","球面上的小圆","球面的赤道"],"answer":0,"explanation":"大圆是球面与通过球心的二维平面的交线。球面上的所有测地线都是大圆（或其一部分）。大圆给出了球面上两点之间的最短路径。","difficulty":"easy","chapter":"ch3","subject":"riemann"},{"q":"在Poincaré圆盘模型中，点(0,0)到点(0,r)（r<1）的双曲距离是多少？","options":["r","r/(1-r²)","ln((1+r)/(1-r))","2 tanh^{-1}(r)"],"answer":2,"explanation":"沿径向弧的双曲距离d = ∫₀ʳ 2dt/(1-t²) = ln((1+r)/(1-r)) = 2 tanh^{-1}(r)。注意D选项也正确（两者等价），但C是更直接的积分结果。当r→1时，距离→∞。","difficulty":"hard","chapter":"ch3","subject":"riemann"},{"q":"设(M,g)是常截面曲率c的黎曼流形。其曲率张量可表示为？","options":["R(X,Y)Z = c·g(Y,Z)X","R(X,Y)Z = c(g(Y,Z)X - g(X,Z)Y)","R(X,Y)Z = 0","R(X,Y)Z = c(g(X,Y)Z - g(Y,Z)X)"],"answer":1,"explanation":"常曲率c空间的曲率张量：R(X,Y)Z = c(g(Y,Z)X - g(X,Z)Y)。截面曲率K(X,Y) = c对所有二维平面成立。这是曲率张量最简单的非平凡形式。","difficulty":"medium","chapter":"ch3","subject":"riemann"},{"q":"双曲空间Hⁿ的Lorentz模型（超boloid模型）定义在什么空间中？","options":["欧氏空间R^{n+1}","Minkowski空间R^{n,1}","R^{n+2}","R^{n-1}"],"answer":1,"explanation":"Lorentz模型：Hⁿ = {x ∈ R^{n,1} : ⟨x,x⟩_L = -1, x₀ > 0}，其中⟨·,·⟩_L是Minkowski内积⟨x,y⟩_L = -x₀y₀ + Σ_{i=1}^n x_i y_i。此模型揭示了双曲几何与狭义相对论的联系。","difficulty":"hard","chapter":"ch3","subject":"riemann"},{"q":"在球面S²上，周长C(r)与半径r的关系（对小的测地圆）是？","options":["C(r) = 2πr","C(r) = 2π sin(r) ≈ 2πr - πr³/3","C(r) = 2π sinh(r)","C(r) = 2πr + πr³"],"answer":1,"explanation":"S²(1)上半径为r的测地圆周长C(r) = 2π sin(r) = 2πr - πr³/3 + O(r⁵)。r很小时C(r) < 2πr，体现正曲率的“聚焦”效应。这与欧氏空间的C(r)=2πr和双曲空间的C(r)=2π sinh(r)对比。","difficulty":"medium","chapter":"ch3","subject":"riemann"},{"q":"齐性空间（homogeneous space）的定义是什么？","options":["等距群可递地作用在流形上","流形是紧致的","流形曲率为常数","流形是单连通的"],"answer":0,"explanation":"齐性空间是指等距群的作用是可递的：对任意两点p,q∈M，存在等距映射将p映到q。所有模型空间（Sⁿ, Rⁿ, Hⁿ）都是齐性空间。齐性空间可表示为G/H，其中H是G的闭子群。","difficulty":"medium","chapter":"ch3","subject":"riemann"},{"q":"Levi-Civita联络由哪两个条件唯一确定？","options":["无挠性和平坦性","无挠性和度量相容性","度量相容性和平坦性","对称性和正定性"],"answer":1,"explanation":"黎曼几何基本定理：存在唯一的无挠性（T=0）和度量相容性（∇g=0）的联络，即Levi-Civita联络。","difficulty":"easy","chapter":"ch4","subject":"riemann"},{"q":"Christoffel符号Γ^k_ij的表达式是什么？","options":["∂_i g_jk","g^kl(∂_i g_jl + ∂_j g_il - ∂_l g_ij)/2","g_ij ∂_k g","∂_i ∂_j g_kl"],"answer":1,"explanation":"Γ^k_ij = (1/2)g^kl(∂_i g_jl + ∂_j g_il - ∂_l g_ij)，完全由度量及其一阶导数决定。","difficulty":"easy","chapter":"ch4","subject":"riemann"},{"q":"平行移动保持什么量不变（对于Levi-Civita联络）？","options":["仅向量的长度","向量的长度和夹角","仅向量的方向","向量的坐标分量"],"answer":1,"explanation":"Levi-Civita联络的度量相容性保证平行移动是等距同构，保持向量长度和两向量夹角。","difficulty":"easy","chapter":"ch4","subject":"riemann"},{"q":"挠率张量T(X,Y)的定义是什么？","options":["∇_X Y + ∇_Y X","∇_X Y - ∇_Y X - [X,Y]","∇_X Y - ∇_Y X","∇_X Y + ∇_Y X + [X,Y]"],"answer":1,"explanation":"挠率张量定
