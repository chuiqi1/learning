<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>学习工作台 — 黎曼几何 · 代数拓扑 · 英语六级</title>
<style>

@font-face{font-family:'WorkSans';src:url('./_shared/fonts/WorkSans-Regular.ttf') format('truetype');font-weight:400;}
@font-face{font-family:'WorkSans';src:url('./_shared/fonts/WorkSans-Bold.ttf') format('truetype');font-weight:700;}
@font-face{font-family:'JetBrainsMono';src:url('./_shared/fonts/JetBrainsMono-Regular.ttf') format('truetype');font-weight:400;}

:root{
  --bg:#f8f7f4; --bg2:#efede7; --ink:#1c1c1c; --muted:#787876;
  --rule:#d9d7d0; --accent:#2563eb; --accent2:#7c3aed;
  --green:#059669; --teal:#0d9488; --amber:#d97706;
  --radius:12px; --radius-sm:8px; --shadow:0 1px 3px rgba(0,0,0,.06);
  --font:system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --mono:'JetBrainsMono','SF Mono',monospace;
  --transition:0.2s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--font);font-size:0.95rem;line-height:1.65;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;height:100dvh;width:100vw}
button{touch-action:manipulation}

/* ── Layout ── */
.app{display:flex;flex-direction:column;height:100dvh;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0.5rem 1rem;background:var(--bg);border-bottom:1px solid var(--rule);z-index:100;gap:0.5rem;flex-shrink:0}
.topbar .logo{font-weight:700;font-size:1rem;white-space:nowrap;color:var(--ink);letter-spacing:-0.01em}
.topbar .logo span{color:var(--accent)}
.tab-row{display:flex;gap:0.25rem;flex-shrink:0}
.tab-btn{padding:0.4rem 0.85rem;border-radius:20px;border:1px solid var(--rule);background:var(--bg);font-size:0.82rem;cursor:pointer;font-weight:500;color:var(--muted);transition:var(--transition);white-space:nowrap}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab-btn.green.active{background:var(--green);border-color:var(--green)}
.tab-btn.amber.active{background:var(--amber);border-color:var(--amber)}
.topbar-actions{display:flex;gap:0.4rem;flex-shrink:0}
.icon-btn{width:2rem;height:2rem;border-radius:50%;border:1px solid var(--rule);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--ink);transition:var(--transition)}
.icon-btn:hover{background:var(--bg2)}
.icon-btn svg{width:1.1rem;height:1.1rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── Main Content ── */
.main{display:flex;flex:1;overflow:hidden;position:relative}
.graph-panel{flex:1;position:relative;background:var(--bg);overflow:hidden;min-width:0}
.graph-panel svg{width:100%;height:100%;display:block}
.graph-panel .hint{position:absolute;bottom:1rem;left:50%;transform:translateX(-50%);font-size:0.75rem;color:var(--muted);pointer-events:none;background:var(--bg2);padding:0.3rem 0.8rem;border-radius:12px;opacity:0.7}

/* ── Detail Panel ── */
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:200;display:none;align-items:flex-end;justify-content:center}
.detail-overlay.show{display:flex}
.detail-panel{background:var(--bg);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;padding:1.5rem;box-shadow:0 -4px 24px rgba(0,0,0,.12);animation:slideUp 0.25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.detail-panel h3{font-size:1.3rem;margin-bottom:0.25rem;display:flex;align-items:center;gap:0.5rem}
.detail-panel .badge{font-size:0.7rem;padding:0.2rem 0.6rem;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
.detail-panel .badge.green{background:var(--green)}
.detail-panel .badge.amber{background:var(--amber)}
.detail-panel .section{margin-top:1rem}
.detail-panel .section h4{font-size:0.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:0.4rem;font-weight:600;display:flex;align-items:center;gap:0.3rem}
.detail-panel .section p{font-size:0.9rem;line-height:1.7}
.detail-panel .related-tags{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.5rem}
.detail-panel .related-tag{padding:0.25rem 0.7rem;border-radius:14px;border:1px solid var(--rule);font-size:0.8rem;cursor:pointer;transition:var(--transition);background:var(--bg)}
.detail-panel .related-tag:hover{background:var(--bg2);border-color:var(--accent)}
.detail-panel .btn-row{display:flex;gap:0.6rem;margin-top:1.5rem;flex-wrap:wrap}
.btn{padding:0.5rem 1.2rem;border-radius:20px;font-size:0.85rem;font-weight:600;cursor:pointer;border:none;transition:var(--transition)}
.btn-learned{background:var(--bg2);color:var(--green);border:1.5px solid var(--green)}
.btn-learned.done{background:var(--green);color:#fff}
.btn-note{background:var(--bg2);color:var(--accent);border:1.5px solid var(--accent)}
.btn-close{position:absolute;top:1rem;right:1rem;width:2rem;height:2rem;border-radius:50%;border:1px solid var(--rule);background:var(--bg);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;z-index:10}

/* ── SVG Chart ── */
.svg-chart-wrap{width:100%;background:var(--bg2);border-radius:var(--radius-sm);padding:0.5rem;overflow:hidden;margin-bottom:0.3rem}
.svg-chart-wrap svg{width:100%;height:auto;max-height:260px;display:block}

/* ── Collapsible ── */
.collapsible-header{cursor:pointer;user-select:none;display:flex;align-items:center;gap:0.3rem;padding:0.3rem 0}
.collapsible-header::after{content:'▾';transition:transform 0.2s;font-size:0.7rem;margin-left:auto}
.collapsible-header.collapsed::after{transform:rotate(-90deg)}
.collapsible-body{overflow:hidden;transition:max-height 0.3s ease;max-height:2000px}
.collapsible-body.hidden{max-height:0}

/* ── Example Cards ── */
.example-list{display:flex;flex-direction:column;gap:0.5rem}
.example-card{background:var(--bg2);border-radius:var(--radius-sm);padding:0.7rem 0.8rem;border-left:3px solid var(--accent);font-size:0.85rem;line-height:1.6}
.example-card .example-title{font-weight:700;color:var(--accent);margin-bottom:0.2rem;font-size:0.88rem}
.example-card.topology{border-left-color:var(--green)}
.example-card.cet6{border-left-color:var(--amber)}

/* ── Applications ── */
.app-item{display:flex;gap:0.5rem;padding:0.5rem 0;border-bottom:1px solid var(--rule);font-size:0.85rem;line-height:1.6;flex-wrap:wrap}
.app-field{font-weight:700;color:var(--accent2);background:var(--bg2);padding:0.15rem 0.5rem;border-radius:10px;font-size:0.75rem;white-space:nowrap;height:fit-content}

/* ── References ── */
.ref-item{display:flex;flex-wrap:wrap;gap:0.4rem;padding:0.4rem 0;border-bottom:1px solid var(--rule);font-size:0.8rem;align-items:baseline}
.ref-book{font-weight:700;color:var(--accent);min-width:75px;font-size:0.82rem}
.ref-loc{color:var(--muted);font-size:0.75rem}
.ref-desc{flex:1;min-width:150px;font-size:0.8rem}

/* ── Dashboard ── */
.dash-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:200;display:none;align-items:flex-end;justify-content:center}
.dash-overlay.show{display:flex}
.dash-panel{background:var(--bg);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;padding:1.5rem;box-shadow:0 -4px 24px rgba(0,0,0,.12);animation:slideUp 0.25s ease-out}
.dash-panel h3{font-size:1.2rem;margin-bottom:1rem}
.dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0.75rem;margin-bottom:1.2rem}
.dash-stat{background:var(--bg2);border-radius:var(--radius-sm);padding:0.8rem;text-align:center}
.dash-stat .num{font-size:1.6rem;font-weight:700;line-height:1.2}
.dash-stat .num.blue{color:var(--accent)}
.dash-stat .num.green{color:var(--green)}
.dash-stat .num.amber{color:var(--amber)}
.dash-stat .lbl{font-size:0.72rem;color:var(--muted);margin-top:0.2rem}
.progress-bar-wrap{background:var(--bg2);border-radius:10px;height:8px;margin:0.5rem 0 1rem;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:10px;background:var(--accent);transition:width 0.5s ease}
.progress-bar-fill.green{background:var(--green)}
.progress-bar-fill.amber{background:var(--amber)}
.dash-list{list-style:none;max-height:200px;overflow-y:auto}
.dash-list li{padding:0.4rem 0;border-bottom:1px solid var(--rule);font-size:0.82rem;display:flex;justify-content:space-between;align-items:center}
.dash-list .time{color:var(--muted);font-size:0.72rem}

/* ── Search ── */
.search-wrap{position:relative;flex-shrink:0}
.search-input{width:100%;padding:0.5rem 0.9rem 0.5rem 2.2rem;border-radius:20px;border:1px solid var(--rule);background:var(--bg);font-size:0.82rem;outline:none;transition:var(--transition)}
.search-input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:0.7rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:0.9rem}
.search-results{position:absolute;top:110%;left:0;right:0;background:var(--bg);border:1px solid var(--rule);border-radius:var(--radius-sm);max-height:200px;overflow-y:auto;display:none;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.search-results.show{display:block}
.search-results .item{padding:0.5rem 0.8rem;cursor:pointer;font-size:0.82rem;border-bottom:1px solid var(--rule);transition:var(--transition)}
.search-results .item:hover{background:var(--bg2)}
.search-results .item .sub{color:var(--muted);font-size:0.72rem}

/* ── Quiz ── */
.quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:none;align-items:center;justify-content:center}
.quiz-overlay.show{display:flex}
.quiz-panel{background:var(--bg);border-radius:var(--radius);width:90%;max-width:550px;max-height:85vh;overflow-y:auto;padding:1.5rem;box-shadow:0 8px 32px rgba(0,0,0,.15);position:relative}
.quiz-panel h3{font-size:1.1rem;margin-bottom:1rem}
.quiz-panel .quiz-progress{font-size:0.8rem;color:var(--muted);margin-bottom:0.5rem}
.quiz-panel .quiz-question{font-size:0.95rem;line-height:1.6;margin-bottom:1rem;font-weight:500}
.quiz-option{padding:0.7rem 1rem;margin:0.4rem 0;border-radius:var(--radius-sm);border:1.5px solid var(--rule);cursor:pointer;transition:var(--transition);font-size:0.9rem}
.quiz-option:hover{background:var(--bg2)}
.quiz-option.correct{background:#d1fae5;border-color:var(--green);color:var(--green)}
.quiz-option.wrong{background:#fee2e2;border-color:#ef4444;color:#ef4444}
.quiz-option.disabled{pointer-events:none;opacity:0.7}
.quiz-score{text-align:center;font-size:1.2rem;font-weight:700;margin:1rem 0}
.quiz-solution{background:#f0f9ff;border:1px solid #bae6fd;border-radius:var(--radius-sm);padding:0.7rem;margin-top:0.8rem;font-size:0.82rem;line-height:1.6;display:none}
.quiz-solution.show{display:block}
.quiz-solution .sol-title{font-weight:700;color:var(--accent);margin-bottom:0.3rem}
.quiz-node-link{display:inline-block;padding:0.15rem 0.5rem;border-radius:10px;background:var(--accent2);color:#fff;font-size:0.7rem;cursor:pointer;margin-top:0.5rem}
.quiz-finish{text-align:center;padding:1rem}
.quiz-finish .big-score{font-size:3rem;font-weight:700;color:var(--accent)}
.quiz-finish .msg{font-size:0.9rem;color:var(--muted);margin:0.5rem 0}

/* ── Node Styles (D3) ── */
.node-circle{cursor:pointer;transition:r 0.2s}
.node-circle:hover{filter:brightness(0.9)}
.node-circle.learned{stroke-width:3px}
.node-label{font-size:11px;pointer-events:none;text-anchor:middle;dominant-baseline:central;fill:var(--ink);font-family:var(--font)}
.link-line{stroke:var(--rule);stroke-opacity:0.6;stroke-width:1.5}

/* ── Mobile bottom bar ── */
.mobile-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--rule);padding:0.5rem;z-index:150;justify-content:space-around}
.mobile-bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0.15rem;font-size:0.65rem;color:var(--muted);background:none;border:none;cursor:pointer;padding:0.3rem}
.mobile-bar button svg{width:1.3rem;height:1.3rem;stroke:currentColor;fill:none;stroke-width:2}

@media(max-width:768px){
  .topbar{padding:0.4rem 0.6rem}
  .topbar .logo{font-size:0.85rem}
  .tab-btn{padding:0.3rem 0.6rem;font-size:0.72rem}
  .icon-btn{width:1.7rem;height:1.7rem}
  .mobile-bar{display:flex}
  .graph-panel{padding-bottom:3.5rem}
  .detail-panel,.dash-panel,.quiz-panel{max-width:100%;border-radius:var(--radius) var(--radius) 0 0}
  .dash-stats{grid-template-columns:repeat(3,1fr);gap:0.4rem}
  .dash-stat .num{font-size:1.2rem}
  .dash-stat .lbl{font-size:0.65rem}
  .node-label{font-size:9px}
  .svg-chart-wrap svg{max-height:200px}
}

/* scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:4px}

</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="logo">学习<span>工作台</span></div>
    <div class="tab-row">
      <button class="tab-btn active" onclick="switchSubject('riemann')">黎曼几何</button>
      <button class="tab-btn green" onclick="switchSubject('topology')">代数拓扑</button>
      <button class="tab-btn amber" onclick="switchSubject('cet6')">英语六级</button>
    </div>
    <div class="topbar-actions">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" placeholder="搜索知识点..." oninput="searchNodes(this.value)" onfocus="searchNodes(this.value)">
        <div class="search-results" id="searchResults"></div>
      </div>
      <button class="icon-btn" onclick="startQuiz()" title="测验">📝</button>
      <button class="icon-btn" onclick="showDashboard()" title="进度">📊</button>
    </div>
  </div>

  <div class="main">
    <div class="graph-panel" id="graphPanel">
      <div class="hint">🖱️ 拖拽节点 · 双击标记已掌握 · 单击查看详情</div>
    </div>
  </div>

  <div class="mobile-bar">
    <button onclick="switchSubject('riemann')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>黎曼</button>
    <button onclick="switchSubject('topology')"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>拓扑</button>
    <button onclick="switchSubject('cet6')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>英语</button>
    <button onclick="startQuiz()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>测验</button>
    <button onclick="showDashboard()"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="8" width="7" height="13" rx="1"/></svg>进度</button>
  </div>
</div>

<!-- Detail Overlay -->
<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-panel" id="detailPanel"></div>
</div>

<!-- Dashboard Overlay -->
<div class="dash-overlay" id="dashOverlay" onclick="if(event.target===this)closeDash()">
  <div class="dash-panel" id="dashPanel"></div>
</div>

<!-- Quiz Overlay -->
<div class="quiz-overlay" id="quizOverlay" onclick="if(event.target===this)closeQuiz()">
  <div class="quiz-panel" id="quizPanel"></div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>

/* ================================================================
   SECTION A: SVG CHARTS
   ================================================================ */
const SVG_CHARTS = {

  // ============================================================
  //  RIEMANN GEOMETRY  (r1 - r20)
  // ============================================================
  riemann: {

    r1: () => `<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="r1-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="var(--ink)"/>
    </marker>
  </defs>
  <rect width="400" height="250" fill="var(--bg2)" rx="8"/>
  <path d="M30,200 Q100,40 200,180 Q300,320 370,160" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <path d="M30,200 Q100,40 200,180 Q300,320 370,160 Q300,380 200,240 Q100,80 30,200" fill="var(--accent)" fill-opacity="0.06"/>
  <rect x="60" y="60" width="60" height="45" rx="3" fill="var(--accent2)" fill-opacity="0.15" stroke="var(--accent2)" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="180" y="100" width="55" height="40" rx="3" fill="var(--green)" fill-opacity="0.15" stroke="var(--green)" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="260" y="130" width="50" height="40" rx="3" fill="var(--amber)" fill-opacity="0.15" stroke="var(--amber)" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="145" y="115" width="80" height="50" rx="3" fill="var(--ink)" fill-opacity="0.08" stroke="var(--ink)" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="205" y="143" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="var(--ink)">重叠区域</text>
  <text x="90" y="85" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="var(--accent2)">U₁</text>
  <text x="207" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="var(--green)">U₂</text>
  <text x="285" y="153" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="var(--amber)">U₃</text>
  <text x="200" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="var(--ink)" font-weight="bold">光滑流形与图册结构</text>
</svg>`,

    r2: () => `<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="r2-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="400" height="250" fill="var(--bg2)" rx="8"/>
  <path d="M20,210 Q80,60 180,190 Q280,310 380,170" fill="none" stroke="var(--ink)" stroke-width="2"/>
  <path d="M20,210 Q80,60 180,190 Q280,310 380,170 Q280,350 180,230 Q80,100 20,210" fill="var(--accent)" fill-opacity="0.04"/>
  <circle cx="180" cy="190" r="5" fill="var(--accent)" stroke="var(--ink)" stroke-width="1"/>
  <text x="195" y="195" font-family="system-ui,sans-serif" font-size="13" fill="var(--ink)" font-weight="bold">p</text>
  <polygon points="110,80 250,80 260,200 100,200" fill="var(--accent2)" fill-opacity="0.12" stroke="var(--accent2)" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="180" y1="190" x2="140" y2="110" stroke="var(--accent)" stroke-width="2" marker-end="url(#r2-arrow)"/>
  <line x1="180" y1="190" x2="220" y2="130" stroke="var(--accent)" stroke-width="2" marker-end="url(#r2-arrow)"/>
  <line x1="180" y1="190" x2="180" y2="100" stroke="var(--green)" stroke-width="1.8" marker-end="url(#r2-arrow)"/>
  <text x="150" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="var(--accent2)">TpM 切空间</text>
  <text x="140" y="105" font-family="system-ui,sans-serif" font-size="10" fill="var(--accent)">v₁</text>
  <text x="225" y="125" font-family="system-ui,sans-serif" font-size="10" fill="var(--accent)">v₂</text>
  <text x="185" y="95" font-family="system-ui,sans-serif" font-size="10" fill="var(--green)">v₃</text>
</svg>`,

    r3: () => `<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="r3-arr" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="400" height="250" fill="var(--bg2)" rx="8"/>
  <path d="M10,190 Q90,40 190,170 Q290,290 390,150" fill="none" stroke="var(--ink)" stroke-width="1.8"/>

/* ================================================================
   SECTION D: STATE MANAGEMENT
   ================================================================ */
const STORAGE_KEY = 'learning_workbench_v3';
function loadState(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{};}catch(e){return{}}
}
function saveState(state){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}
}
let state = loadState();
if(!state.learned) state.learned = {};
if(!state.notes) state.notes = {};
if(!state.currentSubject) state.currentSubject = 'riemann';
if(!state.history) state.history = [];
if(!state.quizLog) state.quizLog = [];
saveState(state);

function markLearned(nodeId){
  if(state.learned[nodeId]){delete state.learned[nodeId]}
  else{state.learned[nodeId]=Date.now()}
  state.history.push({node:nodeId,action:state.learned[nodeId]?'learned':'unlearned',time:Date.now()});
  if(state.history.length>200) state.history = state.history.slice(-200);
  saveState(state);
  updateGraph();
}
function isLearned(nodeId){return !!state.learned[nodeId]}
function getProgress(subject){
  const nodes = KNOWLEDGE[subject].nodes;
  const learned = nodes.filter(n=>isLearned(n.id)).length;
  return {learned,total:nodes.length,pct:Math.round(learned/nodes.length*100)};
}

/* ================================================================
   SECTION E: GRAPH ENGINE
   ================================================================ */
let currentSubject = state.currentSubject;
let simulation, svg, g, zoom;
let nodeElements, linkElements, labelElements;

function initGraph(){
  const panel = document.getElementById('graphPanel');
  const W = panel.clientWidth, H = panel.clientHeight;
  if(svg){svg.remove()}
  svg = d3.select('#graphPanel').append('svg').attr('viewBox',[0,0,W,H]);
  g = svg.append('g');
  zoom = d3.zoom().scaleExtent([0.3,3]).on('zoom',(e)=>g.attr('transform',e.transform));
  svg.call(zoom);
  svg.on('dblclick.zoom',null);
  updateGraph();
}

function updateGraph(){
  const panel = document.getElementById('graphPanel');
  const W = panel.clientWidth, H = panel.clientHeight;
  const subj = KNOWLEDGE[currentSubject];
  const nodes = subj.nodes.map(n=>({...n}));
  const edges = subj.edges.map(e=>({source:e.source,target:e.target}));
  const nodeMap = new Map(nodes.map(n=>[n.id,n]));

  if(simulation) simulation.stop();
  g.selectAll('*').remove();

  linkElements = g.append('g').selectAll('line').data(edges).join('line')
    .attr('class','link-line').attr('stroke',subj.accent2+'44').attr('stroke-width',1.5);

  nodeElements = g.append('g').selectAll('g').data(nodes).join('g').attr('cursor','pointer');

  nodeElements.append('circle').attr('class','node-circle')
    .attr('r',d=>d.r||18).attr('fill',subj.color)
    .attr('stroke',subj.accent2).attr('stroke-width',1.5)
    .attr('opacity',d=>isLearned(d.id)?1:0.72);

  nodeElements.append('circle').attr('class','node-circle learned')
    .attr('r',d=>(d.r||18)+3).attr('fill','none')
    .attr('stroke',subj.accent2).attr('stroke-width',0)
    .attr('opacity',0);

  nodeElements.filter(d=>isLearned(d.id)).select('.learned')
    .attr('stroke-width',2.5).attr('opacity',1);

  labelElements = g.append('g').selectAll('text').data(nodes).join('text')
    .attr('class','node-label').text(d=>d.label)
    .attr('font-size',d=>Math.max(10,Math.min(13,(d.r||18)*0.6)))
    .attr('fill','#fff').attr('font-weight','600');

  simulation = d3.forceSimulation(nodes)
    .force('link',d3.forceLink(edges).id(d=>d.id).distance(100).strength(0.5))
    .force('charge',d3.forceManyBody().strength(-400))
    .force('center',d3.forceCenter(W/2,H/2))
    .force('collision',d3.forceCollide().radius(d=>(d.r||18)+12))
    .on('tick',()=>{
      linkElements.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
        .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      nodeElements.attr('transform',d=>`translate(${d.x},${d.y})`);
      labelElements.attr('x',d=>d.x).attr('y',d=>d.y);
    });

  nodeElements.on('click',(e,d)=>showDetail(d.id));
  nodeElements.on('dblclick',(e,d)=>{e.stopPropagation();markLearned(d.id)});

  nodeElements.call(d3.drag()
    .on('start',(e,d)=>{if(!e.active)simulation.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y})
    .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y})
    .on('end',(e,d)=>{if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null}));

  updateTabStyles();
}

function updateTabStyles(){
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.remove('active');
    if((b.textContent.includes('黎曼')&&currentSubject==='riemann')||
       (b.textContent.includes('拓扑')&&currentSubject==='topology')||
       (b.textContent.includes('英语')&&currentSubject==='cet6')){
      b.classList.add('active');
    }
  });
}

function switchSubject(subj){
  currentSubject = subj;
  state.currentSubject = subj;
  saveState(state);
  updateGraph();
}

/* ================================================================
   SECTION F: DETAIL PANEL
   ================================================================ */
function showDetail(nodeId){
  const subj = KNOWLEDGE[currentSubject];
  const node = subj.nodes.find(n=>n.id===nodeId);
  if(!node) return;
  const learned = isLearned(nodeId);
  const relatedEdges = subj.edges.filter(e=>e.source===nodeId||e.target===nodeId);
  const relatedIds = relatedEdges.map(e=>e.source===nodeId?e.target:e.source);
  const relatedNodes = relatedIds.map(id=>subj.nodes.find(n=>n.id===id)).filter(Boolean);

  const badgeClass = currentSubject==='topology'?'green':currentSubject==='cet6'?'amber':'';
  const cardClass = currentSubject==='topology'?'topology':currentSubject==='cet6'?'cet6':'';

  // Get SVG chart
  let svgHTML = '';
  try {
    const chartFn = SVG_CHARTS[currentSubject] && SVG_CHARTS[currentSubject][nodeId];
    if (chartFn) {
      svgHTML = chartFn();
    }
  } catch(e) { svgHTML = ''; }

  // Build examples HTML
  let examplesHTML = '';
  if (node.examples && node.examples.length) {
    examplesHTML = node.examples.map(ex => `
      <div class="example-card ${cardClass}">
        <div class="example-title">${ex.title}</div>
        <div>${ex.desc}</div>
      </div>
    `).join('');
  }

  // Build applications HTML
  let appsHTML = '';
  if (node.applications && node.applications.length) {
    appsHTML = node.applications.map(app => `
      <div class="app-item">
        <span class="app-field">${app.field}</span>
        <span>${app.desc}</span>
      </div>
    `).join('');
  }

  // Build references HTML
  let refsHTML = '';
  if (node.references && node.references.length) {
    refsHTML = node.references.map(ref => `
      <div class="ref-item">
        <span class="ref-book">${ref.book}</span>
        <span class="ref-loc">${ref.chapter} ${ref.section}</span>
        <span class="ref-desc">${ref.desc}</span>
      </div>
    `).join('');
  }

  const panel = document.getElementById('detailPanel');
  panel.innerHTML = `
    <button class="btn-close" onclick="closeDetail()">✕</button>
    <h3>${node.label}<span class="badge ${badgeClass}">${subj.name}</span></h3>

    ${svgHTML ? `
    <div class="section">
      <h4>📐 可视化</h4>
      <div class="svg-chart-wrap">${svgHTML}</div>
    </div>` : ''}

    <div class="section">
      <div class="collapsible-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('hidden')">
        <h4>📖 核心内容</h4>
      </div>
      <div class="collapsible-body">
        <p>${node.content}</p>
      </div>
    </div>

    <div class="section">
      <div class="collapsible-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('hidden')">
        <h4>💡 我的理解</h4>
      </div>
      <div class="collapsible-body">
        <p style="color:var(--ink);font-style:italic">${node.understanding}</p>
      </div>
    </div>

    ${examplesHTML ? `
    <div class="section">
      <h4>📋 例子</h4>
      <div class="example-list">${examplesHTML}</div>
    </div>` : ''}

    ${appsHTML ? `
    <div class="section">
      <h4>🔬 实际应用</h4>
      ${appsHTML}
    </div>` : ''}

    ${refsHTML ? `
    <div class="section">
      <h4>📚 教材引用</h4>
      ${refsHTML}
    </div>` : ''}

    ${relatedNodes.length?`
    <div class="section">
      <h4>🔗 关联知识点</h4>
      <div class="related-tags">
        ${relatedNodes.map(rn=>`<span class="related-tag" onclick="showDetail('${rn.id}')">${rn.label}</span>`).join('')}
      </div>
    </div>`:''}

    ${state.notes[nodeId]?`
    <div class="section">
      <h4>📝 我的笔记</h4>
      <p style="background:var(--bg2);padding:0.6rem;border-radius:8px;font-size:0.85rem">${state.notes[nodeId]}</p>
    </div>`:''}

    <div class="btn-row">
      <button class="btn btn-learned ${learned?'done':''}" onclick="markLearned('${nodeId}');showDetail('${nodeId}')">${learned?'✅ 已掌握':'☐ 标记为已掌握'}</button>
      <button class="btn btn-note" onclick="addNote('${nodeId}')">📝 写笔记</button>
    </div>
  `;
  document.getElementById('detailOverlay').classList.add('show');
}

function closeDetail(){
  document.getElementById('detailOverlay').classList.remove('show');
}

function addNote(nodeId){
  const note = prompt('为这个知识点写一条笔记：',state.notes[nodeId]||'');
  if(note!==null){
    if(note.trim()){state.notes[nodeId]=note.trim()}
    else{delete state.notes[nodeId]}
    state.history.push({node:nodeId,action:'note',time:Date.now()});
    if(state.history.length>200) state.history = state.history.slice(-200);
    saveState(state);
    showDetail(nodeId);
  }
}

/* ================================================================
   SECTION G: DASHBOARD
   ================================================================ */
function showDashboard(){
  const rp = getProgress('riemann');
  const tp = getProgress('topology');
  const cp = getProgress('cet6');
  const total = rp.learned+tp.learned+cp.learned;
  const totalMax = rp.total+tp.total+cp.total;
  const quizTotal = state.quizLog.length;
  const quizAvg = quizTotal ? Math.round(state.quizLog.reduce((s,q)=>s+q.score/q.total*100,0)/quizTotal) : 0;

  const recent = state.history.slice(-10).reverse();
  const panel = document.getElementById('dashPanel');
  panel.innerHTML = `
    <button class="btn-close" onclick="closeDash()">✕</button>
    <h3>📊 学习进度总览</h3>
    <div class="dash-stats">
      <div class="dash-stat"><div class="num blue">${rp.pct}%</div><div class="lbl">黎曼几何</div></div>
      <div class="dash-stat"><div class="num green">${tp.pct}%</div><div class="lbl">代数拓扑</div></div>
      <div class="dash-stat"><div class="num amber">${cp.pct}%</div><div class="lbl">英语六级</div></div>
    </div>
    <p style="text-align:center;font-size:0.85rem;color:var(--muted)">总计已掌握 <strong>${total}</strong>/${totalMax} 个知识点（${Math.round(total/totalMax*100)}%）</p>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${rp.pct}%"></div></div>
    <p style="font-size:0.75rem;color:var(--muted)">黎曼几何 ${rp.learned}/${rp.total}</p>
    <div class="progress-bar-wrap"><div class="progress-bar-fill green" style="width:${tp.pct}%"></div></div>
    <p style="font-size:0.75rem;color:var(--muted)">代数拓扑 ${tp.learned}/${tp.total}</p>
    <div class="progress-bar-wrap"><div class="progress-bar-fill amber" style="width:${cp.pct}%"></div></div>
    <p style="font-size:0.75rem;color:var(--muted)">英语六级 ${cp.learned}/${cp.total}</p>
    ${quizTotal ? `<p style="text-align:center;font-size:0.85rem;color:var(--muted);margin-top:0.5rem">测验平均分: <strong>${quizAvg}%</strong>（${quizTotal} 次）</p>` : ''}
    <h4 style="font-size:0.85rem;margin-top:1rem;color:var(--muted)">最近活动</h4>
    <ul class="dash-list">
      ${recent.length?recent.map(r=>{
        const allNodes = [...KNOWLEDGE.riemann.nodes,...KNOWLEDGE.topology.nodes,...KNOWLEDGE.cet6.nodes];
        const n = allNodes.find(x=>x.id===r.node);
        const act = r.action==='learned'?'✅ 掌握':r.action==='unlearned'?'↩️ 取消':r.action==='note'?'📝 笔记':'';
        const t = new Date(r.time);
        return `<li><span>${act} ${n?n.label:r.node}</span><span class="time">${t.toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span></li>`;
      }).join(''):'<li style="color:var(--muted)">暂无活动记录，开始学习吧！</li>'}
    </ul>
  `;
  document.getElementById('dashOverlay').classList.add('show');
}

function closeDash(){
  document.getElementById('dashOverlay').classList.remove('show');
}

/* ================================================================
   SECTION H: QUIZ ENGINE
   ================================================================ */
let quizState = null;

function startQuiz(){
  const pool = QUIZ_DATA[currentSubject] || [];
  if (!pool.length) { alert('暂无题目'); return; }
  const questions = d3.shuffle([...pool]).slice(0, 10);
  quizState = { questions, current: 0, score: 0, answers: [], subject: currentSubject };
  showQuizQuestion();
  document.getElementById('quizOverlay').classList.add('show');
}

function showQuizQuestion(){
  if (!quizState) return;
  const q = quizState.questions[quizState.current];
  const panel = document.getElementById('quizPanel');
  const diffLabel = q.difficulty===1?'⭐':q.difficulty===2?'⭐⭐':'⭐⭐⭐';
  panel.innerHTML = `
    <button class="btn-close" onclick="closeQuiz()">✕</button>
    <h3>📝 测验 — ${KNOWLEDGE[currentSubject].name}</h3>
    <div class="quiz-progress">第 ${quizState.current+1}/${quizState.questions.length} 题 ${diffLabel}</div>
    <div class="quiz-question">${q.question}</div>
    ${q.options.map((opt,i)=>`
      <div class="quiz-option" id="opt${i}" onclick="answerQuiz(${i})">${opt}</div>
    `).join('')}
    <div class="quiz-solution" id="quizSol">
      <div class="sol-title">📖 解析</div>
      <div>${q.solution}</div>
      <span class="quiz-node-link" onclick="closeQuiz();showDetail('${q.nodeId}')">📎 查看关联知识点</span>
    </div>
  `;
}

function answerQuiz(idx){
  if (!quizState) return;
  const q = quizState.questions[quizState.current];
  const correct = idx === q.answer;
  if (correct) quizState.score++;
  quizState.answers.push({qid: q.id, correct, chosen: idx});

  // Highlight options
  document.querySelectorAll('.quiz-option').forEach((el,i)=>{
    el.classList.add('disabled');
    if (i === q.answer) el.classList.add('correct');
    if (i === idx && !correct) el.classList.add('wrong');
  });

  // Show solution
  document.getElementById('quizSol').classList.add('show');

  // Add next button
  const panel = document.getElementById('quizPanel');
  const isLast = quizState.current >= quizState.questions.length - 1;
  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn btn-learned';
  nextBtn.style.cssText = 'margin-top:0.8rem;width:100%';
  nextBtn.textContent = isLast ? '查看结果' : '下一题 →';
  nextBtn.onclick = () => {
    if (isLast) {
      finishQuiz();
    } else {
      quizState.current++;
      showQuizQuestion();
    }
  };
  panel.appendChild(nextBtn);
}

function finishQuiz(){
  if (!quizState) return;
  const total = quizState.questions.length;
  const score = quizState.score;
  const pct = Math.round(score/total*100);

  state.quizLog.push({subject: quizState.subject, score, total, time: Date.now()});
  if (state.quizLog.length > 50) state.quizLog = state.quizLog.slice(-50);
  saveState(state);

  const panel = document.getElementById('quizPanel');
  let msg = pct >= 90 ? '🏆 太厉害了！你对这些知识掌握得非常扎实！' :
            pct >= 70 ? '👍 不错！继续保持，再加把劲就能更上一层楼！' :
            pct >= 50 ? '📚 还需要多下功夫，建议回顾相关的知识点。' :
            '💪 别灰心！学习是一个过程，多复习几次就好了。';

  panel.innerHTML = `
    <div class="quiz-finish">
      <div class="big-score">${pct}%</div>
      <div style="font-size:1.1rem;font-weight:600;margin:0.5rem 0">${score}/${total} 正确</div>
      <div class="msg">${msg}</div>
      <div style="margin-top:1rem;display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-learned" onclick="startQuiz()">🔄 再来一轮</button>
        <button class="btn btn-note" onclick="closeQuiz()">关闭</button>
      </div>
    </div>
  `;
  quizState = null;
}

function closeQuiz(){
  quizState = null;
  document.getElementById('quizOverlay').classList.remove('show');
}

/* ================================================================
   SECTION I: SEARCH
   ================================================================ */
function searchNodes(query){
  const results = document.getElementById('searchResults');
  if (!query || query.trim().length < 1) {
    results.classList.remove('show');
    return;
  }
  const q = query.toLowerCase().trim();
  const allNodes = [
    ...KNOWLEDGE.riemann.nodes.map(n=>({...n,subject:'riemann',subjName:'黎曼几何'})),
    ...KNOWLEDGE.topology.nodes.map(n=>({...n,subject:'topology',subjName:'代数拓扑'})),
    ...KNOWLEDGE.cet6.nodes.map(n=>({...n,subject:'cet6',subjName:'英语六级'}))
  ];
  const matches = allNodes.filter(n=>
    n.label.toLowerCase().includes(q) ||
    n.content.toLowerCase().includes(q) ||
    n.understanding.toLowerCase().includes(q)
  ).slice(0, 10);

  if (matches.length) {
    results.innerHTML = matches.map(n=>`
      <div class="item" onclick="switchSubject('${n.subject}');setTimeout(()=>showDetail('${n.id}'),500);results.classList.remove('show')">
        <div>${n.label}</div>
        <div class="sub">${n.subjName}</div>
      </div>
    `).join('');
    results.classList.add('show');
  } else {
    results.innerHTML = '<div class="item" style="color:var(--muted)">未找到匹配的知识点</div>';
    results.classList.add('show');
  }
}

// Close search on outside click
document.addEventListener('click',(e)=>{
  if(!e.target.closest('.search-wrap')){
    document.getElementById('searchResults').classList.remove('show');
  }
});

/* ================================================================
   SECTION J: INITIALIZATION
   ================================================================ */
function init(){
  initGraph();
  switchSubject(currentSubject);
}

// Handle window resize
let resizeTimeout;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(()=>{
    const panel = document.getElementById('graphPanel');
    const W = panel.clientWidth, H = panel.clientHeight;
    if(svg) svg.attr('viewBox',[0,0,W,H]);
    if(simulation) simulation.force('center',d3.forceCenter(W/2,H/2)).alpha(0.3).restart();
  },200);
});

// Start
document.addEventListener('DOMContentLoaded',init);

</script>
</body>
</html>
